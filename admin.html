<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TutorTally admin</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<meta name="theme-color" content="#ffa500">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8f4; --card: #ffffff; --card-2: #f5f7f6; --line: #dfe7e3;
    --ink: #15211f; --ink-dim: #596965; --accent: #a15c00; --accent-fill: #ffa500; --on-accent: #15211f; --accent-light: #fff1d9;
    --good: #0f7a35; --good-light: #e3f7e9; --warn: #c0362c; --warn-light: #fdecea; --muted: #87938f;
    --amber: #9a5b00; --amber-light: #fdf1dc;
    --tip-bg: #15211f; --tip-ink: #f3f7f5; --tip-good: #6ee7a0; --tip-bad: #ff9a85; --tip-todo: #ffc46b;
    --r-sm: 9px; --r-md: 13px; --r-lg: 17px;
    --sh-2: 0 1px 2px rgba(22,21,15,.05), 0 6px 16px -8px rgba(22,21,15,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716; --card: #182321; --card-2: #1e2a27; --line: #30413d;
      --ink: #eef8f5; --ink-dim: #a5b7b1; --accent: #ffa500; --accent-light: #3a2604;
      --good: #4ade80; --good-light: #0f2e1a; --warn: #ff8a63; --warn-light: #351d15; --muted: #7f918c;
      --amber: #f6c26b; --amber-light: #33260c;
      --tip-bg: #eef8f5; --tip-ink: #15211f; --tip-good: #0f7a35; --tip-bad: #c0362c; --tip-todo: #a15c00;
      --sh-2: 0 1px 3px rgba(0,0,0,.45), 0 8px 20px -10px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; padding: 22px 16px 60px;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.3rem; font-weight: 750; letter-spacing: -0.02em; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 0.82rem; }
  .top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .top > div { flex: 1; min-width: 0; }
  .hint { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 26px 0 8px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-2); overflow: hidden;
  }

  /* Headline numbers. Two across on a phone, four on anything wider. */
  .kpis {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 1px; background: var(--line);
  }
  @media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--card); padding: 12px 14px; }
  .kpi b { display: block; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi span { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 1px; }
  .kpi.quiet b { color: var(--muted); }
  .panel-note { padding: 11px 14px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--ink-dim); line-height: 1.5; }
  .panel-note .small { font-size: 0.75rem; color: var(--muted); }
  .mode { font-size: 0.66rem; padding: 2px 7px; border-radius: 999px; letter-spacing: 0.05em; }
  .mode.live { background: var(--good-light); color: var(--good); }
  .mode.test { background: var(--amber-light); color: var(--amber); }

  .rows { border-top: 1px solid var(--line); }
  .row-item {
    display: flex; align-items: baseline; gap: 10px; width: 100%;
    padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: none;
    font: inherit; font-size: 0.83rem; color: var(--ink); text-align: left; cursor: pointer;
  }
  .row-item:first-child { border-top: 0; }
  .row-item .grow { flex: 1; min-width: 0; font-weight: 600; }
  .row-item .dim { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .rows-head { padding: 10px 14px 0; font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* Setup funnel: one bar per step, how many testers have done it. Tapping a
     step lists the ones who have not, which is the actual job. */
  .funnel { padding: 12px 14px 12px; border-top: 1px solid var(--line); }
  .f-head { font-size: 0.76rem; color: var(--muted); margin-bottom: 6px; }
  .f-row {
    display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; gap: 10px;
    width: 100%; padding: 6px 0; border: 0; background: none; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
  }
  .f-label { font-size: 0.8rem; font-weight: 600; }
  .f-track { height: 8px; border-radius: 4px; background: var(--card-2); border: 1px solid var(--line); overflow: hidden; }
  .f-fill { display: block; height: 100%; background: var(--accent-fill); border-radius: 4px; }
  .f-n { font-size: 0.78rem; color: var(--ink-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .f-row:hover .f-label, .f-row:focus-visible .f-label { text-decoration: underline; }

  /* The worklist. */
  .q-item {
    display: flex; gap: 10px; align-items: baseline; width: 100%;
    padding: 10px 13px; border-radius: var(--r-md); margin-bottom: 7px;
    background: var(--card); border: 1px solid var(--line); font: inherit; font-size: 0.85rem;
    border-left: 3px solid var(--muted); cursor: pointer; text-align: left; color: var(--ink);
  }
  .q-item.bad  { border-left-color: var(--warn); }
  .q-item.warn { border-left-color: var(--amber); }
  .q-who { font-weight: 650; flex-shrink: 0; }
  .q-why { color: var(--ink-dim); }
  .q-tag { font-size: 0.68rem; color: var(--muted); margin-left: auto; flex-shrink: 0; }
  .q-empty {
    padding: 14px; border-radius: var(--r-md); background: var(--good-light);
    color: var(--good); font-size: 0.85rem; font-weight: 600; text-align: center;
  }

  /* Groups. */
  .tabs {
    display: flex; gap: 4px; padding: 4px; margin-bottom: 9px;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
  }
  .tab {
    flex: 1; border: 0; background: none; font: inherit; font-size: 0.8rem; font-weight: 650;
    padding: 8px 4px; border-radius: 9px; color: var(--ink-dim); cursor: pointer; white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--sh-2); }
  .tab .n { color: var(--muted); font-weight: 600; margin-left: 3px; }
  .search {
    width: 100%; font-family: inherit; font-size: 0.85rem; padding: 9px 11px; margin-bottom: 10px;
    border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px;
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 6px 11px; border-radius: 999px;
    background: var(--accent-light); color: var(--accent); border: 0; cursor: pointer;
  }

  /* One account. Collapsed it answers "who, what state, where did they stop";
     opening it is for doing something about it. */
  .acct {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-2); margin-bottom: 9px; overflow: hidden;
    transition: box-shadow 0.4s;
  }
  .acct.flash { box-shadow: 0 0 0 2px var(--accent-fill); }
  .acct-head { padding: 12px 14px 12px; cursor: pointer; }
  .acct-head:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: -2px; border-radius: var(--r-lg); }
  .line1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .line1 .who { font-weight: 650; font-size: 0.95rem; margin-right: 3px; }
  .chev { margin-left: auto; color: var(--muted); font-size: 1.1rem; line-height: 1; transition: transform 0.15s; }
  .acct.open .chev { transform: rotate(90deg); }
  .line2 { font-size: 0.78rem; color: var(--muted); margin-top: 3px; word-break: break-all; }
  .peek {
    font-size: 0.78rem; color: var(--ink-dim); margin-top: 9px; padding-left: 9px;
    border-left: 2px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .peek b { font-weight: 650; }

  .pill {
    font-size: 0.66rem; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap;
  }
  .pill.good  { background: var(--good-light); color: var(--good); }
  .pill.bad   { background: var(--warn-light); color: var(--warn); }
  .pill.amber { background: var(--amber-light); color: var(--amber); }
  .pill.accent { background: var(--accent-light); color: var(--accent); }
  .pill.muted { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); }

  /* Setup steps, in the order the app asks for them. */
  .steps { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .step {
    font-size: 0.68rem; font-weight: 650; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--muted);
    white-space: nowrap; cursor: help;
  }
  .step.done { background: var(--good-light); color: var(--good); border-color: transparent; }
  .step.bad  { background: var(--warn-light); color: var(--warn); border-color: transparent; }
  .step.next { background: var(--accent-light); color: var(--accent); border-color: transparent; }
  .step:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 1px; }

  /* Six figures: three by two on a phone, one row on anything wider. */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--line); border-top: 1px solid var(--line);
  }
  @media (min-width: 640px) { .stats { grid-template-columns: repeat(6, 1fr); } }
  .stat { background: var(--card); padding: 9px 12px; cursor: help; }
  .stat b { display: block; font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px; }
  .stat.quiet b { color: var(--muted); }
  /* Anything with an explanation behind it says so, quietly. */
  [data-tip] > span, .kpi[data-tip] span {
    text-decoration: underline dotted; text-underline-offset: 3px;
    text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent);
  }
  .kpi[data-tip] { cursor: help; }

  .body { border-top: 1px solid var(--line); }
  .foot { padding: 11px 14px 14px; border-top: 1px solid var(--line); }
  .meta { font-size: 0.78rem; color: var(--ink-dim); line-height: 1.6; margin-bottom: 11px; }
  .meta .bad { color: var(--warn); }
  .btn {
    font-family: inherit; font-size: 0.8rem; font-weight: 650; cursor: pointer;
    padding: 8px 13px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--card-2); color: var(--ink); text-decoration: none; display: inline-block;
  }
  .btn.primary { background: var(--accent-fill); border-color: transparent; color: #15211f; }
  .btn.danger { color: var(--warn); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .move { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 0.78rem; color: var(--muted); }
  .move select {
    font: inherit; font-size: 0.8rem; padding: 6px 9px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
  }
  textarea, input[type=email], input[type=password] {
    width: 100%; font-family: inherit; font-size: 0.85rem; padding: 9px 11px;
    border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--card-2); color: var(--ink); resize: vertical;
  }
  .notes { margin-top: 14px; }
  .notes-label { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .note {
    font-size: 0.8rem; line-height: 1.5; padding: 8px 0;
    border-top: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word;
  }
  .note time { display: block; color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
  /* Formatted note bodies: bold, underline and bullets from plain-text markers. */
  .note-body { white-space: normal; }
  .note-body .note-line { min-height: 1.5em; }
  .note-body ul { margin: 2px 0 4px; padding-left: 20px; }
  .note-body li { margin: 1px 0; }
  .note-body strong { color: var(--ink); }
  /* The note box: formatted while typing, styled like the other fields. */
  .note-editor {
    width: 100%; min-height: 66px; padding: 9px 11px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card-2); color: var(--ink);
    font-family: inherit; font-size: 0.85rem; line-height: 1.5;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note-editor:focus { outline: 2px solid var(--accent-fill); outline-offset: -1px; }
  .note-editor[data-empty="true"]::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
  .note-editor ul { margin: 2px 0; padding-left: 20px; }
  .note .by { color: var(--ink-dim); font-weight: 650; }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 18px 0; text-align: center; }
  .gate { max-width: 340px; margin: 60px auto; }
  .gate .field { margin-bottom: 11px; }
  .gate label { display: block; font-size: 0.78rem; font-weight: 650; margin-bottom: 4px; }
  .msg { font-size: 0.82rem; margin: 10px 0; }
  .msg.bad { color: var(--warn); }
  .version { color: var(--muted); font-size: 0.7rem; margin-top: 14px; }

  /* Small movements where things used to jump: opacity and position only,
     short, and switched off entirely for anyone whose phone asks for less
     motion. */
  @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes barGrow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .acct.opening .body { animation: fadeIn .22s ease both; }
  #list.enter .acct { animation: fadeInUp .28s cubic-bezier(.2,.8,.2,1) backwards; }
  #list.enter .acct:nth-child(2) { animation-delay: .03s; }
  #list.enter .acct:nth-child(3) { animation-delay: .06s; }
  #list.enter .acct:nth-child(4) { animation-delay: .09s; }
  #list.enter .acct:nth-child(n+5) { animation-delay: .12s; }
  .intro .panel, .intro .q-item, .intro .q-empty { animation: fadeInUp .32s cubic-bezier(.2,.8,.2,1) backwards; }
  .intro .f-fill { transform-origin: left center; animation: barGrow .7s cubic-bezier(.2,.8,.2,1) .15s backwards; }
  .chip { animation: fadeIn .18s ease backwards; }
  .tab { transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
  .btn, .q-item, .row-item { transition: transform .12s ease, background .18s ease, border-color .18s ease; }
  .btn:active:not(:disabled), .q-item:active, .row-item:active { transform: scale(.98); }
  .f-row .f-fill { transition: width .4s cubic-bezier(.2,.8,.2,1); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important; animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important; scroll-behavior: auto !important;
    }
  }

  /* One tooltip for the whole page, positioned against whatever asked for it.
     It lives outside the cards so their rounded corners never clip it. */
  #tip {
    position: fixed; z-index: 50; max-width: 290px; padding: 9px 11px; border-radius: 10px;
    background: var(--tip-bg); color: var(--tip-ink); font-size: 0.78rem; line-height: 1.45;
    box-shadow: 0 10px 28px -10px rgba(0,0,0,.45); pointer-events: none;
    opacity: 0; transform: translateY(3px); transition: opacity 0.12s, transform 0.12s;
  }
  #tip.show { opacity: 1; transform: none; }
  #tip .t-title { font-weight: 700; margin-bottom: 2px; }
  #tip .t-title.good { color: var(--tip-good); }
  #tip .t-title.bad  { color: var(--tip-bad); }
  #tip .t-title.todo { color: var(--tip-todo); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<div id="tip" role="tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// The admin panel for the people running the tester programme.
//
// Everything on this page comes from one endpoint that holds the service key
// and checks the caller against the admins table before it reads anything. The
// page itself has no privileges: signing in here as an ordinary tutor loads a
// "not an admin" message, because the endpoint answers 404 to anyone who is not
// on that table. Nothing is gated in the browser, where gating means nothing.
const VERSION = 'v6.22.0';
const SUPABASE_URL = 'https://uilytgubukiinyrqrltj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WK5p8tUAsNLEqnmxVT7Eag_2EVNbi7V';
const FN_BASE = SUPABASE_URL + '/functions/v1';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

const app = document.getElementById('app');
const tip = document.getElementById('tip');

const SEGMENTS = [
  ['tester', 'Beta testers'],
  ['team', 'Team'],
  ['test', 'Test accounts'],
];
const STEP_LABELS = [
  ['name', 'Name'], ['phone', 'Phone'], ['calendar', 'Calendar'], ['student', 'Student'],
  ['lessons', 'Lessons'], ['payment', 'Payment'], ['parent_link', 'Parent link'],
];
const stepLabel = key => (STEP_LABELS.find(([k]) => k === key) || [])[1] || key;
// Parent-link opens were first recorded on this day. Anything earlier simply
// was not counted, which matters when reading a zero.
const PARENT_OPENS_COUNTED_FROM = '8 Oct 2026';

let data = { accounts: [], income: null, me: null, loadedAt: null };
const ui = {
  seg: recall('tt-admin-seg'),
  q: '',
  missing: null,
  open: new Set(),
};
if (!SEGMENTS.some(([k]) => k === ui.seg)) ui.seg = 'tester';

// A remembered tab is a convenience. Private browsing, blocked storage or a
// cleared site must never stop the page working.
function remember(k, v) { try { localStorage.setItem(k, v); } catch {} }
function recall(k) { try { return localStorage.getItem(k); } catch { return null; } }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Notes land minutes apart when two people are working through the list
// together, so the day on its own is not enough to read them in order.
function fmtDateTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-GB', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
  });
}

function fmtDate(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtShort(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function daysSince(iso) {
  if (!iso) return null;
  return Math.floor((Date.now() - Date.parse(iso)) / 86400000);
}

function agoLabel(iso) {
  if (!iso) return 'never';
  const mins = Math.floor((Date.now() - Date.parse(iso)) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  const d = Math.floor(hrs / 24);
  if (d === 1) return 'yesterday';
  if (d < 30) return d + ' days ago';
  return fmtDate(iso);
}

// "£5" not "£5.00", but "£4.17" kept intact.
function money(pence) {
  if (pence == null) return '—';
  const pounds = pence / 100;
  const whole = Math.abs(pounds - Math.round(pounds)) < 0.005;
  return '£' + pounds.toLocaleString('en-GB', {
    minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2,
  });
}
const gbp = pounds => money(Math.round(Number(pounds || 0) * 100));

const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

// Stored by the app as international digits: 447700900123.
function fmtPhone(digits) {
  if (!digits) return '';
  return digits.startsWith('44')
    ? '+44 ' + digits.slice(2, 6) + ' ' + digits.slice(6)
    : '+' + digits;
}

const nameOf = a => a.name || a.email || 'Unnamed';

// ---- Note formatting --------------------------------------------------------
//
// Same rules as the tutor app (index.html, "Note formatting"): notes are plain
// text with **bold**, __underline__ and "• " bullets. Every piece of text is
// escaped before any tag is added around it, so a note can format itself but
// can never inject markup into the page.
const NOTE_INLINE = /\*\*([\s\S]+?)\*\*|__([\s\S]+?)__/;
const NOTE_BULLET = /^\s*[-*•]\s+/;

function noteInlineHTML(text) {
  let out = '';
  let rest = text;
  while (rest) {
    const m = rest.match(NOTE_INLINE);
    if (!m) { out += esc(rest); break; }
    out += esc(rest.slice(0, m.index));
    out += m[1] != null
      ? `<strong>${noteInlineHTML(m[1])}</strong>`
      : `<u>${noteInlineHTML(m[2])}</u>`;
    rest = rest.slice(m.index + m[0].length);
  }
  return out;
}

function richNoteHTML(text) {
  let html = '';
  let inList = false;
  for (const line of String(text || '').split('\n')) {
    if (NOTE_BULLET.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${noteInlineHTML(line.replace(NOTE_BULLET, ''))}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<div class="note-line">${line ? noteInlineHTML(line) : '&nbsp;'}</div>`;
    }
  }
  if (inList) html += '</ul>';
  return `<div class="note-body">${html}</div>`;
}

// One line for the collapsed card: markers off, bullets run together.
function plainNote(text) {
  return String(text || '')
    .replace(/\*\*|__/g, '')
    .replace(/^\s*[-*•]\s+/gm, '· ')
    .replace(/\s*\n\s*/g, ' ');
}

// A stored note as the editor shows it. Every piece of text is escaped first.
function noteToEditorHTML(text) {
  if (!text) return '';
  let html = '';
  let inList = false;
  for (const line of String(text).split('\n')) {
    if (NOTE_BULLET.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${noteInlineHTML(line.replace(NOTE_BULLET, '')) || '<br>'}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<div>${noteInlineHTML(line) || '<br>'}</div>`;
    }
  }
  if (inList) html += '</ul>';
  return html;
}

const NOTE_SKIP = new Set(['SCRIPT', 'STYLE', 'META', 'TITLE', 'HEAD', 'LINK', 'NOSCRIPT', 'TEMPLATE', 'SVG', 'svg', 'IMG']);
const NOTE_BLOCK = /^(DIV|P|H[1-6]|BLOCKQUOTE|PRE|SECTION|ARTICLE|HEADER|FOOTER|TABLE|TBODY|TR)$/;

// The editor's contents, or a pasted document, as a stored note: only bold,
// underline, bullets and line breaks survive. Bold is read from inline styles
// as well as tags, because Google Docs wraps a whole paste in a
// <b style="font-weight:normal"> and marks the real bold with font-weight:700.
function editorToNote(root) {
  const lines = [];
  let cur = null;
  const open = (bullet) => {
    if (cur && !cur.segs.length) { if (bullet) cur.bullet = true; return; }
    cur = { bullet: !!bullet, segs: [] };
    lines.push(cur);
  };
  const styleOf = (el, st) => {
    let { b, u } = st;
    const tag = el.tagName;
    if (tag === 'B' || tag === 'STRONG' || /^H[1-6]$/.test(tag)) b = true;
    if (tag === 'U' || tag === 'INS') u = true;
    const fw = el.style && el.style.fontWeight;
    if (fw) b = fw === 'bold' || fw === 'bolder' || parseInt(fw, 10) >= 600;
    const td = el.style && (el.style.textDecorationLine || el.style.textDecoration);
    if (td) u = /underline/.test(td);
    return { b, u };
  };
  const walk = (node, st) => {
    if (node.nodeType === 3) {
      const t = node.nodeValue.replace(/\u00a0/g, ' ').replace(/[\r\n]+/g, ' ');
      if (!t) return;
      if (!cur) open(false);
      cur.segs.push({ text: t, b: st.b, u: st.u });
      return;
    }
    if (node.nodeType !== 1 || NOTE_SKIP.has(node.tagName)) return;
    const tag = node.tagName;
    if (tag === 'BR') { if (!cur) open(false); cur = null; return; }
    const style = styleOf(node, st);
    if (tag === 'LI') {
      open(true);
      node.childNodes.forEach(c => walk(c, style));
      cur = null;
      return;
    }
    if (tag === 'UL' || tag === 'OL' || NOTE_BLOCK.test(tag)) {
      if (cur && cur.segs.length) cur = null;
      node.childNodes.forEach(c => walk(c, style));
      cur = null;
      return;
    }
    node.childNodes.forEach(c => walk(c, style));
  };
  root.childNodes.forEach(c => walk(c, { b: false, u: false }));

  const out = lines.map(l => {
    const merged = [];
    for (const seg of l.segs) {
      const last = merged[merged.length - 1];
      if (last && last.b === seg.b && last.u === seg.u) last.text += seg.text;
      else merged.push({ ...seg });
    }
    let text = '';
    for (const seg of merged) {
      const lead = seg.text.match(/^\s*/)[0];
      const trail = seg.text.slice(lead.length).match(/\s*$/)[0];
      const core = seg.text.slice(lead.length, seg.text.length - trail.length);
      if (!core || (!seg.b && !seg.u)) { text += seg.text; continue; }
      let w = core;
      if (seg.u) w = `__${w}__`;
      if (seg.b) w = `**${w}**`;
      text += lead + w + trail;
    }
    text = text.replace(/\s+$/, '');
    return l.bullet ? '• ' + text.replace(NOTE_BULLET, '') : text;
  });
  while (out.length && !out[out.length - 1].trim()) out.pop();
  return out.join('\n');
}

function notePasteHTML(e) {
  const cd = e.clipboardData;
  if (!cd) return null;
  const html = cd.getData('text/html');
  const plain = cd.getData('text/plain');
  let note;
  if (html) note = editorToNote(new DOMParser().parseFromString(html, 'text/html').body);
  else if (plain) note = plain.replace(/\r\n?/g, '\n');
  else return null;
  // One line pasted into the middle of a sentence must stay in that sentence.
  if (!note.includes('\n') && !NOTE_BULLET.test(note)) return noteInlineHTML(note);
  return noteToEditorHTML(note);
}

// Every line in its own block. Typing into an empty box puts the first line
// straight into the box itself rather than into a line of its own, and the
// list command then treats that loose text and the next line as one
// paragraph, dragging both into the bullet. Wrapping loose text as it appears
// keeps "- " on line two from swallowing line one.
function noteNormalise(root) {
  const isBlock = n => n.nodeType === 1 && /^(DIV|P|UL|OL)$/.test(n.nodeName);
  if (![...root.childNodes].some(n => !isBlock(n) && !(n.nodeType === 3 && !n.nodeValue))) return;
  const sel = window.getSelection();
  const keep = sel && sel.rangeCount ? { node: sel.anchorNode, offset: sel.anchorOffset } : null;
  let line = null;
  for (const n of [...root.childNodes]) {
    if (isBlock(n)) { line = null; continue; }
    if (n.nodeType === 3 && !n.nodeValue) { n.remove(); continue; }
    if (n.nodeName === 'BR') {
      if (line) { n.remove(); line = null; }
      else { const empty = document.createElement('div'); root.insertBefore(empty, n); empty.appendChild(n); }
      continue;
    }
    if (!line) { line = document.createElement('div'); root.insertBefore(line, n); }
    line.appendChild(n);
  }
  if (keep && keep.node && keep.node !== root && root.contains(keep.node)) {
    try { sel.collapse(keep.node, keep.offset); } catch {}
  }
}

// Enter on an empty bullet ends the list, as in every notes app. The line
// becomes an ordinary line after the list, and any bullets below it carry on
// as their own list. Done directly rather than through the browser's list
// command, which mis-handles exactly this case.
function noteEnterKey(e, root) {
  if (e.key !== 'Enter' || e.shiftKey) return false;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
  const at = sel.anchorNode;
  const li = (at && (at.nodeType === 1 ? at : at.parentElement))?.closest('li');
  if (!li || !root.contains(li) || li.textContent.replace(/\u00a0/g, ' ').trim()) return false;
  e.preventDefault();
  const ul = li.parentNode;
  const line = document.createElement('div');
  line.appendChild(document.createElement('br'));
  const rest = [];
  for (let n = li.nextSibling; n; n = n.nextSibling) rest.push(n);
  ul.parentNode.insertBefore(line, ul.nextSibling);
  if (rest.length) {
    const tail = document.createElement(ul.nodeName);
    rest.forEach(n => tail.appendChild(n));
    line.parentNode.insertBefore(tail, line.nextSibling);
  }
  li.remove();
  if (!ul.children.length) ul.remove();
  const r = document.createRange();
  r.setStart(line, 0);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
  return true;
}

// "- " (or "* ") typed at the start of a line turns that line into a bullet,
// joining the list above it if there is one. Built directly: the browser's
// own list command, given the empty line left behind once "- " is removed,
// lost the cursor and dragged the line above into the list.
function noteAutoList(root) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== 3 || !root.contains(node)) return false;
  if (sel.anchorOffset !== 2 || !/^[-*•][ \u00a0]/.test(node.nodeValue)) return false;
  const block = node.parentNode;
  if (!block || block.parentNode !== root || !/^(DIV|P)$/.test(block.nodeName)) return false;
  if (block.firstChild !== node) return false;
  node.nodeValue = node.nodeValue.slice(2);
  const li = document.createElement('li');
  while (block.firstChild) li.appendChild(block.firstChild);
  if (!li.textContent) { li.textContent = ''; li.appendChild(document.createElement('br')); }
  const above = block.previousElementSibling;
  if (above && above.nodeName === 'UL') {
    above.appendChild(li);
    block.remove();
  } else {
    const ul = document.createElement('ul');
    ul.appendChild(li);
    root.replaceChild(ul, block);
  }
  const first = li.firstChild;
  const r = document.createRange();
  if (first && first.nodeType === 3) r.setStart(first, 0); else r.setStart(li, 0);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
  return true;
}

function markEmpty(box) {
  box.dataset.empty = (editorToNote(box) || box.querySelector('li')) ? 'false' : 'true';
}

async function call(action, extra = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return { ok: false, problem: 'signed_out' };
  const res = await fetch(FN_BASE + '/admin-portal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ action, ...extra }),
  });
  return res.json().catch(() => ({ ok: false, problem: 'bad_response' }));
}

// ---- Sign in ------------------------------------------------------------

function renderGate(message) {
  app.innerHTML = `
    <div class="gate">
      <h1>TutorTally admin</h1>
      <div class="sub" style="margin-bottom:18px">
        Use the same email and password as TutorTally itself. If you reached
        this from inside the app you should not see this at all.
      </div>
      <form id="gateForm">
        <div class="field">
          <label>Email</label>
          <input type="email" id="gEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="gPassword" autocomplete="current-password" required>
        </div>
        ${message ? `<div class="msg bad">${esc(message)}</div>` : ''}
        <button class="btn primary" type="submit" style="width:100%">Sign in</button>
      </form>
    </div>`;
  document.getElementById('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('gEmail').value.trim();
    const password = document.getElementById('gPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return renderGate(error.message);
    load();
  });
}

// ---- What each account is ----------------------------------------------

const isPaying = a => ['active', 'past_due'].includes(a.billing?.status);
const freeForever = a => a.free_days_left != null && a.free_days_left > 3650;
const freeActive = a => a.free_days_left != null && a.free_days_left >= 0;
// Has students, lessons arriving and at least one payment logged: the point at
// which TutorTally is doing its job for them rather than being looked at.
const usingItProperly = a => a.active_students > 0 && a.total_lessons > 0 && a.payments_logged > 0;
const wouldNeedPro = a => a.over_limit_by > 0 && !isPaying(a);

/**
 * The setup steps, in the order the app asks for them, each with the state a
 * hover or a tap explains. Three states rather than two, because "connected but
 * broken" is the one that matters most and a tick would hide it.
 */
function stepsOf(a) {
  const out = [];
  const add = (key, label, state, title, body) => out.push({ key, label, state, title, body });

  add('name', 'Name', a.has_name ? 'done' : 'todo',
    a.has_name ? 'Filled in' : 'Not filled in yet',
    a.has_name ? `Shows as "${a.name}".` : 'No name on the account. They add it in Settings → Your account.');

  add('phone', 'Phone', a.has_phone ? 'done' : 'todo',
    a.has_phone ? 'Filled in' : 'Not filled in yet',
    a.has_phone ? fmtPhone(a.phone) : 'No phone number yet. They add it in Settings → Your account.');

  const calName = a.calendar === 'google' ? 'Google Calendar'
    : a.calendar === 'link' ? 'Calendar link (Apple, Outlook or similar)' : null;
  const synced = a.calendar_synced_at ? ` Last sync ${agoLabel(a.calendar_synced_at)}.` : '';
  if (a.calendar && a.calendar_error) {
    add('calendar', 'Calendar', 'bad', 'Error',
      `${calName} is connected but failing: ${String(a.calendar_error).replace(/\.\s*$/, '')}.${synced}`);
  } else if (a.calendar) {
    add('calendar', 'Calendar', 'done', 'Connected', `${calName}.${synced || ' Not synced yet.'}`);
  } else {
    add('calendar', 'Calendar', 'todo', 'Not connected yet',
      'No calendar connected, so lessons cannot come in on their own.');
  }

  const archived = a.total_students - a.active_students;
  add('student', 'Student', a.active_students > 0 ? 'done' : 'todo',
    a.active_students > 0 ? 'Added' : 'None added yet',
    a.active_students > 0
      ? `${plural(a.active_students, 'active student')}${archived > 0 ? `, ${archived} archived` : ''}.`
      : 'No students on the account yet.');

  let lessonsWhy = 'Needs a calendar connected first.';
  if (a.calendar && a.calendar_error) lessonsWhy = 'Their calendar is failing, so nothing can come through.';
  else if (a.calendar && a.active_students === 0) lessonsWhy = 'Calendar is connected. Lessons appear once a student is added whose name matches the calendar events.';
  else if (a.calendar) lessonsWhy = 'Calendar is connected but no event has matched a student yet. Usually the event titles do not contain the student\'s name.';
  add('lessons', 'Lessons', a.total_lessons > 0 ? 'done' : 'todo',
    a.total_lessons > 0 ? 'Coming in' : 'None yet',
    a.total_lessons > 0
      ? `${plural(a.total_lessons, 'lesson')} in total. ${a.lessons_last_30} taught in the last 30 days, ${a.lessons_upcoming} booked ahead.`
      : lessonsWhy);

  add('payment', 'Payment', a.payments_logged > 0 ? 'done' : 'todo',
    a.payments_logged > 0 ? 'Logged' : 'None logged yet',
    a.payments_logged > 0
      ? `${plural(a.payments_logged, 'payment')} logged, ${gbp(a.money_logged)} in total${a.last_payment_date ? `, latest dated ${fmtShort(a.last_payment_date)}` : ''}. ${paidLine(a)}`
      : 'They have not recorded any money from a parent yet.');

  add('parent_link', 'Parent link', a.parent_views_ever > 0 ? 'done' : 'todo',
    a.parent_views_ever > 0 ? 'Opened' : 'Not opened yet',
    a.parent_views_ever > 0
      ? `A parent last opened a link ${agoLabel(a.last_parent_view)}. ${a.parent_days_30d ? `Opened on ${plural(a.parent_days_30d, 'day')} in the last 30.` : ''}`
      : `No parent has opened one of their links. Opens are counted from ${PARENT_OPENS_COUNTED_FROM}.`);

  return out;
}

function paidLine(a) {
  if (!a.taught_chargeable) return '';
  return `${a.taught_paid} of the ${a.taught_chargeable} lessons they have taught since tracking money are paid for.`;
}

function stepsHTML(a) {
  const steps = stepsOf(a);
  const next = steps.find(s => s.state === 'todo');
  return '<div class="steps">' + steps.map(s => {
    const cls = s.state === 'done' ? 'done' : s.state === 'bad' ? 'bad' : s === next ? 'next' : '';
    const mark = s.state === 'done' ? '✓ ' : s.state === 'bad' ? '⚠ ' : '';
    const tone = s.state === 'done' ? 'good' : s.state === 'bad' ? 'bad' : 'todo';
    return `<span class="step ${cls}" tabindex="0"
      data-tip="${esc(s.body)}" data-tip-title="${esc(s.label + ': ' + s.title)}" data-tip-tone="${tone}"
      aria-label="${esc(`${s.label}: ${s.title}. ${s.body}`)}">${mark}${esc(s.label)}</span>`;
  }).join('') + '</div>';
}

function pillsHTML(a) {
  const out = [];
  const b = a.billing || {};
  if (b.status === 'past_due') out.push('<span class="pill bad">Payment failing</span>');
  else if (isPaying(a) && b.cancel_at_period_end) out.push(`<span class="pill amber">Cancels ${esc(fmtShort(b.current_period_end))}</span>`);
  else if (isPaying(a)) out.push(`<span class="pill good">Paying${b.mrr_pence ? ' ' + esc(money(b.mrr_pence)) + '/mo' : ''}</span>`);

  if (!isPaying(a)) {
    if (freeForever(a)) out.push('<span class="pill good">Free forever</span>');
    else if (freeActive(a)) out.push(`<span class="pill ${a.free_days_left <= 7 ? 'amber' : 'good'}">Free · ${a.free_days_left}d left</span>`);
    else if (a.free_days_left != null) out.push('<span class="pill bad">Free ended</span>');
    else out.push('<span class="pill muted">Lite</span>');
  }
  // For a tester it is the conversion signal. For anyone else it only matters
  // when it is actually stopping them adding students.
  if (wouldNeedPro(a) && (a.segment === 'tester' || !freeActive(a))) {
    out.push(`<span class="pill accent">${a.over_limit_by} over limit</span>`);
  }
  if (a.is_admin) out.push('<span class="pill muted">Admin</span>');
  return out.join('');
}

// ---- Income -------------------------------------------------------------

function incomeHTML() {
  const inc = data.income;
  const accById = new Map(data.accounts.map(a => [a.owner_id, a]));
  const modeBadge = inc?.available
    ? `<span class="mode ${inc.live ? 'live' : 'test'}">${inc.live ? 'Live' : 'Test mode'}</span>` : '';

  if (!inc || !inc.available) {
    return `
      <div class="section-label">Income</div>
      <div class="panel"><div class="panel-note">${esc(inc?.problem || 'Income is not available right now.')}
        The rest of the page is unaffected.</div></div>`;
  }

  const payers = data.accounts.filter(a => a.segment !== 'test' && isPaying(a));
  const pipeline = data.accounts.filter(a => a.segment === 'tester' && wouldNeedPro(a));

  let note = '';
  if (!inc.live) {
    note += '<div>Stripe is running on test keys, so these are pretend payments made with test cards. Nothing here is real money.</div>';
  }
  if (!inc.paying && pipeline.length) {
    const names = pipeline.map(nameOf);
    const list = names.length === 1 ? names[0]
      : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
    const worth = inc.pro_price_pence ? ` If ${pipeline.length === 1 ? 'they' : 'they all'} went Pro, that is ${money(inc.pro_price_pence * pipeline.length)} a month.` : '';
    note += `<div>Nobody is paying yet. ${esc(list)} ${pipeline.length === 1 ? 'is' : 'are'} over the free limit.${esc(worth)}</div>`;
  } else if (!inc.paying) {
    note += '<div>Nobody is paying yet, and no beta tester is over the free limit.</div>';
  }
  if (inc.trialing) note += `<div>${esc(plural(inc.trialing, 'account'))} on a free trial, not counted until it bills.</div>`;
  if (inc.excluded_count) {
    note += `<div class="small">${esc(money(inc.excluded_pence))} from ${esc(plural(inc.excluded_count, 'payment'))} by your test accounts is left out of these numbers.</div>`;
  }

  const payerRows = payers.length ? `
    <div class="rows-head">Paying</div>
    <div class="rows">${payers.map(a => `
      <button class="row-item" data-jump="${esc(a.owner_id)}">
        <span class="grow">${esc(nameOf(a))}</span>
        <span class="dim">${esc(money(a.billing.mrr_pence))}/mo${a.billing.since ? ' · since ' + esc(fmtShort(a.billing.since)) : ''}</span>
      </button>`).join('')}</div>` : '';

  const recentRows = (inc.recent || []).length ? `
    <div class="rows-head">Latest payments</div>
    <div class="rows">${inc.recent.slice(0, 5).map(r => {
      const a = accById.get(r.owner_id);
      return `
      <button class="row-item" ${a ? `data-jump="${esc(a.owner_id)}"` : 'disabled'}>
        <span class="grow">${esc(a ? nameOf(a) : 'Unknown customer')}</span>
        <span class="dim">${esc(fmtShort(r.at))} · ${esc(money(r.amount_pence))}${r.refunded_pence ? ` (${esc(money(r.refunded_pence))} refunded)` : ''}</span>
      </button>`;
    }).join('')}</div>` : '';

  return `
    <div class="section-label">Income ${modeBadge}</div>
    <div class="panel">
      <div class="kpis">
        <div class="kpi${inc.mrr_pence ? '' : ' quiet'}" data-tip-title="Monthly recurring" data-tip="What paying customers are billed every month, read live from Stripe. Test accounts are left out.">
          <b>${esc(money(inc.mrr_pence))}</b><span>a month</span></div>
        <div class="kpi${inc.paying ? '' : ' quiet'}" data-tip-title="Paying" data-tip="Live Pro subscriptions, including any whose latest payment failed while Stripe retries it.">
          <b>${inc.paying}</b><span>paying</span></div>
        <div class="kpi${inc.collected_pence ? '' : ' quiet'}" data-tip-title="Collected" data-tip="Every successful payment since TutorTally started taking money, minus refunds, before Stripe's fees.">
          <b>${esc(money(inc.collected_pence))}</b><span>collected, all time</span></div>
        <div class="kpi${inc.this_month_pence ? '' : ' quiet'}" data-tip-title="This month" data-tip="Collected since the 1st of this month.">
          <b>${esc(money(inc.this_month_pence))}</b><span>this month</span></div>
      </div>
      ${note ? `<div class="panel-note">${note}</div>` : ''}
      ${payerRows}
      ${recentRows}
    </div>`;
}

// ---- Beta testers overview ---------------------------------------------

function testersHTML(testers) {
  const n = testers.length;
  if (!n) {
    return `<div class="section-label">Beta testers</div>
      <div class="panel"><div class="panel-note">No beta testers yet. New sign-ups land here automatically.</div></div>`;
  }
  const active7 = testers.filter(a => daysSince(a.last_seen) !== null && daysSince(a.last_seen) <= 7).length;
  const proper = testers.filter(usingItProperly).length;
  const overLimit = testers.filter(wouldNeedPro).length;

  const funnel = STEP_LABELS.map(([key, label]) => {
    const done = testers.filter(a => stepsOf(a).find(s => s.key === key).state === 'done').length;
    const pct = Math.round((done / n) * 100);
    const stuck = n - done;
    return `
      <button class="f-row" data-missing="${key}"
        aria-label="${esc(`${done} of ${n} beta testers have done ${label}. Show the ${stuck} who have not.`)}">
        <span class="f-label">${esc(label)}</span>
        <span class="f-track"><span class="f-fill" style="width:${pct}%"></span></span>
        <span class="f-n">${done}/${n}</span>
      </button>`;
  }).join('');

  return `
    <div class="section-label">Beta testers</div>
    <div class="panel">
      <div class="kpis">
        <div class="kpi" data-tip-title="Beta testers" data-tip="Everyone not in Team or Test accounts. Move an account between groups from inside its card.">
          <b>${n}</b><span>beta testers</span></div>
        <div class="kpi${active7 ? '' : ' quiet'}" data-tip-title="Used it this week" data-tip="Had TutorTally open in the last 7 days.">
          <b>${active7}</b><span>used it this week</span></div>
        <div class="kpi${proper ? '' : ' quiet'}" data-tip-title="Using it properly" data-tip="Has students, lessons coming in, and has logged at least one payment. The point where TutorTally is doing its job for them.">
          <b>${proper}</b><span>using it properly</span></div>
        <div class="kpi${overLimit ? '' : ' quiet'}" data-tip-title="Over the free limit" data-tip="More active students than the free plan allows, and not paying. These are the testers who would need Pro if their free access stopped.">
          <b>${overLimit}</b><span>over the free limit</span></div>
      </div>
      <div class="funnel">
        <div class="f-head">How far they got. Tap a step to see who is stuck before it.</div>
        ${funnel}
      </div>
    </div>`;
}

// ---- Needs attention ----------------------------------------------------

/**
 * What to do today, rather than a list of cards to read and form your own
 * opinion about. Derived from the rows already loaded, so it costs nothing and
 * can never disagree with the cards below it. Test accounts never appear, and
 * the team only appears when something of theirs is actually broken.
 */
function buildQueue(list) {
  const out = [];
  const days = iso => daysSince(iso);

  for (const a of list) {
    if (a.segment === 'test') continue;
    const b = a.billing || {};
    if (b.status === 'past_due') {
      out.push({ a, tone: 'bad', why: 'their Pro payment failed and Stripe is retrying' });
    }
    if (a.calendar_error) {
      out.push({ a, tone: 'bad', why: 'calendar is erroring, lessons are not coming in' });
    }
    if (a.segment === 'team') continue;

    if (isPaying(a) && b.cancel_at_period_end) {
      out.push({ a, tone: 'warn', why: `cancelled Pro, it ends ${fmtShort(b.current_period_end)}` });
    }
    if (!freeForever(a) && freeActive(a) && a.free_days_left <= 7) {
      out.push({ a, tone: 'warn', why: `free access ends in ${plural(a.free_days_left, 'day')}` });
    }
    if (a.free_days_left != null && a.free_days_left < 0 && wouldNeedPro(a)) {
      out.push({ a, tone: 'bad', why: `free access ended and they are ${plural(a.over_limit_by, 'student')} over the limit` });
    }
    // Signed up, had a proper look around, then stopped. Distinct from someone
    // who signed up and never started, which is the next rule.
    if (a.total_lessons > 0 && days(a.last_seen) != null && days(a.last_seen) >= 14) {
      out.push({ a, tone: 'warn', why: `was using it, nothing for ${days(a.last_seen)} days` });
    }
    if (a.active_students === 0 && days(a.joined) != null && days(a.joined) >= 3) {
      out.push({ a, tone: 'warn', why: `joined ${days(a.joined)} days ago, never added a student` });
    } else if (a.active_students > 0 && a.total_lessons === 0 && days(a.joined) >= 3) {
      out.push({ a, tone: 'bad', why: 'has a student but no lessons have ever come in' });
    }
    // Either parents owe them a lot of money or, far more likely, they are not
    // logging it. Both are worth a message.
    const unpaid = a.taught_chargeable - a.taught_paid;
    if (a.taught_chargeable >= 8 && unpaid / a.taught_chargeable > 0.5) {
      out.push({ a, tone: 'warn', why: `${unpaid} of ${a.taught_chargeable} lessons taught have no payment logged` });
    }
  }
  return out.sort((x, y) => (x.tone === 'bad' ? 0 : 1) - (y.tone === 'bad' ? 0 : 1));
}

function queueHTML(list) {
  const items = buildQueue(list);
  if (!items.length) {
    return '<div class="section-label">Needs attention</div>'
      + '<div class="q-empty">Nothing needs chasing today.</div>';
  }
  return `<div class="section-label">Needs attention · ${items.length}</div>`
    + items.map(q => `
        <button class="q-item ${q.tone}" data-jump="${esc(q.a.owner_id)}">
          <span class="q-who">${esc(nameOf(q.a))}</span>
          <span class="q-why">${esc(q.why)}</span>
          ${q.a.segment === 'team' ? '<span class="q-tag">team</span>' : ''}
        </button>`).join('');
}

// ---- The account list ---------------------------------------------------

function statsHTML(a) {
  const archived = a.total_students - a.active_students;
  const paidVal = a.taught_chargeable ? `${a.taught_paid}/${a.taught_chargeable}` : '—';
  const cell = (val, label, title, body, quiet) =>
    `<div class="stat${quiet ? ' quiet' : ''}" tabindex="0" data-tip-title="${esc(title)}" data-tip="${esc(body)}"><b>${esc(val)}</b><span>${esc(label)}</span></div>`;
  return `<div class="stats">
    ${cell(a.active_students, 'Students', 'Students',
      `${plural(a.active_students, 'active student')}${archived ? `, ${archived} archived` : ''}. The free plan covers ${a.free_student_limit}.`,
      !a.active_students)}
    ${cell(a.lessons_last_30, 'Taught 30d', 'Taught in the last 30 days', 'Lessons dated in the last 30 days, mostly from their calendar.', !a.lessons_last_30)}
    ${cell(a.lessons_upcoming, 'Booked', 'Booked ahead', 'Lessons in the diary from tomorrow on.', !a.lessons_upcoming)}
    ${cell(paidVal, 'Lessons paid', 'Lessons paid for',
      a.taught_chargeable
        ? `${a.taught_paid} of the ${a.taught_chargeable} lessons taught since they started tracking money have enough logged against them to count as paid. One payment can cover many lessons, so this is the number to watch, not the payment count.`
        : 'No chargeable lessons taught yet.',
      !a.taught_chargeable)}
    ${cell(gbp(a.money_logged), 'Fees logged', 'Fees logged',
      a.payments_logged
        ? `What parents have paid this tutor, as recorded in TutorTally: ${plural(a.payments_logged, 'payment')}${a.last_payment_date ? `, latest dated ${fmtShort(a.last_payment_date)}` : ''}. This is their income, not ours.`
        : 'No payments from parents recorded yet.',
      !a.payments_logged)}
    ${cell(a.parent_days_30d, 'Parent opens', 'Parent-link opens',
      a.parent_views_ever
        ? `Parents opened a link on ${plural(a.parent_days_30d, 'day')} in the last 30. Counted in days, so one parent refreshing five times is one.`
        : `No parent has opened a link yet. Counted from ${PARENT_OPENS_COUNTED_FROM}.`,
      !a.parent_days_30d)}
  </div>`;
}

function metaHTML(a) {
  const lines = [];
  lines.push(`Joined ${esc(fmtDate(a.joined) || '?')} · last used <b>${esc(agoLabel(a.last_seen))}</b>${
    a.last_entry ? ' · last added something ' + esc(agoLabel(a.last_entry)) : ''}`);

  const calName = a.calendar === 'google' ? 'Google Calendar' : a.calendar === 'link' ? 'Calendar link' : null;
  if (calName) {
    lines.push(`${calName}${a.calendar_synced_at ? ', last sync ' + esc(agoLabel(a.calendar_synced_at)) : ''}${
      a.calendar_error ? `<br><span class="bad">⚠ ${esc(a.calendar_error)}</span>` : ''}`);
  } else {
    lines.push('No calendar connected');
  }

  const b = a.billing || {};
  if (isPaying(a)) {
    lines.push(`Pays ${esc(money(b.mrr_pence))} a month${b.since ? ' since ' + esc(fmtDate(b.since)) : ''}${
      b.collected_pence != null ? ` · ${esc(money(b.collected_pence))} collected so far` : ''}${
      b.cancel_at_period_end ? ` · <span class="bad">cancelled, ends ${esc(fmtDate(b.current_period_end))}</span>` : ''}`);
  } else if (b.collected_pence) {
    lines.push(`Used to pay: ${esc(money(b.collected_pence))} collected in total`);
  }

  if (freeForever(a)) lines.push('Free access with no end date');
  else if (a.pro_free_until) lines.push(`Free access ${a.free_days_left < 0 ? 'ended' : 'runs to'} <b>${esc(fmtDate(a.pro_free_until))}</b>`);

  return `<div class="meta">${lines.join('<br>')}</div>`;
}

function notesHTML(a) {
  return `
    <div class="notes">
      <div class="notes-label">Notes · ${a.notes.length}</div>
      <div class="note-editor" contenteditable="true" data-note-box data-empty="true"
        role="textbox" aria-multiline="true"
        data-placeholder="What did they say? Where did it come from?"></div>
      <div class="btn-row" style="margin:7px 0 4px">
        <button class="btn" data-act="save-note">Add note</button>
      </div>
      ${a.notes.length
        ? a.notes.map(nt => `<div class="note"><time><span class="by">${esc(nt.author || 'Unknown')}</span> · ${esc(fmtDateTime(nt.created_at))}</time>${richNoteHTML(nt.body)}</div>`).join('')
        : '<div class="note" style="color:var(--muted)">Nothing recorded yet.</div>'}
    </div>`;
}

function accountHTML(a) {
  const open = ui.open.has(a.owner_id);
  const latest = a.notes[0];
  const line2 = [a.name ? a.email : null, `used ${agoLabel(a.last_seen)}`].filter(Boolean).join(' · ');

  return `
    <div class="acct${open ? ' open' : ''}" data-owner="${esc(a.owner_id)}">
      <div class="acct-head" data-toggle role="button" tabindex="0" aria-expanded="${open}">
        <div class="line1">
          <span class="who">${esc(nameOf(a))}</span>
          ${pillsHTML(a)}
          <span class="chev" aria-hidden="true">›</span>
        </div>
        <div class="line2">${esc(line2)}</div>
        ${stepsHTML(a)}
        ${latest && !open ? `<div class="peek"><b>${esc(latest.author || 'Unknown')}:</b> ${esc(plainNote(latest.body))}</div>` : ''}
      </div>
      ${open ? `
        <div class="body">
          ${statsHTML(a)}
          <div class="foot">
            ${metaHTML(a)}
            <div class="btn-row">
              ${a.phone ? `<a class="btn" href="https://wa.me/${esc(a.phone)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
              ${a.email ? `<a class="btn" href="mailto:${esc(a.email)}">Email</a>` : ''}
              ${!freeForever(a) ? '<button class="btn primary" data-act="grant">+1 month free</button>' : ''}
              ${freeActive(a) ? '<button class="btn danger" data-act="revoke">End free access</button>' : ''}
            </div>
            <label class="move">Group
              <select data-seg-select>
                ${SEGMENTS.map(([k, label]) => `<option value="${k}"${a.segment === k ? ' selected' : ''}>${esc(label)}</option>`).join('')}
              </select>
            </label>
            ${notesHTML(a)}
          </div>
        </div>` : ''}
    </div>`;
}

function visibleAccounts() {
  const q = ui.q.trim().toLowerCase();
  return data.accounts.filter(a => {
    if (a.segment !== ui.seg) return false;
    if (q && !`${a.name || ''} ${a.email || ''}`.toLowerCase().includes(q)) return false;
    if (ui.missing && stepsOf(a).find(s => s.key === ui.missing)?.state === 'done') return false;
    return true;
  });
}

function listHTML() {
  const list = visibleAccounts();
  const missingLabel = ui.missing ? stepLabel(ui.missing) : null;
  const chip = missingLabel
    ? `<button class="chip" data-clear-missing>Not done yet: ${esc(missingLabel)} ✕</button>` : '';
  const emptyText = ui.missing ? `Everyone here has done ${missingLabel}.`
    : ui.q ? 'Nobody matches that search.'
    : ui.seg === 'test' ? 'No test accounts. Move one here from its card so it stops counting as a tester.'
    : 'Nobody in this group yet.';
  return chip + (list.length ? list.map(accountHTML).join('') : `<div class="empty">${esc(emptyText)}</div>`);
}

function tabsHTML() {
  return `<div class="tabs" role="tablist">${SEGMENTS.map(([k, label]) => {
    const n = data.accounts.filter(a => a.segment === k).length;
    return `<button class="tab" role="tab" data-seg="${k}" aria-selected="${ui.seg === k}">${esc(label)}<span class="n">${n}</span></button>`;
  }).join('')}</div>`;
}

function render() {
  hideTip();
  const testers = data.accounts.filter(a => a.segment === 'tester');
  app.innerHTML = `
    <div class="top">
      <div>
        <h1>TutorTally admin</h1>
        <div class="sub">Signed in as ${esc(data.me || '?')} · loaded ${esc(fmtDateTime(data.loadedAt))}</div>
      </div>
      <button class="btn" data-act="refresh">Refresh</button>
    </div>
    <div class="hint">Hover over, or tap, anything underlined or any setup step to see what it means.</div>
    ${incomeHTML()}
    ${testersHTML(testers)}
    ${queueHTML(data.accounts)}
    <div class="section-label" id="accounts">Accounts</div>
    ${tabsHTML()}
    <input type="search" class="search" id="q" placeholder="Search by name or email" value="${esc(ui.q)}" autocomplete="off">
    <div id="list">${listHTML()}</div>
    <div class="btn-row" style="margin-top:22px">
      <a class="btn" href="/">← Back to TutorTally</a>
      <button class="btn" data-act="signout">Sign out</button>
    </div>
    <div class="version">${VERSION}</div>`;
  playIntroOnce();
}

function renderList() {
  hideTip();
  document.getElementById('list').innerHTML = listHTML();
}

// The accounts ease in when the group or the step filter changes, but not on
// every keystroke in search, where it would flicker.
function animateList() {
  const list = document.getElementById('list');
  if (!list) return;
  list.classList.remove('enter');
  void list.offsetWidth;
  list.classList.add('enter');
}

// Only the very first paint gets the full ease-in. Re-renders after a note or
// a grant would otherwise replay it, which reads as the page reloading.
let introShown = false;
function playIntroOnce() {
  if (introShown) return;
  introShown = true;
  app.classList.add('intro');
  setTimeout(() => app.classList.remove('intro'), 1300);
}

function openAccount(ownerId) {
  const a = data.accounts.find(x => x.owner_id === ownerId);
  if (!a) return;
  ui.seg = a.segment;
  remember('tt-admin-seg', ui.seg);
  ui.q = '';
  ui.missing = null;
  ui.open.add(ownerId);
  render();
  const card = app.querySelector(`.acct[data-owner="${ownerId}"]`);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1600);
}

// ---- Tooltip ------------------------------------------------------------
//
// Hover on a computer, tap on a phone. A tap pins it until the next tap, so it
// can be read without holding a finger on the screen.

let tipFor = null;
let tipPinned = false;

function showTip(el, pin) {
  const title = el.dataset.tipTitle;
  const body = el.dataset.tip;
  const tone = el.dataset.tipTone || '';
  tip.innerHTML = (title ? `<div class="t-title ${esc(tone)}">${esc(title)}</div>` : '') + `<div>${esc(body)}</div>`;
  tip.classList.add('show');
  tipFor = el;
  tipPinned = !!pin;

  const r = el.getBoundingClientRect();
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = r.top - h - 8;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}

function hideTip() {
  tip.classList.remove('show');
  tipFor = null;
  tipPinned = false;
}

document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest?.('[data-tip]');
  if (t && t !== tipFor) showTip(t, false);
});
document.addEventListener('pointerout', (e) => {
  if (e.pointerType !== 'mouse' || tipPinned || !tipFor) return;
  if (!tipFor.contains(e.relatedTarget)) hideTip();
});
document.addEventListener('focusin', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (t) showTip(t, false);
});
document.addEventListener('focusout', () => { if (!tipPinned) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('resize', hideTip);

// ---- Interaction --------------------------------------------------------
//
// One listener for the whole page rather than per element, so re-rendering
// never leaves a dead handler behind.

app.addEventListener('click', async (e) => {
  const tipEl = e.target.closest('[data-tip]');
  if (tipEl) {
    // Explaining a step must never also open or close the card it sits in.
    if (tipFor === tipEl && tipPinned) hideTip();
    else showTip(tipEl, true);
    return;
  }
  hideTip();

  const el = e.target.closest('[data-jump],[data-missing],[data-seg],[data-clear-missing],[data-act],[data-toggle]');
  if (!el) return;

  if (el.dataset.jump) return openAccount(el.dataset.jump);

  if (el.dataset.missing) {
    ui.seg = 'tester';
    ui.q = '';
    ui.missing = el.dataset.missing;
    render();
    animateList();
    document.getElementById('accounts')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  if (el.dataset.seg) {
    ui.seg = el.dataset.seg;
    ui.missing = null;
    remember('tt-admin-seg', ui.seg);
    render();
    return animateList();
  }

  if ('clearMissing' in el.dataset) {
    ui.missing = null;
    renderList();
    return animateList();
  }

  if ('toggle' in el.dataset) {
    const id = el.closest('[data-owner]').dataset.owner;
    const opening = !ui.open.has(id);
    if (opening) ui.open.add(id); else ui.open.delete(id);
    renderList();
    // Only the card just tapped fades its details in.
    if (opening) app.querySelector(`.acct[data-owner="${id}"]`)?.classList.add('opening');
    return;
  }

  if (el.dataset.act) return handleAct(el);
});

// The note box. Pasted formatting is cut down to bold, underline and bullets
// before it goes in; "- " at the start of a line becomes a bullet.
app.addEventListener('paste', (e) => {
  const box = e.target.closest?.('[data-note-box]');
  if (!box) return;
  const html = notePasteHTML(e);
  if (html == null) return;
  e.preventDefault();
  document.execCommand('insertHTML', false, html);
  markEmpty(box);
});

app.addEventListener('input', (e) => {
  const box = e.target.closest?.('[data-note-box]');
  if (!box) return;
  noteNormalise(box);
  noteAutoList(box);
  markEmpty(box);
});

// Bold and underline as tags rather than inline styles, which is what the
// note reader expects (it copes with either, but tags are tidier).
app.addEventListener('focusin', (e) => {
  if (e.target.closest?.('[data-note-box]')) {
    try { document.execCommand('styleWithCSS', false, false); } catch {}
  }
});

app.addEventListener('keydown', (e) => {
  const noteBox = e.target.closest?.('[data-note-box]');
  if (noteBox) { if (noteEnterKey(e, noteBox)) markEmpty(noteBox); return; }
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const head = e.target.closest('[data-toggle]');
  if (!head || e.target !== head) return;
  e.preventDefault();
  head.click();
});

app.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  ui.q = e.target.value;
  renderList();
});

app.addEventListener('change', async (e) => {
  const sel = e.target.closest('select[data-seg-select]');
  if (!sel) return;
  const ownerId = sel.closest('[data-owner]').dataset.owner;
  sel.disabled = true;
  const r = await call('segment', { owner_id: ownerId, segment: sel.value });
  if (!r.ok) { alert('Could not move that account: ' + (r.problem || 'unknown')); sel.disabled = false; return; }
  await load(true);
});

// Same date sum the server does, so the confirm can say where the grant lands.
function grantPreview(a) {
  const today = new Date().toISOString().slice(0, 10);
  const base = a.pro_free_until && a.pro_free_until > today
    ? new Date(a.pro_free_until + 'T00:00:00Z') : new Date();
  const d = new Date(base.getTime());
  const day = d.getDate();
  d.setMonth(d.getMonth() + 1);
  if (d.getDate() < day) d.setDate(0);
  return d.toISOString();
}

async function handleAct(btn) {
  const act = btn.dataset.act;

  if (act === 'refresh') { btn.disabled = true; return load(true); }
  if (act === 'signout') {
    await sb.auth.signOut();
    return renderGate(null);
  }

  const card = btn.closest('[data-owner]');
  if (!card) return;
  const ownerId = card.dataset.owner;
  const a = data.accounts.find(x => x.owner_id === ownerId);

  if (act === 'grant') {
    if (!confirm(`Give ${nameOf(a)} another month of free access?\n\nIt would run to ${fmtDate(grantPreview(a))}.`)) return;
    btn.disabled = true;
    const r = await call('grant', { owner_id: ownerId, months: 1 });
    if (!r.ok) { alert('Could not do that: ' + (r.problem || 'unknown')); btn.disabled = false; return; }
    return load(true);
  }

  if (act === 'revoke') {
    if (!confirm(`End free access for ${nameOf(a)}?\n\nThey keep everything and can still log payments. If they are over the free limit, they cannot add new students or lessons until they go Pro.`)) return;
    btn.disabled = true;
    const r = await call('revoke', { owner_id: ownerId });
    if (!r.ok) { alert('Could not do that: ' + (r.problem || 'unknown')); btn.disabled = false; return; }
    return load(true);
  }

  if (act === 'save-note') {
    const box = card.querySelector('[data-note-box]');
    const body = box ? editorToNote(box).trim() : '';
    if (!body) { box?.focus(); return; }
    btn.disabled = true;
    const r = await call('note', { owner_id: ownerId, body });
    if (!r.ok) { alert('Could not save that note: ' + (r.problem || 'unknown')); btn.disabled = false; return; }
    return load(true);
  }
}

// ---- Boot ---------------------------------------------------------------

// Quiet reloads keep the page where it is after an action, instead of blanking
// it to "Loading…" and throwing away the scroll position.
async function load(quiet = false) {
  if (!quiet) app.innerHTML = '<div class="empty">Loading…</div>';
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderGate(null);

  const r = await call('list');
  if (r.problem === 'signed_out' || r.problem === 'unauthorized') return renderGate(null);
  if (r.problem === 'not_found') {
    app.innerHTML = `
      <div class="gate">
        <h1>Not an admin</h1>
        <div class="sub" style="margin-bottom:16px">
          This account cannot see the admin panel. If it should be able to, ask
          Daniel to add it.
        </div>
        <button class="btn" data-act="signout">Sign out</button>
      </div>`;
    return;
  }
  if (!r.ok) {
    app.innerHTML = `<div class="empty">Could not load: ${esc(r.problem || 'unknown')}</div>`;
    return;
  }
  const y = window.scrollY;
  data = { accounts: r.accounts || [], income: r.income || null, me: r.me, loadedAt: new Date().toISOString() };
  render();
  if (quiet) window.scrollTo(0, y);
}

load();
</script>

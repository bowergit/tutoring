<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Replaced with "[first name]'s lessons" once the data lands. This static
     value is all a link-preview crawler sees, since it reads the raw HTML and
     never runs the script that knows whose page it is. -->
<title>Lessons</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<meta name="theme-color" content="#ffa500">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8f4; --card: #ffffff; --card-2: #f5f7f6; --line: #dfe7e3;
    --ink: #15211f; --ink-dim: #596965;
    --accent: #a15c00; --accent-fill: #ffa500; --on-accent: #15211f; --accent-light: #fff1d9;
    --muted: #87938f;
    --r-md: 13px; --r-lg: 17px;
    --sh-2: 0 1px 2px rgba(22,21,15,.05), 0 6px 16px -8px rgba(22,21,15,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716; --card: #182321; --card-2: #1e2a27; --line: #30413d;
      --ink: #eef8f5; --ink-dim: #a5b7b1;
      --accent: #ffa500; --accent-fill: #ffa500; --on-accent: #15211f; --accent-light: #3a2604;
      --muted: #7f918c;
      --sh-2: 0 1px 3px rgba(0,0,0,.45), 0 8px 20px -10px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    /* Same stack as the dashboard on purpose. */
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; padding: 24px 16px 60px;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand svg { width: 30px; height: 23px; display: block; flex-shrink: 0; }
  .brand span { font-size: 0.78rem; font-weight: 650; color: var(--muted); letter-spacing: 0.01em; }
  h1 { font-size: 1.3rem; font-weight: 750; letter-spacing: -0.02em; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 22px; }
  .section-label {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 22px 0 8px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-2); overflow: hidden;
  }
  .lesson { border-bottom: 1px solid var(--line); }
  .lesson:last-child { border-bottom: none; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 15px; font-size: 0.92rem;
  }
  .row .when { font-weight: 600; }
  .row .time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  /* The very next one, so it is findable at a glance rather than counted to. */
  .lesson.next .row { background: var(--accent-light); }
  .lesson.next .when { color: var(--accent); }
  .lesson.next .time { color: var(--accent); }
  .nextflag {
    font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); display: block; margin-bottom: 2px;
  }
  .showmore {
    display: block; width: 100%; text-align: center; padding: 11px 0; margin-top: 8px;
    background: none; border: none; color: var(--muted); font-size: 0.82rem;
    font-family: inherit; cursor: pointer;
  }
  .empty { text-align: center; color: var(--muted); padding: 34px 20px; font-size: 0.88rem; line-height: 1.55; }
  .state { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; line-height: 1.6; }
  .foot { color: var(--muted); font-size: 0.74rem; margin-top: 22px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="state">Loading your lessons…</div>
</div>
<script>
(async function () {
  const FN_BASE = 'https://uilytgubukiinyrqrltj.supabase.co/functions/v1';
  const SHOWN = 8;
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const token = new URLSearchParams(window.location.search).get('t');
  if (!token) {
    app.innerHTML = '<div class="state">This link is missing its code. Ask your tutor to send it again.</div>';
    return;
  }

  let data;
  try {
    data = await fetch(`${FN_BASE}/student-portal?t=${encodeURIComponent(token)}`).then(r => r.json());
  } catch {
    app.innerHTML = '<div class="state">Could not load your lessons. Check your connection and try again.</div>';
    return;
  }
  if (!data || !data.ok) {
    app.innerHTML = '<div class="state">This link is not working any more. Ask your tutor for a new one.</div>';
    return;
  }

  const MARK = `
    <svg viewBox="0 0 900 700" role="img" aria-label="TutorTally">
      <path d="M86 440L812 220" fill="none" stroke="var(--accent-fill)" stroke-width="94" stroke-linecap="round"/>
      <rect x="292" y="48" width="100" height="604" rx="14" fill="var(--ink)"/>
      <rect x="512" y="48" width="100" height="604" rx="14" fill="var(--ink)"/>
    </svg>`;

  function dayLabel(iso) {
    const d = new Date(iso + 'T12:00:00');
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const days = Math.round((d - today) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }

  // Only ever hours and minutes. The stored value can carry seconds, which
  // read as a stopwatch rather than a lesson time.
  const timeLabel = t => String(t || '').slice(0, 5);

  let expanded = false;
  const upcoming = data.upcoming || [];
  const firstName = String(data.name || '').trim().split(/\s+/)[0] || 'Your';
  document.title = `${firstName}'s lessons`;

  function render() {
    const shown = expanded ? upcoming : upcoming.slice(0, SHOWN);
    const more = upcoming.length - shown.length;

    const list = upcoming.length === 0
      ? `<div class="card"><div class="empty">
           No lessons in the diary yet.<br>Your tutor will add them as they are booked.
         </div></div>`
      : `<div class="card">
           ${shown.map((l, i) => `
             <div class="lesson${i === 0 ? ' next' : ''}">
               <div class="row">
                 <span>
                   ${i === 0 ? '<span class="nextflag">Next lesson</span>' : ''}
                   <span class="when">${esc(dayLabel(l.date))}</span>
                 </span>
                 <span class="time">${esc(timeLabel(l.time))}</span>
               </div>
             </div>`).join('')}
         </div>
         ${more > 0 ? `<button class="showmore" id="more">Show ${more} more</button>` : ''}
         ${expanded && upcoming.length > SHOWN ? `<button class="showmore" id="less">Show fewer</button>` : ''}`;

    app.innerHTML = `
      <div class="brand">${MARK}<span>TutorTally</span></div>
      <h1>${esc(data.name)}</h1>
      <div class="sub">Your upcoming lessons</div>
      <div class="section-label">Booked in</div>
      ${list}
      <div class="foot">Times come straight from your tutor's calendar, so this page is always current.</div>`;

    const more_ = document.getElementById('more');
    if (more_) more_.addEventListener('click', () => { expanded = true; render(); });
    const less_ = document.getElementById('less');
    if (less_) less_.addEventListener('click', () => { expanded = false; render(); });
  }

  render();
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Tutortally logo</title>
  <desc id="desc">Tutortally wordmark with a tally mark icon.</desc>
  <defs>
    <linearGradient id="tutortally-bg" x1="20" y1="12" x2="148" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11988d"/>
      <stop offset="0.62" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#15211f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15211f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g transform="translate(16 18)">
    <rect x="0" y="0" width="136" height="136" rx="32" fill="url(#tutortally-bg)" filter="url(#soft-shadow)"/>
    <path d="M31 39v58M51 39v58M71 39v58M91 39v58" fill="none" stroke="#f7f8f4" stroke-width="12" stroke-linecap="round"/>
    <path d="M26 95L105 44" fill="none" stroke="#d05b39" stroke-width="17" stroke-linecap="round"/>

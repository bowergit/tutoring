    <path d="M114 34l-7 18 19-6" fill="#2563eb"/>
  </g>
  <g font-family="General Sans, Inter, Avenir Next, Segoe UI, Arial, sans-serif">
    <text x="184" y="102" fill="#15211f" font-size="72" font-weight="760" letter-spacing="-3.6">Tutor</text>
    <text x="366" y="102" fill="#0f766e" font-size="72" font-weight="760" letter-spacing="-3.6">tally</text>
    <text x="188" y="139" fill="#596965" font-size="20" font-weight="560" letter-spacing="0.2">tutoring admin, finally totalled</text>

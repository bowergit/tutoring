}

function StudentCard({ student, lessons, payments, bundles, allocations = [], allStudents, rateHistory, focused, onEdit, onDataChanged }) {
  const M = useMoney();
  const N = useNameDisplay();
  const [open, setOpen] = useState(false);
  const [notesOpen, setNotesOpen] = useState(false);
  const [showMoreTools, setShowMoreTools] = useState(false);
  const [showCashModal, setShowCashModal] = useState(false);
  const [openMonths, setOpenMonths] = useState({});
  const [showAllUpcoming, setShowAllUpcoming] = useState(false);
  const [detailLesson, setDetailLesson] = useState(null);
  const [detailPayment, setDetailPayment] = useState(null);
  const [editPayment, setEditPayment] = useState(null);
  const [showStatement, setShowStatement] = useState(false);
  const [paymentsOpen, setPaymentsOpen] = useState(false);
  const [toggling, setToggling] = useState(false);

  const studentLessons = lessons.filter(l => l.student_id === student.id)
    .sort((a, b) => new Date(b.lesson_date) - new Date(a.lesson_date));
  const studentPayments = payments.filter(p => p.student_id === student.id);
  const studentBundles = bundles.filter(b => b.student_id === student.id);

  const upcomingLessons = studentLessons.filter(l => l.status === 'scheduled')
    .sort((a, b) => new Date(a.lesson_date) - new Date(b.lesson_date));

  const completedLessons = studentLessons.filter(l => l.status === 'completed');
  // pre_settled lessons were taught before the 27 Jul 2026 reset and are
  // declared already paid, so they never count towards the balance.
  const totalOwed = completedLessons
    .filter(l => !l.is_complimentary && !l.pre_settled)
    .reduce((sum, l) => sum + rateForLesson(l, rateHistory), 0);
  // In fake mode, real payment amounts are scaled by the same ratio the rate
  // was faked by, so a payment still covers the lessons it actually covered.
  const moneyScale = moneyScaleFor(student.id, rateHistory);
  const totalPaid = studentPayments.reduce((sum, p) => sum + parseFloat(p.amount) * moneyScale, 0);
  const balance = totalOwed - totalPaid;

  const paymentsNewestFirst = [...studentPayments].sort((a, b) => b.date_paid.localeCompare(a.date_paid));
  const lastPaymentDate = paymentsNewestFirst[0]?.date_paid || null;

  // Which money paid for which lesson. A lesson can be part-paid, or covered
  // by more than one payment, so each entry carries the full picture.
  const lessonIds = new Set(studentLessons.map(l => l.id));
  const studentAllocations = allocations.filter(a => lessonIds.has(a.lesson_id));
  const paymentsById = Object.fromEntries(studentPayments.map(p => [p.id, p]));

  const payInfoByLessonId = {};
  studentAllocations.forEach(a => {
    const info = payInfoByLessonId[a.lesson_id] || { paid: 0, payments: [] };
    info.paid += parseFloat(a.amount) * moneyScale;
    const p = paymentsById[a.payment_id];
    if (p) info.payments.push({ ...p, allocated: parseFloat(a.amount) * moneyScale });
    payInfoByLessonId[a.lesson_id] = info;
  });

  function lessonPayState(l) {
    const rate = rateForLesson(l, rateHistory);
    const info = payInfoByLessonId[l.id];
    const paid = info ? info.paid : 0;
    return {
      rate, paid,
      payments: info ? info.payments : [],
      settled: l.pre_settled || l.is_complimentary || paid >= rate - 0.005,
      partial: paid > 0.005 && paid < rate - 0.005,
    };
  }

  // Money received that isn't yet attached to a lesson — i.e. credit in hand.
  const allocatedTotal = studentAllocations.reduce((sum, a) => sum + parseFloat(a.amount) * moneyScale, 0);

  const daysSinceLastPayment = lastPaymentDate ? daysBetween(lastPaymentDate) : null;
  const isOverdue = balance > 0 && (daysSinceLastPayment === null || daysSinceLastPayment > 2);

  const nextLesson = upcomingLessons[0];

  // Credit in hand: money received beyond what's been allocated to lessons,
  // expressed as roughly how many sessions it covers ahead.
  const creditInHand = Math.max(0, totalPaid - allocatedTotal);
  const bundleRemaining = null;
  const activeBundle = null;

  async function toggleComplimentary(lesson) {
    setToggling(true);
    await supabase.from('tutoring_lessons').update({ is_complimentary: !lesson.is_complimentary }).eq('id', lesson.id);
    // Same reason as a rate change: this moves what's owed, so anything
    // already allocated to this lesson has to be redistributed — otherwise
    // making a lesson free strands its payment there instead of letting it
    // settle the next one.
    await supabase.rpc('reallocate_student_payments', { p_student_id: student.id });
    setToggling(false);
    setDetailLesson(null);
    onDataChanged();
  }

  // The escape hatch for a lesson that shouldn't exist — a calendar event
  // created by mistake, or one the sync picked up before it was cancelled.
  // Without this the only option was marking it free, which leaves a lesson
  // in the history that never happened and quietly distorts the record.
  async function deleteLesson(lesson) {
    setToggling(true);
    await supabase.from('tutoring_lessons').delete().eq('id', lesson.id);
    // Its allocations cascade away with it, so rebuilding moves that money
    // onto the next unpaid lesson instead of leaving the student looking
    // behind on payments they've actually made.
    await supabase.rpc('reallocate_student_payments', { p_student_id: student.id });
    setToggling(false);
    setDetailLesson(null);
    onDataChanged();
  }

  async function archiveStudent() {
    await supabase.from('tutoring_students').update({ active: false }).eq('id', student.id);
    setShowMoreTools(false);
    onDataChanged();
  }

  async function deleteStudent() {
    await supabase.from('tutoring_monzo_transactions')
      .update({ matched_student_id: null }).eq('matched_student_id', student.id);
    await supabase.from('tutoring_students').delete().eq('id', student.id);
    setShowMoreTools(false);
    onDataChanged();
  }

  const displayYear = currentSchoolYear(student.school_year, student.school_year_as_of_date);
  const referredBy = student.referred_by_student_id ? allStudents.find(s => s.id === student.referred_by_student_id) : null;
  const referrals = allStudents.filter(s => s.referred_by_student_id === student.id);

  const currentRate = getCurrentRate(student.id, rateHistory);
  const unpaidCount = balance > 0 && currentRate > 0 ? Math.ceil(balance / currentRate) : 0;

  const sixMonthsOut = new Date();
  sixMonthsOut.setMonth(sixMonthsOut.getMonth() + 6);
  const sixMonthsOutStr = sixMonthsOut.toISOString().slice(0, 10);
  const upcomingNext6 = upcomingLessons.filter(l => l.lesson_date <= sixMonthsOutStr);
  const pastLessons = studentLessons
    .filter(l => l.status !== 'scheduled')
    .slice(0, Math.max(10, unpaidCount));

  const groupedLessons = groupByMonth(pastLessons);
  const isMonthOpen = key => key in openMonths ? openMonths[key] : (groupedLessons.length > 0 && groupedLessons[0].key === key);

  const studentFirstName = student.name.split(' ')[0];
  const parentFirstName = (student.parent_name || '').split(' ')[0];
  const greeting = parentFirstName ? `Hi ${parentFirstName}!` : 'Hi!';
  const phone = normaliseUKPhone(student.parent_phone);
  const waMessage = balance > 0
    ? `${greeting} Just a friendly reminder we have an outstanding balance of ${moneyText(balance)} for ${studentFirstName}'s maths lessons. Please could you settle this when you get the chance? Thanks!`
    : `${greeting} Just checking in about ${studentFirstName}'s next maths lesson.`;
  const waLink = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(waMessage)}` : null;
  const paymentMsg = `${greeting} Just a note that we have ${unpaidCount} outstanding session${unpaidCount !== 1 ? 's' : ''} totalling ${moneyText(balance)}. Please could you settle this when you get the chance? Thanks!`;
  const paymentWaLink = phone && balance > 0 ? `https://wa.me/${phone}?text=${encodeURIComponent(paymentMsg)}` : null;
  const bundleWaLink = null;

  const paperRecent = recentPaper(student);

  return (
    <div
      className={`card${open ? ' is-open' : ''}`}
      id={'student-' + student.id}
      style={focused ? { borderColor: 'var(--accent)', boxShadow: 'var(--sh-3), var(--ring)' } : undefined}
    >
      <div className="card-header" onClick={() => setOpen(!open)}>
        <div style={{minWidth:0}}>
          <div className="student-name">
            <span className={`dot ${balance > 0.005 ? 'warn' : nextLesson ? 'ok' : 'idle'}`} />
            {N(student.name, student.id)}{!student.active && ' (inactive)'}
            {paperRecent && (
              <span className="sparkle" title={`Past paper ${paperRecent.label}`}>✨</span>
            )}
          </div>
          <div className="status-row">
            {balance > 0 && (
              <span className={`pill ${isOverdue ? 'warn' : 'neutral'}`}>
                {isOverdue ? `Overdue ${M(balance, student.id + ':balance')}` : `Owes ${M(balance, student.id + ':balance')}`}
              </span>
            )}
            {balance <= 0 && <span className="pill ok">Paid up</span>}
            {creditInHand > 0.005 && (
              <span className="pill ok">{M(creditInHand, student.id + ':credit')} credit</span>
            )}
            {nextLesson && (
              <span className="pill neutral">Next: {new Date(nextLesson.lesson_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>
            )}
            {displayYear && <span className="pill neutral">Y{displayYear}</span>}
            <span className="pill neutral">{M(currentRate, student.id + ':rate')}</span>
            {student.is_zoom && <span className="pill neutral">Zoom</span>}
          </div>
        </div>
        <span className={`chevron ${open ? 'open' : ''}`}>›</span>
      </div>

      <div className={`card-body${open ? ' open' : ''}`}>
      <div className="card-body-inner">
          {(student.school || displayYear || referredBy || referrals.length > 0) && (
            <React.Fragment>
              <div className="section-label">Details</div>
              {(student.school || displayYear) && (
                <div style={{ fontSize: '0.85rem', color: 'var(--ink-dim)', marginBottom: 4 }}>
                  {student.school}{displayYear ? `, Year ${displayYear}` : ''}{student.exam_board ? ` · ${student.exam_board}` : ''}{student.exam_tier && student.exam_tier !== 'not_sure' ? ` (${student.exam_tier})` : ''}
                </div>
              )}
              {displayYear && student.school_year && (() => {
                const now = new Date();
                const thisAug = new Date(now.getFullYear(), 7, 1);
                const nextAug = now < thisAug ? thisAug : new Date(now.getFullYear() + 1, 7, 1);
                const nextDisplayYear = Math.min(displayYear + 1, 13);
                const daysToUpdate = Math.ceil((nextAug - now) / 86400000);
                const startedLabel = student.school_year !== displayYear ? ` · started Y${student.school_year}` : '';
                // Only worth mentioning when it's imminent — "Y12 in 360d" is
                // noise for eleven and a half months of the year.
                const updateLabel = (nextDisplayYear <= 13 && daysToUpdate <= 14)
                  ? ` · Y${nextDisplayYear} in ${daysToUpdate}d`
                  : '';
                return <div style={{fontSize:'0.76rem', color:'var(--muted)', marginBottom:4}}>{`Y${displayYear}${startedLabel}${updateLabel}`}</div>;
              })()}
              {referredBy && (
                <div style={{ fontSize: '0.82rem', color: 'var(--muted)' }}>Referred by {N(referredBy.name, referredBy.id).split(' ')[0]}</div>
              )}
              {referrals.length > 0 && (
                <div style={{ fontSize: '0.82rem', color: 'var(--accent)', marginTop: 2 }}>
                  Referred {referrals.map(s => N(s.name, s.id).split(' ')[0]).join(', ')} — use "mark free" on their next lesson
                </div>
              )}
              {paperRecent && (
                <div className="paper-chip">
                  ✨ Past paper {paperRecent.label}
                  {paperRecent.score != null && <b>{paperRecent.score}%</b>}
                  {paperRecent.name && <span style={{color:'var(--muted)'}}>· {paperRecent.name}</span>}
                </div>
              )}
            </React.Fragment>
          )}

          {upcomingNext6.length > 0 && (
            <>
              <div className="section-label">Upcoming</div>
              {(showAllUpcoming ? upcomingNext6 : upcomingNext6.slice(0, 5)).map(l => (
                <div className="lesson-row" key={l.id} onClick={() => setDetailLesson(l)}>
                  <span className="lesson-date">
                    {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}
                    {l.start_time && <span style={{color:'var(--muted)'}}> · {l.start_time}</span>}
                  </span>
                  <span style={{display:'flex',alignItems:'center'}}>
                    <span className="lesson-status scheduled" style={lessonPayState(l).settled ? {color:'var(--accent)'} : {}}>
                      {lessonPayState(l).settled ? 'prepaid' : 'scheduled'}
                    </span>
                    <span className="chev">›</span>
                  </span>
                </div>
              ))}
              {upcomingNext6.length > 5 && (
                <button onClick={() => setShowAllUpcoming(!showAllUpcoming)} style={{
                  display:'block', width:'100%', textAlign:'center', padding:'8px 0', marginTop:2,
                  background:'none', border:'none', color:'var(--muted)', fontSize:'0.82rem',
                  fontFamily:'inherit', cursor:'pointer',
                }}>
                  {showAllUpcoming ? 'Show fewer' : `Show ${upcomingNext6.length - 5} more`}
                </button>
              )}
            </>
          )}

          <div className="section-label">History</div>
          {groupedLessons.length === 0 && (
            <div style={{fontSize:'0.85rem',color:'var(--muted)',padding:'6px 0'}}>No lessons logged yet.</div>
          )}
          {groupedLessons.map(group => (
            <React.Fragment key={group.key}>
              <div className="month-hdr" onClick={() => setOpenMonths(prev => ({...prev, [group.key]: !isMonthOpen(group.key)}))}>
                <span style={{fontSize:'0.83rem',fontWeight:600,color:'var(--ink)'}}>{group.label}</span>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{group.lessons.length} lesson{group.lessons.length !== 1 ? 's' : ''}</span>
                  <span className="month-chevron" style={{transform:isMonthOpen(group.key)?'rotate(90deg)':'none'}}>›</span>
                </div>
              </div>
              {isMonthOpen(group.key) && group.lessons.map(l => (
                <div className="lesson-row" key={l.id} onClick={() => setDetailLesson(l)}>
                  <span className="lesson-date">
                    {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' })}
                    {l.start_time && <span style={{color:'var(--muted)'}}> · {l.start_time}</span>}
                  </span>
                  <span style={{display:'flex',alignItems:'center'}}>
                    {(() => {
                      const st = l.is_complimentary ? null : lessonPayState(l);
                      const settled = l.is_complimentary || l.pre_settled || (st && st.settled);
                      return (
                        <>
                          {!l.is_complimentary && (
                            l.pre_settled ? <span style={{fontSize:'0.7rem',color:'var(--accent)',marginRight:7}}>✓ settled</span>
                            : st.settled  ? <span style={{fontSize:'0.7rem',color:'var(--accent)',marginRight:7}}>✓ paid</span>
                            : st.partial  ? <span style={{fontSize:'0.7rem',color:'var(--gold)',marginRight:7}}>part paid</span>
                            : null
                          )}
                          <span className={`lesson-status ${l.is_complimentary ? '' : l.status}`} style={
                            l.is_complimentary ? {color:'var(--accent)'}
                            // Green only once the money is actually in. A lesson
                            // that has happened but hasn't been paid for is money
                            // owed, not a job done, so it reads as a warning.
                            : l.status === 'completed' ? {color: settled ? 'var(--accent)' : 'var(--warn)'}
                            : {}
                          }>
                            {l.is_complimentary ? 'free' : `${l.status} · ${M(rateForLesson(l, rateHistory), l.id + ':rate')}`}
                          </span>
                        </>
                      );
                    })()}
                    <span className="chev">›</span>
                  </span>
                </div>
              ))}
            </React.Fragment>
          ))}

          <div className="month-hdr" onClick={() => setPaymentsOpen(!paymentsOpen)} style={{marginTop:14}}>
            <span className="section-label" style={{margin:0}}>Payments</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>
                {studentPayments.length === 0 ? 'none' : `${studentPayments.length} · ${M(totalPaid, student.id + ':totalpaid')} total`}
              </span>
              <span className="month-chevron" style={{transform:paymentsOpen?'rotate(90deg)':'none'}}>›</span>
            </div>
          </div>
          {paymentsOpen && (
            <>
              {paymentsNewestFirst.map(p => {
                const n = studentAllocations.filter(a => a.payment_id === p.id).length;
                return (
                  <div className="pay-row" key={p.id} onClick={() => setDetailPayment(p)}>
                    <span style={{display:'flex',alignItems:'center',gap:8}}>
                      <span className="lesson-date">
                        {new Date(p.date_paid + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'2-digit' })}
                      </span>
                      <span className={`pay-method ${p.method}`}>
                        {{cash:'cash', bank_transfer:'transfer', monzo_auto:'monzo', other:'other'}[p.method] || p.method}
                      </span>
                    </span>
                    <span style={{display:'flex',alignItems:'center'}}>
                      <span style={{fontSize:'0.72rem',color:'var(--muted)',marginRight:8}}>
                        {n > 0 ? `${n} lesson${n !== 1 ? 's' : ''}` : 'unlinked'}
                      </span>
                      <span style={{fontWeight:600,color:'var(--ink)'}}>{M(parseFloat(p.amount) * moneyScale, p.id)}</span>
                      <span className="chev">›</span>
                    </span>
                  </div>
                );
              })}
              <button
                className="btn"
                style={{width:'100%',marginTop:10,background:'var(--card-2)',color:'var(--ink)',border:'1px solid var(--line)'}}
                onClick={() => { setEditPayment(null); setShowCashModal(true); }}
              >+ Log a payment</button>
            </>
          )}

          <div className="actions">
            {paymentWaLink && <a className="btn whatsapp" href={paymentWaLink} target="_blank" rel="noopener">💷 Request payment</a>}
            {bundleWaLink && <a className="btn" href={bundleWaLink} target="_blank" rel="noopener" style={{background:'#128C7E'}}>🔔 Bundle low</a>}
            {waLink && <a className="btn whatsapp" href={waLink} target="_blank" rel="noopener">WhatsApp</a>}
            {student.spreadsheet_url && (
              <a className="btn" href={student.spreadsheet_url} target="_blank" rel="noopener" style={{background:'#1a7f4b', flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}>📈</a>
            )}
            {student.is_zoom && student.zoom_link && (
              <a className="btn" href={student.zoom_link} target="_blank" rel="noopener" style={{background:'#2D8CFF', flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}>🎥</a>
            )}
            <button className="btn edit" onClick={() => onEdit(student)}>Edit</button>
            <button className="btn more" onClick={() => setShowMoreTools(true)}>More tools</button>
            {student.general_notes && (
              <button className="btn notes" onClick={() => setNotesOpen(!notesOpen)}>
                {notesOpen ? 'Hide notes' : 'Notes'}
              </button>
            )}
          </div>

          {student.general_notes && (
            <div className={`notes-box ${notesOpen ? 'visible' : ''}`}>{student.general_notes}</div>
          )}
        </div>
      </div>

      {showMoreTools && ReactDOM.createPortal(
        <MoreToolsSheet
          student={student}
          onClose={() => setShowMoreTools(false)}
          onTrackCash={() => { setShowMoreTools(false); setEditPayment(null); setShowCashModal(true); }}
          onStatement={() => { setShowMoreTools(false); setShowStatement(true); }}
          onArchive={archiveStudent}
          onDelete={deleteStudent}
        />, document.body
      )}

      {showCashModal && ReactDOM.createPortal(
        <PaymentModal
          student={student}
          payment={editPayment}
          lessons={studentLessons}
          currentRate={currentRate}
          rateHistory={rateHistory}
          allocations={studentAllocations}
          onClose={() => { setShowCashModal(false); setEditPayment(null); }}
          onSaved={() => { setShowCashModal(false); setEditPayment(null); onDataChanged(); }}
        />, document.body
      )}

      {detailPayment && ReactDOM.createPortal(
        <PaymentDetailSheet
          payment={detailPayment}
          lessons={studentLessons}
          allocations={studentAllocations}
          onClose={() => setDetailPayment(null)}
          onEdit={() => { setEditPayment(detailPayment); setDetailPayment(null); setShowCashModal(true); }}
          onDeleted={() => { setDetailPayment(null); onDataChanged(); }}
        />, document.body
      )}

      {showStatement && ReactDOM.createPortal(
        <StatementSheet
          student={student}
          lessons={studentLessons}
          payments={studentPayments}
          allocations={studentAllocations}
          payState={lessonPayState}
          scale={moneyScale}
          onClose={() => setShowStatement(false)}
        />, document.body
      )}

      {detailLesson && ReactDOM.createPortal(
        <LessonDetailSheet
          lesson={detailLesson}
          payState={lessonPayState(detailLesson)}
          lessonRate={rateForLesson(detailLesson, rateHistory)}
          onClose={() => setDetailLesson(null)}
          onToggleFree={() => toggleComplimentary(detailLesson)}
          onDelete={() => deleteLesson(detailLesson)}
          toggling={toggling}
        />, document.body
      )}
    </div>
  );
}

// ---------- Onboarding walkthrough ----------
// A plain bottom card rather than tooltips pinned to individual buttons: a
// brand-new account has an empty screen, so there is often nothing to point
// at, and anything anchored to an element breaks the moment a list is empty
// or a layout shifts. Every step that asks the tutor to go somewhere opens
// that screen for them instead of describing where to find it.
const WT_STEPS = [
  {
    key: 'welcome',
    title: "Let's get you running",
    body: "About three minutes and your whole timetable will be in here. Stop whenever you like — it picks up where you left off, and nothing you do here can break anything.",
  },
  {
    key: 'you',
    title: 'A few details about you',
    body: "Your name shows at the top of the app. The email and phone are what parents use to reach you from their child's lesson page.",
    form: true,
  },
  {
    key: 'calendar',
    title: 'Connect your Google Calendar',
    body: "This is the one that matters. Your lessons come straight out of your calendar, so you never type a timetable in by hand. Tap below, then Connect, and pick whichever calendar has your lessons on it.",
    action: { label: '📅 Open calendar settings', tool: 'gcal' },
  },
  {
    key: 'students',
    title: 'Turn the names into students',
    body: "Tap Sync now. Any name in your calendar that isn't a student yet gets listed with an Add button — tap Add for each real one and their lessons appear straight away. It guesses the name from the event title; correct it there if the guess is off.",
    action: { label: '📅 Open calendar settings', tool: 'gcal' },
  },
  {
    key: 'details',
    title: 'Fill in the gaps',
    body: "Tap a student, then Edit, to add their school, year, exam board, the parent's number and any notes. There's a progress tracker link too — paste a Google Drive or Dropbox folder if that's how you keep their work, or leave it blank.",
  },
  {
    key: 'money',
    title: 'Getting paid',
    body: "Student → More tools → Log a payment. Payments always settle the oldest unpaid lesson first, so the figure on each card is simply what they still owe you. Cash payments offer to send a WhatsApp receipt.",
  },
  {
    key: 'links',
    title: 'Give parents their own page',
    body: "Every student has a private page showing their upcoming lessons and what's been paid. Student → More tools → Copy link. Parents don't need a login, and they only ever see that one child.",
  },
  {
    key: 'newstudent',
    title: 'New students later on',
    body: "Tap + Add at the top. If they're already in your calendar the sync will match them by name automatically, so most of the time you won't have to do even that.",
    action: { label: '+ Add a student', addStudent: true },
  },
  {
    key: 'done',
    title: "That's everything",
    body: "Replay this any time from Tools → Replay walkthrough. Your calendar re-syncs itself every couple of hours, so from here it mostly runs itself.",
  },
];

function Walkthrough({ session, students, onOpenTool, onAddStudent, onDone, onPausedChange }) {
  const meta = session?.user?.user_metadata || {};
  const startAt = typeof meta.wt_step === 'number' && meta.wt_step > 0 ? meta.wt_step : 0;
  const [step, setStep] = useState(startAt);
  const [paused, setPausedState] = useState(false);
  // Told to the app as well, so the Tools button can come back while they
  // wander — looking around is the whole point of pausing, and Tools is where
  // half the app lives.
  const setPaused = v => { setPausedState(v); onPausedChange?.(v); };
  const [saving, setSaving] = useState(false);
  const [calStatus, setCalStatus] = useState(null);

  const [name, setName]   = useState(meta.display_name || '');
  const [email, setEmail] = useState(meta.contact_email || '');
  const [phone, setPhone] = useState(meta.contact_phone || '');
  const [rate, setRate]   = useState(meta.default_rate != null ? String(meta.default_rate) : '');

  const s = WT_STEPS[step];
  const isLast = step === WT_STEPS.length - 1;
  // Archived students would otherwise be counted, which reads as wrong to
  // someone checking the number against what's on their screen.
  const activeCount = students.filter(x => x.active).length;

  // Live connection state, so the calendar step tells them where they actually
  // are rather than assuming the tap worked.
  useEffect(() => {
    if (s.key !== 'calendar' && s.key !== 'students') { setCalStatus(null); return; }
    let cancelled = false;
    fetch(`${FN_BASE}/google-calendar-status`, {
      headers: { Authorization: `Bearer ${session?.access_token}` },
    }).then(r => r.json()).then(d => { if (!cancelled) setCalStatus(d); }).catch(() => {});
    return () => { cancelled = true; };
  }, [step]);

  async function persist(nextStep) {
    const data = { wt_step: nextStep };
    if (s.form) {
      data.display_name  = name.trim();
      data.contact_email = email.trim();
      data.contact_phone = normaliseUKPhone(phone);
      const r = parseFloat(rate);
      data.default_rate = isNaN(r) ? null : r;
    }
    await supabase.auth.updateUser({ data });
  }

  async function next() {
    setSaving(true);
    if (isLast) { await persist(-1); setSaving(false); onDone(); return; }
    await persist(step + 1);
    setSaving(false);
    setStep(step + 1);
  }

  async function skip() {
    setSaving(true);
    await persist(-1);
    setSaving(false);
    onDone();
  }

  if (paused) {
    return ReactDOM.createPortal(
      <button onClick={() => setPaused(false)} style={{
        position:'fixed', right:14, bottom:14, zIndex:150,
        padding:'11px 16px', borderRadius:100, border:'1px solid var(--accent)',
        background:'var(--card)', color:'var(--accent)', fontFamily:'inherit',
        fontSize:'0.82rem', fontWeight:650, boxShadow:'var(--sh-3)', cursor:'pointer',
      }}>
        ▶ Back to setup · {step + 1}/{WT_STEPS.length}
      </button>, document.body
    );
  }

  return ReactDOM.createPortal(
    <div style={{
      position:'fixed', left:0, right:0, bottom:0, zIndex:150,
      background:'var(--card)', borderTop:'1px solid var(--line)',
      boxShadow:'var(--sh-3)', padding:'16px 16px calc(16px + env(safe-area-inset-bottom))',
      maxHeight:'72vh', overflowY:'auto', overflowX:'hidden',
    }}>
      <div style={{maxWidth:680, margin:'0 auto'}}>
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:7}}>
          <span style={{
            fontSize:'0.66rem', fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--muted)',
          }}>Setup · {step + 1} of {WT_STEPS.length}</span>
          <div style={{flex:1, height:3, background:'var(--card-3)', borderRadius:2}}>
            <div style={{
              width:`${((step + 1) / WT_STEPS.length) * 100}%`, height:'100%',
              background:'var(--accent)', borderRadius:2, transition:'width .25s',
            }} />
          </div>
        </div>

        <div style={{fontSize:'1.02rem', fontWeight:700, marginBottom:5}}>{s.title}</div>
        <div style={{fontSize:'0.86rem', color:'var(--ink-dim)', lineHeight:1.5, marginBottom:12}}>
          {s.body}
        </div>

        {s.form && (
          <div style={{marginBottom:12}}>
            <div className="field">
              <label>Your first name</label>
              <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Djavhan" />
            </div>
            <div className="field">
              <label>Contact email for parents</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                     placeholder={session?.user?.email || 'you@example.com'} />
            </div>
            <div className="field">
              <label>Your phone (for the parents' WhatsApp button)</label>
              <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. 07999 896555" />
            </div>
            <div className="field">
              <label>Your usual fee per lesson</label>
              <input type="number" min="0" step="1" value={rate} onChange={e => setRate(e.target.value)} placeholder="e.g. 50" />
              <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
                Just the starting figure for new students — you can charge each one
                differently, and change it whenever you like.
              </div>
            </div>
          </div>
        )}

        {calStatus && (
          <div style={{
            fontSize:'0.8rem', fontWeight:600, marginBottom:11, padding:'9px 12px',
            borderRadius:'var(--r-md)',
            background: calStatus.connected ? 'var(--accent-light)' : 'var(--card-2)',
            color: calStatus.connected ? 'var(--accent)' : 'var(--muted)',
            border:'1px solid var(--line)',
          }}>
            {calStatus.connected && calStatus.calendar_chosen
              ? `✓ Connected to “${calStatus.calendar_summary}” — ${activeCount} student${activeCount === 1 ? '' : 's'} so far`
              : calStatus.connected
                ? 'Connected — now pick which calendar has your lessons'
                : 'Not connected yet'}
          </div>
        )}

        {s.action && (
          <button className="btn save" style={{width:'100%', marginBottom:10}}
            onClick={() => { s.action.addStudent ? onAddStudent() : onOpenTool(s.action.tool); }}>
            {s.action.label}
          </button>
        )}

        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <button onClick={skip} disabled={saving} style={{
            background:'none', border:'none', color:'var(--muted)', cursor:'pointer',
            fontFamily:'inherit', fontSize:'0.78rem', padding:'8px 2px', flexShrink:0,
          }}>Skip</button>
          <button onClick={() => setPaused(true)} disabled={saving} style={{
            flex:1, padding:'11px 10px', borderRadius:'var(--r-md)',
            border:'1px solid var(--line)', background:'var(--card-2)', color:'var(--ink)',
            fontFamily:'inherit', fontSize:'0.8rem', fontWeight:600, cursor:'pointer',
          }}>Let me look around</button>
          <button className="btn save" onClick={next} disabled={saving}
            style={{flex:1, minWidth:0}}>
            {saving ? '…' : isLast ? 'Finish' : 'Next'}
          </button>
        </div>
      </div>
    </div>, document.body
  );
}

function App() {
  const [students, setStudents] = useState([]);
  const [lessons, setLessons] = useState([]);
  const [payments, setPayments] = useState([]);
  const [bundles, setBundles] = useState([]);
  const [allocations, setAllocations] = useState([]);
  const [rateHistory, setRateHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSynced, setLastSynced] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [showAddModal, setShowAddModal] = useState(false);
  const [editingStudent, setEditingStudent] = useState(null);
  const [showGlobalTools, setShowGlobalTools] = useState(false);
  const [toolsInitial, setToolsInitial] = useState(null);
  const [walkthroughOpen, setWalkthroughOpen] = useState(false);
  const [walkthroughPaused, setWalkthroughPaused] = useState(false);
  const [monzoStatus, setMonzoStatus] = useState(null);
  const [googleStatus, setGoogleStatus] = useState(null);
  const [moneyMode, setMoneyMode] = useState('normal');
  const [nameMode, setNameMode] = useState('normal');
  const [query, setQuery] = useState('');
  const [focusStudentId, setFocusStudentId] = useState(null);
  // undefined = still checking; null = signed out; object = signed in.
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = supabase.auth.onAuthStateChange((_evt, s) => setSession(s ?? null));
    return () => sub.subscription.unsubscribe();
  }, []);

  // -1 means finished or skipped. Anything else — including never having had
  // the field at all, which is every account that predates this — means show
  // it. Saving a step writes to user metadata and so bounces back through the
  // auth listener above; the walkthrough keeps its own step in local state so
  // that round trip can't reset it mid-flow.
  useEffect(() => {
    if (!session) return;
    setWalkthroughOpen(session.user?.user_metadata?.wt_step !== -1);
  }, [session?.user?.id]);

  async function replayWalkthrough() {
    await supabase.auth.updateUser({ data: { wt_step: 0 } });
    setShowGlobalTools(false);
    setToolsInitial(null);
    setWalkthroughOpen(true);
  }

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const monzo = params.get('monzo');
    if (monzo) {
      setMonzoStatus(monzo);
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => setMonzoStatus(null), 6000);
    }
    const google = params.get('google');
    if (google) {
      setGoogleStatus(google);
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => setGoogleStatus(null), 6000);
    }
  }, []);

  // A failed read must never look like an empty diary. Every result is checked
  // for an error, and if any table fails the previous data is left on screen
  // with a banner saying so — `data || []` on a failed query yields [], which
  // renders as "no lessons" and is indistinguishable from genuinely having
  // none. That is exactly how a momentary connection drop once emptied the
  // whole app while the database was perfectly intact.
  async function loadAll(isManualRefresh = false) {
    if (isManualRefresh) setRefreshing(true);
    try {
      // Auto-complete lessons that have already happened. Two passes, because a
      // lesson earlier TODAY has passed too — checking the date alone left this
      // morning's lesson showing as upcoming until tomorrow.
      const today = new Date().toISOString().slice(0, 10);
      const nowHHMM = new Date().toTimeString().slice(0, 5);
      await supabase.from('tutoring_lessons').update({ status: 'completed' })
        .eq('status', 'scheduled').lt('lesson_date', today);
      await supabase.from('tutoring_lessons').update({ status: 'completed' })
        .eq('status', 'scheduled').eq('lesson_date', today).lt('start_time', nowHHMM);
      const [s, l, p, b, r, a] = await Promise.all([
        supabase.from('tutoring_students').select('*').order('active', { ascending: false }).order('name'),
        supabase.from('tutoring_lessons').select('*'),
        // Archived payments are excluded everywhere money is counted; they
        // only surface in Tools → Deleted payments, where they can be restored.
        supabase.from('tutoring_payments').select('*').is('deleted_at', null),
        supabase.from('tutoring_bundles').select('*'),
        supabase.from('tutoring_rate_history').select('*'),
        supabase.from('tutoring_payment_allocations').select('*')
      ]);

      const failed = [s, l, p, b, r, a].find(res => res.error);
      if (failed) throw new Error(failed.error.message || 'Could not read your data');

      setStudents(s.data || []);
      setLessons(l.data || []);
      setPayments(p.data || []);
      setBundles(b.data || []);
      setRateHistory(r.data || []);
      setAllocations(a.data || []);
      setLastSynced(new Date());
      setLoadError(null);
    } catch (err) {
      setLoadError(String(err && err.message ? err.message : err));
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }

  // Only fetch once signed in — with RLS on, an anonymous fetch returns
  // nothing anyway, and firing it would just show a misleading empty state.
  useEffect(() => { if (session) loadAll(); }, [session]);

  const activeStudents = students.filter(s => s.active);
  const archivedCount = students.filter(s => !s.active).length;

  const syncLabel = lastSynced
    ? `synced ${lastSynced.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
    : '';

  const privacyOn = moneyMode !== 'normal' || nameMode !== 'normal';

  // Rate lookups are plain functions used all over the tree, not hooks, so the
  // mode is published here for them to read. Set during render, before any
  // child reads it.
  PRIVACY_MONEY_MODE = moneyMode;

  // Search matches name or school, so "Hasmonean" finds everyone there.
  // (auth gate is applied at the end of this component, after all hooks have
  // run — bailing out earlier would change the hook order between renders)
  const q = query.trim().toLowerCase();
  const shownStudents = q
    ? activeStudents.filter(s =>
        (s.name || '').toLowerCase().includes(q) ||
        (s.school || '').toLowerCase().includes(q))
    : activeStudents;

  function jumpToStudent(id) {
    setQuery('');
    setFocusStudentId(id);
    // Let the filter clear before scrolling, or the card may not be mounted yet.
    setTimeout(() => {
      const el = document.getElementById('student-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
    setTimeout(() => setFocusStudentId(null), 2200);
  }

  // Still restoring the session from storage: hold a blank screen for the
  // instant it takes, rather than flashing the sign-in form at someone who is
  // already signed in.
  if (session === undefined) return <div style={{minHeight:'100dvh'}} />;
  if (session === null) return <LoginGate />;

  return (
    <PrivacyContext.Provider value={{ moneyMode, nameMode }}>
    <div>
      {monzoStatus && (
        <div style={{
          position:'fixed', top:12, left:'50%', transform:'translateX(-50%)', zIndex:200,
          padding:'10px 18px', borderRadius:10, fontSize:'0.85rem', fontWeight:600,
          background: monzoStatus === 'connected' ? 'var(--accent)' : 'var(--warn)',
          color:'#fff', boxShadow:'0 4px 20px rgba(0,0,0,0.25)'
        }}>
          {monzoStatus === 'connected' ? '🏦 Monzo connected successfully' : 'Monzo connection was cancelled or denied'}
        </div>
      )}
      {googleStatus && (
        <div style={{
          position:'fixed', top:12, left:0, right:0, marginInline:'auto', width:'fit-content', zIndex:200,
          padding:'10px 18px', borderRadius:10, fontSize:'0.85rem', fontWeight:600,
          background: googleStatus === 'connected' ? 'var(--accent)' : 'var(--warn)',
          color:'#fff', boxShadow:'0 4px 20px rgba(0,0,0,0.25)'
        }}>
          {googleStatus === 'connected' ? '📅 Google Calendar connected — pick a calendar in Tools to finish' : 'Google Calendar connection was cancelled or denied'}
        </div>
      )}
      <div className="app-header">
        <div className="header-row">
          <div>
            <div className="header-title">
              {session?.user?.user_metadata?.display_name
                ? `${session.user.user_metadata.display_name}'s Tutortally`
                : 'Tutortally'}
            </div>
            <div className="header-sub">
              {activeStudents.length} active{archivedCount > 0 ? ` · ${archivedCount} archived` : ''}{syncLabel ? ` · ${syncLabel}` : ''}
            </div>
          </div>
          <div className="header-right">
            <button className="refresh-btn" onClick={() => loadAll(true)} disabled={refreshing}>
              <span style={{display:'inline-block', animation: refreshing ? 'spin 0.8s linear infinite' : 'none'}}>↻</span>
            </button>
            <button className="add-btn" onClick={() => setShowAddModal(true)}>+ Add</button>
          </div>
        </div>
        {/* The controls live in Tools; this is only a reminder that they're on,
            so it can't be left masked by accident. */}
        {privacyOn && (
          <div
            onClick={() => setShowGlobalTools(true)}
            style={{
              display:'inline-flex', alignItems:'center', gap:6, marginTop:10, cursor:'pointer',
              fontSize:'0.72rem', fontWeight:600, color:'var(--gold)',
              border:'1px solid var(--gold)', borderRadius:20, padding:'4px 11px'
            }}>
            🕶 Privacy mode on
            <span style={{color:'var(--muted)', fontWeight:500}}>
              {moneyMode !== 'normal' ? (moneyMode === 'dummy' ? 'fake amounts' : 'amounts hidden') : ''}
              {moneyMode !== 'normal' && nameMode !== 'normal' ? ' · ' : ''}
              {nameMode !== 'normal' ? (nameMode === 'dummy' ? 'fake names' : 'names hidden') : ''}
            </span>
          </div>
        )}
      </div>

      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>

      {loadError && (
        <div style={{
          margin:'0 auto 4px', maxWidth:680, padding:'11px 14px',
          background:'var(--warn-light)', border:'1px solid var(--warn)',
          borderRadius:'var(--r-md)', color:'var(--warn)', fontSize:'0.82rem', lineHeight:1.45
        }}>
          <b>Couldn't reach your data.</b>{' '}
          {lastSynced
            ? 'Showing what was last loaded — nothing has been lost or changed.'
            : 'Nothing is loaded yet, so this page is empty — that is not your real data.'}
          <button onClick={() => loadAll(true)} disabled={refreshing} style={{
            marginLeft:8, padding:'3px 10px', borderRadius:8, cursor:'pointer',
            border:'1px solid var(--warn)', background:'none', color:'var(--warn)',
            fontFamily:'inherit', fontSize:'0.78rem', fontWeight:600
          }}>
            {refreshing ? 'Retrying…' : 'Retry'}
          </button>
        </div>
      )}

      <div className="content">
        {loading && (
          <>
            <div className="sk" style={{height:132, marginBottom:14}} />
            <div className="sk" /><div className="sk" /><div className="sk" />
          </>
        )}

        {!loading && <SummaryWidget students={students} rateHistory={rateHistory} />}

        {!loading && (
          <NeedsAttention
            students={students} lessons={lessons} payments={payments}
            allocations={allocations} rateHistory={rateHistory}
            onJump={jumpToStudent}
          />
        )}

        {!loading && activeStudents.length > 3 && (
          <div className="search-wrap">
            <span className="s-icon">⌕</span>
            <input
              type="text" value={query} onChange={e => setQuery(e.target.value)}
              placeholder="Search students or schools…"
            />
            {query && <button className="s-clear" onClick={() => setQuery('')}>✕</button>}
          </div>
        )}

        {!loading && activeStudents.length === 0 && (
          <div className="empty">No active students. Tap "+ Add" to get started.</div>
        )}

        {!loading && activeStudents.length > 0 && shownStudents.length === 0 && (
          <div className="empty">No one matches "{query}".</div>
        )}

        {!loading && shownStudents.map(s => (
          <StudentCard key={s.id} student={s} lessons={lessons} payments={payments} bundles={bundles}
            allocations={allocations} allStudents={students} rateHistory={rateHistory}
            focused={focusStudentId === s.id}
            onEdit={setEditingStudent} onDataChanged={loadAll} />
        ))}

        {!loading && <div className="version-tag">v5.6</div>}
      </div>

      {showAddModal && (
        <StudentFormModal
          allStudents={students}
          rateHistory={rateHistory}
          defaultRate={session?.user?.user_metadata?.default_rate ?? null}
          onClose={() => setShowAddModal(false)}
          onSaved={() => { setShowAddModal(false); loadAll(); }}
        />
      )}

      {/* Hidden only while the walkthrough card is actually on screen, since
          they occupy the same space and the card offers its own way in. It
          comes straight back when they pause to look around. */}
      {(!walkthroughOpen || walkthroughPaused) && (
        <button className="global-tools-btn" onClick={() => setShowGlobalTools(true)}>⚙ Tools</button>
      )}

      {showGlobalTools && (
        <GlobalToolsSheet
          students={students}
          rateHistory={rateHistory}
          payments={payments}
          userEmail={session?.user?.email}
          session={session}
          initialTool={toolsInitial}
          moneyMode={moneyMode} setMoneyMode={setMoneyMode}
          nameMode={nameMode} setNameMode={setNameMode}
          onClose={() => { setShowGlobalTools(false); setToolsInitial(null); }}
          onReplayWalkthrough={replayWalkthrough}
          onDataChanged={loadAll}
        />
      )}

      {walkthroughOpen && (
        <Walkthrough
          session={session}
          students={students}
          onOpenTool={t => { setToolsInitial(t); setShowGlobalTools(true); }}
          onAddStudent={() => setShowAddModal(true)}
          onPausedChange={setWalkthroughPaused}
          onDone={() => { setWalkthroughOpen(false); setWalkthroughPaused(false); }}
        />
      )}

      {editingStudent && (
        <StudentFormModal
          student={editingStudent}
          allStudents={students}
          rateHistory={rateHistory}
          onClose={() => setEditingStudent(null)}
          onSaved={() => { setEditingStudent(null); loadAll(); }}
        />
      )}
    </div>
    </PrivacyContext.Provider>
  );
}

// iOS Safari ignores user-scalable=no, so the pinch gesture has to be refused
// directly. touch-action handles double-tap; these cover pinch.
['gesturestart', 'gesturechange', 'gestureend'].forEach(evt =>
  document.addEventListener(evt, e => e.preventDefault(), { passive: false })
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

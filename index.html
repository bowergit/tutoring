              incoming Monzo transfers. After the first match the account is
              remembered, so the name no longer has to be exact.
            </div>
          </div>
        )}
        <div className="field">
          <label>Progress tracker link (optional)</label>
          <input type="text" value={form.spreadsheet_url} onChange={e => setForm({...form, spreadsheet_url: e.target.value})} placeholder="Google Sheet, Drive or Dropbox link" />
          <div style={{fontSize: '0.78rem', color: 'var(--muted)', marginTop: 4, lineHeight: 1.45}}>
            Wherever you keep their work. Shows as a button on their card, and on
            the lesson page you share with their parent. Leave blank if you don't
            use one.
          </div>
        </div>
        {danielOnly && (
          <div className="field">
            <label>Referred by</label>
            <select value={form.referred_by_student_id} onChange={e => setForm({...form, referred_by_student_id: e.target.value})}>
              <option value="">- not a referral -</option>
              {allStudents.filter(s => s.id !== student?.id).map(s => (
                <option key={s.id} value={s.id}>{N(s.name, s.id)}</option>
              ))}
            </select>
          </div>
        )}
        <div className="field">
          <label>Student's name in your calendar</label>
          <input type="text" value={maskName(form.calendar_title_pattern)}
            onChange={e => setForm({...form, calendar_title_pattern: e.target.value})}
            placeholder="e.g. Saskia" />
          <div style={{fontSize: '0.78rem', color: 'var(--muted)', marginTop: 4}}>
            The word that appears in your Google Calendar event titles for this
            student's lessons. Leave blank to just use their name - only worth
            filling in if your calendar calls them something else.
          </div>
        </div>
        <div className="field">
          <label>Notes</label>
          <textarea value={nameMode === 'normal' ? form.general_notes : (nameMode === 'dummy' ? 'Notes hidden while demoing.' : HIDDEN_TEXT_MASK)}
            onChange={e => setForm({...form, general_notes: e.target.value})} />
        </div>
        <div className="field">
          <Toggle checked={form.active} onChange={v => setForm({...form, active: v})} label="Active student" />
        </div>
        </div>

        <div className="btn-row">
          <button className="btn cancel" onClick={close}>{demo ? 'Close' : 'Cancel'}</button>
          {!demo && (
            <button className="btn save" onClick={handleSave} disabled={saving || !form.name}>
              {saving ? 'Saving…' : 'Save'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- Payment Modal (add / edit) ----------
// Records the money only. Which lessons it pays for is worked out by the
// database, oldest unpaid first - so paying per lesson, paying for several at
// once, and paying in advance are all the same action. The preview below
// shows what it will settle before you commit.
function PaymentModal({ student, payment, lessons, currentRate, rateHistory = [],
                        allocations = [], onClose, onSaved }) {
  const N = useNameDisplay();
  const M = useMoney();
  const { moneyMode, nameMode } = usePrivacy();
  const [cls, close] = useAnimatedClose(onClose);
  const editing = !!payment;
  const today = new Date().toISOString().slice(0, 10);

  // Read-only while privacy is on, for the same reason as the student form: a
  // masked amount you can still submit is one tap away from being saved.
  const demo = moneyMode !== 'normal' || nameMode !== 'normal';
  const maskAmount = real => moneyMode === 'normal' ? real
    : moneyMode === 'dummy' ? String(dummyRateFor(student.id))
    : '•••';

  const [datePaid, setDatePaid]   = useState(payment?.date_paid || today);
  const [method, setMethod]       = useState(payment?.method || (student.pays_in_cash ? 'cash' : 'bank_transfer'));
  const [amount, setAmount]       = useState(payment ? String(payment.amount) : '');
  const [saving, setSaving]       = useState(false);
  const [savedCash, setSavedCash] = useState(null);

  const rate = currentRate || 90;

  // Mirrors allocate_payment() in the database so the preview matches what
  // will actually happen. Money already allocated by OTHER payments counts as
  // paid; this payment's own existing allocations are ignored, since editing
  // it redistributes from scratch.
  const paidByOthers = {};
  allocations.forEach(a => {
    if (editing && a.payment_id === payment.id) return;
    paidByOthers[a.lesson_id] = (paidByOthers[a.lesson_id] || 0) + parseFloat(a.amount);
  });

  const queue = lessons
    .filter(l => l.status !== 'cancelled' && !l.is_complimentary && !l.pre_settled)
    .sort((a, b) => (a.lesson_date + (a.start_time || '00:00'))
                      .localeCompare(b.lesson_date + (b.start_time || '00:00')));

  let remaining = parseFloat(amount) || 0;
  const willCover = [];
  for (const l of queue) {
    if (remaining <= 0.005) break;
    const due = rateForLesson(l, rateHistory, rate) - (paidByOthers[l.id] || 0);
    if (due <= 0.005) continue;
    const take = Math.min(due, remaining);
    willCover.push({ lesson: l, take, partial: take < due - 0.005 });
    remaining -= take;
  }
  const leftOver = remaining;

  // Prefill a new payment with one session at the current rate, since that is
  // by far the most common case.
  useEffect(() => {
    if (!editing) setAmount(String(rate));
  }, []);

  async function handleSave() {
    setSaving(true);
    const amt = parseFloat(amount) || 0;

    // Allocation is handled by a database trigger, so it happens identically
    // however the payment arrives - here, from Monzo, or by hand.
    if (editing) {
      await supabase.from('tutoring_payments')
        .update({ amount: amt, date_paid: datePaid, method })
        .eq('id', payment.id);
    } else {
      // owner_id set explicitly: see the comment on the same pattern in
      // StudentFormModal - the column DEFAULT belongs to Daniel's account, so
      // a second tenant's insert would otherwise fail the RLS WITH CHECK.
      const ownerId = (await supabase.auth.getUser()).data.user?.id;
      await supabase.from('tutoring_payments').insert({
        student_id: student.id, amount: amt, date_paid: datePaid, method, owner_id: ownerId
      });
    }

    setSaving(false);

    // Cash leaves no paper trail the way a bank transfer does, so offer a
    // WhatsApp receipt right away rather than closing straight out - only for
    // a genuinely new cash payment, not edits, and only if there's a number
    // to send it to.
    if (!editing && method === 'cash' && normaliseUKPhone(student.parent_phone)) {
      setSavedCash({ amount: amt, date: datePaid });
    } else {
      onSaved();
    }
  }

  const studentFirstName = student.name.split(' ')[0];
  const receiptWaLink = savedCash ? (() => {
    const parentFirstName = (student.parent_name || '').split(' ')[0];
    const greeting = parentFirstName ? `Hi ${parentFirstName}!` : 'Hi!';
    const dateLabel = new Date(savedCash.date + 'T12:00:00')
      .toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const msg = `${greeting} Just confirming I've received ${moneyText(savedCash.amount)} for ${studentFirstName}'s lessons on ${dateLabel}. Thanks a lot!`;
    return `https://wa.me/${normaliseUKPhone(student.parent_phone)}?text=${encodeURIComponent(msg)}`;
  })() : null;

  if (savedCash) {
    return (
      <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
        <div className={`sheet${cls}`}>
          <h2>Payment logged</h2>
          <div style={{fontSize:'0.85rem', color:'var(--muted)', marginBottom:18, lineHeight:1.5}}>
            {moneyText(savedCash.amount)} from {N(student.name, student.id)} on{' '}
            {new Date(savedCash.date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' })}.
            Send a WhatsApp receipt to the parent?
          </div>
          <div className="btn-row">
            <button className="btn cancel" onClick={onSaved}>Skip</button>
            <a className="btn save" style={{textAlign:'center', textDecoration:'none'}}
              href={receiptWaLink} target="_blank" rel="noopener" onClick={onSaved}>
              💬 Send receipt
            </a>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2>{editing ? 'Edit payment' : 'Log payment'} - {N(student.name, student.id)}</h2>

        {demo && (
          <div style={{
            fontSize:'0.76rem', fontWeight:600, color:'#fff', background:'var(--gold)',
            padding:'8px 11px', borderRadius:8, marginBottom:14, lineHeight:1.4
          }}>
            Privacy mode is on, so this form is masked and read-only. Turn it off
            in Settings to log or edit a payment.
          </div>
        )}
        <div style={demo ? { pointerEvents: 'none', opacity: 0.9 } : undefined}>

        <div className="field">
          <label>Method</label>
          <div className="seg">
            {[['cash','💵 Cash'],['bank_transfer','🏦 Transfer'],['other','Other']].map(([v,lab]) => (
              <button key={v} className={method === v ? 'sel' : ''} onClick={() => setMethod(v)}>{lab}</button>
            ))}
          </div>
        </div>

        <div className="field">
          <label>Date paid</label>
          <input type="date" value={datePaid} onChange={e => setDatePaid(e.target.value)} />
        </div>

        <div className="field">
          <label>Amount</label>
          <input type={demo ? 'text' : 'number'} min="0" step="0.01"
                 value={maskAmount(amount)} placeholder="0.00"
                 onChange={e => setAmount(e.target.value)} />
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginTop:4}}>
            Current rate {M(rate)} per session.
          </div>
        </div>

        <div className="field">
          <label>What this settles</label>
          {willCover.length === 0 ? (
            <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'6px 0'}}>
              {(parseFloat(amount) || 0) <= 0
                ? 'Enter an amount to see which lessons it covers.'
                : 'Nothing outstanding - the whole amount will sit as credit against future lessons.'}
            </div>
          ) : (
            <div className="session-list">
              {willCover.map(({ lesson: l, take, partial }) => (
                <div className="session-pick-row" key={l.id} style={{gap:8}}>
                  <span style={{flex:1}}>
                    {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'2-digit' })}
                    {l.start_time ? ` · ${l.start_time}` : ''}
                  </span>
                  <span style={{fontSize:'0.74rem', color: partial ? 'var(--gold)' : 'var(--accent)'}}>
                    {M(take)}{partial ? ' (part)' : ''}
                  </span>
                  <span style={{fontSize:'0.72rem', color: l.status === 'scheduled' ? 'var(--gold)' : 'var(--muted)'}}>
                    {l.status === 'scheduled' ? 'upcoming' : l.status}
                  </span>
                </div>
              ))}
            </div>
          )}
          {leftOver > 0.005 && (
            <div style={{fontSize:'0.78rem', color:'var(--gold)', marginTop:6}}>
              {M(leftOver)} left over - held as credit against future lessons.
            </div>
          )}
          <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:6, lineHeight:1.45}}>
            Payments always go to the oldest unpaid lesson first.
          </div>
        </div>
        </div>

        <div className="btn-row">
          <button className="btn cancel" onClick={close}>{demo ? 'Close' : 'Cancel'}</button>
          {!demo && (
            <button className="btn save" onClick={handleSave} disabled={saving}>
              {saving ? 'Saving…' : editing ? 'Save changes' : 'Log payment'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- Payment Detail Sheet ----------
function PaymentDetailSheet({ payment, lessons, allocations = [], onClose, onEdit, onDeleted }) {
  const M = useMoney();
  const [cls, close] = useAnimatedClose(onClose);
  const [busy, setBusy] = useState(false);
  const [confirming, setConfirming] = useState(false);

  const covered = allocations
    .filter(a => a.payment_id === payment.id)
    .map(a => ({ lesson: lessons.find(l => l.id === a.lesson_id), amount: parseFloat(a.amount) }))
    .filter(x => x.lesson)
    .sort((a, b) => a.lesson.lesson_date.localeCompare(b.lesson.lesson_date));

  const allocated = covered.reduce((sum, c) => sum + c.amount, 0);
  const unallocated = parseFloat(payment.amount) - allocated;

  const methodLabel = { cash:'Cash', bank_transfer:'Bank transfer', monzo_auto:'Monzo (auto)', other:'Other' }[payment.method] || payment.method;

  async function handleDelete() {
    setBusy(true);
    // Archived, not destroyed. A hard delete took the date, method and Monzo
    // link with it, so undoing meant retyping the payment from memory -
    // which is exactly how a correct set of payments ends up wrong.
    await supabase.from('tutoring_payments')
      .update({ deleted_at: new Date().toISOString() }).eq('id', payment.id);
    // Rebuilding drops this payment's allocations along with it and spreads
    // whatever is left over the lessons again, oldest first.
    await supabase.rpc('reallocate_student_payments', { p_student_id: payment.student_id });
    setBusy(false);
    onDeleted();
  }

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2 style={{fontSize:'1.5rem', marginBottom:2, letterSpacing:'-0.02em'}}>{M(parseFloat(payment.amount), payment.id)}</h2>
        <div style={{fontSize:'0.86rem', color:'var(--muted)', marginBottom:14}}>
          {new Date(payment.date_paid + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}
        </div>

        <div style={{display:'flex', gap:6, marginBottom:16, flexWrap:'wrap'}}>
          <span className={`pay-method ${payment.method}`}>{methodLabel}</span>
          {payment.monzo_transaction_id && <span className="pill neutral">auto-matched</span>}
        </div>

        <div className="section-label">Covers {covered.length} lesson{covered.length !== 1 ? 's' : ''}</div>
        {covered.length === 0 ? (
          <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'6px 0 10px'}}>
            Nothing was outstanding when this arrived - it is sitting as credit
            and will settle the next lesson automatically.
          </div>
        ) : (
          <div style={{marginBottom:10}}>
            {covered.map(({ lesson: l, amount }) => (
              <div className="lesson-row" key={l.id} style={{cursor:'default'}}>
                <span className="lesson-date">
                  {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'2-digit' })}
                  {l.start_time ? ` · ${l.start_time}` : ''}
                </span>
                <span style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontSize:'0.78rem', fontWeight:600, color:'var(--accent)'}}>{M(amount, l.id + ':rate')}</span>
                  <span className={`lesson-status ${l.status}`}>{l.status}</span>
                </span>
              </div>
            ))}
          </div>
        )}
        {unallocated > 0.005 && (
          <div style={{fontSize:'0.8rem', color:'var(--gold)', marginBottom:10}}>
            {M(unallocated, payment.id + ':unalloc')} of this payment is unused credit.
          </div>
        )}

        {confirming ? (
          <>
            <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10, lineHeight:1.45}}>
              This is kept in Settings → Archive → Payments and can be put back
              exactly as it is, so nothing is lost if you change your mind.
            </div>
            <div className="btn-row">
              <button className="btn cancel" onClick={() => setConfirming(false)}>Keep</button>
              <button className="btn save" style={{background:'var(--warn)'}} onClick={handleDelete} disabled={busy}>
                {busy ? '…' : 'Delete payment'}
              </button>
            </div>
          </>
        ) : (
          <div className="btn-row">
            <button className="btn cancel" onClick={close}>Close</button>
            <button className="btn" style={{background:'var(--warn)', color:'#fff'}} onClick={() => setConfirming(true)}>Delete</button>
            <button className="btn save" onClick={onEdit}>Edit</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Deleted payments ----------
// Fetched on open rather than held in app state: these are excluded from every
// normal query on purpose, and a list nobody looks at most days isn't worth
// carrying around in memory.
function DeletedPayments({ students, onDataChanged }) {
  const M = useMoney();
  const N = useNameDisplay();
  const [rows, setRows] = useState(null);
  const [busyId, setBusyId] = useState(null);

  useEffect(() => { load(); }, []);

  async function load() {
    const { data } = await supabase.from('tutoring_payments')
      .select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
    setRows(data || []);
  }

  async function restore(p) {
    setBusyId(p.id);
    await supabase.from('tutoring_payments').update({ deleted_at: null }).eq('id', p.id);
    // Put the money back where it belongs rather than on the end: rebuilding
    // settles the oldest unpaid lesson first, exactly as if it had never gone.
    await supabase.rpc('reallocate_student_payments', { p_student_id: p.student_id });
    setBusyId(null);
    await load();
    onDataChanged();
  }

  const nameOf = id => students.find(s => s.id === id)?.name || 'Unknown student';

  if (rows === null) return <div style={{color:'var(--muted)', fontSize:'0.88rem', padding:'10px 0'}}>Loading…</div>;
  if (rows.length === 0) {
    return (
      <div style={{color:'var(--muted)', fontSize:'0.88rem', padding:'10px 0', lineHeight:1.5}}>
        Nothing deleted. Any payment you remove lands here rather than
        disappearing, so it can be put back with its date and method intact.
      </div>
    );
  }

  return (
    <>
      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:12, lineHeight:1.45}}>
        Restoring puts the payment back and re-settles the oldest unpaid lesson
        first, so balances correct themselves.
      </div>
      {rows.map(p => (
        <div key={p.id} style={{display:'flex', alignItems:'center', gap:10, padding:'11px 0', borderBottom:'1px solid var(--line)'}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:'0.92rem', fontWeight:600}}>
              {M(parseFloat(p.amount), p.id)} · {N(nameOf(p.student_id), p.student_id)}
            </div>
            <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:2}}>
              Paid {new Date(p.date_paid + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}
              {' · '}{({cash:'Cash', bank_transfer:'Bank transfer', monzo_auto:'Monzo (auto)', other:'Other'})[p.method] || p.method}
              {' · deleted '}{new Date(p.deleted_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' })}
            </div>
          </div>
          <button className="btn save" style={{flex:'0 0 auto', minWidth:'auto', padding:'7px 14px', fontSize:'0.82rem'}}
            disabled={busyId === p.id} onClick={() => restore(p)}>
            {busyId === p.id ? '…' : 'Restore'}
          </button>
        </div>
      ))}
    </>
  );
}

// ---------- Statement ----------
// A plain, chronological record of every chargeable lesson and exactly which
// money settled it - the thing to read out when a parent asks "when did I pay
// for that?". Copyable as text so it can be pasted straight into WhatsApp.
function StatementSheet({ student, lessons, payments, allocations, payState, scale, onClose }) {
  const M = useMoney();
  const N = useNameDisplay();
  const { moneyMode, nameMode } = usePrivacy();
  const [copied, setCopied] = useState(false);
  const [cls, close] = useAnimatedClose(onClose);

  const rows = lessons
    .filter(l => l.status !== 'cancelled' && !l.is_complimentary && !l.pre_settled)
    .sort((a, b) => (a.lesson_date + (a.start_time || '')).localeCompare(b.lesson_date + (b.start_time || '')))
    .map(l => ({ lesson: l, st: payState(l) }));

  // Rates are faked at source and paid amounts are pre-scaled, so these sums
  // reconcile in every mode without any second layer of substitution.
  const totalCharged = rows.reduce((s, r) => s + r.st.rate, 0);
  const totalPaid    = rows.reduce((s, r) => s + Math.min(r.st.paid, r.st.rate), 0);
  const outstanding  = Math.max(0, totalCharged - totalPaid);
  const unpaidCount  = rows.filter(r => !r.st.settled && r.lesson.status !== 'scheduled').length;

  const received = payments
    .slice()
    .sort((a, b) => a.date_paid.localeCompare(b.date_paid))
    .map(p => ({
      payment: p,
      amount: parseFloat(p.amount) * scale,
      covers: allocations.filter(a => a.payment_id === p.id).length,
    }));
  const totalReceived = received.reduce((s, r) => s + r.amount, 0);

  const dShort = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const dPlain = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  const METHODS = { cash:'cash', bank_transfer:'transfer', monzo_auto:'transfer', other:'payment' };

  // Always the real figures - this is what gets sent to a parent.
  function asText() {
    const money = n => `£${n.toFixed(2).replace(/\.00$/, '')}`;
    const L = [`${student.name} - lessons and payments`, ''];
    L.push('LESSONS');
    rows.forEach(({ lesson: l, st }) => {
      const when = dPlain(l.lesson_date) + (l.start_time ? ` ${l.start_time}` : '');
      const paidNote = st.settled && st.payments.length
        ? `paid ${st.payments.map(p => dPlain(p.date_paid)).join(' + ')}`
        : st.partial ? `part paid ${money(st.paid)}`
        : l.status === 'scheduled' ? 'not yet due' : 'UNPAID';
      L.push(`  ${when} - ${money(st.rate)} - ${paidNote}`);
    });
    L.push('', 'PAYMENTS RECEIVED');
    if (received.length === 0) L.push('  none yet');
    received.forEach(r => {
      L.push(`  ${dPlain(r.payment.date_paid)} - ${money(r.amount)} by ${METHODS[r.payment.method] || r.payment.method}` +
             (r.covers ? ` (covers ${r.covers} lesson${r.covers !== 1 ? 's' : ''})` : ''));
    });
    L.push('', `Charged: ${money(totalCharged)}`);
    L.push(`Paid: ${money(totalPaid)}`);
    L.push(outstanding > 0.005 ? `OUTSTANDING: ${money(outstanding)}` : 'Fully settled - thank you!');
    L.push('', 'Payments are applied to the oldest unpaid lesson first.');
    return L.join('\n');
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(asText());
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch { /* clipboard blocked - everything is on screen anyway */ }
  }

  const masked = moneyMode !== 'normal' || nameMode !== 'normal';

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        {masked && (
          <div style={{
            fontSize:'0.76rem', fontWeight:600, color:'#fff', background:'var(--warn)',
            padding:'8px 11px', borderRadius:8, marginBottom:14, lineHeight:1.4
          }}>
            Privacy mode is on, so this screen is masked. Turn it off in Settings
            before screenshotting this for a parent. "Copy as text" is unaffected
            and always gives the real figures.
          </div>
        )}

        {/* Laid out to be screenshotted whole and sent as-is. */}
        <div className="stmt-head">
          <div className="stmt-name">{N(student.name, student.id)}</div>
          <div className="stmt-when">
            Lessons &amp; payments · as at {new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })}
          </div>
        </div>

        {rows.length === 0 ? (
          <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'14px 0'}}>
            No chargeable lessons yet.
          </div>
        ) : (
          <div className="stmt-grid">
            <div className="stmt-h">Lesson</div>
            <div className="stmt-h stmt-c">Charged</div>
            <div className="stmt-h stmt-c">Paid</div>
            {rows.map(({ lesson: l, st }) => {
              const notDue = !st.settled && l.status === 'scheduled';
              return (
                <React.Fragment key={l.id}>
                  <div>
                    {dShort(l.lesson_date)}
                    {l.start_time && <span style={{color:'var(--muted)'}}> {l.start_time}</span>}
                  </div>
                  <div className="stmt-c">{M(st.rate)}</div>
                  <div className={`stmt-c ${st.settled ? 'stmt-paid' : notDue ? '' : 'stmt-unpaid'}`}>
                    {st.settled && st.payments.length
                      ? st.payments.map(p => dPlain(p.date_paid)).join(' + ')
                      : st.settled ? '✓'
                      : st.partial ? `${M(st.paid)} so far`
                      : notDue ? <span style={{color:'var(--muted)'}}>not due</span>
                      : 'unpaid'}
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        )}

        <div className="section-label" style={{marginTop:18}}>Payments received</div>
        {received.length === 0 ? (
          <div style={{fontSize:'0.83rem', color:'var(--muted)', padding:'4px 0'}}>Nothing received yet.</div>
        ) : (
          <div className="stmt-grid">
            {received.map(r => (
              <React.Fragment key={r.payment.id}>
                <div>
                  {dPlain(r.payment.date_paid)}
                  <span style={{color:'var(--muted)'}}> · {METHODS[r.payment.method] || r.payment.method}</span>
                </div>
                <div className="stmt-c stmt-paid">{M(r.amount)}</div>
                <div className="stmt-c" style={{color:'var(--muted)', fontSize:'0.76rem'}}>
                  {r.covers ? `${r.covers} lesson${r.covers !== 1 ? 's' : ''}` : 'credit'}
                </div>
              </React.Fragment>
            ))}
          </div>
        )}

        <div className="stmt-tot">
          <div>
            <div style={{fontSize:'0.72rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:700}}>
              {outstanding > 0.005 ? 'Outstanding' : 'Fully settled'}
            </div>
            <div style={{fontSize:'0.74rem', color:'var(--muted)', marginTop:3}}>
              {M(totalCharged)} charged · {M(totalPaid)} paid
              {unpaidCount > 0 ? ` · ${unpaidCount} lesson${unpaidCount !== 1 ? 's' : ''} unpaid` : ''}
            </div>
          </div>
          <div className="stmt-big" style={{color: outstanding > 0.005 ? 'var(--warn)' : 'var(--accent)'}}>
            {M(outstanding)}
          </div>
        </div>

        <div style={{fontSize:'0.72rem', color:'var(--muted)', marginTop:10, lineHeight:1.45}}>
          Payments are applied to the oldest unpaid lesson first.
          {totalReceived - totalPaid > 0.005 && (
            <> {M(totalReceived - totalPaid)} is sitting as credit against future lessons.</>
          )}
        </div>

        <div className="btn-row">
          <button className="btn cancel" onClick={close}>Close</button>
          <button className="btn save" onClick={copy}>{copied ? 'Copied ✓' : 'Copy as text'}</button>
        </div>
      </div>
    </div>
  );
}

// ---------- More Tools Sheet ----------
function MoreToolsSheet({ student, onClose, onTrackCash, onStatement, onArchive, onDelete }) {
  const N = useNameDisplay();
  const [cls, close] = useAnimatedClose(onClose);
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const [pupilCopied, setPupilCopied] = useState(false);
  // Built from wherever the app is actually being served, so moving domain
  // needs no code change and links always point at the site the tutor is
  // looking at rather than a hardcoded one.
  const studentLink = new URL(`student.html?t=${student.public_token}`, window.location.href).toString();
  // A different token, not a different path on the same one. The pupil's link
  // has to be safe to hand to the pupil, and a shared token would let anyone
  // holding it edit the URL and read the balance.
  const pupilLink = new URL(`lessons.html?t=${student.student_token}`, window.location.href).toString();

  function copyStudentLink() {
    navigator.clipboard.writeText(studentLink).then(() => {
      setLinkCopied(true);
      setTimeout(() => setLinkCopied(false), 2000);
    });
  }

  function copyPupilLink() {
    navigator.clipboard.writeText(pupilLink).then(() => {
      setPupilCopied(true);
      setTimeout(() => setPupilCopied(false), 2000);
    });
  }

  return (
    <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2>More tools - {N(student.name, student.id)}</h2>
        <div className="tools-menu">
          <ToolsSection title="Payments">
            <ToolsRow
              title="Log a payment"
              subtitle="Record cash, transfer or another payment"
              onClick={onTrackCash}
            />
            <ToolsRow
              title="Lessons & payments"
              subtitle="Prepare a parent-friendly statement"
              onClick={onStatement}
            />
          </ToolsSection>

          <ToolsSection title="Parent page">
            <div className="tools-split-row">
              <ToolsRow
                title={linkCopied ? 'Copied' : 'Copy link'}
                subtitle="Lessons, payments and progress"
                onClick={copyStudentLink}
                end={linkCopied ? '✓' : null}
              />
              <ToolsRow
                title="Open"
                subtitle="Preview the parent page"
                onClick={() => window.open(studentLink, '_blank', 'noopener')}
                end="↗"
              />
            </div>
          </ToolsSection>

          <ToolsSection title="Student page">
            <div className="tools-split-row">
              <ToolsRow
                title={pupilCopied ? 'Copied' : 'Copy link'}
                subtitle="Upcoming lessons only, no money"
                onClick={copyPupilLink}
                end={pupilCopied ? '✓' : null}
              />
              <ToolsRow
                title="Open"
                subtitle="Preview what they see"
                onClick={() => window.open(pupilLink, '_blank', 'noopener')}
                end="↗"
              />
            </div>
          </ToolsSection>

          <ToolsSection title="Student">
            {student.active && (
              <ToolsRow
                title="Archive student"
                subtitle="Hide them without deleting their history"
                tone="danger"
                onClick={onArchive}
              />
            )}
            {confirmingDelete ? (
              <div style={{padding:'12px 14px'}}>
                <SlideToConfirm onConfirm={onDelete} />
              </div>
            ) : (
              <ToolsRow
                title="Delete student"
                subtitle="Permanent once confirmed"
                tone="danger"
                onClick={() => setConfirmingDelete(true)}
              />
            )}
          </ToolsSection>
        </div>
        <div className="btn-row">
          <button className="btn cancel" onClick={close}>Close</button>
        </div>
      </div>
    </div>
  );
}

function groupByMonth(lessons) {
  const groups = {};
  lessons.forEach(l => {
    const key = l.lesson_date.slice(0, 7);
    if (!groups[key]) {
      const d = new Date(l.lesson_date + 'T12:00:00');
      groups[key] = { key, label: d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), lessons: [] };
    }
    groups[key].lessons.push(l);
  });
  return Object.values(groups).sort((a, b) => b.key.localeCompare(a.key));
}

            <span className="pill neutral">{M(lessonRate, moneySeed)}</span>
          )}
          {lesson.is_complimentary ? null
            : lesson.pre_settled ? <span className="pill ok">settled before 27 Jul</span>
            : st.settled ? <span className="pill ok">paid</span>
            : st.partial ? <span className="pill warn">part paid · {M(st.paid, moneySeed + ':paid')} of {M(st.rate, moneySeed)}</span>
            : <span className="pill warn">unpaid</span>}
        </div>

        {/* The receipt: exactly what was paid, when, and how. */}
        {st.payments.length > 0 && (
          <div style={{
            marginBottom:16, padding:'10px 12px', borderRadius:8,
            background:'var(--card-2)', border:'1px solid var(--line)'
          }}>
            <div style={{fontSize:'0.72rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:6}}>
              Payment record
            </div>
            {st.payments
              .slice()
              .sort((a, b) => a.date_paid.localeCompare(b.date_paid))
              .map(p => (
                <div key={p.id} style={{fontSize:'0.83rem', color:'var(--ink-dim)', lineHeight:1.5}}>
                  {M(p.allocated, moneySeed)} received {new Date(p.date_paid + 'T12:00:00')
                    .toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}
                  {' '}by {METHODS[p.method] || p.method}
                </div>
              ))}
            {st.partial && (
              <div style={{fontSize:'0.8rem', color:'var(--gold)', marginTop:4}}>
                {M(st.rate - st.paid, moneySeed + ':outstanding')} still outstanding on this lesson.
              </div>
            )}
          </div>
        )}
        {/* Lesson notes come straight from the calendar event title, which
            usually contains the student's name - hidden whenever names are. */}
        {lesson.lesson_notes && nameMode === 'normal' && (
          <div style={{fontSize:'0.83rem',color:'var(--ink-dim)',marginBottom:16,lineHeight:1.55,background:'var(--card-2)',padding:'10px 12px',borderRadius:8,border:'1px solid var(--line)'}}>
            {lesson.lesson_notes}
          </div>
        )}
        {confirmingDelete ? (
          <>
            <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10, lineHeight:1.45}}>
              {lesson.google_event_id
                ? 'This one came from your calendar, so remove it there too - otherwise the next sync puts it straight back.'
                : 'This was added by hand, so it won’t come back.'}
              {' '}Any money covering it moves to the next unpaid lesson.
            </div>
            <div className="btn-row">
              <button className="btn cancel" onClick={() => setConfirmingDelete(false)}>Keep</button>
              <button className="btn save" style={{background:'var(--warn)'}} onClick={onDelete} disabled={toggling}>
                {toggling ? '…' : 'Delete lesson'}
              </button>
            </div>
          </>
        ) : (
          <div className="btn-row">
            <button className="btn cancel" onClick={close}>Close</button>
            <button className="btn" style={{background:'var(--warn)', color:'#fff', flex:'0 0 auto', minWidth:'auto', padding:'11px 14px'}}
              onClick={() => setConfirmingDelete(true)}>Delete</button>
            {lesson.status === 'completed' && (
              <button
                className="btn save"
                style={lesson.is_complimentary ? {background:'var(--warn)'} : {}}
                onClick={onToggleFree}
                disabled={toggling}
              >
                {toggling ? '…' : lesson.is_complimentary ? 'Remove free mark' : 'Mark as free'}
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function StudentCard({ student, lessons, payments, bundles, allocations = [], allStudents, rateHistory, focused, session, onEdit, onDataChanged }) {
  const M = useMoney();
  const N = useNameDisplay();
  const danielOnly = isDanielAccount(session);
  const [open, setOpen] = useState(false);
  const [notesOpen, setNotesOpen] = useState(false);
  const [showMoreTools, setShowMoreTools] = useState(false);
  const [showCashModal, setShowCashModal] = useState(false);
  const [openMonths, setOpenMonths] = useState({});
  const [showAllUpcoming, setShowAllUpcoming] = useState(false);
  const [detailLesson, setDetailLesson] = useState(null);
  const [detailPayment, setDetailPayment] = useState(null);
  const [editPayment, setEditPayment] = useState(null);
  const [showStatement, setShowStatement] = useState(false);
  const [paymentsOpen, setPaymentsOpen] = useState(false);
  const [toggling, setToggling] = useState(false);

  const studentLessons = lessons.filter(l => l.student_id === student.id)
    .sort((a, b) => new Date(b.lesson_date) - new Date(a.lesson_date));
  const studentPayments = payments.filter(p => p.student_id === student.id);
  const studentBundles = bundles.filter(b => b.student_id === student.id);

  const upcomingLessons = studentLessons.filter(l => l.status === 'scheduled')
    .sort((a, b) => new Date(a.lesson_date) - new Date(b.lesson_date));

  const completedLessons = studentLessons.filter(l => l.status === 'completed');
  // pre_settled lessons were taught before the 27 Jul 2026 reset and are
  // declared already paid, so they never count towards the balance.
  const totalOwed = completedLessons
    .filter(l => !l.is_complimentary && !l.pre_settled)
    .reduce((sum, l) => sum + rateForLesson(l, rateHistory), 0);
  // In fake mode, real payment amounts are scaled by the same ratio the rate
  // was faked by, so a payment still covers the lessons it actually covered.
  const moneyScale = moneyScaleFor(student.id, rateHistory);
  const totalPaid = studentPayments.reduce((sum, p) => sum + parseFloat(p.amount) * moneyScale, 0);
  const balance = totalOwed - totalPaid;

  const paymentsNewestFirst = [...studentPayments].sort((a, b) => b.date_paid.localeCompare(a.date_paid));
  const lastPaymentDate = paymentsNewestFirst[0]?.date_paid || null;

  // Which money paid for which lesson. A lesson can be part-paid, or covered
  // by more than one payment, so each entry carries the full picture.
  const lessonIds = new Set(studentLessons.map(l => l.id));
  const studentAllocations = allocations.filter(a => lessonIds.has(a.lesson_id));
  const paymentsById = Object.fromEntries(studentPayments.map(p => [p.id, p]));

  const payInfoByLessonId = {};
  studentAllocations.forEach(a => {
    const info = payInfoByLessonId[a.lesson_id] || { paid: 0, payments: [] };
    info.paid += parseFloat(a.amount) * moneyScale;
    const p = paymentsById[a.payment_id];
    if (p) info.payments.push({ ...p, allocated: parseFloat(a.amount) * moneyScale });
    payInfoByLessonId[a.lesson_id] = info;
  });

  function lessonPayState(l) {
    const rate = rateForLesson(l, rateHistory);
    const info = payInfoByLessonId[l.id];
    const paid = info ? info.paid : 0;
    return {
      rate, paid,
      payments: info ? info.payments : [],
      settled: l.pre_settled || l.is_complimentary || paid >= rate - 0.005,
      partial: paid > 0.005 && paid < rate - 0.005,
    };
  }

  // Money received that isn't yet attached to a lesson - i.e. credit in hand.
  const allocatedTotal = studentAllocations.reduce((sum, a) => sum + parseFloat(a.amount) * moneyScale, 0);

  const daysSinceLastPayment = lastPaymentDate ? daysBetween(lastPaymentDate) : null;
  const isOverdue = balance > 0 && (daysSinceLastPayment === null || daysSinceLastPayment > 2);

  const nextLesson = upcomingLessons[0];

  // Credit in hand: money received beyond what's been allocated to lessons,
  // expressed as roughly how many sessions it covers ahead.
  const creditInHand = Math.max(0, totalPaid - allocatedTotal);
  const bundleRemaining = null;
  const activeBundle = null;

  async function toggleComplimentary(lesson) {
    setToggling(true);
    await supabase.from('tutoring_lessons').update({ is_complimentary: !lesson.is_complimentary }).eq('id', lesson.id);
    // Same reason as a rate change: this moves what's owed, so anything
    // already allocated to this lesson has to be redistributed - otherwise
    // making a lesson free strands its payment there instead of letting it
    // settle the next one.
    await supabase.rpc('reallocate_student_payments', { p_student_id: student.id });
    setToggling(false);
    setDetailLesson(null);
    onDataChanged();
  }

  // The escape hatch for a lesson that shouldn't exist - a calendar event
  // created by mistake, or one the sync picked up before it was cancelled.
  // Without this the only option was marking it free, which leaves a lesson
  // in the history that never happened and quietly distorts the record.
  async function deleteLesson(lesson) {
    setToggling(true);
    await supabase.from('tutoring_lessons').delete().eq('id', lesson.id);
    // Its allocations cascade away with it, so rebuilding moves that money
    // onto the next unpaid lesson instead of leaving the student looking
    // behind on payments they've actually made.
    await supabase.rpc('reallocate_student_payments', { p_student_id: student.id });
    setToggling(false);
    setDetailLesson(null);
    onDataChanged();
  }

  async function archiveStudent() {
    await supabase.from('tutoring_students').update({ active: false }).eq('id', student.id);
    setShowMoreTools(false);
    onDataChanged();
  }

  async function deleteStudent() {
    await supabase.from('tutoring_monzo_transactions')
      .update({ matched_student_id: null }).eq('matched_student_id', student.id);
    await supabase.from('tutoring_students').delete().eq('id', student.id);
    setShowMoreTools(false);
    onDataChanged();
  }

  const displayYear = currentSchoolYear(student.school_year, student.school_year_as_of_date);
  const referredBy = danielOnly && student.referred_by_student_id ? allStudents.find(s => s.id === student.referred_by_student_id) : null;
  const referrals = danielOnly ? allStudents.filter(s => s.referred_by_student_id === student.id) : [];
  const lessonPills = studentLessonPills(student);

  const currentRate = getCurrentRate(student.id, rateHistory);
  const unpaidCount = balance > 0 && currentRate > 0 ? Math.ceil(balance / currentRate) : 0;

  const sixMonthsOut = new Date();
  sixMonthsOut.setMonth(sixMonthsOut.getMonth() + 6);
  const sixMonthsOutStr = sixMonthsOut.toISOString().slice(0, 10);
  const upcomingNext6 = upcomingLessons.filter(l => l.lesson_date <= sixMonthsOutStr);
  const pastLessons = studentLessons
    .filter(l => l.status !== 'scheduled')
    .slice(0, Math.max(10, unpaidCount));

  const groupedLessons = groupByMonth(pastLessons);
  const isMonthOpen = key => key in openMonths ? openMonths[key] : (groupedLessons.length > 0 && groupedLessons[0].key === key);

  const studentFirstName = student.name.split(' ')[0];
  const parentFirstName = (student.parent_name || '').split(' ')[0];
  const greeting = parentFirstName ? `Hi ${parentFirstName}!` : 'Hi!';
  const phone = normaliseUKPhone(student.parent_phone);
  const waMessage = balance > 0
    ? `${greeting} Just a friendly reminder we have an outstanding balance of ${moneyText(balance)} for ${studentFirstName}'s lessons. Please could you settle this when you get the chance? Thanks!`
    : `${greeting} Just checking in about ${studentFirstName}'s next lesson.`;
  const waLink = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(waMessage)}` : null;
  const paymentMsg = `${greeting} Just a note that we have ${unpaidCount} outstanding session${unpaidCount !== 1 ? 's' : ''} totalling ${moneyText(balance)}. Please could you settle this when you get the chance? Thanks!`;
  const paymentWaLink = phone && balance > 0 ? `https://wa.me/${phone}?text=${encodeURIComponent(paymentMsg)}` : null;
  const bundleWaLink = null;
  const cardParentLink = new URL(`student.html?t=${student.public_token}`, window.location.href).toString();
  const cardPupilLink = new URL(`lessons.html?t=${student.student_token}`, window.location.href).toString();
  const [parentLinkCopied, setParentLinkCopied] = useState(false);
  const [cardPupilCopied, setCardPupilCopied] = useState(false);
  // Which "you haven't filled this in yet" explainer is open, if any.
  const [setupHint, setSetupHint] = useState(null);

  const paperRecent = recentPaper(student);

  return (
    <div
      className={`card${open ? ' is-open' : ''}`}
      id={'student-' + student.id}
      style={focused ? { borderColor: 'var(--accent)', boxShadow: 'var(--sh-3), var(--ring)' } : undefined}
    >
      <div className="card-header" data-wt="card" onClick={() => setOpen(!open)}>
        <div style={{minWidth:0}}>
          <div className="student-name">
            <span className={`dot ${balance > 0.005 ? 'warn' : nextLesson ? 'ok' : 'idle'}`} />
            {N(student.name, student.id)}{!student.active && ' (inactive)'}
          </div>
          <div className="status-row">
            {balance > 0 && (
              <span className={`pill ${isOverdue ? 'warn' : 'neutral'}`}>
                {isOverdue ? `Overdue ${M(balance, student.id + ':balance')}` : `Owes ${M(balance, student.id + ':balance')}`}
              </span>
            )}
            {/* One line about money, not two. The old pair showed a credit
                pill only when a payment happened to be sitting unallocated,
                so Rose read "£5 credit" for having 80 paid against 75
                allocated while Shimmy, equally paid ahead but allocated to
                the penny, showed nothing at all. That difference is internal
                bookkeeping and meant nothing to anyone reading the card.
                Being ahead is a kind of being paid up, so it is the same
                pill in the same green, carrying the amount. */}
            {balance < -0.005 && (
              <span className="pill ok">In credit {M(-balance, student.id + ':credit')}</span>
            )}
            {balance >= -0.005 && balance <= 0.005 && <span className="pill ok">Paid up</span>}
            {nextLesson && (
              <span className="pill neutral">Next: {new Date(nextLesson.lesson_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</span>
            )}
            {displayYear && <span className="pill neutral">Y{displayYear}</span>}
            <span className="pill neutral">{M(currentRate, student.id + ':rate')}</span>
            {lessonPills.map(label => <span className="pill neutral" key={label}>{label}</span>)}
          </div>
        </div>
        <span className={`chevron ${open ? 'open' : ''}`}>›</span>
      </div>

      <div className={`card-body${open ? ' open' : ''}`}>
      <div className="card-body-inner">
          {(student.school || displayYear || referredBy || referrals.length > 0) && (
            <React.Fragment>
              <div className="section-label">Details</div>
              {(student.school || displayYear) && (
                <div style={{ fontSize: '0.85rem', color: 'var(--ink-dim)', marginBottom: 4 }}>
                  {student.school}{displayYear ? `, Year ${displayYear}` : ''}{student.exam_board ? ` · ${student.exam_board}` : ''}{student.exam_tier && student.exam_tier !== 'not_sure' ? ` (${student.exam_tier})` : ''}
                </div>
              )}
              {referredBy && (
                <div style={{ fontSize: '0.82rem', color: 'var(--muted)' }}>Referred by {N(referredBy.name, referredBy.id).split(' ')[0]}</div>
              )}
              {referrals.length > 0 && (
                <div style={{ fontSize: '0.82rem', color: 'var(--accent)', marginTop: 2 }}>
                  Referred {referrals.map(s => N(s.name, s.id).split(' ')[0]).join(', ')} - use "mark free" on their next lesson
                </div>
              )}
            </React.Fragment>
          )}

          {upcomingNext6.length > 0 && (
            <>
              <div className="section-label">Upcoming</div>
              {(showAllUpcoming ? upcomingNext6 : upcomingNext6.slice(0, 5)).map(l => (
                <div className="lesson-row" key={l.id} onClick={() => setDetailLesson(l)}>
                  <span className="lesson-date">
                    {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}
                    {l.start_time && <span style={{color:'var(--muted)'}}> · {l.start_time}</span>}
                  </span>
                  <span style={{display:'flex',alignItems:'center'}}>
                    <span className="lesson-status scheduled" style={lessonPayState(l).settled ? {color:'var(--accent)'} : {}}>
                      {lessonPayState(l).settled ? 'prepaid' : 'scheduled'}
                    </span>
                    <span className="chev">›</span>
                  </span>
                </div>
              ))}
              {upcomingNext6.length > 5 && (
                <button onClick={() => setShowAllUpcoming(!showAllUpcoming)} style={{
                  display:'block', width:'100%', textAlign:'center', padding:'8px 0', marginTop:2,
                  background:'none', border:'none', color:'var(--muted)', fontSize:'0.82rem',
                  fontFamily:'inherit', cursor:'pointer',
                }}>
                  {showAllUpcoming ? 'Show fewer' : `Show ${upcomingNext6.length - 5} more`}
                </button>
              )}
            </>
          )}

          <div className="section-label">History</div>
          {groupedLessons.length === 0 && (
            <div style={{fontSize:'0.85rem',color:'var(--muted)',padding:'6px 0'}}>No lessons logged yet.</div>
          )}
          {groupedLessons.map(group => (
            <React.Fragment key={group.key}>
              <div className="month-hdr" onClick={() => setOpenMonths(prev => ({...prev, [group.key]: !isMonthOpen(group.key)}))}>
                <span style={{fontSize:'0.83rem',fontWeight:600,color:'var(--ink)'}}>{group.label}</span>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>{group.lessons.length} lesson{group.lessons.length !== 1 ? 's' : ''}</span>
                  <span className="month-chevron" style={{transform:isMonthOpen(group.key)?'rotate(90deg)':'none'}}>›</span>
                </div>
              </div>
              {isMonthOpen(group.key) && group.lessons.map(l => (
                <div className="lesson-row" key={l.id} onClick={() => setDetailLesson(l)}>
                  <span className="lesson-date">
                    {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' })}
                    {l.start_time && <span style={{color:'var(--muted)'}}> · {l.start_time}</span>}
                  </span>
                  <span style={{display:'flex',alignItems:'center'}}>
                    {(() => {
                      const st = l.is_complimentary ? null : lessonPayState(l);
                      const settled = l.is_complimentary || l.pre_settled || (st && st.settled);
                      return (
                        <>
                          {!l.is_complimentary && (
                            l.pre_settled ? <span style={{fontSize:'0.7rem',color:'var(--accent)',marginRight:7}}>✓ settled</span>
                            : st.settled  ? <span style={{fontSize:'0.7rem',color:'var(--accent)',marginRight:7}}>✓ paid</span>
                            : st.partial  ? <span style={{fontSize:'0.7rem',color:'var(--gold)',marginRight:7}}>part paid</span>
                            : null
                          )}
                          <span className={`lesson-status ${l.is_complimentary ? '' : l.status}`} style={
                            l.is_complimentary ? {color:'var(--accent)'}
                            // Green only once the money is actually in. A lesson
                            // that has happened but hasn't been paid for is money
                            // owed, not a job done, so it reads as a warning.
                            : l.status === 'completed' ? {color: settled ? 'var(--accent)' : 'var(--warn)'}
                            : {}
                          }>
                            {l.is_complimentary ? 'free' : `${l.status} · ${M(rateForLesson(l, rateHistory), l.id + ':rate')}`}
                          </span>
                        </>
                      );
                    })()}
                    <span className="chev">›</span>
                  </span>
                </div>
              ))}
            </React.Fragment>
          ))}

          <div className="month-hdr" onClick={() => setPaymentsOpen(!paymentsOpen)} style={{marginTop:14}}>
            <span className="section-label" style={{margin:0}}>Payments</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:'0.72rem',color:'var(--muted)'}}>
                {studentPayments.length === 0 ? 'none' : `${studentPayments.length} · ${M(totalPaid, student.id + ':totalpaid')} total`}
              </span>
              <span className="month-chevron" style={{transform:paymentsOpen?'rotate(90deg)':'none'}}>›</span>
            </div>
          </div>
          {paymentsOpen && (
            <>
              {paymentsNewestFirst.map(p => {
                const n = studentAllocations.filter(a => a.payment_id === p.id).length;
                return (
                  <div className="pay-row" key={p.id} onClick={() => setDetailPayment(p)}>
                    <span style={{display:'flex',alignItems:'center',gap:8}}>
                      <span className="lesson-date">
                        {new Date(p.date_paid + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'2-digit' })}
                      </span>
                      <span className={`pay-method ${p.method}`}>
                        {{cash:'cash', bank_transfer:'transfer', monzo_auto:'monzo', other:'other'}[p.method] || p.method}
                      </span>
                    </span>
                    <span style={{display:'flex',alignItems:'center'}}>
                      <span style={{fontSize:'0.72rem',color:'var(--muted)',marginRight:8}}>
                        {n > 0 ? `${n} lesson${n !== 1 ? 's' : ''}` : 'unlinked'}
                      </span>
                      <span style={{fontWeight:600,color:'var(--ink)'}}>{M(parseFloat(p.amount) * moneyScale, p.id)}</span>
                      <span className="chev">›</span>
                    </span>
                  </div>
                );
              })}
              <button
                className="btn"
                style={{width:'100%',marginTop:10,background:'var(--card-2)',color:'var(--ink)',border:'1px solid var(--line)'}}
                onClick={() => { setEditPayment(null); setShowCashModal(true); }}
              >+ Log a payment</button>
            </>
          )}

          <div className="actions">
            {phone
              ? (balance > 0 && <a className="btn whatsapp" href={paymentWaLink} target="_blank" rel="noopener">💷 Request payment</a>)
              : balance > 0 && (
                <button className="btn needs-setup" onClick={() => setSetupHint('payment')}>💷 Request payment</button>
              )}
            {bundleWaLink && <a className="btn" href={bundleWaLink} target="_blank" rel="noopener" style={{background:'#128C7E'}}>🔔 Bundle low</a>}
            {phone
              ? <a className="btn whatsapp" href={waLink} target="_blank" rel="noopener">WhatsApp</a>
              : <button className="btn needs-setup" onClick={() => setSetupHint('whatsapp')}>WhatsApp</button>}
            {/* Was buried in More tools, where nobody found it. */}
            <button
              className="btn"
              data-wt="parentlink"
              title="Copy the parent's private page link"
              style={{background:'var(--accent-fill)', color:'var(--on-accent)', flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}
              onClick={() => {
                navigator.clipboard.writeText(cardParentLink).then(() => {
                  setParentLinkCopied(true);
                  setTimeout(() => setParentLinkCopied(false), 1800);
                });
              }}
            >{parentLinkCopied ? '✓' : '🔗'}</button>
            {/* The pupil's own link. Same one tap, different audience: this one
                is safe to give the child, since it carries no money at all. */}
            <button
              className="btn"
              title="Copy the student's link, upcoming lessons only"
              style={{background:'var(--card-2)', color:'var(--ink)', border:'1px solid var(--line)',
                      flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}
              onClick={() => {
                navigator.clipboard.writeText(cardPupilLink).then(() => {
                  setCardPupilCopied(true);
                  setTimeout(() => setCardPupilCopied(false), 1800);
                });
              }}
            >{cardPupilCopied ? '✓' : '🎓'}</button>
            {student.spreadsheet_url && (
              <a className="btn" href={student.spreadsheet_url} target="_blank" rel="noopener" style={{background:'#1a7f4b', flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}>📈</a>
            )}
            {student.is_zoom && student.zoom_link && (
              <a className="btn" href={student.zoom_link} target="_blank" rel="noopener" style={{background:'var(--accent-fill)', color:'var(--on-accent)', flex:'0 0 auto', minWidth:'auto', padding:'10px 14px'}}>🎥</a>
            )}
            <button className="btn edit" data-wt="edit" onClick={() => onEdit(student)}>Edit</button>
            <button className="btn more" data-wt="moretools" onClick={() => setShowMoreTools(true)}>More tools</button>
            {student.general_notes && (
              <button className="btn notes" onClick={() => setNotesOpen(!notesOpen)}>
                {notesOpen ? 'Hide notes' : 'Notes'}
              </button>
            )}
          </div>

          {student.general_notes && (
            <div className={`notes-box ${notesOpen ? 'visible' : ''}`}>{student.general_notes}</div>
          )}
        </div>
      </div>

      {setupHint && ReactDOM.createPortal(
        <div className="overlay" onClick={e => e.target === e.currentTarget && setSetupHint(null)}>

            <div style={{fontSize:'0.88rem', color:'var(--ink-dim)', lineHeight:1.55, marginBottom:14}}>

                ? <>To chase this balance over WhatsApp, {N(student.name, student.id)} needs a <b>parent's mobile number</b>. Add it and this button writes the message for you, with the amount and the number of unpaid lessons already filled in.</>
                : <>To message this parent, {N(student.name, student.id)} needs a <b>parent's mobile number</b>. Add it and this button opens WhatsApp with a message ready to send.</>}
            </div>
            <div style={{
              fontSize:'0.8rem', color:'var(--muted)', lineHeight:1.5, marginBottom:16,

              border:'1px solid var(--line)'
            }}>
              Worth filling in while you're there: the <b>parent's name</b>, so messages open
              with their name rather than just "Hi". School year and exam board drive the
              progress page. Address and notes change nothing, so skip them unless you
              want them.
            </div>
            <div style={{display:'flex', gap:8}}>
              <button className="btn cancel" style={{flex:1}} onClick={() => setSetupHint(null)}>Not now</button>
              <button className="btn save" style={{flex:1}}
                onClick={() => { setSetupHint(null); onEdit(student); }}>Add it now</button>
            </div>
          </div>
        </div>, document.body
      )}

      {showMoreTools && ReactDOM.createPortal(
        <MoreToolsSheet
          student={student}
          onClose={() => setShowMoreTools(false)}
          onTrackCash={() => { setShowMoreTools(false); setEditPayment(null); setShowCashModal(true); }}
          onStatement={() => { setShowMoreTools(false); setShowStatement(true); }}
          onArchive={archiveStudent}
          onDelete={deleteStudent}
        />, document.body
      )}

      {showCashModal && ReactDOM.createPortal(
        <PaymentModal
          student={student}
          payment={editPayment}
          lessons={studentLessons}
          currentRate={currentRate}
          rateHistory={rateHistory}
          allocations={studentAllocations}
          onClose={() => { setShowCashModal(false); setEditPayment(null); }}
          onSaved={() => { setShowCashModal(false); setEditPayment(null); onDataChanged(); }}
        />, document.body
      )}

      {detailPayment && ReactDOM.createPortal(
        <PaymentDetailSheet
          payment={detailPayment}
          lessons={studentLessons}
          allocations={studentAllocations}
          onClose={() => setDetailPayment(null)}
          onEdit={() => { setEditPayment(detailPayment); setDetailPayment(null); setShowCashModal(true); }}
          onDeleted={() => { setDetailPayment(null); onDataChanged(); }}
        />, document.body
      )}

      {showStatement && ReactDOM.createPortal(
        <StatementSheet
          student={student}
          lessons={studentLessons}
          payments={studentPayments}
          allocations={studentAllocations}
          payState={lessonPayState}
          scale={moneyScale}
          onClose={() => setShowStatement(false)}
        />, document.body
      )}

      {detailLesson && ReactDOM.createPortal(
        <LessonDetailSheet
          lesson={detailLesson}
          payState={lessonPayState(detailLesson)}
          lessonRate={rateForLesson(detailLesson, rateHistory)}
          onClose={() => setDetailLesson(null)}
          onToggleFree={() => toggleComplimentary(detailLesson)}
          onDelete={() => deleteLesson(detailLesson)}
          toggling={toggling}
        />, document.body
      )}
    </div>
  );
}

// ---------- Onboarding walkthrough ----------
// A plain bottom card rather than tooltips pinned to individual buttons: a
// brand-new account has an empty screen, so there is often nothing to point
// at, and anything anchored to an element breaks the moment a list is empty
// or a layout shifts. Every step that asks the tutor to go somewhere opens
// that screen for them instead of describing where to find it.
// A ring cut out of a dimmed page, glued to whatever the current step is
// talking about. Describing a button in prose was not enough: two tutors read
// the whole walkthrough and still could not find More tools.
/**
 * Is this element actually on screen, as opposed to merely present?
 *
 * A collapsed student card keeps its buttons in the DOM and clips them with a
 * zero-height, overflow-hidden wrapper. Those buttons still report a real width
 * and height, still have an offsetParent, and even satisfy checkVisibility(),
 * so the ring was being drawn over a card on a button nobody could see. The
 * only reliable tell is whether an ancestor that clips has any overlap left.
 */
function isReallyVisible(el) {
  if (!el) return false;
  const cs = getComputedStyle(el);
  if (cs.display === 'none' || cs.visibility === 'hidden') return false;
  // offsetParent is null for anything positioned fixed, which is how the
  // floating Settings pill is drawn, so that test alone called a perfectly
  // visible button hidden.
  if (cs.position !== 'fixed' && !el.offsetParent) return false;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  for (let p = el.parentElement; p; p = p.parentElement) {
    const cs = getComputedStyle(p);
    if (cs.overflow === 'visible' && cs.overflowX === 'visible' && cs.overflowY === 'visible') continue;
    const pr = p.getBoundingClientRect();
    if (r.bottom <= pr.top + 0.5 || r.top >= pr.bottom - 0.5 ||
        r.right <= pr.left + 0.5 || r.left >= pr.right - 0.5) return false;
  }
  return true;
}

/**
 * First visible match, trying each selector in turn. Steps that point at a
 * control living inside a student card name the card as a fallback, so before
 * anything is opened the ring lands on the card they need to tap rather than
 * on a button hidden inside it.
 */
function resolveAnchor(anchor) {
  const list = Array.isArray(anchor) ? anchor : [anchor];
  for (const sel of list) {
    const found = [...document.querySelectorAll(sel)].find(isReallyVisible);
    if (found) return found;
  }
  return null;
}

function Spotlight({ anchor }) {
  const [rect, setRect] = useState(null);
  const key = Array.isArray(anchor) ? anchor.join('|') : String(anchor || '');

  // A layout effect, not a passive one: this measures the DOM, and passive
  // effects get deferred by React's scheduler, which left the ring stranded on
  // the previous step's button. Layout effects run synchronously after commit,
  // so the ring moves in the same frame the step does.
  React.useLayoutEffect(() => {
    if (!key) { setRect(null); return; }

    const measure = () => {
      const el = resolveAnchor(anchor);
      if (!el) { setRect(null); return; }
      const r = el.getBoundingClientRect();
      // Only an actual move re-renders, so re-measuring costs nothing while
      // the page sits still.
      setRect(prev => (
        prev &&
        Math.abs(prev.top - r.top) < 0.5 && Math.abs(prev.left - r.left) < 0.5 &&
        Math.abs(prev.width - r.width) < 0.5 && Math.abs(prev.height - r.height) < 0.5
      ) ? prev : { top: r.top, left: r.left, width: r.width, height: r.height });
    };

    const el = resolveAnchor(anchor);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    measure();

    // Deliberately not requestAnimationFrame. A backgrounded tab stops being
    // handed frames entirely, so an rAF loop runs once and then freezes with
    // the ring stranded over whatever it highlighted first. The interval also
    // means opening a card mid-step moves the ring onto the button that just
    // appeared inside it.
    const id = setInterval(measure, 400);
    window.addEventListener('scroll', measure, { passive: true, capture: true });
    window.addEventListener('resize', measure);
    return () => {
      clearInterval(id);
      window.removeEventListener('scroll', measure, { capture: true });
      window.removeEventListener('resize', measure);
    };
  }, [key]);

  if (!rect) return null;

  // Above the target when there is genuinely room for it, otherwise below and
  // flipped. The old threshold of 70 counted the arrow as fitting above a
  // button sitting at 71, which put it in the header rather than clear of it.
  // It needs its own height plus the offset, so anything near the top of the
  // screen gets pointed at from underneath instead.
  const above = rect.top > 110;
  return ReactDOM.createPortal(
    <>
      <div className="wt-ring" style={{
        top: rect.top - 6, left: rect.left - 6,
        width: rect.width + 12, height: rect.height + 12,
      }} />
      <div className="wt-arrow" style={{
        top: above ? rect.top - 34 : rect.top + rect.height + 10,
        left: rect.left + rect.width / 2 - 9,
        transform: above ? 'none' : 'rotate(180deg)',
      }}>▼</div>
    </>, document.body
  );
}

const WT_STEPS = [

    title: "Let's get you running",

  {

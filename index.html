<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tutoring — Bower OS</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b3e">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  /* ── Light mode (default) ── */
  :root {
    --bg: #f4f3f0;
    --card: #ffffff;
    --card-2: #f7f6f3;
    --line: #e8e4dc;
    --ink: #1c1a17;
    --ink-dim: #6e6a62;
    --accent: #2a5c38;
    --accent-light: #edf4ef;
    --warn: #b84f1c;
    --warn-light: #fef1ec;
    --muted: #9c9890;
    --gold: #96752e;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161412;
      --card: #1e1c19;
      --card-2: #262320;
      --line: #333028;
      --ink: #f0ece4;
      --ink-dim: #9c9890;
      --accent: #4aad6b;
      --accent-light: #122018;
      --warn: #d4703a;
      --warn-light: #261408;
      --muted: #6e6a62;
      --gold: #d3b890;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    /* No pinch-zoom or double-tap-zoom: this is a fixed-layout app, and
       accidental zoom while scrolling a card list is pure annoyance.
       manipulation keeps panning and scrolling, drops the zoom gestures. */
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  #root { max-width: 720px; margin: 0 auto; padding-bottom: 100px; }

  /* ── Header ── */
  .app-header {
    background: var(--card);
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .header-title { font-size: 1.3rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
  .header-sub { font-size: 0.74rem; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 8px; padding: 7px 11px; font-size: 0.82rem; cursor: pointer;
    font-family: inherit;
  }
  .refresh-btn:active { opacity: 0.6; }
  .add-btn {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 8px 14px; font-size: 0.82rem;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .add-btn:active { opacity: 0.85; }

  /* ── Content ── */
  .content { padding: 14px 16px; }

  /* ── Cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card-header {
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
  }
  .card-header:active { background: var(--card-2); }
  .student-name { font-weight: 600; font-size: 1rem; color: var(--ink); }
  .status-row { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .pill {
    font-size: 0.67rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; letter-spacing: 0.02em;
  }
  .pill.ok { background: var(--accent-light); color: var(--accent); }
  .pill.warn { background: var(--warn-light); color: var(--warn); }
  .pill.neutral { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .chevron { font-size: 1rem; color: var(--muted); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
  .chevron.open { transform: rotate(90deg); }
  .card-body { overflow: hidden; max-height: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); }
  .card-body.open { max-height: 3000px; }
  .card-body-inner { padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .section-label {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 14px 0 6px; font-weight: 600;
  }
  .lesson-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; font-size: 0.86rem; border-bottom: 1px solid var(--line);
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-date { color: var(--ink-dim); }
  .lesson-status { font-size: 0.74rem; font-weight: 500; }
  .lesson-status.completed { color: var(--accent); }
  .lesson-status.scheduled { color: var(--gold); }
  .lesson-status.missed { color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 90px; padding: 10px 12px; border-radius: 10px; border: none;
    font-size: 0.83rem; font-weight: 600; cursor: pointer; text-align: center;
    text-decoration: none; color: white; font-family: inherit;
  }
  .btn.whatsapp { background: #25D366; color: #0a2e14; }
  .btn.notes { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .btn.more  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }
  .btn.edit  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }
  .notes-box {
    font-size: 0.84rem; color: var(--ink-dim); background: var(--card-2);
    padding: 10px 12px; border-radius: 8px; margin-top: 8px; line-height: 1.5;
    border: 1px solid var(--line); display: none;
  }
  .notes-box.visible { display: block; }
  .empty   { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
  .loading { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 0.88rem; letter-spacing: 0.04em; }

  /* ── Modals ── */
  @keyframes overlayIn  { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,0.5); } }
  @keyframes overlayOut { from { background: rgba(0,0,0,0.5); } to { background: rgba(0,0,0,0); } }
  @keyframes sheetUp    { from { transform: translateY(48px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes sheetDown  { from { transform: translateY(0); opacity: 1; } to { transform: translateY(52px); opacity: 0; } }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; animation: overlayIn 0.2s ease forwards;
  }
  /* Closing needs its own state because React unmounts instantly otherwise —
     the sheet would vanish with no exit animation at all. */
  .overlay.closing { animation: overlayOut 0.2s ease forwards; }
  .sheet {
    background: var(--card); border: 1px solid var(--line);
    width: 100%; max-width: 720px; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 90vh; overflow-y: auto;
    animation: sheetUp 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .sheet.closing { animation: sheetDown 0.2s cubic-bezier(0.4,0,1,1) forwards; }
  .sheet h2 { font-size: 1.05rem; margin: 0 0 16px; color: var(--ink); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.68rem; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 0.95rem; font-family: inherit;
    background: var(--card-2); color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .field textarea { min-height: 70px; resize: vertical; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn.cancel { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; padding: 10px 18px; }
  .btn.save   { background: var(--accent); color: white; }
  .session-list { margin: 10px 0; }
  .session-pick-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; color: var(--ink-dim);
  }
  .session-pick-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .tools-menu { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
  .tools-menu button {
    text-align: left; padding: 13px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card-2); font-size: 0.88rem;
    cursor: pointer; color: var(--ink); font-family: inherit; font-weight: 500;
  }
  .tools-menu button:active { opacity: 0.7; }

  /* ── Global tools button ── */
  .global-tools-btn {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); border: none; border-radius: 24px;
    padding: 12px 26px; font-size: 0.86rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18); z-index: 50; white-space: nowrap;
    font-family: inherit; letter-spacing: 0.01em;
  }
  .global-tools-btn:active { opacity: 0.85; }
  @media (prefers-color-scheme: dark) {
    .global-tools-btn { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  }

  /* ── Growth calculator ── */
  .calc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; font-size: 0.82rem; }
  .calc-grid-cell { padding: 7px 4px; border-top: 1px solid var(--line); color: var(--ink-dim); }
  .calc-grid-head { padding: 0 4px 7px; font-size: 0.67rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Perspective items ── */
  .perspective-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .perspective-item {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card-2); font-size: 0.82rem;
  }
  .perspective-item .emoji { font-size: 1.4rem; display: block; margin-bottom: 4px; }
  .perspective-item .name { font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .perspective-item .count { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
  .perspective-item .per-year { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

  /* ── Free lesson button ── */
  .free-btn {
    font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--line); cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .free-btn.active   { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .free-btn.inactive { background: var(--card-2); color: var(--muted); }

  /* ── Version tag ── */
  .version-tag { text-align: center; color: var(--ink); font-size: 0.88rem; font-weight: 600; padding: 60px 0 8px; letter-spacing: 0.05em; }

  /* ── Month group ── */
  .month-hdr {
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .month-hdr:active { opacity:0.7; }
  .month-chevron { font-size:0.9rem; color:var(--muted); display:inline-block; transition:transform 0.2s; }
  /* Rows are tappable on mobile and clickable on desktop.
     Inset via box-shadow so the highlight never shifts layout. */
  .lesson-row, .pay-row { cursor:pointer; border-radius:6px; transition: box-shadow 0.15s, background 0.15s; }
  .lesson-row:active, .pay-row:active { background:var(--card-2); box-shadow:0 0 0 4px var(--card-2); }
  @media (hover:hover) {
    .lesson-row:hover, .pay-row:hover { background:var(--card-2); box-shadow:0 0 0 4px var(--card-2); }
    .month-hdr:hover { opacity:0.75; }
  }
  .lesson-row .chev, .pay-row .chev { color:var(--muted); font-size:0.85rem; margin-left:8px; opacity:0; transition:opacity 0.15s; }
  @media (hover:hover) { .lesson-row:hover .chev, .pay-row:hover .chev { opacity:1; } }

  /* Payments */
  .pay-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; font-size:0.86rem; border-bottom:1px solid var(--line);
  }
  .pay-row:last-child { border-bottom:none; }
  .pay-method {
    font-size:0.66rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em;
    padding:2px 7px; border-radius:5px; background:var(--card-2); border:1px solid var(--line); color:var(--muted);
  }
  .pay-method.cash { color:var(--gold); border-color:var(--gold); }
  .pay-method.bank_transfer { color:#2D8CFF; border-color:#2D8CFF; }
  .pay-method.monzo_auto { color:#FF4F64; border-color:#FF4F64; }
  .seg { display:flex; gap:6px; }
  .seg button {
    flex:1; padding:9px 8px; border-radius:9px; font-size:0.84rem; font-weight:500;
    border:1px solid var(--line); background:var(--card-2); color:var(--muted);
    cursor:pointer; font-family:inherit; transition: all 0.15s;
  }
  .seg button.sel { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ── Three-position sliding switch (fake / real / hidden) ── */
  .tri-row {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  .tri-row:last-of-type { border-bottom:none; }
  .tri-meta { min-width:0; }
  .tri-title { font-size:0.92rem; font-weight:600; color:var(--ink); }
  .tri-sub { font-size:0.75rem; color:var(--muted); margin-top:3px; line-height:1.4; }
  .tri {
    position:relative; width:132px; height:36px; flex-shrink:0;
    border-radius:18px; border:1.5px solid var(--line); cursor:pointer;
    background:var(--card-2); overflow:hidden;
    transition: background 0.3s ease, border-color 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .tri[data-v="dummy"]  { background:linear-gradient(90deg, rgba(211,184,144,0.6), var(--card-2) 78%); border-color:var(--gold); }
  .tri[data-v="normal"] { background:var(--card-2); border-color:var(--accent); }
  .tri[data-v="hidden"] { background:linear-gradient(270deg, rgba(184,74,58,0.55), var(--card-2) 78%); border-color:var(--warn); }
  .tri-zone { position:absolute; top:0; bottom:0; width:33.34%; z-index:3; }
  .tri-zone.l { left:0; } .tri-zone.m { left:33.33%; } .tri-zone.r { right:0; }
  .tri-edge {
    position:absolute; top:50%; transform:translateY(-50%); z-index:1;
    font-size:0.8rem; font-weight:700; pointer-events:none;
  }
  .tri-edge.l { left:11px; color:var(--gold); }
  .tri-edge.r { right:12px; color:var(--warn); }
  .tri-knob {
    position:absolute; top:3px; width:40px; height:28px; border-radius:14px;
    background:#fff; box-shadow:0 2px 7px rgba(0,0,0,0.4); z-index:2;
    display:flex; align-items:center; justify-content:center;
    font-size:0.78rem; font-weight:700; color:#2b2b2b;
    transition: left 0.34s cubic-bezier(0.34,1.42,0.64,1);
  }
  .tri[data-v="dummy"]  .tri-knob { left:4px; }
  .tri[data-v="normal"] .tri-knob { left:45px; }
  .tri[data-v="hidden"] .tri-knob { left:86px; }
  .tri-state { font-size:0.72rem; font-weight:600; margin-top:5px; text-align:right; }
  .tri-state.dummy  { color:var(--gold); }
  .tri-state.normal { color:var(--accent); }
  .tri-state.hidden { color:var(--warn); }

  /* ── Statement (built to be screenshotted and sent to a parent) ── */
  .stmt-head { text-align:center; padding-bottom:12px; border-bottom:2px solid var(--ink); margin-bottom:2px; }
  .stmt-name { font-size:1.15rem; font-weight:700; color:var(--ink); letter-spacing:-0.01em; }
  .stmt-when { font-size:0.72rem; color:var(--muted); margin-top:3px; }
  .stmt-grid { display:grid; grid-template-columns: 1fr auto auto; gap:0; font-size:0.83rem; }
  .stmt-grid > div { padding:8px 0; border-bottom:1px solid var(--line); }
  .stmt-h {
    font-size:0.64rem !important; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--muted); font-weight:700; border-bottom:1px solid var(--line) !important;
  }
  .stmt-c { text-align:right; padding-left:14px !important; font-variant-numeric:tabular-nums; }
  .stmt-unpaid { color:var(--warn); font-weight:600; }
  .stmt-paid   { color:var(--accent); }
  .stmt-tot {
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:12px; padding-top:12px; border-top:2px solid var(--ink);
  }
  .stmt-big { font-size:1.6rem; font-weight:800; letter-spacing:-0.03em; line-height:1; }

  /* ── Animations ── */
  @keyframes fadeInUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
  .summary-widget { animation: fadeInUp 0.35s cubic-bezier(0.4,0,0.2,1) both; }
  .card { animation: fadeInUp 0.32s cubic-bezier(0.4,0,0.2,1) both; }
  .card:nth-child(1) { animation-delay:0.05s; }
  .card:nth-child(2) { animation-delay:0.09s; }
  .card:nth-child(3) { animation-delay:0.13s; }
  .card:nth-child(4) { animation-delay:0.17s; }
  .card:nth-child(5) { animation-delay:0.21s; }
  .card:nth-child(6) { animation-delay:0.25s; }
  .card:nth-child(7) { animation-delay:0.28s; }
  .card:nth-child(8) { animation-delay:0.31s; }
  .card:nth-child(9) { animation-delay:0.34s; }
  .card-body-inner { animation: fadeIn 0.22s ease both; }

  /* ── Toggle switch ── */
  .toggle-wrap { display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
  .toggle-track {
    width:44px; height:26px; border-radius:13px; position:relative; flex-shrink:0;
    transition: background 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  .toggle-track.on  { background: var(--accent); }
  .toggle-track.off { background: var(--card-2); border: 1.5px solid var(--line); }
  .toggle-thumb {
    position:absolute; top:3px; width:18px; height:18px; border-radius:9px;
    background:white; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    transition: left 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  .toggle-track.on  .toggle-thumb { left:22px; }
  .toggle-track.off .toggle-thumb { left:3px; }
  .toggle-label { font-size:0.88rem; color:var(--ink); }
  .rate-cash-row { display:flex; align-items:center; gap:12px; }
  .rate-cash-row input { width:90px !important; flex-shrink:0; }
</style>
</head>

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://uilytgubukiinyrqrltj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WK5p8tUAsNLEqnmxVT7Eag_2EVNbi7V';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function daysBetween(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function currentSchoolYear(baseYear, asOfDate) {
  if (baseYear == null || !asOfDate) return null;
  const ref = new Date(asOfDate);
  const now = new Date();
  let bumps = 0;
  let cursor = new Date(ref.getFullYear(), 7, 1); // 1 August of ref's year
  if (ref >= cursor) cursor.setFullYear(cursor.getFullYear() + 1);
  while (cursor <= now) {
    bumps++;
    cursor.setFullYear(cursor.getFullYear() + 1);
  }
  return Math.min(baseYear + bumps, 13);
}

const PRESET_BOARDS = ['Edexcel', 'AQA', 'Edexcel IGCSE', 'OCR'];

// Set once per render from App. Faking is applied at the RATE level rather
// than at each place a number is printed, because rates are what every other
// figure is computed from — fake the rate and the balances, totals and
// statements all come out consistent for free. Masking at print time instead
// produced totals that didn't add up to their own rows.
let PRIVACY_MONEY_MODE = 'normal';

// The rate in effect on a given date. Rates dated in the future are ignored
// until that date arrives, so a September rise doesn't affect today's figures.
// Ties on effective_from_date are broken by created_at, so the most recent
// edit always wins rather than whichever row happened to sort first.
function getRateOnDateReal(studentId, rateHistory, dateStr, fallback = 90) {
  const rows = (rateHistory || [])
    .filter(r => r.student_id === studentId && r.effective_from_date <= dateStr)
    .sort((a, b) => {
      const byDate = b.effective_from_date.localeCompare(a.effective_from_date);
      if (byDate !== 0) return byDate;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  return rows.length > 0 ? parseFloat(rows[0].rate) : fallback;
}

function getRateOnDate(studentId, rateHistory, dateStr, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(studentId);
  return getRateOnDateReal(studentId, rateHistory, dateStr, fallback);
}

function getCurrentRate(studentId, rateHistory, fallback = 90) {
  return getRateOnDate(studentId, rateHistory, new Date().toISOString().slice(0, 10), fallback);
}

// What a lesson is worth. An explicit rate_charged is a manual override and
// always wins; otherwise it's the rate that applied on the day it was taught,
// so past lessons keep their old price when you put rates up.
function rateForLesson(lesson, rateHistory, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(lesson.student_id);
  if (lesson.rate_charged !== null && lesson.rate_charged !== undefined && lesson.rate_charged !== '') {
    return parseFloat(lesson.rate_charged);
  }
  return getRateOnDateReal(lesson.student_id, rateHistory, lesson.lesson_date, fallback);
}

// Payments and allocations come out of the database as real amounts. In fake
// mode they're scaled by the same ratio the student's rate was faked by, so a
// payment still covers exactly the number of lessons it really covered.
function moneyScaleFor(studentId, rateHistory) {
  if (PRIVACY_MONEY_MODE !== 'dummy') return 1;
  const real = getRateOnDateReal(studentId, rateHistory, new Date().toISOString().slice(0, 10));
  if (!real) return 1;
  return dummyRateFor(studentId) / real;
}

// ---------- Privacy (show / hide / fake, for money and names independently) ----------
// Modes: 'normal' (real data), 'hidden' (fixed-width mask, reveals nothing —
// not even digit count), 'dummy' (plausible fake, stable per element so it
// doesn't flicker between renders or make totals look inconsistent).
//
// Deliberately scoped to DISPLAY ONLY. Nothing that feeds an editable form
// field or a "Copy as text" meant for a parent ever goes through these — a
// demo mode must never risk writing a fake number into the real books, or
// sending a parent a fake balance.
const PrivacyContext = React.createContext({ moneyMode: 'normal', nameMode: 'normal' });
function usePrivacy() { return React.useContext(PrivacyContext); }

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Students become "The Lazy One"; whoever pays for them becomes "The Big Lazy
// One", so the family link is obvious on screen without naming anybody.
const DUMMY_TRAITS = [
  'Lazy','Slow','Smart','Keen','Chatty','Sleepy','Quick','Grumpy',
  'Cheery','Fussy','Bright','Dreamy','Chaotic','Sharp','Sulky','Bouncy',
];

function dummyTraitFor(seedKey) {
  return DUMMY_TRAITS[hashStr(String(seedKey) + ':trait') % DUMMY_TRAITS.length];
}

function dummyNameFor(seedKey) {
  return `The ${dummyTraitFor(seedKey)} One`;
}

// The payer of a given student — same trait, "Big" added.
function dummyPayerNameFor(seedKey) {
  return `The Big ${dummyTraitFor(seedKey)} One`;
}

function hiddenNameFor(seedKey) {
  return `Student ${1000 + (hashStr(String(seedKey)) % 9000)}`;
}

// Session rates in fake mode land on £35-£75 in £5 steps: a believable
// tutoring rate, round like a real one, and nowhere near the real figure.
function dummyRateFor(studentId) {
  return 35 + (hashStr(String(studentId) + ':rate35') % 9) * 5;
}

const HIDDEN_MONEY_MASK = '£•••';

// Money display. By the time a number reaches here it is ALREADY correct for
// the current mode — rates are faked at source and payments are pre-scaled by
// moneyScaleFor — so fake mode just formats. Only hidden mode substitutes,
// with a fixed-width mask so a £45 and a £100 look identical.
function useMoney() {
  const { moneyMode } = usePrivacy();
  return (value, _seedKey, formatter) => {
    const fmt = formatter || (n => `£${Number(n).toFixed(2).replace(/\.00$/, '')}`);
    if (moneyMode === 'hidden') return HIDDEN_MONEY_MASK;
    return fmt(value);
  };
}

// Name display wrapper. seedKey should be the student's id so the same
// person shows the same fake/hidden label everywhere on screen.
function useNameDisplay() {
  const { nameMode } = usePrivacy();
  return (real, seedKey, isPayer) => {
    if (nameMode === 'hidden') return isPayer ? 'Payer' : hiddenNameFor(seedKey ?? real);
    if (nameMode === 'dummy') {
      return isPayer ? dummyPayerNameFor(seedKey ?? real) : dummyNameFor(seedKey ?? real);
    }
    return real;
  };
}

// One physical switch with three detents: fake (left) — real (middle) —
// hidden (right). The knob slides; tapping a third of the track jumps to it.
const TRI_GLYPH = { dummy: '≈', normal: '✓', hidden: '✕' };
const TRI_WORD  = { dummy: 'Showing fake data', normal: 'Showing real data', hidden: 'Hidden' };

// ---------- Animated sheet close ----------
// React unmounts instantly, so sheets previously blinked out of existence with
// no exit animation. This keeps the sheet mounted for the length of the close
// animation, then calls the real onClose. Returns the class suffix to apply to
// .overlay/.sheet, plus the close function to use everywhere instead of
// onClose — including internal Close/Cancel buttons, or those would still snap.
function useAnimatedClose(onClose) {
  const [closing, setClosing] = useState(false);
  const timer = React.useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);

  const close = React.useCallback(() => {
    setClosing(prev => {
      if (prev) return prev;               // already closing; ignore repeats
      timer.current = setTimeout(onClose, 200);
      return true;
    });
  }, [onClose]);

  return [closing ? ' closing' : '', close];
}

}

// ---------- Summary Widget ----------
function SummaryWidget({ students, rateHistory }) {
  const M = useMoney();
  const active = students.filter(s => s.active);

  const weeklyNet = active.reduce((sum, s) => {
    const rate = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? rate : rate * 0.6);
  }, 0);
  const annualNet = weeklyNet * 40;
  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;

  const SEP_TARGET = 10;
  const FULL_TARGET = 15;
  const awayFromSep = Math.max(0, SEP_TARGET - active.length);
  const awayFromFull = Math.max(0, FULL_TARGET - active.length);

  const stats = [
    { label: 'students', value: active.length,  accent: false },
    { label: 'net/week', value: M(weeklyNet, 'summary-week', fmt),  accent: true  },

          {stats.map(({label, value, accent}) => (
            <div key={label} style={{flex:'1 1 70px',minWidth:60}}>
              <div style={{fontSize:'1.85rem',fontWeight:700,color:accent?'var(--gold)':'var(--ink)',letterSpacing:'-0.03em',lineHeight:1}}>{value}</div>
              <div style={{fontSize:'0.66rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em',marginTop:4}}>{label}</div>
            </div>
          ))}
        </div>
      )}
      {/* Goal tracker */}
      <div style={{fontSize:'0.66rem',textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--muted)',marginBottom:10,fontWeight:600}}>Goal</div>
      <div style={{marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <span style={{fontSize:'0.82rem',color:'var(--ink-dim)'}}>10 by September</span>
          <span style={{fontSize:'0.78rem',fontWeight:600,color:awayFromSep===0?'var(--accent)':'var(--muted)'}}>
            {awayFromSep===0?'✓ reached':`${active.length} / ${SEP_TARGET}`}
          </span>
        </div>
        <div style={{background:'var(--card-2)',borderRadius:4,height:5,border:'1px solid var(--line)'}}>
          <div style={{background:'var(--accent)',width:`${Math.min(active.length/SEP_TARGET,1)*100}%`,height:'100%',borderRadius:4,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}></div>
        </div>
      </div>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <span style={{fontSize:'0.82rem',color:'var(--ink-dim)'}}>15 fully booked</span>
          <span style={{fontSize:'0.78rem',fontWeight:600,color:awayFromFull===0?'var(--gold)':'var(--muted)'}}>
            {awayFromFull===0?'🎉 fully booked!':`${active.length} / ${FULL_TARGET}`}
          </span>
        </div>
        <div style={{background:'var(--card-2)',borderRadius:4,height:5,border:'1px solid var(--line)'}}>
          <div style={{background:'var(--gold)',opacity:awayFromFull===0?1:0.55,width:`${Math.min(active.length/FULL_TARGET,1)*100}%`,height:'100%',borderRadius:4,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}></div>

      </div>

}

function normaliseUKPhone(raw) {
  const digits = (raw || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('44')) return digits;
  if (digits.startsWith('0')) return '44' + digits.slice(1);
  return '44' + digits;
}

// ---------- Growth Calculator ----------
function GrowthCalculator({ students, rateHistory, extra, setExtra, extraRate, setExtraRate, extraCash, setExtraCash }) {
  const active = students.filter(s => s.active);
  const avgRate = active.length > 0
    ? Math.round(active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0) / active.length)
    : 90;

  // Use passed props, or init with defaults if not provided
  const e = extra !== undefined ? extra : 4;
  const er = extraRate !== undefined ? extraRate : avgRate;
  const ec = extraCash !== undefined ? extraCash : false;

  const setE = setExtra || (() => {});
  const setER = setExtraRate || (() => {});
  const setEC = setExtraCash || (() => {});

  const currGrossW = active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0);
  const currNetW   = active.reduce((sum, s) => {
    const r = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? r : r * 0.6);
  }, 0);
  const addGrossW = e * er;
  const addNetW   = e * er * (ec ? 1 : 0.6);

  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;
  const M = useMoney();

  const rows = [
    { label: 'Students',  curr: active.length,    add: e,      isCount: true },
    { label: 'Gross/wk', curr: currGrossW,        add: addGrossW  },
    { label: 'Net/wk',   curr: currNetW,          add: addNetW    },
    { label: 'Gross/yr', curr: currGrossW * 40,   add: addGrossW * 40 },
    { label: 'Net/yr',   curr: currNetW * 40,     add: addNetW * 40   },
  ];

  return (
    <div>
      <div style={{display:'flex', gap:10, marginBottom:12}}>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Extra students</label>
          <input type="number" min="1" value={e} onChange={ev => setE(parseInt(ev.target.value)||1)} />
        </div>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Rate £/session</label>
          <input type="number" min="0" step="5" value={er} onChange={ev => setER(parseInt(ev.target.value)||0)} />
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <Toggle checked={ec} onChange={setEC} label="Pay in cash" />
      </div>
      <div className="calc-grid">
        <div className="calc-grid-head"></div>
        <div className="calc-grid-head">Now</div>
        <div className="calc-grid-head">+{e} more</div>
        <div className="calc-grid-head">New total</div>
        {rows.map(({ label, curr, add, isCount }) => (
          <React.Fragment key={label}>
            <div className="calc-grid-cell" style={{color:'var(--muted)'}}>{label}</div>
            <div className="calc-grid-cell">{isCount ? curr : M(curr, `growth-curr-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{color:'var(--accent)'}}>+{isCount ? add : M(add, `growth-add-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{fontWeight:600}}>{isCount ? curr+add : M(curr+add, `growth-total-${label}`, fmt)}</div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

// ---------- Monzo ----------
const FN_BASE = 'https://uilytgubukiinyrqrltj.supabase.co/functions/v1';

function MonzoPanel({ students, onDataChanged }) {
  const M = useMoney();
  const N = useNameDisplay();
  const nameModeIsNormal = usePrivacy().nameMode === 'normal';
  const [status, setStatus] = useState(null);
  const [pending, setPending] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [working, setWorking] = useState({});

  const activeStudents = students.filter(s => s.active);

  useEffect(() => { refresh(); }, []);

  async function refresh() {
    setPending(null);
    try {
      const s = await fetch(`${FN_BASE}/monzo-status`).then(r => r.json());
      setStatus(s);
      const p = await fetch(`${FN_BASE}/monzo-review`).then(r => r.json());
      setPending(p.pending || []);
    } catch (e) {
      setStatus({ connected: false, problem: String(e) });
      setPending([]);
    }
  }

  async function syncNow() {
    setBusy(true); setMsg(null);
    try {
      const r = await fetch(`${FN_BASE}/monzo-sync`).then(r => r.json());
      setMsg(r.ok
        ? `Logged ${r.newly_logged} new payment${r.newly_logged === 1 ? '' : 's'}.`
        : `Problem: ${r.problem}`);
      if (r.ok) onDataChanged();
    } catch { setMsg('Sync failed — check your connection.'); }
    setBusy(false);
    refresh();
  }

  async function act(txId, body) {
    setWorking(w => ({ ...w, [txId]: true }));
    try {
      await fetch(`${FN_BASE}/monzo-review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: txId, ...body }),
      });
      setPending(p => p.filter(x => x.transaction_id !== txId));
      if (body.student_id) onDataChanged();
    } finally {
      setWorking(w => ({ ...w, [txId]: false }));
    }
  }

  const connected = status?.connected && status?.data_access_approved;

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderRadius:10,
        background:'var(--card-2)', border:'1px solid var(--line)', marginBottom:12, fontSize:'0.85rem'
      }}>
        <span style={{
          width:9, height:9, borderRadius:5, flexShrink:0,
          background: status === null ? 'var(--muted)' : connected ? 'var(--accent)' : 'var(--warn)'
        }} />
        <span style={{flex:1}}>
          {status === null ? 'Checking…'
            : connected ? 'Connected to Monzo'
            : status?.connected ? 'Connected, but data access not approved in the Monzo app'
            : 'Not connected'}
        </span>
        {!connected && status !== null && (
          <a href={`${FN_BASE}/monzo-connect`} style={{
            fontSize:'0.78rem', fontWeight:600, color:'var(--accent)', textDecoration:'none'
          }}>Reconnect →</a>
        )}
      </div>

      <button className="btn save" style={{width:'100%', marginBottom:6}} onClick={syncNow} disabled={busy}>
        {busy ? 'Checking Monzo…' : '↻ Sync payments now'}
      </button>
      {msg && <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10}}>{msg}</div>}

      <div className="section-label" style={{marginTop:16}}>
        Unrecognised transfers{pending ? ` (${pending.length})` : ''}
      </div>
      <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:10, lineHeight:1.45}}>
        Money that came in but doesn't match a student. Assign one to a student and
        every future transfer from that account is logged automatically. These are
        read live from Monzo — nothing here is stored unless you assign it.
      </div>

      {pending === null && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Loading…</div>}
      {pending?.length === 0 && (
        <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Nothing waiting — all caught up.</div>
      )}

      {pending?.map(t => (
        <div key={t.transaction_id} style={{
          padding:'10px 0', borderBottom:'1px solid var(--line)',
          opacity: working[t.transaction_id] ? 0.45 : 1
        }}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:10}}>
            <span style={{fontWeight:600, fontSize:'0.9rem'}}>{N(t.from || 'Unknown sender', t.from || 'unknown-sender', true)}</span>
            <span style={{fontWeight:700, fontSize:'0.95rem'}}>{M(t.amount, t.transaction_id)}</span>
          </div>
          <div style={{fontSize:'0.75rem', color:'var(--muted)', marginTop:2}}>
            {new Date(t.date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}
            {/* Free-text bank reference can contain a name, so it's hidden
                entirely rather than shown in privacy mode — there's no safe
                way to partially redact arbitrary text. */}
            {nameModeIsNormal && t.reference && t.reference !== t.from ? ` · ${t.reference}` : ''}
          </div>
          <div style={{display:'flex', gap:6, marginTop:8}}>
            <select
              value=""
              disabled={working[t.transaction_id]}
              onChange={e => e.target.value && act(t.transaction_id, { student_id: e.target.value })}
              style={{flex:1, fontSize:'0.82rem', padding:'7px 8px'}}
            >
              <option value="">Assign to student…</option>
              {activeStudents.map(s => <option key={s.id} value={s.id}>{N(s.name, s.id)}</option>)}
            </select>
            <button
              className="btn cancel"
              style={{flex:'0 0 auto', minWidth:'auto', padding:'7px 12px', fontSize:'0.8rem'}}
              disabled={working[t.transaction_id]}
              onClick={() => act(t.transaction_id, { dismiss: true })}
            >Not tutoring</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ---------- Global Tools Sheet ----------
function GlobalToolsSheet({ students, rateHistory, moneyMode, setMoneyMode, nameMode, setNameMode, onClose, onDataChanged }) {
  const N = useNameDisplay();
  const [cls, close] = useAnimatedClose(onClose);
  const [tool, setTool] = useState(null);
  const privacyOn = moneyMode !== 'normal' || nameMode !== 'normal';
  const archived = students.filter(s => !s.active);

  // Growth calculator state (shared with perspective calc)
  const active = students.filter(s => s.active);
  const avgRate = active.length > 0
    ? Math.round(active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0) / active.length)
    : 90;
  const [extra, setExtra] = useState(4);
  const [extraRate, setExtraRate] = useState(avgRate);
  const [extraCash, setExtraCash] = useState(false);

  const addNetW = extra * extraRate * (extraCash ? 1 : 0.6);

  async function unarchive(id) {
    await supabase.from('tutoring_students').update({ active: true }).eq('id', id);
    onDataChanged();
  }

  const backBtn = (
    <button style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1.1rem',padding:0}} onClick={() => setTool(null)}>←</button>
  );

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        {!tool && (
          <>
            <h2>Tools</h2>
            <div className="tools-menu">
              <button onClick={() => setTool('growth')}>📈 Growth calculator — what if I had more students?</button>
              <button onClick={() => setTool('archived')}>🗂 Archived students{archived.length > 0 ? ` (${archived.length})` : ''}</button>
              <button onClick={() => setTool('monzo')}>🏦 Monzo payments</button>
              <button onClick={() => setTool('privacy')}>
                🕶 Privacy mode{privacyOn ? ' — on' : ''}
              </button>
              <button onClick={() => setTool('info')}>ℹ️ About &amp; data sources</button>
            </div>
          </>
        )}
        {tool === 'privacy' && (
          <>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:6}}>
              {backBtn}
              <h2 style={{margin:0}}>Privacy mode</h2>
            </div>
            <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:6, lineHeight:1.45}}>
              For showing the app to someone without handing over your rates or
              your students' names. Slide left for believable fake data, right to
              blank it out entirely.
            </div>
            <PrivacyToggle3
              title="💰 Amounts"
              sub="Rates, balances, payments and totals."
              value={moneyMode}
              onChange={setMoneyMode}
            />
            <PrivacyToggle3
              title="🧑 Names"
              sub="Students, parents and payer names."
              value={nameMode}
              onChange={setNameMode}
            />
            <div style={{fontSize:'0.76rem', color:'var(--gold)', marginTop:14, lineHeight:1.5}}>
              Forms you open to add or edit still show the real figures — masking
              a field you're about to save into would risk writing fake data into
              your actual records. The same goes for the text the payment record
              copies for a parent.
            </div>
          </>
        )}
        {tool === 'growth' && (
          <>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {backBtn}
              <h2 style={{margin:0}}>Growth calculator</h2>
            </div>
            <GrowthCalculator
              students={students}
              rateHistory={rateHistory}
              extra={extra}
              setExtra={setExtra}
              extraRate={extraRate}
              setExtraRate={setExtraRate}
              extraCash={extraCash}
              setExtraCash={setExtraCash}
            />
            <div style={{borderTop:'1px solid var(--line)', paddingTop:16, marginTop:20}}>
              <h3 style={{fontSize:'1rem', marginBottom:10}}>Here's what it gets you</h3>
              <PerspectiveCalculator addNetW={addNetW} />
            </div>
          </>
        )}
        {tool === 'monzo' && (
          <>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {backBtn}
              <h2 style={{margin:0}}>Monzo payments</h2>
            </div>
            <MonzoPanel students={students} onDataChanged={onDataChanged} />
          </>
        )}
        {tool === 'archived' && (
          <>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {backBtn}
              <h2 style={{margin:0}}>Archived students</h2>
            </div>
            {archived.length === 0 ? (
              <div style={{color:'var(--muted)', fontSize:'0.88rem', padding:'10px 0'}}>No archived students.</div>
            ) : (
              archived.map(s => (
                <div key={s.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--line)'}}>
                  <span style={{fontSize:'0.95rem'}}>{N(s.name, s.id)}</span>
                  <button className="btn save" style={{flex:'0 0 auto',minWidth:'auto',padding:'6px 14px',fontSize:'0.82rem'}} onClick={() => unarchive(s.id)}>
                    Unarchive
                  </button>
                </div>
              ))
            )}
          </>
        )}
        {tool === 'info' && (
          <>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:16}}>
              {backBtn}
              <h2 style={{margin:0}}>About &amp; data sources</h2>
            </div>
            {[
              { icon: '🗄️', title: 'Student profiles', body: 'Stored in Supabase (Bower OS project). Name, school, exam board, rate, WhatsApp number, Zoom link, spreadsheet link, and the bank name to expect payments from — all edited via the Edit button on each card.' },
              { icon: '📅', title: 'Lessons', body: 'Each lesson row has a date, start time, status (scheduled / completed / missed) and the rate charged. Past "scheduled" lessons are auto-corrected to "completed" on each app load. History is grouped by month — tap a month to expand it, then tap a lesson for its detail, where you can also mark it free.' },
              { icon: '🔄', title: 'Fresh start — 27 July 2026', body: 'Everything taught before 27 July 2026 is marked as already paid for. Those lessons still show in history (tagged "settled") but never count towards a balance, and all payments predating that date were cleared out. The old records were archived inside the database rather than destroyed, so they can be recovered if ever needed.' },
              { icon: '💷', title: 'Payments', body: 'Open a student and expand Payments to see every payment, or log a new one (cash or bank transfer). Tap a payment to see which lessons it covers, edit it, or delete it. Balance = completed lessons since the reset − total paid.' },
              { icon: '🏦', title: 'Monzo', body: 'Tools → Monzo payments pulls incoming bank transfers and logs them against the right student automatically. Set "Expect bank transfers from" on a student to teach it a parent\'s name; after the first match it remembers their account, so it keeps working even when the bank formats the name differently. Only money coming IN from real people is ever looked at — card spending, pot transfers and declines are filtered out, and unrecognised transfers are read live and never stored. Nothing before 27 July 2026 is considered.' },
              { icon: '📆', title: 'Calendar sync', body: 'A Google Apps Script (tutoring_calendar_sync_v3.gs) runs nightly. It reads your Tutoring calendar, matches events to students by their "calendar name" field, and writes lesson rows into Supabase with their start times — marking sessions complete once the date passes. Delete an event from the calendar and the lesson is removed too, unless a payment is attached to it, in which case it is kept and flagged in the log. Lessons you add by hand in the app are never touched by the sync.' },
              { icon: '📈', title: 'Spreadsheet links', body: 'Each student can have a Google Sheets link (set via Edit). Tap the 📈 button on a card to open it. Links are stored in Supabase and can also be set directly in the database.' },
              { icon: '💰', title: 'Rate history', body: 'Every rate change is recorded with a date. The app always uses the rate that was in effect on a given day — so historical balances stay accurate when you put prices up.' },
              { icon: '🔐', title: 'Security', body: 'Monzo credentials live only in Supabase\'s secret store, and the Monzo tables are locked so the key embedded in this page cannot read any bank data. Student details are not yet behind a login, so treat the site URL as private until that is added.' },
            ].map(({ icon, title, body }) => (
              <div key={title} style={{marginBottom:14, paddingBottom:14, borderBottom:'1px solid var(--line)'}}>
                <div style={{fontSize:'0.88rem', fontWeight:600, color:'var(--gold)', marginBottom:4}}>{icon} {title}</div>
                <div style={{fontSize:'0.83rem', color:'var(--ink-dim)', lineHeight:1.55}}>{body}</div>
              </div>
            ))}
          </>
        )}
        <div className="btn-row" style={{marginTop:20}}>
          <button className="btn cancel" onClick={close}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Add/Edit Student Modal ----------
function StudentFormModal({ student, onClose, onSaved, allStudents = [], rateHistory = [] }) {
  const [cls, close] = useAnimatedClose(onClose);
  const isEdit = !!student;
  const existingBoard = student?.exam_board || '';
  const initPreset = PRESET_BOARDS.includes(existingBoard) ? existingBoard : (existingBoard ? 'other' : '');

  const [form, setForm] = useState({
    name: student?.name || '',
    parent_name: student?.parent_name || '',
    parent_phone: student?.parent_phone || '',
    address: student?.address || '',
    school: student?.school || '',
    school_year: student?.school_year || '',
    exam_board_preset: initPreset,
    exam_board_custom: initPreset === 'other' ? existingBoard : '',
    exam_tier: student?.exam_tier || '',
    has_extra_time: student?.has_extra_time || false,
    pays_in_cash: !!student?.pays_in_cash,
    is_zoom: !!student?.is_zoom,
    zoom_link: student?.zoom_link || '',
    monzo_payer_name: student?.monzo_payer_name || '',
    general_notes: student?.general_notes || '',
    calendar_title_pattern: student?.calendar_title_pattern || '',
    spreadsheet_url: student?.spreadsheet_url || '',
    referred_by_student_id: student?.referred_by_student_id || '',
    active: student?.active !== undefined ? student.active : true,
  });
  const todayStr = new Date().toISOString().slice(0, 10);
  const [ratePerSession, setRatePerSession] = useState('');
  const [originalRate, setOriginalRate] = useState(null);
  const [rateFrom, setRateFrom] = useState(todayStr);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (!isEdit || !student?.id) return;
    async function fetchRate() {
      const today = new Date().toISOString().slice(0, 10);
      const { data } = await supabase
        .from('tutoring_rate_history')
        .select('rate')
        .eq('student_id', student.id)
        .lte('effective_from_date', today)
        .order('effective_from_date', { ascending: false })
        .limit(1)
        .single();
      if (data) {
        const r = parseFloat(data.rate);
        setRatePerSession(r.toString());
        setOriginalRate(r);
      }
    }
    fetchRate();
  }, []);

  async function handleSave() {
    setSaving(true);
    const exam_board = form.exam_board_preset === 'other'
      ? form.exam_board_custom
      : form.exam_board_preset;
    const payload = {
      name: form.name,
      parent_name: form.parent_name,
      parent_phone: form.parent_phone,
      address: form.address,
      school: form.school,
      school_year: form.school_year ? parseInt(form.school_year) : null,
      school_year_as_of_date: form.school_year
        ? (parseInt(form.school_year) !== student?.school_year
            ? new Date().toISOString().slice(0, 10)
            : (student?.school_year_as_of_date || new Date().toISOString().slice(0, 10)))
        : null,
      exam_board: exam_board || null,
      exam_tier: form.exam_tier || null,
      has_extra_time: form.has_extra_time,
      pays_in_cash: form.pays_in_cash,
      is_zoom: form.is_zoom,
      zoom_link: form.is_zoom ? (form.zoom_link || null) : null,
      monzo_payer_name: form.monzo_payer_name || null,
      general_notes: form.general_notes,
      calendar_title_pattern: form.calendar_title_pattern,
      spreadsheet_url: form.spreadsheet_url || null,
      referred_by_student_id: form.referred_by_student_id || null,
      active: form.active,
    };

    let studentId = student?.id;
    if (isEdit) {
      await supabase.from('tutoring_students').update(payload).eq('id', student.id);
    } else {
      const { data: newStudent } = await supabase.from('tutoring_students').insert(payload).select().single();
      studentId = newStudent?.id;
    }

    const rateNum = parseFloat(ratePerSession);
    const rateChanged = rateNum !== originalRate;
    const schedulingFutureRise = rateFrom !== todayStr;
    if (studentId && ratePerSession && !isNaN(rateNum) && (rateChanged || schedulingFutureRise)) {
      // Upsert, not insert: editing a rate twice in one day must replace that
      // day's figure rather than leave two rows competing for the same date.
      await supabase.from('tutoring_rate_history').upsert({
        student_id: studentId,
        rate: rateNum,
        effective_from_date: rateFrom,
      }, { onConflict: 'student_id,effective_from_date' });
    }

    setSaving(false);
    onSaved();
  }

  return (
    <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2>{isEdit ? 'Edit student' : 'Add student'}</h2>

        <div className="field">
          <label>Name</label>
          <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
        </div>
        <div className="field">
          <label>Parent name</label>
          <input type="text" value={form.parent_name} onChange={e => setForm({...form, parent_name: e.target.value})} />
        </div>
        <div className="field">
          <label>Parent's mobile number</label>
          <input type="text" value={form.parent_phone} onChange={e => setForm({...form, parent_phone: e.target.value})} placeholder="07700 900000" />
        </div>
        <div className="field">
          <label>Address</label>
          <input type="text" value={form.address} onChange={e => setForm({...form, address: e.target.value})} />
        </div>
        <div className="field">
          <label>School</label>
          <input type="text" list="school-options" value={form.school} onChange={e => setForm({...form, school: e.target.value})} />
          <datalist id="school-options">
            {[...new Set(allStudents.map(s => s.school).filter(Boolean))].map(sc => <option key={sc} value={sc} />)}
          </datalist>
        </div>
        <div className="field">
          <label>Rate per session</label>
          <div className="rate-cash-row">
            <input type="number" min="0" step="5" value={ratePerSession} onChange={e => setRatePerSession(e.target.value)} placeholder="e.g. 90" />
            <Toggle checked={form.pays_in_cash} onChange={v => setForm({...form, pays_in_cash: v})} label="Cash" />
          </div>
          <label style={{marginTop:10}}>Effective from</label>
          <input type="date" value={rateFrom} onChange={e => setRateFrom(e.target.value)} />
          <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
            Leave as today to change the rate now, or set a future date to
            schedule a rise. Lessons keep whichever rate applied on the day they
            were taught.
          </div>
          {isEdit && student?.id && (() => {
            const future = (rateHistory || [])
              .filter(r => r.student_id === student.id && r.effective_from_date > todayStr)
              .sort((a, b) => a.effective_from_date.localeCompare(b.effective_from_date));
            if (future.length === 0) return null;
            return (
              <div style={{fontSize:'0.78rem', color:'var(--gold)', marginTop:6}}>
                Scheduled: {future.map(r =>
                  `£${parseFloat(r.rate)} from ${new Date(r.effective_from_date + 'T12:00:00')
                    .toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}`
                ).join(' · ')}
              </div>
            );
          })()}
        </div>
        <div className="field">
          <label>School year (7–13, as of today)</label>
          <input type="number" min="7" max="13" value={form.school_year} onChange={e => setForm({...form, school_year: e.target.value})} />
        </div>
        <div className="field">
          <label>Exam board</label>
          <select value={form.exam_board_preset} onChange={e => setForm({...form, exam_board_preset: e.target.value})}>
            <option value="">—</option>
            <option value="Edexcel">Edexcel</option>
            <option value="AQA">AQA</option>
            <option value="Edexcel IGCSE">Edexcel IGCSE</option>
            <option value="OCR">OCR</option>
            <option value="other">Other</option>
          </select>
          {form.exam_board_preset === 'other' && (
            <input type="text" style={{marginTop: 6}} value={form.exam_board_custom}
              onChange={e => setForm({...form, exam_board_custom: e.target.value})}
              placeholder="e.g. OCR, Cambridge" />
          )}
        </div>
        <div className="field">
          <label>Exam tier</label>
          <select value={form.exam_tier} onChange={e => setForm({...form, exam_tier: e.target.value})}>
            <option value="">—</option>
            <option value="foundation">Foundation</option>
            <option value="higher">Higher</option>
            <option value="not_sure">Not sure yet</option>
          </select>
        </div>
        <div className="field">
          <Toggle checked={form.has_extra_time} onChange={v => setForm({...form, has_extra_time: v})} label="Has extra time (25%)" />
        </div>
        <div className="field">
          <Toggle checked={form.is_zoom} onChange={v => setForm({...form, is_zoom: v})} label="Zoom lesson" />
        </div>
        {form.is_zoom && (
          <div className="field">
            <label>Zoom link</label>
            <input type="text" value={form.zoom_link}
              onChange={e => setForm({...form, zoom_link: e.target.value})}
              placeholder="https://zoom.us/j/..." />
          </div>
        )}
        <div className="field">
          <label>Expect bank transfers from</label>
          <input type="text" value={form.monzo_payer_name}
            onChange={e => setForm({...form, monzo_payer_name: e.target.value})}
            placeholder="e.g. Sarah Simons" />
          <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
            The parent's name as it appears on their bank account. Used to match
            incoming Monzo transfers. After the first match the account is
            remembered, so the name no longer has to be exact.
          </div>
        </div>
        <div className="field">
          <label>Google Sheet link (optional)</label>
          <input type="text" value={form.spreadsheet_url} onChange={e => setForm({...form, spreadsheet_url: e.target.value})} placeholder="Paste the sheet URL here" />
        </div>
        <div className="field">
          <label>Referred by</label>
          <select value={form.referred_by_student_id} onChange={e => setForm({...form, referred_by_student_id: e.target.value})}>
            <option value="">— not a referral —</option>
            {allStudents.filter(s => s.id !== student?.id).map(s => (
              <option key={s.id} value={s.id}>{s.name}</option>
            ))}
          </select>
        </div>
        <div className="field">
          <label>Student's name in your calendar</label>
          <input type="text" value={form.calendar_title_pattern}
            onChange={e => setForm({...form, calendar_title_pattern: e.target.value})}
            placeholder="e.g. Saskia" />
          <div style={{fontSize: '0.78rem', color: 'var(--muted)', marginTop: 4}}>
            The word that appears in your Google Calendar event titles for this student's lessons.
          </div>
        </div>
        <div className="field">
          <label>Notes</label>
          <textarea value={form.general_notes} onChange={e => setForm({...form, general_notes: e.target.value})} />
        </div>
        <div className="field">
          <Toggle checked={form.active} onChange={v => setForm({...form, active: v})} label="Active student" />
        </div>

        <div className="btn-row">
          <button className="btn cancel" onClick={close}>Cancel</button>
          <button className="btn save" onClick={handleSave} disabled={saving || !form.name}>
            {saving ? 'Saving…' : 'Save'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- Payment Modal (add / edit) ----------
// Records the money only. Which lessons it pays for is worked out by the
// database, oldest unpaid first — so paying per lesson, paying for several at
// once, and paying in advance are all the same action. The preview below
// shows what it will settle before you commit.
function PaymentModal({ student, payment, lessons, currentRate, rateHistory = [],
                        allocations = [], onClose, onSaved }) {
  // Everything below this line is a live data-entry form, so it always shows
  // real amounts and lessons — masking a field you're about to save into the
  // real books would be actively dangerous. Only the title's name is masked,
  // since that's passive label text, not something being written anywhere.
  const N = useNameDisplay();
  const [cls, close] = useAnimatedClose(onClose);
  const editing = !!payment;
  const today = new Date().toISOString().slice(0, 10);

  const [datePaid, setDatePaid]   = useState(payment?.date_paid || today);
  const [method, setMethod]       = useState(payment?.method || (student.pays_in_cash ? 'cash' : 'bank_transfer'));
  const [amount, setAmount]       = useState(payment ? String(payment.amount) : '');
  const [saving, setSaving]       = useState(false);

  const rate = currentRate || 90;

  // Mirrors allocate_payment() in the database so the preview matches what
  // will actually happen. Money already allocated by OTHER payments counts as
  // paid; this payment's own existing allocations are ignored, since editing
  // it redistributes from scratch.
  const paidByOthers = {};
  allocations.forEach(a => {
    if (editing && a.payment_id === payment.id) return;
    paidByOthers[a.lesson_id] = (paidByOthers[a.lesson_id] || 0) + parseFloat(a.amount);
  });

  const queue = lessons
    .filter(l => l.status !== 'cancelled' && !l.is_complimentary && !l.pre_settled)
    .sort((a, b) => (a.lesson_date + (a.start_time || '00:00'))
                      .localeCompare(b.lesson_date + (b.start_time || '00:00')));

  let remaining = parseFloat(amount) || 0;
  const willCover = [];
  for (const l of queue) {
    if (remaining <= 0.005) break;
    const due = rateForLesson(l, rateHistory, rate) - (paidByOthers[l.id] || 0);
    if (due <= 0.005) continue;
    const take = Math.min(due, remaining);
    willCover.push({ lesson: l, take, partial: take < due - 0.005 });
    remaining -= take;
  }
  const leftOver = remaining;

  // Prefill a new payment with one session at the current rate, since that is
  // by far the most common case.
  useEffect(() => {
    if (!editing) setAmount(String(rate));
  }, []);

  async function handleSave() {
    setSaving(true);
    const amt = parseFloat(amount) || 0;

    // Allocation is handled by a database trigger, so it happens identically
    // however the payment arrives — here, from Monzo, or by hand.
    if (editing) {
      await supabase.from('tutoring_payments')
        .update({ amount: amt, date_paid: datePaid, method })
        .eq('id', payment.id);
    } else {
      await supabase.from('tutoring_payments').insert({
        student_id: student.id, amount: amt, date_paid: datePaid, method
      });
    }

    setSaving(false);
    onSaved();
  }

  return (
    <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2>{editing ? 'Edit payment' : 'Log payment'} — {N(student.name, student.id)}</h2>

        <div className="field">
          <label>Method</label>
          <div className="seg">
            {[['cash','💵 Cash'],['bank_transfer','🏦 Transfer'],['other','Other']].map(([v,lab]) => (
              <button key={v} className={method === v ? 'sel' : ''} onClick={() => setMethod(v)}>{lab}</button>
            ))}
          </div>
        </div>

        <div className="field">
          <label>Date paid</label>
          <input type="date" value={datePaid} onChange={e => setDatePaid(e.target.value)} />
        </div>

        <div className="field">
          <label>Amount</label>
          <input type="number" min="0" step="0.01" value={amount} placeholder="0.00"
                 onChange={e => { setTouched(true); setAmount(e.target.value); }} />
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginTop:4}}>
            Current rate £{rate} per session.
          </div>
        </div>

        <div className="field">
          <label>What this settles</label>
          {willCover.length === 0 ? (
            <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'6px 0'}}>
              {(parseFloat(amount) || 0) <= 0
                ? 'Enter an amount to see which lessons it covers.'
                : 'Nothing outstanding — the whole amount will sit as credit against future lessons.'}

function PaymentDetailSheet({ payment, lessons, allocations = [], onClose, onEdit, onDeleted }) {
  const M = useMoney();
  const [cls, close] = useAnimatedClose(onClose);
  const [busy, setBusy] = useState(false);
  const [confirming, setConfirming] = useState(false);

  const covered = allocations
    .filter(a => a.payment_id === payment.id)
    .map(a => ({ lesson: lessons.find(l => l.id === a.lesson_id), amount: parseFloat(a.amount) }))
    .filter(x => x.lesson)
    .sort((a, b) => a.lesson.lesson_date.localeCompare(b.lesson.lesson_date));

  const allocated = covered.reduce((sum, c) => sum + c.amount, 0);
  const unallocated = parseFloat(payment.amount) - allocated;

  const methodLabel = { cash:'Cash', bank_transfer:'Bank transfer', monzo_auto:'Monzo (auto)', other:'Other' }[payment.method] || payment.method;

  async function handleDelete() {
    setBusy(true);
    // Allocations are removed automatically by the foreign key cascade, which
    // frees those lessons to be settled by a later payment.
    await supabase.from('tutoring_payments').delete().eq('id', payment.id);
    setBusy(false);
    onDeleted();
  }

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2 style={{fontSize:'1.5rem', marginBottom:2, letterSpacing:'-0.02em'}}>{M(parseFloat(payment.amount), payment.id)}</h2>
        <div style={{fontSize:'0.86rem', color:'var(--muted)', marginBottom:14}}>
          {new Date(payment.date_paid + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}
        </div>

        <div style={{display:'flex', gap:6, marginBottom:16, flexWrap:'wrap'}}>
          <span className={`pay-method ${payment.method}`}>{methodLabel}</span>
          {payment.monzo_transaction_id && <span className="pill neutral">auto-matched</span>}
        </div>

        <div className="section-label">Covers {covered.length} lesson{covered.length !== 1 ? 's' : ''}</div>
        {covered.length === 0 ? (
          <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'6px 0 10px'}}>
            Nothing was outstanding when this arrived — it is sitting as credit
            and will settle the next lesson automatically.
          </div>
        ) : (
          <div style={{marginBottom:10}}>
            {covered.map(({ lesson: l, amount }) => (
              <div className="lesson-row" key={l.id} style={{cursor:'default'}}>
                <span className="lesson-date">
                  {new Date(l.lesson_date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'2-digit' })}
                  {l.start_time ? ` · ${l.start_time}` : ''}
                </span>
                <span style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontSize:'0.78rem', fontWeight:600, color:'var(--accent)'}}>{M(amount, l.id + ':rate')}</span>
                  <span className={`lesson-status ${l.status}`}>{l.status}</span>
                </span>
              </div>
            ))}
          </div>
        )}
        {unallocated > 0.005 && (
          <div style={{fontSize:'0.8rem', color:'var(--gold)', marginBottom:10}}>
            {M(unallocated, payment.id + ':unalloc')} of this payment is unused credit.
          </div>
        )}

        {confirming ? (
          <div className="btn-row">
            <button className="btn cancel" onClick={() => setConfirming(false)}>Keep</button>
            <button className="btn save" style={{background:'var(--warn)'}} onClick={handleDelete} disabled={busy}>
              {busy ? '…' : 'Delete for good'}
            </button>
          </div>
        ) : (
          <div className="btn-row">
            <button className="btn cancel" onClick={close}>Close</button>
            <button className="btn" style={{background:'var(--warn)', color:'#fff'}} onClick={() => setConfirming(true)}>Delete</button>
            <button className="btn save" onClick={onEdit}>Edit</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Statement ----------
// A plain, chronological record of every chargeable lesson and exactly which
// money settled it — the thing to read out when a parent asks "when did I pay
// for that?". Copyable as text so it can be pasted straight into WhatsApp.
function StatementSheet({ student, lessons, payments, allocations, payState, scale, onClose }) {
  const M = useMoney();
  const N = useNameDisplay();
  const { moneyMode, nameMode } = usePrivacy();
  const [copied, setCopied] = useState(false);
  const [cls, close] = useAnimatedClose(onClose);

  const rows = lessons
    .filter(l => l.status !== 'cancelled' && !l.is_complimentary && !l.pre_settled)
    .sort((a, b) => (a.lesson_date + (a.start_time || '')).localeCompare(b.lesson_date + (b.start_time || '')))
    .map(l => ({ lesson: l, st: payState(l) }));

  // Rates are faked at source and paid amounts are pre-scaled, so these sums
  // reconcile in every mode without any second layer of substitution.
  const totalCharged = rows.reduce((s, r) => s + r.st.rate, 0);
  const totalPaid    = rows.reduce((s, r) => s + Math.min(r.st.paid, r.st.rate), 0);
  const outstanding  = Math.max(0, totalCharged - totalPaid);
  const unpaidCount  = rows.filter(r => !r.st.settled && r.lesson.status !== 'scheduled').length;

  const received = payments
    .slice()
    .sort((a, b) => a.date_paid.localeCompare(b.date_paid))
    .map(p => ({
      payment: p,
      amount: parseFloat(p.amount) * scale,
      covers: allocations.filter(a => a.payment_id === p.id).length,
    }));
  const totalReceived = received.reduce((s, r) => s + r.amount, 0);

  const dShort = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const dPlain = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  const METHODS = { cash:'cash', bank_transfer:'transfer', monzo_auto:'transfer', other:'payment' };

  // Always the real figures — this is what gets sent to a parent.
  function asText() {
    const money = n => `£${n.toFixed(2).replace(/\.00$/, '')}`;
    const L = [`${student.name} — lessons and payments`, ''];
    L.push('LESSONS');
    rows.forEach(({ lesson: l, st }) => {
      const when = dPlain(l.lesson_date) + (l.start_time ? ` ${l.start_time}` : '');
      const paidNote = st.settled && st.payments.length
        ? `paid ${st.payments.map(p => dPlain(p.date_paid)).join(' + ')}`
        : st.partial ? `part paid ${money(st.paid)}`
        : l.status === 'scheduled' ? 'not yet due' : 'UNPAID';
      L.push(`  ${when} — ${money(st.rate)} — ${paidNote}`);
    });
    L.push('', 'PAYMENTS RECEIVED');
    if (received.length === 0) L.push('  none yet');
    received.forEach(r => {
      L.push(`  ${dPlain(r.payment.date_paid)} — ${money(r.amount)} by ${METHODS[r.payment.method] || r.payment.method}` +
             (r.covers ? ` (covers ${r.covers} lesson${r.covers !== 1 ? 's' : ''})` : ''));
    });
    L.push('', `Charged: ${money(totalCharged)}`);
    L.push(`Paid: ${money(totalPaid)}`);
    L.push(outstanding > 0.005 ? `OUTSTANDING: ${money(outstanding)}` : 'Fully settled — thank you!');
    L.push('', 'Payments are applied to the oldest unpaid lesson first.');
    return L.join('\n');
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(asText());
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch { /* clipboard blocked — everything is on screen anyway */ }
  }

  const masked = moneyMode !== 'normal' || nameMode !== 'normal';

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        {masked && (
          <div style={{
            fontSize:'0.76rem', fontWeight:600, color:'#fff', background:'var(--warn)',
            padding:'8px 11px', borderRadius:8, marginBottom:14, lineHeight:1.4
          }}>
            Privacy mode is on, so this screen is masked. Turn it off in Tools
            before screenshotting this for a parent. "Copy as text" is unaffected
            and always gives the real figures.
          </div>
        )}

        {/* Laid out to be screenshotted whole and sent as-is. */}
        <div className="stmt-head">
          <div className="stmt-name">{N(student.name, student.id)}</div>
          <div className="stmt-when">
            Lessons &amp; payments · as at {new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })}
          </div>
        </div>

        {rows.length === 0 ? (
          <div style={{fontSize:'0.85rem', color:'var(--muted)', padding:'14px 0'}}>
            No chargeable lessons yet.
          </div>
        ) : (
          <div className="stmt-grid">
            <div className="stmt-h">Lesson</div>
            <div className="stmt-h stmt-c">Charged</div>
            <div className="stmt-h stmt-c">Paid</div>
            {rows.map(({ lesson: l, st }) => {
              const notDue = !st.settled && l.status === 'scheduled';
              return (
                <React.Fragment key={l.id}>
                  <div>
                    {dShort(l.lesson_date)}
                    {l.start_time && <span style={{color:'var(--muted)'}}> {l.start_time}</span>}
                  </div>
                  <div className="stmt-c">{M(st.rate)}</div>
                  <div className={`stmt-c ${st.settled ? 'stmt-paid' : notDue ? '' : 'stmt-unpaid'}`}>
                    {st.settled && st.payments.length
                      ? st.payments.map(p => dPlain(p.date_paid)).join(' + ')
                      : st.settled ? '✓'
                      : st.partial ? `${M(st.paid)} so far`
                      : notDue ? <span style={{color:'var(--muted)'}}>not due</span>
                      : 'unpaid'}
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        )}

        <div className="section-label" style={{marginTop:18}}>Payments received</div>
        {received.length === 0 ? (
          <div style={{fontSize:'0.83rem', color:'var(--muted)', padding:'4px 0'}}>Nothing received yet.</div>
        ) : (
          <div className="stmt-grid">
            {received.map(r => (
              <React.Fragment key={r.payment.id}>
                <div>
                  {dPlain(r.payment.date_paid)}
                  <span style={{color:'var(--muted)'}}> · {METHODS[r.payment.method] || r.payment.method}</span>
                </div>
                <div className="stmt-c stmt-paid">{M(r.amount)}</div>
                <div className="stmt-c" style={{color:'var(--muted)', fontSize:'0.76rem'}}>
                  {r.covers ? `${r.covers} lesson${r.covers !== 1 ? 's' : ''}` : 'credit'}
                </div>
              </React.Fragment>
            ))}
          </div>
        )}

        <div className="stmt-tot">
          <div>
            <div style={{fontSize:'0.72rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', fontWeight:700}}>
              {outstanding > 0.005 ? 'Outstanding' : 'Fully settled'}
            </div>
            <div style={{fontSize:'0.74rem', color:'var(--muted)', marginTop:3}}>
              {M(totalCharged)} charged · {M(totalPaid)} paid
              {unpaidCount > 0 ? ` · ${unpaidCount} lesson${unpaidCount !== 1 ? 's' : ''} unpaid` : ''}
            </div>
          </div>
          <div className="stmt-big" style={{color: outstanding > 0.005 ? 'var(--warn)' : 'var(--accent)'}}>
            {M(outstanding)}
          </div>
        </div>

        <div style={{fontSize:'0.72rem', color:'var(--muted)', marginTop:10, lineHeight:1.45}}>
          Payments are applied to the oldest unpaid lesson first.
          {totalReceived - totalPaid > 0.005 && (
            <> {M(totalReceived - totalPaid)} is sitting as credit against future lessons.</>
          )}
        </div>

        <div className="btn-row">
          <button className="btn cancel" onClick={close}>Close</button>
          <button className="btn save" onClick={copy}>{copied ? 'Copied ✓' : 'Copy as text'}</button>
        </div>
      </div>
    </div>
  );
}

function groupByMonth(lessons) {
  const groups = {};
  lessons.forEach(l => {
    const key = l.lesson_date.slice(0, 7);
    if (!groups[key]) {
      const d = new Date(l.lesson_date + 'T12:00:00');
      groups[key] = { key, label: d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }), lessons: [] };
    }
    groups[key].lessons.push(l);
  });
  return Object.values(groups).sort((a, b) => b.key.localeCompare(a.key));
}

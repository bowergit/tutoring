<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tutortally</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#0f766e">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* ── Light mode (default) ── */
  :root {
    --bg: #f7f8f4;
    --bg-tint: #ecf4f1;
    --card: #ffffff;
    --card-2: #f5f7f6;
    --card-3: #edf1ef;
    --line: #dfe7e3;
    --line-soft: #edf1ef;
    --ink: #15211f;
    --ink-dim: #596965;
    --accent: #0f766e;
    --accent-2: #2563eb;
    --accent-light: #e0f3ef;
    --warn: #d05b39;
    --warn-light: #fff0e9;
    --muted: #87938f;
    --gold: #b7791f;
    --gold-light: #fff4d8;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    /* Layered shadows read as real depth; a single blurred box never does. */
    --sh-1: 0 1px 2px rgba(22,21,15,.06);
    --sh-2: 0 1px 2px rgba(22,21,15,.05), 0 6px 16px -8px rgba(22,21,15,.14);
    --sh-3: 0 2px 6px rgba(22,21,15,.06), 0 16px 40px -12px rgba(22,21,15,.22);
    --ring: 0 0 0 3px rgba(15,118,110,.16);
  }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716;
      --bg-tint: #14211f;
      --card: #182321;
      --card-2: #1e2a27;
      --card-3: #26332f;
      --line: #30413d;
      --line-soft: #26332f;
      --ink: #eef8f5;
      --ink-dim: #a5b7b1;
      --accent: #35c2b0;
      --accent-2: #7ba7ff;
      --accent-light: #12332f;
      --warn: #ff8a63;
      --warn-light: #351d15;
      --muted: #7f918c;
      --gold: #e6bd62;
      --gold-light: #302612;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --sh-1: 0 1px 2px rgba(0,0,0,.4);
      --sh-2: 0 1px 3px rgba(0,0,0,.45), 0 8px 20px -10px rgba(0,0,0,.6);
      --sh-3: 0 2px 8px rgba(0,0,0,.5), 0 20px 48px -14px rgba(0,0,0,.75);
      --ring: 0 0 0 3px rgba(53,194,176,.22);
    }
  }

  /* Radii and motion, shared across both themes. */
  :root {
    --r-sm: 9px; --r-md: 13px; --r-lg: 17px; --r-xl: 24px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --ease-spring: cubic-bezier(.34,1.4,.64,1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    /* No pinch-zoom or double-tap-zoom: this is a fixed-layout app, and
       accidental zoom while scrolling a card list is pure annoyance.
       manipulation keeps panning and scrolling, drops the zoom gestures. */
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  #root { max-width: 720px; margin: 0 auto; padding-bottom: 100px; }

  /* ── Header ── */
  .app-header {
    background: color-mix(in srgb, var(--card) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    backdrop-filter: saturate(180%) blur(16px);
    padding: 15px 16px 13px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  @supports not (backdrop-filter: blur(1px)) { .app-header { background: var(--card); } }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .header-title {
    font-size: 1.32rem; font-weight: 700; color: var(--ink);
    letter-spacing: -0.028em; line-height: 1;
  }
  .header-sub { font-size: 0.735rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.005em; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: var(--r-sm); width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer;
    font-family: inherit; display: grid; place-items: center;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .refresh-btn:active { transform: scale(.92); background: var(--card-3); }
  .add-btn {
    background: var(--accent); color: white; border: none;
    border-radius: var(--r-sm); padding: 9px 15px; font-size: 0.82rem;
    font-weight: 650; cursor: pointer; font-family: inherit;
    box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.14);
    transition: transform .18s var(--ease), filter .18s var(--ease);
  }
  .add-btn:active { transform: scale(.95); filter: brightness(1.08); }

  /* ── Content ── */
  .content { padding: 14px 16px; }

  /* ── Search ── */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input {
    width: 100%; padding: 11px 36px 11px 36px; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 0.9rem; font-family: inherit; box-shadow: var(--sh-1);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .search-wrap .s-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 0.9rem; pointer-events: none;
  }
  .search-wrap .s-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--card-3); border: none; color: var(--ink-dim); cursor: pointer;
    width: 22px; height: 22px; border-radius: 11px; font-size: 0.8rem; line-height: 1;
    display: grid; place-items: center; font-family: inherit;
  }

  /* ── Cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    margin-bottom: 11px;
    overflow: hidden;
    box-shadow: var(--sh-2);
    transition: box-shadow .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease);
  }
  .card.is-open { box-shadow: var(--sh-3); border-color: color-mix(in srgb, var(--accent) 26%, var(--line)); }
  @media (hover:hover) { .card:hover { box-shadow: var(--sh-3); } }
  .card-header {
    padding: 15px 16px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    gap: 10px;
    transition: background .18s var(--ease);
  }
  .card-header:active { background: var(--card-2); }
  .student-name {
    font-weight: 650; font-size: 1.02rem; color: var(--ink); letter-spacing: -0.015em;
    display: flex; align-items: center; gap: 7px;
  }
  /* Coloured dot carries paid/owing state before any text is read. */
  .dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; }
  .dot.ok { background: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-light); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-light); }
  .dot.idle { background: var(--muted); opacity: .55; }
  .status-row { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .pill {
    font-size: 0.665rem; padding: 3px 9px; border-radius: 20px; font-weight: 650;
    letter-spacing: 0.015em; line-height: 1.45; white-space: nowrap;
  }
  .pill.ok { background: var(--accent-light); color: var(--accent); }
  .pill.warn { background: var(--warn-light); color: var(--warn); }
  .pill.neutral { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .pill.gold { background: var(--gold-light); color: var(--gold); }

  /* ── Skeleton loading ── */
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .sk {
    border-radius: var(--r-lg); height: 74px; margin-bottom: 11px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-3) 45%, var(--card) 90%);
    background-size: 420px 100%;
    animation: shimmer 1.25s linear infinite;
    border: 1px solid var(--line);
  }
  .chevron { font-size: 1rem; color: var(--muted); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
  .chevron.open { transform: rotate(90deg); }
  .card-body { overflow: hidden; max-height: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); }
  .card-body.open { max-height: 3000px; }
  .card-body-inner { padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .section-label {
    font-size: 0.645rem; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 700;
  }
  .lesson-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 0.86rem; border-bottom: 1px solid var(--line-soft);
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-date { color: var(--ink-dim); }
  .lesson-status { font-size: 0.74rem; font-weight: 550; }
  .lesson-status.completed { color: var(--accent); }
  .lesson-status.scheduled { color: var(--gold); }
  .lesson-status.missed { color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 90px; padding: 11px 13px; border-radius: var(--r-md); border: none;
    font-size: 0.83rem; font-weight: 650; cursor: pointer; text-align: center;
    text-decoration: none; color: white; font-family: inherit;
    transition: transform .16s var(--ease), filter .16s var(--ease), background .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.96); }
  @media (hover:hover) { .btn:hover { filter: brightness(1.06); } }
  .btn:disabled { opacity: .5; cursor: default; transform: none; filter: none; }
  .btn.whatsapp { background: #25D366; color: #07300f; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  .btn.notes { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .btn.more  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }
  .btn.edit  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }

  /* ── Needs attention ── */
  .attn {
    background: var(--warn-light); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    border-radius: var(--r-lg); padding: 13px 15px; margin-bottom: 12px;
    box-shadow: var(--sh-1);
  }
  .attn-title {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em;
    font-weight: 700; color: var(--warn); margin-bottom: 8px;
  }
  .attn-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; font-size: 0.85rem; cursor: pointer; color: var(--ink);
    border-radius: 6px; transition: background .15s var(--ease);
  }
  .attn-item:active { background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .attn-why { font-size: 0.74rem; color: var(--warn); font-weight: 600; white-space: nowrap; }

  /* ── Recent past paper ── */
  @keyframes sparkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50%      { transform: scale(1.22) rotate(9deg); opacity: .82; }
  }
  .sparkle { display: inline-block; animation: sparkle 2.4s ease-in-out infinite; font-size: 0.92rem; }
  @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
  .paper-chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--accent-light); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); border-radius: var(--r-sm); padding: 6px 10px;
    font-size: 0.75rem; font-weight: 600; margin-top: 8px;
  }
  .paper-chip b { font-size: 0.9rem; font-weight: 750; }

  /* ── Revenue trend ── */
  .rev-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .rev-month { font-size: 0.75rem; color: var(--muted); width: 54px; flex-shrink: 0; }
  .rev-track { flex: 1; height: 22px; background: var(--card-2); border-radius: 6px; overflow: hidden; }
  .rev-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .5s var(--ease);
  }
  .rev-val { font-size: 0.78rem; font-weight: 650; width: 62px; text-align: right; flex-shrink: 0; }
  .notes-box {
    font-size: 0.84rem; color: var(--ink-dim); background: var(--card-2);
    padding: 10px 12px; border-radius: 8px; margin-top: 8px; line-height: 1.5;
    border: 1px solid var(--line); display: none;
  }
  .notes-box.visible { display: block; }
  .empty   { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
  .loading { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 0.88rem; letter-spacing: 0.04em; }

  /* ── Modals ── */
  @keyframes overlayIn  { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,0.5); } }
  @keyframes overlayOut { from { background: rgba(0,0,0,0.5); } to { background: rgba(0,0,0,0); } }
  @keyframes sheetUp    { from { transform: translateY(48px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes sheetDown  { from { transform: translateY(0); opacity: 1; } to { transform: translateY(52px); opacity: 0; } }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; animation: overlayIn 0.2s ease forwards;
  }
  /* Closing needs its own state because React unmounts instantly otherwise —
     the sheet would vanish with no exit animation at all. */
  .overlay.closing { animation: overlayOut 0.2s ease forwards; }
  .sheet {
    background: var(--card); border: 1px solid var(--line);
    width: 100%; max-width: 720px; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 90vh; overflow-y: auto; overflow-x: hidden;
    animation: sheetUp 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .sheet.closing { animation: sheetDown 0.2s cubic-bezier(0.4,0,1,1) forwards; }
  .sheet h2 { font-size: 1.05rem; margin: 0 0 16px; color: var(--ink); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.68rem; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field input[type="email"], .field input[type="password"], .field select, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: var(--r-md); font-size: 0.95rem; font-family: inherit;
    background: var(--card-2); color: var(--ink);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--card);
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .field textarea { min-height: 70px; resize: vertical; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn.cancel { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; padding: 10px 18px; }
  .btn.save   { background: var(--accent); color: white; }
  .session-list { margin: 10px 0; }
  .session-pick-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; color: var(--ink-dim);
  }
  .session-pick-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .tools-menu { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
  .tools-menu button {
    text-align: left; padding: 14px 15px; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--card-2); font-size: 0.88rem;
    cursor: pointer; color: var(--ink); font-family: inherit; font-weight: 550;
    transition: background .16s var(--ease), transform .16s var(--ease), border-color .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .tools-menu button:active { transform: scale(.985); background: var(--card-3); }
  @media (hover:hover) { .tools-menu button:hover { border-color: var(--accent); background: var(--card-3); } }

  /* ── Global tools button ── */
  /* Centred with auto margins rather than translateX(-50%): a transform on a
     fixed element gives iOS a compositing layer it mispositions during
     momentum scrolling, which is what made this drift up the screen. */
  .global-tools-btn {
    position: fixed;
    left: 0; right: 0; margin-inline: auto; width: fit-content;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); border: none; border-radius: var(--r-xl);
    padding: 13px 28px; font-size: 0.86rem; font-weight: 700; cursor: pointer;
    box-shadow: var(--sh-3); z-index: 50; white-space: nowrap;
    font-family: inherit; letter-spacing: 0.01em;
    transition: transform .2s var(--ease-spring), box-shadow .2s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .global-tools-btn:active { transform: scale(.94); }
  @media (hover:hover) { .global-tools-btn:hover { transform: translateY(-2px); } }

  /* ── Growth calculator ── */
  .calc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; font-size: 0.82rem; }
  .calc-grid-cell { padding: 7px 4px; border-top: 1px solid var(--line); color: var(--ink-dim); }
  .calc-grid-head { padding: 0 4px 7px; font-size: 0.67rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  /* ── Perspective items ── */
  .perspective-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .perspective-item {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card-2); font-size: 0.82rem;
  }
  .perspective-item .emoji { font-size: 1.4rem; display: block; margin-bottom: 4px; }
  .perspective-item .name { font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .perspective-item .count { font-size: 1.8rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
  .perspective-item .per-year { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

  /* ── Free lesson button ── */
  .free-btn {
    font-size: 0.65rem; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--line); cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .free-btn.active   { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .free-btn.inactive { background: var(--card-2); color: var(--muted); }

  /* ── Version tag ── */
  .version-tag { text-align: center; color: var(--ink); font-size: 0.88rem; font-weight: 600; padding: 60px 0 8px; letter-spacing: 0.05em; }

  /* ── Month group ── */
  .month-hdr {
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .month-hdr:active { opacity:0.7; }
  .month-chevron { font-size:0.9rem; color:var(--muted); display:inline-block; transition:transform 0.2s; }
  /* Rows are tappable on mobile and clickable on desktop.
     Inset via box-shadow so the highlight never shifts layout. */
  .lesson-row, .pay-row { cursor:pointer; border-radius:6px; transition: box-shadow 0.15s, background 0.15s; }
  .lesson-row:active, .pay-row:active { background:var(--card-2); box-shadow:0 0 0 4px var(--card-2); }
  @media (hover:hover) {
    .lesson-row:hover, .pay-row:hover { background:var(--card-2); box-shadow:0 0 0 4px var(--card-2); }
    .month-hdr:hover { opacity:0.75; }
  }
  .lesson-row .chev, .pay-row .chev { color:var(--muted); font-size:0.85rem; margin-left:8px; opacity:0; transition:opacity 0.15s; }
  @media (hover:hover) { .lesson-row:hover .chev, .pay-row:hover .chev { opacity:1; } }

  /* Payments */
  .pay-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; font-size:0.86rem; border-bottom:1px solid var(--line);
  }
  .pay-row:last-child { border-bottom:none; }
  .pay-method {

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://uilytgubukiinyrqrltj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WK5p8tUAsNLEqnmxVT7Eag_2EVNbi7V';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    // Keep the session in localStorage and refresh it silently, so signing in
    // is a rare event rather than something to do every visit.
    persistSession: true,
    autoRefreshToken: true,
    // The magic link comes back with tokens in the URL fragment; let the
    // client consume them and then tidy the address bar.
    detectSessionInUrl: true,

function daysBetween(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function currentSchoolYear(baseYear, asOfDate) {
  if (baseYear == null || !asOfDate) return null;
  const ref = new Date(asOfDate);
  const now = new Date();
  let bumps = 0;
  let cursor = new Date(ref.getFullYear(), 7, 1); // 1 August of ref's year
  if (ref >= cursor) cursor.setFullYear(cursor.getFullYear() + 1);
  while (cursor <= now) {
    bumps++;
    cursor.setFullYear(cursor.getFullYear() + 1);
  }
  return Math.min(baseYear + bumps, 13);
}

const PRESET_BOARDS = ['Edexcel', 'AQA', 'Edexcel IGCSE', 'OCR'];

// A paper done in the last week earns a sparkle on the card. Written nightly
// from the student's own tracker sheet by the Apps Script.
function recentPaper(student, withinDays = 7) {
  if (!student.last_paper_date) return null;
  const done = new Date(student.last_paper_date + 'T12:00:00');
  const days = Math.floor((Date.now() - done) / 86400000);
  if (days < 0 || days > withinDays) return null;
  return {
    days,
    score: student.last_paper_score,
    name: student.last_paper_name,
    label: days === 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`,
  };
}

// Set once per render from App. Faking is applied at the RATE level rather
// than at each place a number is printed, because rates are what every other
// figure is computed from — fake the rate and the balances, totals and
// statements all come out consistent for free. Masking at print time instead
// produced totals that didn't add up to their own rows.
let PRIVACY_MONEY_MODE = 'normal';

// The rate in effect on a given date. Rates dated in the future are ignored
// until that date arrives, so a September rise doesn't affect today's figures.
// Ties on effective_from_date are broken by created_at, so the most recent
// edit always wins rather than whichever row happened to sort first.
function getRateOnDateReal(studentId, rateHistory, dateStr, fallback = 90) {
  const rows = (rateHistory || [])
    .filter(r => r.student_id === studentId && r.effective_from_date <= dateStr)
    .sort((a, b) => {
      const byDate = b.effective_from_date.localeCompare(a.effective_from_date);
      if (byDate !== 0) return byDate;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  return rows.length > 0 ? parseFloat(rows[0].rate) : fallback;
}

function getRateOnDate(studentId, rateHistory, dateStr, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(studentId);
  return getRateOnDateReal(studentId, rateHistory, dateStr, fallback);
}

function getCurrentRate(studentId, rateHistory, fallback = 90) {
  return getRateOnDate(studentId, rateHistory, new Date().toISOString().slice(0, 10), fallback);
}

// What a lesson is worth. An explicit rate_charged is a manual override and
// always wins; otherwise it's the rate that applied on the day it was taught,
// so past lessons keep their old price when you put rates up.
function rateForLesson(lesson, rateHistory, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(lesson.student_id);
  if (lesson.rate_charged !== null && lesson.rate_charged !== undefined && lesson.rate_charged !== '') {
    return parseFloat(lesson.rate_charged);
  }
  return getRateOnDateReal(lesson.student_id, rateHistory, lesson.lesson_date, fallback);
}

// Payments and allocations come out of the database as real amounts. In fake
// mode they're scaled by the same ratio the student's rate was faked by, so a
// payment still covers exactly the number of lessons it really covered.
function moneyScaleFor(studentId, rateHistory) {
  if (PRIVACY_MONEY_MODE !== 'dummy') return 1;
  const real = getRateOnDateReal(studentId, rateHistory, new Date().toISOString().slice(0, 10));
  if (!real) return 1;
  return dummyRateFor(studentId) / real;
}

// ---------- Privacy (show / hide / fake, for money and names independently) ----------
// Modes: 'normal' (real data), 'hidden' (fixed-width mask, reveals nothing —
// not even digit count), 'dummy' (plausible fake, stable per element so it
// doesn't flicker between renders or make totals look inconsistent).
//
// Deliberately scoped to DISPLAY ONLY. Nothing that feeds an editable form
// field or a "Copy as text" meant for a parent ever goes through these — a
// demo mode must never risk writing a fake number into the real books, or
// sending a parent a fake balance.
const PrivacyContext = React.createContext({ moneyMode: 'normal', nameMode: 'normal' });
function usePrivacy() { return React.useContext(PrivacyContext); }

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Students become "The Lazy One"; whoever pays for them becomes "The Big Lazy
// One", so the family link is obvious on screen without naming anybody.
const DUMMY_TRAITS = [
  'Lazy','Slow','Smart','Keen','Chatty','Sleepy','Quick','Grumpy',
  'Cheery','Fussy','Bright','Dreamy','Chaotic','Sharp','Sulky','Bouncy',
];

function dummyTraitFor(seedKey) {
  return DUMMY_TRAITS[hashStr(String(seedKey) + ':trait') % DUMMY_TRAITS.length];
}

function dummyNameFor(seedKey) {
  return `The ${dummyTraitFor(seedKey)} One`;
}

// The payer of a given student — same trait, "Big" added.
function dummyPayerNameFor(seedKey) {
  return `The Big ${dummyTraitFor(seedKey)} One`;
}

function hiddenNameFor(seedKey) {
  return `Student ${1000 + (hashStr(String(seedKey)) % 9000)}`;
}

// Session rates in fake mode land on £35-£75 in £5 steps: a believable
// tutoring rate, round like a real one, and nowhere near the real figure.
function dummyRateFor(studentId) {
  return 35 + (hashStr(String(studentId) + ':rate35') % 9) * 5;
}

// Stand-ins for the other identifying fields on the edit form. 07700 900xxx is
// Ofcom's reserved drama/fiction range, so it can never be a real number.
const DUMMY_STREETS = ['Elm','Oak','Ash','Cedar','Maple','Birch','Willow','Hazel'];
const DUMMY_SCHOOLS = ['Northgate High','Kingsway Academy','Parkview School','Beechwood High','Riverside College'];

function dummyPhoneFor(seed) {
  return '07700 900' + String(100 + hashStr(String(seed) + ':ph') % 900);
}
function dummyAddressFor(seed) {
  const n = 1 + hashStr(String(seed) + ':hn') % 98;
  return `${n} ${DUMMY_STREETS[hashStr(String(seed) + ':st') % DUMMY_STREETS.length]} Road`;
}
function dummySchoolFor(seed) {
  return DUMMY_SCHOOLS[hashStr(String(seed) + ':sch') % DUMMY_SCHOOLS.length];
}

const HIDDEN_TEXT_MASK = '•••••';

const HIDDEN_MONEY_MASK = '£•••';

// Money display. By the time a number reaches here it is ALREADY correct for
// the current mode — rates are faked at source and payments are pre-scaled by
// moneyScaleFor — so fake mode just formats. Only hidden mode substitutes,
// with a fixed-width mask so a £45 and a £100 look identical.
function useMoney() {
  const { moneyMode } = usePrivacy();
  return (value, _seedKey, formatter) => {
    const fmt = formatter || (n => `£${Number(n).toFixed(2).replace(/\.00$/, '')}`);
    if (moneyMode === 'hidden') return HIDDEN_MONEY_MASK;
    return fmt(value);
  };
}

// For amounts that arrive already real and have no student to scale against —
// chiefly unmatched Monzo transfers, which come straight off the bank API. Fake
// mode substitutes a plausible transfer: one to four sessions at a fake rate.
function useRawMoney() {
  const { moneyMode } = usePrivacy();
  return (real, seedKey) => {
    if (moneyMode === 'hidden') return HIDDEN_MONEY_MASK;
    if (moneyMode === 'dummy') {
      const h = hashStr(String(seedKey ?? real));
      const sessions = 1 + (h % 4);
      return `£${((35 + (h % 9) * 5) * sessions).toFixed(2).replace(/\.00$/, '')}`;
    }
    return `£${Number(real).toFixed(2).replace(/\.00$/, '')}`;
  };
}

// Name display wrapper. seedKey should be the student's id so the same
// person shows the same fake/hidden label everywhere on screen.
function useNameDisplay() {
  const { nameMode } = usePrivacy();
  return (real, seedKey, isPayer) => {
    if (nameMode === 'hidden') return isPayer ? 'Payer' : hiddenNameFor(seedKey ?? real);
    if (nameMode === 'dummy') {
      return isPayer ? dummyPayerNameFor(seedKey ?? real) : dummyNameFor(seedKey ?? real);
    }
    return real;
  };
}

// One physical switch with three detents: fake (left) — real (middle) —
// hidden (right). The knob slides; tapping a third of the track jumps to it.
const TRI_GLYPH = { dummy: '≈', normal: '✓', hidden: '✕' };
const TRI_WORD  = { dummy: 'Showing fake data', normal: 'Showing real data', hidden: 'Hidden' };

function PrivacyToggle3({ title, sub, value, onChange }) {

}

// ---------- Animated sheet close ----------
// React unmounts instantly, so sheets previously blinked out of existence with
// no exit animation. This keeps the sheet mounted for the length of the close
// animation, then calls the real onClose. Returns the class suffix to apply to
// .overlay/.sheet, plus the close function to use everywhere instead of
// onClose — including internal Close/Cancel buttons, or those would still snap.
function useAnimatedClose(onClose) {
  const [closing, setClosing] = useState(false);
  const timer = React.useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);

  const close = React.useCallback(() => {
    setClosing(prev => {
      if (prev) return prev;               // already closing; ignore repeats
      timer.current = setTimeout(onClose, 200);
      return true;
    });
  }, [onClose]);

  return [closing ? ' closing' : '', close];
}

// ---------- Toggle ----------
function Toggle({ checked, onChange, label }) {
  return (
    <div className="toggle-wrap" onClick={() => onChange(!checked)}>

        <div className="toggle-thumb" />

      {label && <span className="toggle-label">{label}</span>}
    </div>

}

// ---------- Summary Widget ----------
function SummaryWidget({ students, rateHistory }) {
  const M = useMoney();
  const active = students.filter(s => s.active);

  const weeklyNet = active.reduce((sum, s) => {
    const rate = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? rate : rate * 0.6);
  }, 0);
  const annualNet = weeklyNet * 40;
  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;

  const SEP_TARGET = 10;
  const FULL_TARGET = 15;
  const awayFromSep = Math.max(0, SEP_TARGET - active.length);
  const awayFromFull = Math.max(0, FULL_TARGET - active.length);

  const stats = [
    { label: 'students', value: active.length,  accent: false },
    { label: 'net/week', value: M(weeklyNet, 'summary-week', fmt),  accent: true  },
    { label: 'net/year', value: M(annualNet, 'summary-year', fmt),  accent: true  },
  ];

  return (
    <div className="summary-widget" style={{
      background:'linear-gradient(165deg, var(--card) 0%, var(--card-2) 100%)',

    }}>
      {/* Hairline of colour rather than a heavy 3px slab across the top. */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:3,
        background:'linear-gradient(90deg, var(--gold), var(--accent-2))'}} />
      {/* Stats row */}
      {active.length > 0 && (
        <div style={{display:'flex',gap:0,flexWrap:'wrap',marginBottom:16,paddingBottom:15,borderBottom:'1px solid var(--line)'}}>
          {stats.map(({label, value, accent}) => (
            <div key={label} style={{flex:'1 1 70px',minWidth:60}}>
              <div style={{fontSize:'1.95rem',fontWeight:750,color:accent?'var(--gold)':'var(--ink)',letterSpacing:'-0.035em',lineHeight:1}}>{value}</div>
              <div style={{fontSize:'0.66rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em',marginTop:4}}>{label}</div>
            </div>
          ))}
        </div>
      )}
      {/* Goal tracker */}
      <div style={{fontSize:'0.66rem',textTransform:'uppercase',letterSpacing:'0.08em',color:'var(--muted)',marginBottom:10,fontWeight:600}}>Goal</div>
      <div style={{marginBottom:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <span style={{fontSize:'0.82rem',color:'var(--ink-dim)'}}>10 by September</span>
          <span style={{fontSize:'0.78rem',fontWeight:600,color:awayFromSep===0?'var(--accent)':'var(--muted)'}}>
            {awayFromSep===0?'✓ reached':`${active.length} / ${SEP_TARGET}`}
          </span>
        </div>
        <div style={{background:'var(--card-2)',borderRadius:4,height:5,border:'1px solid var(--line)'}}>
          <div style={{background:'var(--accent)',width:`${Math.min(active.length/SEP_TARGET,1)*100}%`,height:'100%',borderRadius:4,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}></div>
        </div>
      </div>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <span style={{fontSize:'0.82rem',color:'var(--ink-dim)'}}>15 fully booked</span>
          <span style={{fontSize:'0.78rem',fontWeight:600,color:awayFromFull===0?'var(--gold)':'var(--muted)'}}>
            {awayFromFull===0?'🎉 fully booked!':`${active.length} / ${FULL_TARGET}`}
          </span>
        </div>
        <div style={{background:'var(--card-2)',borderRadius:4,height:5,border:'1px solid var(--line)'}}>
          <div style={{background:'var(--gold)',opacity:awayFromFull===0?1:0.55,width:`${Math.min(active.length/FULL_TARGET,1)*100}%`,height:'100%',borderRadius:4,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}></div>
        </div>
      </div>
    </div>

}

// "£81" rather than "£81.00", but "£81.50" kept intact — pennies only appear
// when there actually are any. Matches how amounts already read everywhere
// else in the app; the messages sent to parents were the one place still
// showing a trailing .00.
function moneyText(n) {
  return `£${Number(n).toFixed(2).replace(/\.00$/, '')}`;
}

function normaliseUKPhone(raw) {
  const digits = (raw || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('44')) return digits;
  if (digits.startsWith('0')) return '44' + digits.slice(1);
  return '44' + digits;
}

// ---------- Growth Calculator ----------
function GrowthCalculator({ students, rateHistory, extra, setExtra, extraRate, setExtraRate, extraCash, setExtraCash }) {
  const active = students.filter(s => s.active);
  const avgRate = active.length > 0
    ? Math.round(active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0) / active.length)
    : 90;

  // Use passed props, or init with defaults if not provided
  const e = extra !== undefined ? extra : 4;
  const er = extraRate !== undefined ? extraRate : avgRate;
  const ec = extraCash !== undefined ? extraCash : false;

  const setE = setExtra || (() => {});
  const setER = setExtraRate || (() => {});
  const setEC = setExtraCash || (() => {});

  const currGrossW = active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0);
  const currNetW   = active.reduce((sum, s) => {
    const r = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? r : r * 0.6);
  }, 0);
  const addGrossW = e * er;
  const addNetW   = e * er * (ec ? 1 : 0.6);

  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;
  const M = useMoney();

  const rows = [
    { label: 'Students',  curr: active.length,    add: e,      isCount: true },
    { label: 'Gross/wk', curr: currGrossW,        add: addGrossW  },
    { label: 'Net/wk',   curr: currNetW,          add: addNetW    },
    { label: 'Gross/yr', curr: currGrossW * 40,   add: addGrossW * 40 },
    { label: 'Net/yr',   curr: currNetW * 40,     add: addNetW * 40   },
  ];

  return (
    <div>
      <div style={{display:'flex', gap:10, marginBottom:12}}>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Extra students</label>
          <input type="number" min="1" value={e} onChange={ev => setE(parseInt(ev.target.value)||1)} />
        </div>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Rate £/session</label>
          <input type="number" min="0" step="5" value={er} onChange={ev => setER(parseInt(ev.target.value)||0)} />
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <Toggle checked={ec} onChange={setEC} label="Pay in cash" />
      </div>
      <div className="calc-grid">
        <div className="calc-grid-head"></div>
        <div className="calc-grid-head">Now</div>
        <div className="calc-grid-head">+{e} more</div>
        <div className="calc-grid-head">New total</div>
        {rows.map(({ label, curr, add, isCount }) => (
          <React.Fragment key={label}>
            <div className="calc-grid-cell" style={{color:'var(--muted)'}}>{label}</div>
            <div className="calc-grid-cell">{isCount ? curr : M(curr, `growth-curr-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{color:'var(--accent)'}}>+{isCount ? add : M(add, `growth-add-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{fontWeight:600}}>{isCount ? curr+add : M(curr+add, `growth-total-${label}`, fmt)}</div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

// ---------- Google Calendar ----------
// Self-serve, per-account: unlike the old Apps Script (Daniel's own Google
// login, manually edited to add each new tutor), any signed-in user connects
// their own calendar here with no one else's involvement. All calls carry
// the caller's own Supabase session, and the sync Edge Function only ever
// touches that same account's rows — see google-calendar-connect's comments
// for how the OAuth state param prevents this being spoofable.
// Best-effort strip of the generic lesson-y words tutors tend to put in
// calendar titles alongside a student's name — never trusted outright, just
// a starting guess the tutor confirms or overrides with one tap.
const CALENDAR_TITLE_STOPWORDS = new Set([
  'maths', 'math', 'lesson', 'lessons', 'tutoring', 'tutor', 'session', 'call',
  'zoom', 'catchup', 'catch', 'up', 'revision', 'gcse', 'gcses', 'alevel', 'a',
  'level', 'class', 'meeting', 'online', 'with', 'and', 'the', 'exam',
]);
function guessStudentName(title) {
  const cleaned = title.replace(/[-–—:|()]/g, ' ').replace(/\s+/g, ' ').trim();
  const kept = cleaned.split(' ').filter(w => {
    const key = w.toLowerCase().replace(/[^a-z0-9]/g, '');
    return key && !CALENDAR_TITLE_STOPWORDS.has(key);
  });
  return kept.join(' ').trim() || title.trim();
}

function GoogleCalendarPanel({ session, onDataChanged }) {
  const [status, setStatus] = useState(null);
  const [calendars, setCalendars] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [unmatched, setUnmatched] = useState([]);
  const [confirmingTitles, setConfirmingTitles] = useState({});
  const [editingTitles, setEditingTitles] = useState({});
  const [editedNames, setEditedNames] = useState({});

  async function authedFetch(path, opts = {}) {
    const token = session?.access_token;
    return fetch(`${FN_BASE}/${path}`, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
    }).then(r => r.json());
  }

  useEffect(() => { refresh(); }, []);

  async function refresh() {
    setStatus(null);
    const s = await authedFetch('google-calendar-status').catch(e => ({ ok: false, problem: String(e) }));
    setStatus(s);
    if (s.connected && !s.calendar_chosen) {
      const l = await authedFetch('google-calendar-list').catch(() => null);
      setCalendars(l?.calendars || []);
    } else {
      setCalendars(null);
    }
  }

  async function connect() {
    setBusy(true);
    // Tell the callback which domain to come back to. It's checked against an
    // allowlist server-side, so this can't be used to bounce anyone elsewhere.
    const back = encodeURIComponent(window.location.origin + window.location.pathname);
    const r = await authedFetch(`google-calendar-connect?return_to=${back}`).catch(e => ({ ok: false, problem: String(e) }));
    setBusy(false);
    if (r.ok && r.authorize_url) window.location.href = r.authorize_url;
    else setMsg('Could not start the connection — try again.');
  }

  async function pick(cal) {
    setBusy(true);
    await authedFetch('google-calendar-select', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ calendar_id: cal.id, calendar_summary: cal.summary }),
    });
    setBusy(false);
    refresh();
  }

  async function syncNow() {
    setBusy(true); setMsg(null);
    const r = await authedFetch('google-calendar-sync').catch(e => ({ ok: false, problem: String(e) }));
    setBusy(false);
    const mine = r.results?.[0];
    setMsg(r.ok && mine?.ok
      ? `Synced ${mine.synced} lesson${mine.synced === 1 ? '' : 's'}, matched against ${mine.students_matched} student${mine.students_matched === 1 ? '' : 's'}.`
      : `Problem: ${mine?.problem || r.problem || 'unknown'}`);
    setUnmatched(mine?.unmatched_titles || []);
    refresh();
  }

  // Quick path for onboarding: turn a recurring calendar event nobody's
  // claimed yet straight into a student, using the event title itself as
  // both the name and the match pattern, then re-sync so their lessons
  // land immediately instead of waiting for the next tap of "Sync now".
  async function addStudentFromTitle(title) {
    setBusy(true);
    const ownerId = (await supabase.auth.getUser()).data.user?.id;
    await supabase.from('tutoring_students').insert({
      name: title.trim().slice(0, 80),
      calendar_title_pattern: title,
      active: true,
      owner_id: ownerId,
    });
    onDataChanged?.();
    await syncNow();
  }

  async function disconnect() {
    setBusy(true);
    await authedFetch('google-calendar-disconnect', { method: 'POST' });
    setBusy(false);
    refresh();
  }

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderRadius:10,
        background:'var(--card-2)', border:'1px solid var(--line)', marginBottom:12, fontSize:'0.85rem'
      }}>
        <span style={{
          width:9, height:9, borderRadius:5, flexShrink:0,
          background: status === null ? 'var(--muted)' : status.connected ? 'var(--accent)' : 'var(--warn)'
        }} />
        <span style={{flex:1}}>
          {status === null ? 'Checking…'
            : status.connected && status.calendar_chosen ? `Connected · ${status.calendar_summary}`
            : status.connected ? 'Connected — pick a calendar below'
            : 'Not connected'}
        </span>
      </div>

      {!status?.connected && (
        <>
          <button className="btn save" style={{width:'100%'}} onClick={connect} disabled={busy || status === null}>
            {busy ? 'Opening Google…' : '📅 Connect Google Calendar'}
          </button>
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginTop:10, lineHeight:1.45}}>
            Google will ask you to approve read-only access to your calendars.
            Nothing is shared with anyone else — this connects only your own account.
          </div>
        </>
      )}

      {status?.connected && !status.calendar_chosen && (
        <>
          <div className="section-label">Which calendar has your lessons?</div>
          {calendars === null && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Loading your calendars…</div>}
          {calendars?.length === 0 && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>No calendars found on that Google account.</div>}
          {calendars?.map(c => (
            <button key={c.id} style={{
              display:'block', width:'100%', textAlign:'left', padding:'12px 14px', marginBottom:7,
              borderRadius:'var(--r-md)', border:'1px solid var(--line)', background:'var(--card-2)',
              fontSize:'0.88rem', cursor:'pointer', fontFamily:'inherit', color:'var(--ink)'
            }} disabled={busy} onClick={() => pick(c)}>
              {c.summary}{c.primary ? ' (main calendar)' : ''}
            </button>
          ))}
        </>
      )}

      {status?.connected && status.calendar_chosen && (
        <>
          <button className="btn save" style={{width:'100%', marginBottom:8}} onClick={syncNow} disabled={busy}>
            {busy ? 'Syncing…' : '↻ Sync now'}
          </button>
          {msg && <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10}}>{msg}</div>}
          {unmatched.length > 0 && (
            <div style={{marginBottom:14}}>
              <div className="section-label">
                {unmatched.length} name{unmatched.length === 1 ? '' : 's'} in your calendar aren't a student yet
              </div>
              {unmatched.map(u => {
                const guess = guessStudentName(u.title);
                return (
                  <div key={u.title} style={{
                    padding:'9px 12px', marginBottom:6,
                    borderRadius:'var(--r-md)', border:'1px solid var(--line)', background:'var(--card-2)',
                  }}>
                    {editingTitles[u.title] ? (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <input type="text" value={editedNames[u.title] ?? guess} autoFocus
                          onChange={e => setEditedNames({...editedNames, [u.title]: e.target.value})}
                          style={{flex:1, fontSize:'0.85rem', padding:'6px 8px', borderRadius:8, border:'1px solid var(--line)', fontFamily:'inherit'}} />
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => addStudentFromTitle((editedNames[u.title] ?? guess).trim())}>
                          + Add
                        </button>
                      </div>
                    ) : confirmingTitles[u.title] ? (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <span style={{flex:1, fontSize:'0.85rem'}}>
                          Is their name <b>{guess}</b>? <span style={{color:'var(--muted)'}}>× {u.count}</span>
                        </span>
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => addStudentFromTitle(guess)}>
                          Yes
                        </button>
                        <button className="btn cancel" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0, minWidth:'auto'}}
                          disabled={busy} onClick={() => setEditingTitles({...editingTitles, [u.title]: true})}>
                          No
                        </button>
                      </div>
                    ) : (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <span style={{flex:1, fontSize:'0.85rem'}}>
                          {u.title} <span style={{color:'var(--muted)'}}>× {u.count}</span>
                        </span>
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => setConfirmingTitles({...confirmingTitles, [u.title]: true})}>
                          Add student
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{fontSize:'0.78rem', color:'var(--muted)', lineHeight:1.45}}>
                The guess strips out common words like "maths" or "lesson" — say no if it's wrong
                and type the real one. Pulls their lessons in straight away, then you can fill in
                their details on their card.
              </div>
            </div>
          )}
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:14, lineHeight:1.5}}>
            Also syncs automatically overnight. Matches events whose title
            contains a student's "name in your calendar" (set on their profile),
            same as before — nothing to reconfigure there.
            {status.last_synced_at && (
              <> Last automatic sync: {new Date(status.last_synced_at).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}.</>
            )}
          </div>
          {status.last_sync_error && (
            <div style={{fontSize:'0.78rem', color:'var(--warn)', marginBottom:14}}>
              Last sync had a problem: {status.last_sync_error}
            </div>
          )}
          <button className="btn cancel" style={{width:'100%'}} onClick={disconnect} disabled={busy}>
            Disconnect
          </button>
        </>
      )}
    </div>
  );
}

// ---------- Monzo ----------
const FN_BASE = 'https://uilytgubukiinyrqrltj.supabase.co/functions/v1';

function MonzoPanel({ students, onDataChanged }) {
  const M = useRawMoney();
  const N = useNameDisplay();
  const nameModeIsNormal = usePrivacy().nameMode === 'normal';
  const [status, setStatus] = useState(null);
  const [pending, setPending] = useState(null);
  const [blocked, setBlocked] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [working, setWorking] = useState({});

  const activeStudents = students.filter(s => s.active);

  useEffect(() => { refresh(); }, []);

  async function refresh() {
    setPending(null);
    try {
      const s = await fetch(`${FN_BASE}/monzo-status`).then(r => r.json());
      setStatus(s);
      const p = await fetch(`${FN_BASE}/monzo-review`).then(r => r.json());
      setPending(p.pending || []);
      setBlocked(p.blocked || []);
    } catch (e) {
      setStatus({ connected: false, problem: String(e) });
      setPending([]);
    }
  }

  async function unblock(key) {
    setBlocked(b => b.filter(x => x.key !== key));
    await fetch(`${FN_BASE}/monzo-review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ unblock_key: key }),
    });
    refresh();
  }

  async function syncNow() {
    setBusy(true); setMsg(null);
    try {
      const r = await fetch(`${FN_BASE}/monzo-sync`).then(r => r.json());
      setMsg(r.ok
        ? `Logged ${r.newly_logged} new payment${r.newly_logged === 1 ? '' : 's'}.`
        : `Problem: ${r.problem}`);
      if (r.ok) onDataChanged();
    } catch { setMsg('Sync failed — check your connection.'); }
    setBusy(false);
    refresh();
  }

  async function act(txId, body) {
    setWorking(w => ({ ...w, [txId]: true }));
    try {
      await fetch(`${FN_BASE}/monzo-review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: txId, ...body }),
      });
      setPending(p => p.filter(x => x.transaction_id !== txId));
      if (body.student_id) onDataChanged();
    } finally {
      setWorking(w => ({ ...w, [txId]: false }));
    }
  }

  const connected = status?.connected && status?.data_access_approved;

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderRadius:10,
        background:'var(--card-2)', border:'1px solid var(--line)', marginBottom:12, fontSize:'0.85rem'
      }}>
        <span style={{
          width:9, height:9, borderRadius:5, flexShrink:0,
          background: status === null ? 'var(--muted)' : connected ? 'var(--accent)' : 'var(--warn)'
        }} />
        <span style={{flex:1}}>
          {status === null ? 'Checking…'
            : connected ? 'Connected to Monzo'
            : status?.connected ? 'Connected, but data access not approved in the Monzo app'
            : 'Not connected'}
        </span>
        {!connected && status !== null && (
          <a href={`${FN_BASE}/monzo-connect`} style={{
            fontSize:'0.78rem', fontWeight:600, color:'var(--accent)', textDecoration:'none'
          }}>Reconnect →</a>
        )}
      </div>

      <button className="btn save" style={{width:'100%', marginBottom:6}} onClick={syncNow} disabled={busy}>
        {busy ? 'Checking Monzo…' : '↻ Sync payments now'}
      </button>
      {msg && <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10}}>{msg}</div>}

      <div className="section-label" style={{marginTop:16}}>
        Unrecognised transfers{pending ? ` (${pending.length})` : ''}
      </div>
      <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:10, lineHeight:1.45}}>
        Money that came in but doesn't match a student. Assign one and every future
        transfer from that account is logged automatically; "Never tutoring" hides
        that payer for good. Read live from Monzo — nothing is stored unless you
        assign it.
      </div>

      {pending === null && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Loading…</div>}
      {pending?.length === 0 && (
        <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Nothing waiting — all caught up.</div>
      )}

      {pending?.map(t => (
        <div key={t.transaction_id} style={{
          padding:'10px 0', borderBottom:'1px solid var(--line)',
          opacity: working[t.transaction_id] ? 0.45 : 1
        }}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:10}}>
            <span style={{fontWeight:600, fontSize:'0.9rem'}}>{N(t.from || 'Unknown sender', t.from || 'unknown-sender', true)}</span>
            <span style={{fontWeight:700, fontSize:'0.95rem'}}>{M(t.amount, t.transaction_id)}</span>
          </div>
          <div style={{fontSize:'0.75rem', color:'var(--muted)', marginTop:2}}>
            {new Date(t.date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}
            {/* Free-text bank reference can contain a name, so it's hidden
                entirely rather than shown in privacy mode — there's no safe
                way to partially redact arbitrary text. */}
            {nameModeIsNormal && t.reference && t.reference !== t.from ? ` · ${t.reference}` : ''}
          </div>
          <div style={{display:'flex', gap:6, marginTop:8}}>
            <select
              value=""
              disabled={working[t.transaction_id]}
              onChange={e => e.target.value && act(t.transaction_id, { student_id: e.target.value })}
              style={{flex:1, fontSize:'0.82rem', padding:'7px 8px'}}
            >
              <option value="">Assign to student…</option>
              {activeStudents.map(s => <option key={s.id} value={s.id}>{N(s.name, s.id)}</option>)}
            </select>
            <button
              className="btn cancel"
              style={{flex:'0 0 auto', minWidth:'auto', padding:'7px 12px', fontSize:'0.8rem'}}
              disabled={working[t.transaction_id]}
              title={`Never ask about money from ${t.from || 'this payer'} again`}
              onClick={() => act(t.transaction_id, { dismiss: true })}
            >Never tutoring</button>
          </div>
        </div>
      ))}

      {blocked.length > 0 && (
        <>
          <div className="section-label" style={{marginTop:20}}>
            Never tutoring · {blocked.length}
          </div>
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:8, lineHeight:1.45}}>
            Money from these accounts is skipped without asking.
          </div>
          {blocked.map(b => (
            <div key={b.key} style={{
              display:'flex', justifyContent:'space-between', alignItems:'center',
              padding:'8px 0', borderBottom:'1px solid var(--line-soft)', fontSize:'0.85rem'
            }}>
              <span>{N(b.name || 'Unnamed account', b.key, true)}</span>
              <button
                className="btn cancel"
                style={{flex:'0 0 auto', minWidth:'auto', padding:'5px 11px', fontSize:'0.76rem'}}
                onClick={() => unblock(b.key)}
              >Unblock</button>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ---------- Sign in ----------
// Email and password, in a real <form> with the right autocomplete hints so a
// password manager offers to fill and save it. There is deliberately no
// sign-up here: the account is created once in the Supabase dashboard, so this
// screen can only ever let an existing owner back in.
function LoginGate() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [state, setState] = useState('idle');   // idle | busy | error | reset-sent

    setState('busy');

      password,
    });
    if (error) {
      setState('error');
      setDetail(error.message === 'Invalid login credentials'
        ? 'That email and password combination was not recognised.'

  async function sendReset() {
    if (!email.trim()) {
      setState('error');

    // list and, if it doesn't match, silently falls back to the project's
    // Site URL — which on this project is the other app entirely. A stray
    // ?v=… left in the address bar was enough to cause that, so anything
    // beyond the path is stripped before asking.
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin + window.location.pathname,

            display:'grid', placeItems:'center', fontWeight:800, fontSize:'0.95rem',
            letterSpacing:'-0.08em', transform:'rotate(-2deg)'
          }}>||||</div>
          <div style={{fontSize:'1.35rem', fontWeight:780, letterSpacing:'-0.03em'}}>
            Tutor<span style={{color:'var(--accent)'}}>tally</span>

        </div>
        <div style={{fontSize:'0.85rem', color:'var(--muted)', marginBottom:22, lineHeight:1.5}}>
          Sign in to total your lessons, payments, and parent links.
        </div>

        {state === 'reset-sent' ? (
          <div style={{
            background:'var(--accent-light)', border:'1px solid color-mix(in srgb, var(--accent) 30%, transparent)',
            color:'var(--accent)', borderRadius:'var(--r-md)', padding:'14px 15px',
            fontSize:'0.87rem', lineHeight:1.5, fontWeight:550

          <form onSubmit={signIn}>

              />
            </div>
            <div className="field">
              <label>Password</label>
              <input
                type="password" value={password} onChange={e => setPassword(e.target.value)}

              />
            </div>
            {state === 'error' && (
              <div style={{fontSize:'0.8rem', color:'var(--warn)', marginBottom:12, lineHeight:1.45}}>
                {detail}
              </div>
            )}
            <button className="btn save" style={{width:'100%'}} type="submit"
                    disabled={state === 'busy' || !email.trim() || !password}>
              {state === 'busy' ? 'Signing in…' : 'Sign in'}

            <button

// ---------- Change password ----------
function ChangePassword() {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [state, setState] = useState('idle');
  const [detail, setDetail] = useState('');

  async function save(e) {
    e.preventDefault();
    if (pw.length < 8) { setState('error'); setDetail('Use at least 8 characters.'); return; }
    if (pw !== pw2)    { setState('error'); setDetail('The two passwords do not match.'); return; }
    setState('busy');
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) { setState('error'); setDetail(error.message); }
    else { setState('done'); setPw(''); setPw2(''); }
  }

  return (
    <form onSubmit={save}>
      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:14, lineHeight:1.45}}>
        Sets the password for the account you're signed in as. Your password
        manager should offer to update its saved copy.
      </div>
      <div className="field">
        <label>New password</label>
        <input type="password" value={pw} onChange={e => setPw(e.target.value)}
               autoComplete="new-password" placeholder="At least 8 characters" />
      </div>
      <div className="field">
        <label>Confirm new password</label>
        <input type="password" value={pw2} onChange={e => setPw2(e.target.value)}
               autoComplete="new-password" placeholder="Type it again" />
      </div>
      {state === 'error' && (
        <div style={{fontSize:'0.8rem', color:'var(--warn)', marginBottom:12}}>{detail}</div>
      )}
      {state === 'done' && (
        <div style={{fontSize:'0.82rem', color:'var(--accent)', marginBottom:12, fontWeight:600}}>
          Password updated.
        </div>
      )}
      <button className="btn save" style={{width:'100%'}} type="submit" disabled={state === 'busy'}>
        {state === 'busy' ? 'Saving…' : 'Set password'}
      </button>
    </form>
  );
}

// ---------- Revenue trend ----------
// Money actually received, by month. Built from payment dates rather than
// lessons taught, so it reflects cash in hand rather than what's owed.
function RevenueTrend({ payments, students, rateHistory }) {
  const M = useMoney();
  const MONTHS_SHOWN = 6;

  const scaleByStudent = {};
  students.forEach(s => { scaleByStudent[s.id] = moneyScaleFor(s.id, rateHistory); });

  const buckets = {};
  const now = new Date();
  for (let i = MONTHS_SHOWN - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    // Built from local parts, not toISOString: midnight on the 1st in BST is
    // still the previous month in UTC, which silently merged July into June.
    buckets[`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`] = 0;
  }

  payments.forEach(p => {
    const key = String(p.date_paid || '').slice(0, 7);
    if (!(key in buckets)) return;
    buckets[key] += parseFloat(p.amount) * (scaleByStudent[p.student_id] ?? 1);
  });

  const rows = Object.entries(buckets).map(([key, total]) => ({
    key, total,
    label: new Date(key + '-01T12:00:00').toLocaleDateString('en-GB', { month: 'short' }),
  }));

  const peak = Math.max(...rows.map(r => r.total), 1);
  const received = rows.reduce((s, r) => s + r.total, 0);
  const monthsWithMoney = rows.filter(r => r.total > 0).length;
  const average = monthsWithMoney > 0 ? received / monthsWithMoney : 0;

  // Compare the two most recent complete months, ignoring the current partial
  // one — otherwise every month looks like a collapse until it's over.
  const prior = rows.slice(0, -1);
  const lastFull = prior[prior.length - 1];
  const prevFull = prior[prior.length - 2];
  const change = lastFull && prevFull && prevFull.total > 0
    ? Math.round(((lastFull.total - prevFull.total) / prevFull.total) * 100)
    : null;

  return (
    <div>
      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:14, lineHeight:1.45}}>
        Money received each month. The current month is still filling up, so the
        change below compares the last two complete months.
      </div>

      {rows.map(r => (
        <div className="rev-row" key={r.key}>
          <span className="rev-month">{r.label}</span>
          <span className="rev-track">
            <span className="rev-fill" style={{width: `${Math.max(2, (r.total / peak) * 100)}%`}} />
          </span>
          <span className="rev-val" style={{color: r.total > 0 ? 'var(--ink)' : 'var(--muted)'}}>
            {r.total > 0 ? M(r.total) : '—'}
          </span>
        </div>
      ))}

      <div style={{
        display:'flex', gap:14, marginTop:16, paddingTop:14,
        borderTop:'1px solid var(--line)', flexWrap:'wrap'
      }}>
        <div style={{flex:'1 1 90px'}}>
          <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em'}}>{M(received)}</div>
          <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
            last {MONTHS_SHOWN} months
          </div>
        </div>
        <div style={{flex:'1 1 90px'}}>
          <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em'}}>{M(average)}</div>
          <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
            monthly average
          </div>
        </div>
        {change !== null && (
          <div style={{flex:'1 1 90px'}}>
            <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em',
                         color: change >= 0 ? 'var(--accent)' : 'var(--warn)'}}>
              {change >= 0 ? '+' : ''}{change}%
            </div>
            <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
              {prevFull.label} → {lastFull.label}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Needs attention ----------
// Surfaces the two things that actually cost money if missed: someone owing
// for a while, and an active student with nothing in the diary. Hidden
// entirely when there's nothing wrong, so it never becomes wallpaper.
function NeedsAttention({ students, lessons, payments, allocations, rateHistory, onJump }) {
  const M = useMoney();
  const N = useNameDisplay();
  const today = new Date().toISOString().slice(0, 10);

  const items = [];
  students.filter(s => s.active).forEach(s => {
    const mine = lessons.filter(l => l.student_id === s.id);
    const lessonIds = new Set(mine.map(l => l.id));
    const scale = moneyScaleFor(s.id, rateHistory);

    const owed = mine
      .filter(l => l.status === 'completed' && !l.is_complimentary && !l.pre_settled)
      .reduce((sum, l) => sum + rateForLesson(l, rateHistory), 0);
    const paid = payments
      .filter(p => p.student_id === s.id)
      .reduce((sum, p) => sum + parseFloat(p.amount) * scale, 0);
    const balance = owed - paid;

    const oldestUnpaid = mine
      .filter(l => l.status === 'completed' && !l.is_complimentary && !l.pre_settled)
      .filter(l => {
        const covered = allocations
          .filter(a => a.lesson_id === l.id)
          .reduce((sum, a) => sum + parseFloat(a.amount) * scale, 0);
        return covered < rateForLesson(l, rateHistory) - 0.005;
      })
      .sort((a, b) => a.lesson_date.localeCompare(b.lesson_date))[0];

    if (balance > 0.005 && oldestUnpaid) {
      const days = Math.floor((new Date(today) - new Date(oldestUnpaid.lesson_date)) / 86400000);
      if (days >= 7) {
        items.push({
          id: s.id + ':owing', studentId: s.id, name: s.name,
          why: `${M(balance, s.id + ':balance')} · ${days}d`,
          sort: 1000 - days,
        });
      }
    }

    const hasUpcoming = mine.some(l => l.status === 'scheduled' && l.lesson_date >= today);
    if (!hasUpcoming) {
      items.push({
        id: s.id + ':nolesson', studentId: s.id, name: s.name,
        why: 'nothing booked', sort: 2000,
      });
    }
  });

  if (items.length === 0) return null;
  items.sort((a, b) => a.sort - b.sort);

  return (
    <div className="attn">
      <div className="attn-title">Needs attention · {items.length}</div>
      {items.slice(0, 6).map(it => (
        <div className="attn-item" key={it.id} onClick={() => onJump(it.studentId)}>
          <span>{N(it.name, it.studentId)}</span>
          <span className="attn-why">{it.why}</span>
        </div>
      ))}
    </div>
  );
}

// Deliberately harder to trigger than a tap — this fires a permanent delete,
// so a drag past 90% of the track is the confirmation, not a click.
function SlideToConfirm({ onConfirm }) {
  const trackRef = React.useRef(null);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [done, setDone] = useState(false);
  const HANDLE = 34;

  function clampAndMaybeFire(clientX) {
    const rect = trackRef.current.getBoundingClientRect();
    const max = rect.width - HANDLE - 4;
    const x = Math.min(Math.max(clientX - rect.left - HANDLE / 2, 0), max);
    setDragX(x);
    if (x >= max * 0.9) {
      setDragging(false);
      setDone(true);
      onConfirm();
    }
  }

  return (
    <div ref={trackRef} style={{
      position:'relative', height:38, borderRadius:19, background:'var(--card-2)',
      border:'1.5px solid var(--warn)', overflow:'hidden', userSelect:'none', touchAction:'none',
    }}
      onPointerMove={e => dragging && clampAndMaybeFire(e.clientX)}
      onPointerUp={() => { if (dragging && !done) { setDragging(false); setDragX(0); } }}
      onPointerLeave={() => { if (dragging && !done) { setDragging(false); setDragX(0); } }}>
      <div style={{
        position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:'0.8rem', color:'var(--warn)', pointerEvents:'none',
      }}>
        {done ? 'Deleting…' : 'Slide to permanently delete →'}
      </div>
      <div
        onPointerDown={e => { if (!done) { setDragging(true); e.target.setPointerCapture(e.pointerId); } }}
        style={{
          position:'absolute', top:2, left:2, width:HANDLE, height:HANDLE, borderRadius:HANDLE / 2,
          background:'var(--warn)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center',
          transform:`translateX(${dragX}px)`, transition: dragging ? 'none' : 'transform 0.2s',
          cursor: done ? 'default' : 'grab', touchAction:'none', fontSize:'1rem', lineHeight:1,
        }}><span style={{transform:'translateY(-1px)'}}>🗑</span></div>
    </div>
  );
}

              {backBtn}

            {[
              { icon: '🗄️', title: 'Student profiles', body: 'Stored in Supabase for Tutortally. Name, school, exam board, rate, WhatsApp number, Zoom link, spreadsheet link, and the bank name to expect payments from — all edited via the Edit button on each card.' },

              { icon: '🔄', title: 'Fresh start — 27 July 2026', body: 'Everything taught before 27 July 2026 is marked as already paid for. Those lessons still show in history (tagged "settled") but never count towards a balance, and all payments predating that date were cleared out. The old records were archived inside the database rather than destroyed, so they can be recovered if ever needed.' },
              { icon: '💷', title: 'Payments', body: 'Open a student and expand Payments to see every payment, or log a new one (cash or bank transfer). Tap a payment to see which lessons it covers, edit it, or delete it. Balance = completed lessons since the reset − total paid.' },
              { icon: '🏦', title: 'Monzo', body: 'Tools → Monzo payments pulls incoming bank transfers and logs them against the right student automatically. Set "Expect bank transfers from" on a student to teach it a parent\'s name; after the first match it remembers their account, so it keeps working even when the bank formats the name differently. Only money coming IN from real people is ever looked at — card spending, pot transfers and declines are filtered out, and unrecognised transfers are read live and never stored. Nothing before 27 July 2026 is considered.' },

              { icon: '🔐', title: 'Security', body: 'Monzo credentials live only in Supabase\'s secret store, and the Monzo tables are locked so the key embedded in this page cannot read any bank data. Student details are not yet behind a login, so treat the site URL as private until that is added.' },
            ].map(({ icon, title, body }) => (
              <div key={title} style={{marginBottom:14, paddingBottom:14, borderBottom:'1px solid var(--line)'}}>
                <div style={{fontSize:'0.88rem', fontWeight:600, color:'var(--gold)', marginBottom:4}}>{icon} {title}</div>
                <div style={{fontSize:'0.83rem', color:'var(--ink-dim)', lineHeight:1.55}}>{body}</div>

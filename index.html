<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TutorTally</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json"> 
<meta name="theme-color" content="#ffa500">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* ── Light mode (default) ── */
  :root {
    --bg: #f7f8f4;
    --bg-tint: #ecf4f1;
    --card: #ffffff;
    --card-2: #f5f7f6;
    --card-3: #edf1ef;
    --line: #dfe7e3;
    --line-soft: #edf1ef;
    --ink: #15211f;
    --ink-dim: #596965;
    /* Orange is the brand colour, but it only behaves as a FILL. #ffa500 as
       text on paper is 1.85:1 and under white text 1.97:1, both unreadable,
       while ink on top of it is 8.4:1. So --accent is the readable orange used
       for text and borders, --accent-fill is the brand orange used for blocks,
       and --on-accent is what goes on top of a fill. */
    --accent: #a15c00;
    --accent-fill: #ffa500;
    --on-accent: #15211f;
    --accent-2: #ffa500;
    --accent-light: #fff1d9;
    /* Status is not brand. Orange says "this is TutorTally"; green and red
       say whether a thing is good or bad, and never stand in for each other. */
    --good: #0f7a35;
    --good-light: #e3f7e9;
    /* The old coral was 3.61:1 on its own tint, under the 4.5 needed. */
    --warn: #c0362c;
    --warn-light: #fdecea;
    --muted: #87938f;
    --gold: #b7791f;
    --gold-light: #fff4d8;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    /* Layered shadows read as real depth; a single blurred box never does. */
    --sh-1: 0 1px 2px rgba(22,21,15,.06);
    --sh-2: 0 1px 2px rgba(22,21,15,.05), 0 6px 16px -8px rgba(22,21,15,.14);
    --sh-3: 0 2px 6px rgba(22,21,15,.06), 0 16px 40px -12px rgba(22,21,15,.22);
    --ring: 0 0 0 3px rgba(255,165,0,.28);
  }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101716;
      --bg-tint: #14211f;
      --card: #182321;
      --card-2: #1e2a27;
      --card-3: #26332f;
      --line: #30413d;
      --line-soft: #26332f;
      --ink: #eef8f5;
      --ink-dim: #a5b7b1;
      /* On a dark ground the brand orange is 9.2:1, so text and fill are the
         same colour here and nothing has to be darkened. */
      --accent: #ffa500;
      --accent-fill: #ffa500;
      --on-accent: #15211f;
      --accent-2: #ffa500;
      --accent-light: #3a2604;
      --good: #4ade80;
      --good-light: #0f2e1a;
      --warn: #ff8a63;
      --warn-light: #351d15;
      --muted: #7f918c;
      --gold: #e6bd62;
      --gold-light: #302612;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --sh-1: 0 1px 2px rgba(0,0,0,.4);
      --sh-2: 0 1px 3px rgba(0,0,0,.45), 0 8px 20px -10px rgba(0,0,0,.6);
      --sh-3: 0 2px 8px rgba(0,0,0,.5), 0 20px 48px -14px rgba(0,0,0,.75);
      --ring: 0 0 0 3px rgba(255,165,0,.30);
    }
  }

  /* Radii and motion, shared across both themes. */
  :root {
    --r-sm: 9px; --r-md: 13px; --r-lg: 17px; --r-xl: 24px;
    --ease: cubic-bezier(.2,.8,.2,1);
    --ease-spring: cubic-bezier(.34,1.4,.64,1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    /* No pinch-zoom or double-tap-zoom: this is a fixed-layout app, and
       accidental zoom while scrolling a card list is pure annoyance.
       manipulation keeps panning and scrolling, drops the zoom gestures. */
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  #root { max-width: 720px; margin: 0 auto; padding-bottom: 100px; }

  /* ── Header ── */
  .app-header {
    background: color-mix(in srgb, var(--card) 82%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    backdrop-filter: saturate(180%) blur(16px);
    padding: 15px 16px 13px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 40;
  }
  @supports not (backdrop-filter: blur(1px)) { .app-header { background: var(--card); } }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .header-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
  /* Drawn rather than loaded so the tally strokes take the current ink and
     flip with the theme; a flat asset is invisible on one of the two. */
  .brand-mark { flex-shrink: 0; width: 34px; height: 26px; display: block; }
  .header-title {
    font-size: 1.32rem; font-weight: 700; color: var(--ink);
    letter-spacing: -0.028em; line-height: 1;
  }
  .header-sub { font-size: 0.735rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.005em; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: var(--r-sm); width: 34px; height: 34px; font-size: 0.9rem; cursor: pointer;
    font-family: inherit; display: grid; place-items: center;
    transition: background .18s var(--ease), transform .18s var(--ease);
  }
  .refresh-btn:active { transform: scale(.92); background: var(--card-3); }
  .add-btn {
    background: var(--accent-fill); color: var(--on-accent); border: none;
    border-radius: var(--r-sm); padding: 9px 15px; font-size: 0.82rem;
    font-weight: 650; cursor: pointer; font-family: inherit;
    box-shadow: var(--sh-1), inset 0 1px 0 rgba(255,255,255,.14);
    transition: transform .18s var(--ease), filter .18s var(--ease);
  }
  .add-btn:active { transform: scale(.95); filter: brightness(1.08); }
  /* On a phone this lives as a floating pill within thumb reach. On a desktop
     there is no thumb and the bottom of the window is a long way from where
     the eye is, so it joins the other controls in the header instead. Only
     ever one of the two is on screen. */
  .header-settings-btn { display: none; }
  @media (min-width: 760px) {
    .header-settings-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card-2); border: 1px solid var(--line); color: var(--ink);
      border-radius: var(--r-sm); padding: 0 13px; height: 34px;
      font-size: 0.82rem; font-weight: 650; cursor: pointer; font-family: inherit;
      transition: background .18s var(--ease), transform .18s var(--ease);
    }
    .header-settings-btn:active { transform: scale(.95); background: var(--card-3); }
    @media (hover:hover) { .header-settings-btn:hover { background: var(--card-3); } }
    .global-tools-btn { display: none; }
  }

  /* ── Content ── */
  .content { padding: 14px 16px; }

  /* ── Search ── */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input {
    width: 100%; padding: 11px 36px 11px 36px; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 0.9rem; font-family: inherit; box-shadow: var(--sh-1);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
  .search-wrap .s-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 0.9rem; pointer-events: none;
  }
  .search-wrap .s-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: var(--card-3); border: none; color: var(--ink-dim); cursor: pointer;
    width: 22px; height: 22px; border-radius: 11px; font-size: 0.8rem; line-height: 1;
    display: grid; place-items: center; font-family: inherit;
  }

  /* ── Cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    margin-bottom: 11px;
    overflow: hidden;
    box-shadow: var(--sh-2);
    transition: box-shadow .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease);
  }
  .card.is-open { box-shadow: var(--sh-3); border-color: color-mix(in srgb, var(--accent) 26%, var(--line)); }
  @media (hover:hover) { .card:hover { box-shadow: var(--sh-3); } }
  .card-header {
    padding: 15px 16px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    gap: 10px;
    transition: background .18s var(--ease);
  }
  .card-header:active { background: var(--card-2); }
  .student-name {
    font-weight: 650; font-size: 1.02rem; color: var(--ink); letter-spacing: -0.015em;
    display: flex; align-items: center; gap: 7px;
  }
  /* Coloured dot carries paid/owing state before any text is read. */
  .dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; }
  .dot.ok { background: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-light); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-light); }
  .dot.idle { background: var(--muted); opacity: .55; }
  .status-row { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .pill {
    font-size: 0.665rem; padding: 3px 9px; border-radius: 20px; font-weight: 650;
    letter-spacing: 0.015em; line-height: 1.45; white-space: nowrap;
  }
  .pill.ok { background: var(--good-light); color: var(--good); }
  .pill.warn { background: var(--warn-light); color: var(--warn); }
  .pill.neutral { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .pill.gold { background: var(--gold-light); color: var(--gold); }

  /* ── Skeleton loading ── */
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .sk {
    border-radius: var(--r-lg); height: 74px; margin-bottom: 11px;
    background: linear-gradient(90deg, var(--card) 0%, var(--card-3) 45%, var(--card) 90%);
    background-size: 420px 100%;
    animation: shimmer 1.25s linear infinite;
    border: 1px solid var(--line);
  }
  .chevron { font-size: 1rem; color: var(--muted); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
  .chevron.open { transform: rotate(90deg); }
  .card-body { overflow: hidden; max-height: 0; transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1); }
  .card-body.open { max-height: 3000px; }
  .card-body-inner { padding: 0 16px 16px; border-top: 1px solid var(--line); }
  .section-label {
    font-size: 0.645rem; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 700;
  }
  .lesson-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 0.86rem; border-bottom: 1px solid var(--line-soft);
  }
  .lesson-row:last-child { border-bottom: none; }
  .lesson-date { color: var(--ink-dim); }
  .lesson-status { font-size: 0.74rem; font-weight: 550; }
  .lesson-status.completed { color: var(--accent); }
  .lesson-status.scheduled { color: var(--gold); }
  .lesson-status.missed { color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 90px; padding: 11px 13px; border-radius: var(--r-md); border: none;
    font-size: 0.83rem; font-weight: 650; cursor: pointer; text-align: center;
    text-decoration: none; color: white; font-family: inherit;
    transition: transform .16s var(--ease), filter .16s var(--ease), background .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.96); }
  @media (hover:hover) { .btn:hover { filter: brightness(1.06); } }
  .btn:disabled { opacity: .5; cursor: default; transform: none; filter: none; }
  .btn.whatsapp { background: #25D366; color: #07300f; box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
  /* A button that cannot work yet still gets shown, because hiding it is why
     nobody knew the feature existed. Dashed and in the warning colour so it
     reads as "not ready" rather than "broken", and tapping it says what is
     missing instead of doing nothing. */
  .btn.needs-setup {
    background: var(--warn-light); color: var(--warn);
    border: 1px dashed var(--warn); box-shadow: none;
  }
  .btn.needs-setup::after { content: ' · setup'; opacity: .75; font-size: .82em; }

  /* ── Walkthrough spotlight ── */
  @keyframes wt-nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  .wt-ring {
    /* Above the sticky header and the billing bar, below sheets and the
       walkthrough itself. Left on auto, page chrome painted straight over the
       ring and the arrow, so the box around + Add was invisible and the arrow
       was tucked behind the bar. The dim is the ring's own shadow and the ring
       is a hole in it, so whatever is being pointed at still shows through
       undimmed however it is stacked. */
    z-index: 95;
    position: fixed; border-radius: 12px; border: 2px solid var(--accent);
    /* The dim is this element's own shadow, so the ring is a hole in it and
       the highlighted control stays fully lit and tappable. */
    box-shadow: 0 0 0 9999px rgba(6, 18, 16, .60);
    transition: top .18s var(--ease), left .18s var(--ease), width .18s var(--ease), height .18s var(--ease);
    pointer-events: none;
  }
  .wt-arrow {
    z-index: 96;
    position: fixed; font-size: 1.5rem; line-height: 1; color: var(--accent);
    animation: wt-nudge 1.1s ease-in-out infinite; pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .btn.notes { background: var(--card-2); color: var(--ink-dim); border: 1px solid var(--line); }
  .btn.more  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }
  .btn.edit  { background: var(--card-2); color: var(--ink);     border: 1px solid var(--line); }

  /* ── Needs attention ── */
  .attn {
    background: var(--warn-light); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
    border-radius: var(--r-lg); padding: 13px 15px; margin-bottom: 12px;
    box-shadow: var(--sh-1);
  }
  .attn-title {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em;
    font-weight: 700; color: var(--warn); margin-bottom: 8px;
  }
  .attn-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 6px 0; font-size: 0.85rem; cursor: pointer; color: var(--ink);
    border-radius: 6px; transition: background .15s var(--ease);
  }
  .attn-item:active { background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .attn-why { font-size: 0.74rem; color: var(--warn); font-weight: 600; white-space: nowrap; }

  /* ── Revenue trend ── */
  .rev-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .rev-month { font-size: 0.75rem; color: var(--muted); width: 62px; flex-shrink: 0; }
  .rev-row.now .rev-month { color: var(--ink); font-weight: 700; }
  .rev-row.now .rev-track { box-shadow: 0 0 0 1px var(--accent-fill); }
  /* Booked is not earned, so it is not drawn as if it were. Stripes rather
     than a lighter shade, so it survives being printed or read by someone who
     cannot separate the two colours. */
  .rev-fill.booked {
    background: repeating-linear-gradient(135deg,
      var(--accent-fill) 0 5px,
      color-mix(in srgb, var(--accent-fill) 38%, transparent) 5px 10px);
  }
  .rev-track { flex: 1; height: 22px; background: var(--card-2); border-radius: 6px; overflow: hidden; }
  .rev-fill {
    /* A span is inline, and width and height do not apply to inline elements,
       so every bar collapsed to nothing and all that showed was the empty
       grey track behind it. */
    display: block;
    height: 100%; border-radius: 6px; min-width: 3px;
    background: linear-gradient(90deg, var(--accent-fill), var(--accent-2));
    transition: width .5s var(--ease);
  }
  .rev-val { font-size: 0.78rem; font-weight: 650; width: 62px; text-align: right; flex-shrink: 0; }
  .notes-box {
    font-size: 0.84rem; color: var(--ink-dim); background: var(--card-2);
    padding: 10px 12px; border-radius: 8px; margin-top: 8px; line-height: 1.5;
    border: 1px solid var(--line); display: none;
  }
  .notes-box.visible { display: block; }
  .empty   { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
  .loading { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 0.88rem; letter-spacing: 0.04em; }

  /* ── Modals ── */
  @keyframes overlayIn  { from { background: rgba(0,0,0,0); } to { background: rgba(0,0,0,0.5); } }
  @keyframes overlayOut { from { background: rgba(0,0,0,0.5); } to { background: rgba(0,0,0,0); } }
  @keyframes sheetUp    { from { transform: translateY(48px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes sheetDown  { from { transform: translateY(0); opacity: 1; } to { transform: translateY(52px); opacity: 0; } }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; animation: overlayIn 0.2s ease forwards;
  }
  /* Closing needs its own state because React unmounts instantly otherwise -
     the sheet would vanish with no exit animation at all. */
  .overlay.closing { animation: overlayOut 0.2s ease forwards; }
  .sheet {
    background: var(--card); border: 1px solid var(--line);
    width: 100%; max-width: 720px; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 90vh; overflow-y: auto; overflow-x: hidden;
    animation: sheetUp 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .sheet.closing { animation: sheetDown 0.2s cubic-bezier(0.4,0,1,1) forwards; }
  /* The walkthrough sits above sheets on purpose, so that whatever it is
     pointing at stays visible. The cost is that a sheet opened FROM the
     walkthrough lands underneath it, which hid the calendar list, Sync now,
     every Add button and most Save buttons. Rather than fight over z-index,
     the walkthrough shrinks to a bar and the sheet is lifted clear of it. */
  body[data-wt-bar="1"] .overlay { padding-bottom: var(--wt-bar-h, 96px); }
  body[data-wt-bar="1"] .sheet { max-height: calc(94vh - var(--wt-bar-h, 96px)); }
  .sheet h2 { font-size: 1.05rem; margin: 0 0 16px; color: var(--ink); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 0.68rem; color: var(--muted);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .field input[type="text"], .field input[type="date"], .field input[type="number"], .field input[type="email"], .field input[type="password"], .field select, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: var(--r-md); font-size: 0.95rem; font-family: inherit;
    background: var(--card-2); color: var(--ink);
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: var(--ring); background: var(--card);
  }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .field textarea { min-height: 70px; resize: vertical; }
  .money-input { position: relative; width: 100%; }
  .money-input span {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-weight: 700; pointer-events: none;
  }
  .money-input input { padding-left: 28px !important; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn.cancel { background: var(--card-2); color: var(--ink); border: 1px solid var(--line); flex: 0 0 auto; padding: 10px 18px; }
  .btn.save   { background: var(--accent-fill); color: var(--on-accent); }
  .session-list { margin: 10px 0; }
  .session-pick-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; color: var(--ink-dim);
  }
  .session-pick-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .tools-menu { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
  .tools-section-title {
    margin: 0 2px 8px; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 750;
  }
  .tools-group {
    overflow: hidden; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--card-2); box-shadow: var(--sh-1);
  }
  .tools-row {
    width: 100%; min-height: 58px; display: flex; align-items: center;

<script type="text/babel">
const { useState, useEffect } = React;

const SUPABASE_URL = 'https://uilytgubukiinyrqrltj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WK5p8tUAsNLEqnmxVT7Eag_2EVNbi7V';
const realSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    // Keep the session in localStorage and refresh it silently, so signing in
    // is a rare event rather than something to do every visit.
    persistSession: true,
    autoRefreshToken: true,
    // The magic link comes back with tokens in the URL fragment; let the
    // client consume them and then tidy the address bar.
    detectSessionInUrl: true,
  },
});

// ---------- Demo mode and the billing lock ----------
//
// Both need the same thing: a seam between the app and Supabase that can fake
// a write or refuse one. Rather than touching all 26 call sites, the client is
// wrapped once, here. Every mutation in this app is called directly after
// .from(table), so intercepting at that point catches every one of them.
//
// ?demo=1 runs the real app against fabricated students held in memory. It is
// the marketing demo, so it must never reach the database: the demo client
// below makes no network calls of any kind.

const DEMO_MODE = new URLSearchParams(window.location.search).has('demo');

// Set true once a subscription has lapsed. Reads stay open deliberately. The
// promise made on the marketing page is that nothing is deleted and records
// stay readable and exportable, so lapsing blocks writing, not looking.
let WRITES_BLOCKED = false;
let notifyBlockedWrite = () => {};
const BLOCKED_MESSAGE = "You are over TutorTally Lite's student limit, so TutorTally is read-only for now. Nothing has been deleted.";

// Set when the account is on TutorTally Lite and already using every slot.
// Adding one more student is refused on its own, rather than the whole app
  // locking, so the tutor hits a clear "this needs TutorTally Pro" at the moment they try.
let NEW_STUDENT_BLOCKED = false;
let CURRENT_FREE_LIMIT = 3;
let notifyStudentLimit = () => {};

// Returns null to allow, or {message, notify} to refuse.
function refuseWrite(table, op, args) {
  if (WRITES_BLOCKED) {
    return { message: BLOCKED_MESSAGE, notify: () => notifyBlockedWrite() };
  }
  if (NEW_STUDENT_BLOCKED && table === 'tutoring_students') {
    const payload = args && args[0];
    // Un-archiving steps over the limit exactly the way adding one does, so it
    // is caught here too. Any other edit to an existing student is fine.
    const adding = op === 'insert';
    const unarchiving = op === 'update' && payload && payload.active === true;
    if (adding || unarchiving) {
      return {
        message: `TutorTally Lite covers ${CURRENT_FREE_LIMIT} active students. TutorTally Pro is £5 a month for as many as you like.`,
        notify: () => notifyStudentLimit(),
      };
    }
  }
  return null;
}

// Stands in for a PostgREST query builder: every method returns itself, and
// awaiting it produces a fixed result. Used for refused writes, and for the
// parts of the demo client that only need to report success.
function chainableResult(result) {
  const proxy = new Proxy({}, {
    get(_t, prop) {
      if (prop === 'then')    return (ok, bad) => Promise.resolve(result).then(ok, bad);
      if (prop === 'catch')   return (f) => Promise.resolve(result).catch(f);
      if (prop === 'finally') return (f) => Promise.resolve(result).finally(f);
      return () => proxy;
    }
  });
  return proxy;
}

const MUTATIONS = ['insert', 'update', 'delete', 'upsert'];

function guardedClient(client) {
  return {
    auth: client.auth,
    rpc: (...args) => WRITES_BLOCKED
      ? chainableResult({ data: null, error: { message: BLOCKED_MESSAGE } })
      : client.rpc(...args),
    from: (table) => {
      const q = client.from(table);
      return new Proxy(q, {
        get(target, prop) {
          const v = target[prop];
          if (!MUTATIONS.includes(prop)) {
            return typeof v === 'function' ? v.bind(target) : v;
          }
          return (...args) => {
            const refusal = refuseWrite(table, prop, args);
            if (refusal) {
              refusal.notify();
              return chainableResult({ data: null, error: { message: refusal.message } });
            }
            return v.apply(target, args);
          };
        }
      });
    },
  };
}

// ---------- The demo tutor's books ----------
// Dates are generated relative to today so the demo never looks abandoned.

  const todayStr = iso(new Date());

  const spec = [
    { name: 'Amira Khan',   parent: 'Yasmin Khan',    phone: '07700900101', school: 'Hasmonean High',    year: 11, board: 'Edexcel', tier: 'Higher',     rate: 60, weekday: 2, time: '16:00', owed: 0, cash: false, zoom: false },
    { name: 'Joe Fletcher', parent: 'Karen Fletcher', phone: '07700900102', school: 'Queen Elizabeths',  year: 11, board: 'AQA',     tier: 'Higher',     rate: 60, weekday: 3, time: '17:30', owed: 3, cash: false, zoom: false },
    { name: 'Priya Shah',   parent: 'Anita Shah',     phone: '07700900103', school: 'St Michaels',       year: 13, board: 'Edexcel', tier: null,         rate: 70, weekday: 4, time: '18:00', owed: 0, cash: false, zoom: true  },
    { name: 'Tom Bennett',  parent: 'Rachel Bennett', phone: '07700900104', school: 'Woodhouse',         year: 9,  board: null,      tier: null,         rate: 55, weekday: 1, time: '17:00', owed: 2, cash: false, zoom: false },
    { name: 'Layla Ahmed',  parent: 'Sana Ahmed',     phone: '07700900105', school: 'Copthall',          year: 10, board: 'Edexcel', tier: 'Foundation', rate: 60, weekday: 5, time: '16:30', owed: 0, cash: true,  zoom: false },
    { name: 'Ben Carter',   parent: 'Mark Carter',    phone: '07700900106', school: 'Mill Hill County',  year: 12, board: 'OCR',     tier: null,         rate: 70, weekday: 6, time: '10:00', owed: 1, cash: false, zoom: false },

  const students = [], lessons = [], payments = [], rateHistory = [];

        rate_charged: null,
        lesson_notes: null,
        google_event_id: 'demo-event-' + sid + '-' + w,
        owner_id: 'demo-tutor',
      });
    }
    lessons.push(...mine);

    // Pay for every completed lesson except the ones this student is meant to
    // be behind on, in chunks of three, which is how most parents actually pay.
    const completed = mine.filter(l => l.status === 'completed');
    const toCover = Math.max(0, completed.length - s.owed);
    let covered = 0;
    while (covered < toCover) {
      const chunk = Math.min(3, toCover - covered);
      payments.push({
        id: nextId('demo-payment'),
        student_id: sid,
        amount: chunk * s.rate,
        date_paid: completed[Math.min(covered + chunk - 1, completed.length - 1)].lesson_date,
        method: s.cash ? 'cash' : 'bank_transfer',
        deleted_at: null,
        monzo_transaction_id: null,
        owner_id: 'demo-tutor',
        created_at: new Date().toISOString(),
      });
      covered += chunk;
    }
  });

  return {
    tutoring_students: students,
    tutoring_lessons: lessons,
    tutoring_payments: payments,
    tutoring_bundles: [],
    tutoring_rate_history: rateHistory,
    tutoring_payment_allocations: [],
    tutoring_monzo_transactions: [],
  };
}

// ---------- In-memory stand-in for Supabase ----------
// Supports exactly the query shapes this app uses: the filters, the two-key
// ordering on the student list, insert/update/delete/upsert, and the one RPC.
// Anything it does not recognise resolves to an empty success rather than
// throwing, because a demo that white-screens is worse than a demo that is
// slightly incomplete.
function makeDemoClient() {
  const db = makeDemoData();
  let seq = 10000;
  const newId = () => 'demo-' + (++seq);

  const user = {
    id: 'demo-tutor',
    email: 'you@example.com',
    user_metadata: { display_name: 'Sam', default_rate: 60, wt_step: -1 },
  };
  const session = { user, access_token: 'demo-token' };
  const listeners = [];

  function matches(row, filters) {
    return filters.every(f => {
      const v = row[f.col];
      switch (f.op) {
        case 'eq':  return String(v) === String(f.val);
        case 'neq': return String(v) !== String(f.val);
        case 'is':  return f.val === null ? (v === null || v === undefined) : v === f.val;
        case 'lt':  return v != null && v <  f.val;
        case 'lte': return v != null && v <= f.val;
        case 'gt':  return v != null && v >  f.val;
        case 'gte': return v != null && v >= f.val;
        case 'in':  return Array.isArray(f.val) && f.val.includes(v);
        default:    return true;
      }
    });
  }

  // Mirrors allocate_payment() in the database: oldest unpaid lesson first,
  // skipping anything cancelled, complimentary or already settled. Kept here
  // so a demo visitor logging a payment sees a balance move exactly the way it
  // would on a real account.
  function rateFor(lesson) {
    if (lesson.rate_charged != null && lesson.rate_charged !== '') return parseFloat(lesson.rate_charged);
    const rows = db.tutoring_rate_history
      .filter(r => r.student_id === lesson.student_id && r.effective_from_date <= lesson.lesson_date)
      .sort((a, b) => {
        const byDate = b.effective_from_date.localeCompare(a.effective_from_date);
        return byDate !== 0 ? byDate : String(b.created_at || '').localeCompare(String(a.created_at || ''));
      });
    return rows.length ? parseFloat(rows[0].rate) : 60;
  }

  function reallocate(studentId) {
    const mine = new Set(db.tutoring_payments.filter(p => p.student_id === studentId).map(p => p.id));
    db.tutoring_payment_allocations = db.tutoring_payment_allocations.filter(a => !mine.has(a.payment_id));

    const queue = db.tutoring_lessons
      .filter(l => l.student_id === studentId && l.status !== 'cancelled' && !l.is_complimentary && !l.pre_settled)
      .sort((a, b) => (a.lesson_date + (a.start_time || '00:00')).localeCompare(b.lesson_date + (b.start_time || '00:00')));

    const due = {};
    queue.forEach(l => { due[l.id] = rateFor(l); });

    db.tutoring_payments
      .filter(p => p.student_id === studentId && !p.deleted_at)
      .sort((a, b) => String(a.date_paid).localeCompare(String(b.date_paid)))
      .forEach(p => {
        let remaining = parseFloat(p.amount) || 0;
        for (const l of queue) {
          if (remaining <= 0.005) break;
          if (due[l.id] <= 0.005) continue;
          const take = Math.min(due[l.id], remaining);
          db.tutoring_payment_allocations.push({
            id: newId(), payment_id: p.id, lesson_id: l.id,
            student_id: studentId, amount: take, created_at: new Date().toISOString(),
          });
          due[l.id] -= take;
          remaining -= take;
        }
      });
  }

  function reallocateAll() {
    db.tutoring_students.forEach(s => reallocate(s.id));
  }
  reallocateAll();

  function table(name) {
    if (!db[name]) db[name] = [];
    const st = { op: 'select', filters: [], orders: [], payload: null, single: false, onConflict: null };

    function affectedStudents(rows) {
      return [...new Set(rows.map(r => r.student_id).filter(Boolean))];
    }

    function run() {
      const rows = db[name];
      try {
        if (st.op === 'select') {
          let out = rows.filter(r => matches(r, st.filters));
          // Applied back to front so the first .order() wins, which is how
          // PostgREST treats a chain of them.
          for (let i = st.orders.length - 1; i >= 0; i--) {
            const o = st.orders[i];
            out = out.slice().sort((a, b) => {
              const av = a[o.col], bv = b[o.col];
              if (av === bv) return 0;
              const cmp = av == null ? -1 : bv == null ? 1 : (av > bv ? 1 : -1);
              return o.asc ? cmp : -cmp;
            });
          }
          return { data: st.single ? (out[0] ?? null) : out, error: null };
        }

        if (st.op === 'insert') {
          const items = (Array.isArray(st.payload) ? st.payload : [st.payload]).map(x => ({
            id: newId(), created_at: new Date().toISOString(), ...x,
          }));
          rows.push(...items);
          affectedStudents(items).forEach(reallocate);
          return { data: st.single ? (items[0] ?? null) : items, error: null };
        }

        if (st.op === 'update') {
          const hit = rows.filter(r => matches(r, st.filters));
          hit.forEach(r => Object.assign(r, st.payload));
          affectedStudents(hit).forEach(reallocate);
          return { data: st.single ? (hit[0] ?? null) : hit, error: null };
        }

        if (st.op === 'delete') {
          const hit = rows.filter(r => matches(r, st.filters));
          db[name] = rows.filter(r => !matches(r, st.filters));
          affectedStudents(hit).forEach(reallocate);
          return { data: hit, error: null };
        }

        if (st.op === 'upsert') {
          const items = Array.isArray(st.payload) ? st.payload : [st.payload];
          const keys = st.onConflict ? st.onConflict.split(',').map(k => k.trim()) : ['id'];
          const saved = items.map(x => {
            const existing = rows.find(r => keys.every(k => String(r[k]) === String(x[k])));
            if (existing) { Object.assign(existing, x); return existing; }
            const fresh = { id: newId(), created_at: new Date().toISOString(), ...x };
            rows.push(fresh);
            return fresh;
          });
          affectedStudents(saved).forEach(reallocate);
          return { data: st.single ? (saved[0] ?? null) : saved, error: null };
        }

        return { data: null, error: null };
      } catch (e) {
        return { data: null, error: { message: String(e && e.message ? e.message : e) } };
      }
    }

    const api = {
      select() { return api; },
      insert(p) { st.op = 'insert'; st.payload = p; return api; },
      update(p) { st.op = 'update'; st.payload = p; return api; },
      upsert(p, opts) { st.op = 'upsert'; st.payload = p; st.onConflict = opts && opts.onConflict; return api; },
      delete() { st.op = 'delete'; return api; },
      eq(c, v)  { st.filters.push({ op: 'eq',  col: c, val: v }); return api; },
      neq(c, v) { st.filters.push({ op: 'neq', col: c, val: v }); return api; },
      is(c, v)  { st.filters.push({ op: 'is',  col: c, val: v }); return api; },
      lt(c, v)  { st.filters.push({ op: 'lt',  col: c, val: v }); return api; },
      lte(c, v) { st.filters.push({ op: 'lte', col: c, val: v }); return api; },
      gt(c, v)  { st.filters.push({ op: 'gt',  col: c, val: v }); return api; },
      gte(c, v) { st.filters.push({ op: 'gte', col: c, val: v }); return api; },
      in(c, v)  { st.filters.push({ op: 'in',  col: c, val: v }); return api; },
      order(col, opts) { st.orders.push({ col, asc: !(opts && opts.ascending === false) }); return api; },
      limit() { return api; },
      single() { st.single = true; return api; },
      maybeSingle() { st.single = true; return api; },
      then(ok, bad) { return Promise.resolve(run()).then(ok, bad); },
    };
    return api;
  }

  return {
    from: table,
    rpc: (fn, args) => {
      if (fn === 'reallocate_student_payments' && args && args.p_student_id) reallocate(args.p_student_id);
      return chainableResult({ data: null, error: null });
    },
    auth: {
      getSession: () => Promise.resolve({ data: { session }, error: null }),
      getUser:    () => Promise.resolve({ data: { user }, error: null }),
      onAuthStateChange: (cb) => {
        listeners.push(cb);
        return { data: { subscription: { unsubscribe() {} } } };
      },
      updateUser: ({ data }) => {
        Object.assign(user.user_metadata, data || {});
        listeners.forEach(cb => cb('USER_UPDATED', { ...session }));
        return Promise.resolve({ data: { user }, error: null });
      },
      signOut: () => { window.location.href = '/app'; return Promise.resolve({ error: null }); },
      signInWithPassword: () => Promise.resolve({ data: { session }, error: null }),
      resetPasswordForEmail: () => Promise.resolve({ error: null }),
    },
  };
}

// The Monzo and Google panels talk to Edge Functions over plain fetch rather
// than through the client, so the demo answers for them here. Without this
// they would sit on "couldn't connect", which reads as a broken product rather
// than a demo.
function demoFunctionReply(url) {
  if (url.includes('google-calendar-status')) {
    return {
      ok: true, connected: true, calendar_chosen: true, calendar_summary: 'Tutoring',
      connected_at: new Date(Date.now() - 86400000 * 40).toISOString(),
      last_synced_at: new Date(Date.now() - 1000 * 60 * 12).toISOString(),
      last_sync_error: null,
    };
  }
  if (url.includes('google-calendar-list')) {
    return { ok: true, calendars: [{ id: 'demo', summary: 'Tutoring', primary: true }] };
  }
  if (url.includes('google-calendar-sync')) return { ok: true, created: 0, updated: 0, skipped: 0 };
  if (url.includes('google-calendar-diagnose')) return { ok: true, findings: [] };
  if (url.includes('monzo-status')) return { connected: false };
  if (url.includes('monzo-review')) return { pending: [], blocked: [] };
  return { ok: true };
}

if (DEMO_MODE) {
  const realFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.includes('/functions/v1/')) {
      return Promise.resolve(new Response(JSON.stringify(demoFunctionReply(url)), {
        status: 200, headers: { 'Content-Type': 'application/json' },
      }));
    }
    return realFetch(input, init);
  };
}

// ---------- Billing ----------
// TutorTally Lite up to a student count, TutorTally Pro when you outgrow it. So the gate is
// a count, not a date.
//
// TutorTally Pro comes from any of three things: a comped account, a pro_free_until date
// still in the future (beta periods, referral months, goodwill), or a live
// Stripe subscription. past_due counts as live, because Stripe retries a failed
// card for days and locking a tutor out of their own lesson records over an
// expired card is the worse outcome.
const FN_BILLING = 'https://uilytgubukiinyrqrltj.supabase.co/functions/v1';
const STRIPE_OK = ['active', 'trialing', 'past_due'];
const DEFAULT_FREE_LIMIT = 3;

// Addons are extra line items on the same Stripe subscription, so a tutor pays
// one invoice however many they have. Anything with available:false is
// plumbing that exists end to end but is not on sale yet, and is deliberately
// not shown to tutors: listing an unbuilt feature is a promise.
const ADDONS = [
  {
    key: 'monzo',
    name: 'Monzo payment matching',
    price: '£5 a month',
    blurb: 'Bank transfers matched to students automatically, instead of logging them by hand.',
    available: false,
  },
];

function todayISO() { return new Date().toISOString().slice(0, 10); }
function tutorCopyName(name) {
  const clean = String(name || '').trim();
  return clean ? `${clean}'s TutorTally` : 'TutorTally';
}
function planCopyName(st, ownerName) {
  const base = tutorCopyName(ownerName);
  if (st?.unknown) return base;
  return `${base} ${st?.pro ? 'Pro' : 'Lite'}`;
}

function readEntitlement(ent, activeStudents = 0) {
  const limit = ent?.free_student_limit ?? DEFAULT_FREE_LIMIT;

  // Fails open. If the row cannot be read - a network blip, a policy change, a
  // row that never got created - the tutor keeps working. Locking a paying
  // customer out because of a billing bug is far worse than a few free days.
  if (!ent) {
    return {
      unknown: true, pro: true, access: true, reason: 'unknown',
      limit, over: false, atLimit: false, addons: [], grantDaysLeft: null,
    };
  }

  const comped  = ent.plan === 'comp';
  const granted = !!(ent.pro_free_until && ent.pro_free_until >= todayISO());
  const paying  = STRIPE_OK.includes(ent.stripe_status);
  const pro     = comped || granted || paying;

  const over    = activeStudents > limit;
  const atLimit = activeStudents >= limit;

  const grantDaysLeft = ent.pro_free_until
    ? Math.round((new Date(ent.pro_free_until + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000)
    : null;

  return {
    unknown: false, pro, comped, granted, paying,
    limit, over, atLimit,
    access: pro || !over,
    grantDaysLeft,
    addons: Array.isArray(ent.addons) ? ent.addons : [],
    reason: comped ? 'comp' : paying ? 'paying' : granted ? 'granted' : over ? 'over' : 'free',
  };
}

async function billingRedirect(fn, setBusy, setError, addons) {
  setBusy(true);
  setError(null);
  try {
    const { data } = await supabase.auth.getSession();
    const res = await fetch(`${FN_BILLING}/${fn}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${data?.session?.access_token ?? ''}`,
      },
      body: JSON.stringify({ addons: addons || [] }),
    });
    const body = await res.json();
    if (body.ok && body.url) { window.location.href = body.url; return; }
    setError(body.message || 'Could not open the payment page. Try again in a moment.');
  } catch (e) {
    setError('Could not reach the payment page. Check your connection and try again.');
  }
  setBusy(false);
}

async function refreshBillingFromStripe(accessToken) {
  const token = accessToken ?? (await supabase.auth.getSession()).data?.session?.access_token ?? '';
  const res = await fetch(`${FN_BILLING}/stripe-refresh`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`,
    },
    body: '{}',
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || !body.ok) throw new Error(body.message || 'Could not refresh billing from Stripe');
  return body.entitlement ?? null;
}

  // A free TutorTally Pro period running out, and no card on file to carry it on.

  }

  return null;
}

// A paper done in the last week earns a sparkle on the card. Written nightly
// from the student's own tracker sheet by the Apps Script.
function recentPaper(student, withinDays = 7) {
  if (!student.last_paper_date) return null;
  const done = new Date(student.last_paper_date + 'T12:00:00');
  const days = Math.floor((Date.now() - done) / 86400000);
  if (days < 0 || days > withinDays) return null;
  return {
    days,
    score: student.last_paper_score,
    name: student.last_paper_name,
    label: days === 0 ? 'today' : days === 1 ? 'yesterday' : `${days} days ago`,
  };
}

// Set once per render from App. Faking is applied at the RATE level rather
// than at each place a number is printed, because rates are what every other
// figure is computed from - fake the rate and the balances, totals and
// statements all come out consistent for free. Masking at print time instead
// produced totals that didn't add up to their own rows.
let PRIVACY_MONEY_MODE = 'normal';

// The rate in effect on a given date. Rates dated in the future are ignored
// until that date arrives, so a September rise doesn't affect today's figures.
// Ties on effective_from_date are broken by created_at, so the most recent
// edit always wins rather than whichever row happened to sort first.
function getRateOnDateReal(studentId, rateHistory, dateStr, fallback = 90) {
  const rows = (rateHistory || [])
    .filter(r => r.student_id === studentId && r.effective_from_date <= dateStr)
    .sort((a, b) => {
      const byDate = b.effective_from_date.localeCompare(a.effective_from_date);
      if (byDate !== 0) return byDate;
      return String(b.created_at || '').localeCompare(String(a.created_at || ''));
    });
  return rows.length > 0 ? parseFloat(rows[0].rate) : fallback;
}

function getRateOnDate(studentId, rateHistory, dateStr, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(studentId);
  return getRateOnDateReal(studentId, rateHistory, dateStr, fallback);
}

function getCurrentRate(studentId, rateHistory, fallback = 90) {
  return getRateOnDate(studentId, rateHistory, new Date().toISOString().slice(0, 10), fallback);
}

// What a lesson is worth. An explicit rate_charged is a manual override and
// always wins; otherwise it's the rate that applied on the day it was taught,
// so past lessons keep their old price when you put rates up.
function rateForLesson(lesson, rateHistory, fallback = 90) {
  if (PRIVACY_MONEY_MODE === 'dummy') return dummyRateFor(lesson.student_id);
  if (lesson.rate_charged !== null && lesson.rate_charged !== undefined && lesson.rate_charged !== '') {
    return parseFloat(lesson.rate_charged);
  }
  return getRateOnDateReal(lesson.student_id, rateHistory, lesson.lesson_date, fallback);
}

// Payments and allocations come out of the database as real amounts. In fake
// mode they're scaled by the same ratio the student's rate was faked by, so a
// payment still covers exactly the number of lessons it really covered.
function moneyScaleFor(studentId, rateHistory) {
  if (PRIVACY_MONEY_MODE !== 'dummy') return 1;
  const real = getRateOnDateReal(studentId, rateHistory, new Date().toISOString().slice(0, 10));
  if (!real) return 1;
  return dummyRateFor(studentId) / real;
}

// ---------- Privacy (show / hide / fake, for money and names independently) ----------
// Modes: 'normal' (real data), 'hidden' (fixed-width mask, reveals nothing -
// not even digit count), 'dummy' (plausible fake, stable per element so it
// doesn't flicker between renders or make totals look inconsistent).
//
// Deliberately scoped to DISPLAY ONLY. Nothing that feeds an editable form
// field or a "Copy as text" meant for a parent ever goes through these - a
// demo mode must never risk writing a fake number into the real books, or
// sending a parent a fake balance.
const PrivacyContext = React.createContext({ moneyMode: 'normal', nameMode: 'normal' });
function usePrivacy() { return React.useContext(PrivacyContext); }

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Students become "The Lazy One"; whoever pays for them becomes "The Big Lazy
// One", so the family link is obvious on screen without naming anybody.
const DUMMY_TRAITS = [
  'Lazy','Slow','Smart','Keen','Chatty','Sleepy','Quick','Grumpy',
  'Cheery','Fussy','Bright','Dreamy','Chaotic','Sharp','Sulky','Bouncy',
];

function dummyTraitFor(seedKey) {
  return DUMMY_TRAITS[hashStr(String(seedKey) + ':trait') % DUMMY_TRAITS.length];
}

function dummyNameFor(seedKey) {
  return `The ${dummyTraitFor(seedKey)} One`;
}

// The payer of a given student - same trait, "Big" added.
function dummyPayerNameFor(seedKey) {
  return `The Big ${dummyTraitFor(seedKey)} One`;
}

function hiddenNameFor(seedKey) {
  return `Student ${1000 + (hashStr(String(seedKey)) % 9000)}`;
}

// Session rates in fake mode land on £35-£75 in £5 steps: a believable
// tutoring rate, round like a real one, and nowhere near the real figure.
function dummyRateFor(studentId) {
  return 35 + (hashStr(String(studentId) + ':rate35') % 9) * 5;
}

// Stand-ins for the other identifying fields on the edit form. 07700 900xxx is
// Ofcom's reserved drama/fiction range, so it can never be a real number.
const DUMMY_STREETS = ['Elm','Oak','Ash','Cedar','Maple','Birch','Willow','Hazel'];
const DUMMY_SCHOOLS = ['Northgate High','Kingsway Academy','Parkview School','Beechwood High','Riverside College'];

function dummyPhoneFor(seed) {
  return '07700 900' + String(100 + hashStr(String(seed) + ':ph') % 900);
}
function dummyAddressFor(seed) {
  const n = 1 + hashStr(String(seed) + ':hn') % 98;
  return `${n} ${DUMMY_STREETS[hashStr(String(seed) + ':st') % DUMMY_STREETS.length]} Road`;
}
function dummySchoolFor(seed) {
  return DUMMY_SCHOOLS[hashStr(String(seed) + ':sch') % DUMMY_SCHOOLS.length];
}

const HIDDEN_TEXT_MASK = '•••••';

const HIDDEN_MONEY_MASK = '£•••';

// Money display. By the time a number reaches here it is ALREADY correct for
// the current mode - rates are faked at source and payments are pre-scaled by
// moneyScaleFor - so fake mode just formats. Only hidden mode substitutes,
// with a fixed-width mask so a £45 and a £100 look identical.
function useMoney() {
  const { moneyMode } = usePrivacy();
  return (value, _seedKey, formatter) => {
    const fmt = formatter || (n => `£${Number(n).toFixed(2).replace(/\.00$/, '')}`);
    if (moneyMode === 'hidden') return HIDDEN_MONEY_MASK;
    return fmt(value);
  };
}

// For amounts that arrive already real and have no student to scale against -
// chiefly unmatched Monzo transfers, which come straight off the bank API. Fake
// mode substitutes a plausible transfer: one to four sessions at a fake rate.
function useRawMoney() {
  const { moneyMode } = usePrivacy();
  return (real, seedKey) => {
    if (moneyMode === 'hidden') return HIDDEN_MONEY_MASK;
    if (moneyMode === 'dummy') {
      const h = hashStr(String(seedKey ?? real));
      const sessions = 1 + (h % 4);
      return `£${((35 + (h % 9) * 5) * sessions).toFixed(2).replace(/\.00$/, '')}`;
    }
    return `£${Number(real).toFixed(2).replace(/\.00$/, '')}`;
  };
}

// Name display wrapper. seedKey should be the student's id so the same
// person shows the same fake/hidden label everywhere on screen.
function useNameDisplay() {
  const { nameMode } = usePrivacy();
  return (real, seedKey, isPayer) => {
    if (nameMode === 'hidden') return isPayer ? 'Payer' : hiddenNameFor(seedKey ?? real);
    if (nameMode === 'dummy') {
      return isPayer ? dummyPayerNameFor(seedKey ?? real) : dummyNameFor(seedKey ?? real);
    }
    return real;
  };
}

// ---------- Animated sheet close ----------
// React unmounts instantly, so sheets previously blinked out of existence with
// no exit animation. This keeps the sheet mounted for the length of the close
// animation, then calls the real onClose. Returns the class suffix to apply to
// .overlay/.sheet, plus the close function to use everywhere instead of
// onClose - including internal Close/Cancel buttons, or those would still snap.
function useAnimatedClose(onClose) {
  const [closing, setClosing] = useState(false);
  const timer = React.useRef(null);

  useEffect(() => () => clearTimeout(timer.current), []);

  const close = React.useCallback(() => {
    setClosing(prev => {
      if (prev) return prev;               // already closing; ignore repeats
      timer.current = setTimeout(onClose, 200);
      return true;
    });
  }, [onClose]);

  return [closing ? ' closing' : '', close];
}

function SummaryWidget({ students, rateHistory, showNet = false }) {
  const M = useMoney();
  const active = students.filter(s => s.active);
  const readSavedTarget = () => {
    const n = parseInt(localStorage.getItem('tutortally_full_target') || '', 10);
    return Number.isFinite(n) && n > 0 ? n : 15;
  };
  const [fullTarget, setFullTarget] = useState(readSavedTarget);
  const [targetSaving, setTargetSaving] = useState('idle');

  const weeklyNet = active.reduce((sum, s) => {
    const rate = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? rate : rate * 0.6);
  }, 0);
  const annualNet = weeklyNet * 40;
  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;

  useEffect(() => {
    if (DEMO_MODE) return;
    let cancelled = false;
    supabase.auth.getUser().then(({ data }) => {
      if (cancelled) return;
      const n = parseInt(data?.user?.user_metadata?.fully_booked_target || '', 10);
      if (Number.isFinite(n) && n > 0) {
        setFullTarget(n);
        localStorage.setItem('tutortally_full_target', String(n));
      }
    });
    return () => { cancelled = true; };
  }, []);

  async function saveFullTarget(raw) {
    const next = Math.max(1, Math.min(999, parseInt(raw, 10) || 15));
    setFullTarget(next);
    localStorage.setItem('tutortally_full_target', String(next));
    if (DEMO_MODE) return;
    setTargetSaving('saving');
    const { error } = await supabase.auth.updateUser({ data: { fully_booked_target: next } });
    setTargetSaving(error ? 'error' : 'saved');
    setTimeout(() => setTargetSaving('idle'), 1800);
  }

  const awayFromFull = Math.max(0, fullTarget - active.length);

  const stats = [
    { label: 'students', value: active.length,  accent: false },
    ...(showNet ? [
      { label: 'net/week', value: M(weeklyNet, 'summary-week', fmt),  accent: true  },
      { label: 'net/year', value: M(annualNet, 'summary-year', fmt),  accent: true  },
    ] : []),
  ];

  return (
    <div className="summary-widget" style={{
      background:'linear-gradient(165deg, var(--card) 0%, var(--card-2) 100%)',
      border:'1px solid var(--line)', borderRadius:'var(--r-lg)',
      padding:'18px 17px', marginBottom:14, boxShadow:'var(--sh-2)',
      position:'relative', overflow:'hidden'
    }}>
      {/* Hairline of colour rather than a heavy 3px slab across the top. */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:3,
        background:'linear-gradient(90deg, var(--gold), var(--accent-2))'}} />
      {/* Stats row */}
      {active.length > 0 && (
        <div style={{display:'flex',gap:0,flexWrap:'wrap',marginBottom:16,paddingBottom:15,borderBottom:'1px solid var(--line)'}}>
          {stats.map(({label, value, accent}) => (
            <div key={label} style={{flex:'1 1 70px',minWidth:60}}>
              <div style={{fontSize:'1.95rem',fontWeight:750,color:accent?'var(--gold)':'var(--ink)',letterSpacing:'-0.035em',lineHeight:1}}>{value}</div>
              <div style={{fontSize:'0.66rem',color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em',marginTop:4}}>{label}</div>
            </div>
          ))}
        </div>
      )}
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <label htmlFor="fullTarget" style={{fontSize:'0.82rem',color:'var(--ink-dim)',display:'flex',alignItems:'center',gap:6}}>
            Fully booked at
            <input
              id="fullTarget"
              type="number"
              min="1"
              max="999"
              value={fullTarget}
              onChange={e => setFullTarget(Math.max(1, Math.min(999, parseInt(e.target.value, 10) || 1)))}
              onBlur={e => saveFullTarget(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }}
              style={{width:54,padding:'3px 6px',border:'1px solid var(--line)',borderRadius:6,background:'var(--card)',color:'var(--ink)',font:'inherit',fontSize:'0.82rem'}}

        </div>
        <div style={{background:'var(--card-2)',borderRadius:4,height:5,border:'1px solid var(--line)'}}>
          <div style={{background:'var(--gold)',opacity:awayFromFull===0?1:0.55,width:`${Math.min(active.length/fullTarget,1)*100}%`,height:'100%',borderRadius:4,transition:'width 0.6s cubic-bezier(0.4,0,0.2,1)'}}></div>

function moneyText(n) {

function normaliseUKPhone(raw) {
  const digits = (raw || '').replace(/\D/g, '');
  if (!digits) return '';
  if (digits.startsWith('44')) return digits;
  if (digits.startsWith('0')) return '44' + digits.slice(1);
  return '44' + digits;
}

// ---------- Growth Calculator ----------
function GrowthCalculator({ students, rateHistory, extra, setExtra, extraRate, setExtraRate, extraCash, setExtraCash }) {
  const active = students.filter(s => s.active);
  const avgRate = active.length > 0
    ? Math.round(active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0) / active.length)
    : 90;

  // Use passed props, or init with defaults if not provided
  const e = extra !== undefined ? extra : 4;
  const er = extraRate !== undefined ? extraRate : avgRate;
  const ec = extraCash !== undefined ? extraCash : false;

  const setE = setExtra || (() => {});
  const setER = setExtraRate || (() => {});
  const setEC = setExtraCash || (() => {});

  const currGrossW = active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0);
  const currNetW   = active.reduce((sum, s) => {
    const r = getCurrentRate(s.id, rateHistory);
    return sum + (s.pays_in_cash ? r : r * 0.6);
  }, 0);
  const addGrossW = e * er;
  const addNetW   = e * er * (ec ? 1 : 0.6);

  const fmt = n => n >= 1000000 ? `£${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `£${(n / 1000).toFixed(1)}k` : `£${Math.round(n)}`;
  const M = useMoney();

  const rows = [
    { label: 'Students',  curr: active.length,    add: e,      isCount: true },
    { label: 'Gross/wk', curr: currGrossW,        add: addGrossW  },
    { label: 'Net/wk',   curr: currNetW,          add: addNetW    },
    { label: 'Gross/yr', curr: currGrossW * 40,   add: addGrossW * 40 },
    { label: 'Net/yr',   curr: currNetW * 40,     add: addNetW * 40   },
  ];

  return (
    <div>
      <div style={{display:'flex', gap:10, marginBottom:12}}>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Extra students</label>
          <input type="number" min="1" value={e} onChange={ev => setE(parseInt(ev.target.value)||1)} />
        </div>
        <div className="field" style={{flex:1, marginBottom:0}}>
          <label>Rate £/session</label>
          <input type="number" min="0" step="5" value={er} onChange={ev => setER(parseInt(ev.target.value)||0)} />
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <Toggle checked={ec} onChange={setEC} label="Pay in cash" />
      </div>
      <div className="calc-grid">
        <div className="calc-grid-head"></div>
        <div className="calc-grid-head">Now</div>
        <div className="calc-grid-head">+{e} more</div>
        <div className="calc-grid-head">New total</div>
        {rows.map(({ label, curr, add, isCount }) => (
          <React.Fragment key={label}>
            <div className="calc-grid-cell" style={{color:'var(--muted)'}}>{label}</div>
            <div className="calc-grid-cell">{isCount ? curr : M(curr, `growth-curr-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{color:'var(--accent)'}}>+{isCount ? add : M(add, `growth-add-${label}`, fmt)}</div>
            <div className="calc-grid-cell" style={{fontWeight:600}}>{isCount ? curr+add : M(curr+add, `growth-total-${label}`, fmt)}</div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

  // from was already faked at source, so the headline and every count below it
  // are consistent with each other automatically.
  const shownNetY = addNetY;

  return (
    <div>
      <div style={{fontSize:'0.9rem', color:'var(--ink-dim)', marginBottom:14, lineHeight:1.5}}>
        With this growth, you'd pocket an extra <span style={{fontWeight:600, color:'var(--ink)'}}>{fmt(shownNetY)}/year</span>. That's:
      </div>
      <div className="perspective-grid">
        {items.map(item => {
          const count = Math.floor(shownNetY / item.price);
          return (
            <div className="perspective-item" key={item.name}>
              <div className="emoji">{item.emoji}</div>
              <div className="name">{item.name}</div>
              <div className="count">{count.toLocaleString('en-GB')}</div>
              {item.price < 1000 && <div className="per-year">per year</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Google Calendar ----------
// Self-serve, per-account: unlike the old Apps Script (Daniel's own Google
// login, manually edited to add each new tutor), any signed-in user connects
// their own calendar here with no one else's involvement. All calls carry
// the caller's own Supabase session, and the sync Edge Function only ever
// touches that same account's rows - see google-calendar-connect's comments
// for how the OAuth state param prevents this being spoofable.
// Best-effort strip of the generic lesson-y words tutors tend to put in
// calendar titles alongside a student's name - never trusted outright, just
// a starting guess the tutor confirms or overrides with one tap.
const CALENDAR_TITLE_STOPWORDS = new Set([
  'maths', 'math', 'lesson', 'lessons', 'tutoring', 'tutor', 'session', 'call',
  'zoom', 'catchup', 'catch', 'up', 'revision', 'gcse', 'gcses', 'alevel', 'a',
  'level', 'class', 'meeting', 'online', 'with', 'and', 'the', 'exam',
]);
function guessStudentName(title) {
  const cleaned = title.replace(/[-\u2013\u2014:|()]/g, ' ').replace(/\s+/g, ' ').trim();
  const kept = cleaned.split(' ').filter(w => {
    const key = w.toLowerCase().replace(/[^a-z0-9]/g, '');
    return key && !CALENDAR_TITLE_STOPWORDS.has(key);
  });
  return kept.join(' ').trim() || title.trim();
}

function GoogleUnverifiedNote({ compact = false }) {
  return (
    <div style={{
      marginTop: compact ? 8 : 10,
      padding: compact ? '9px 10px' : '10px 12px',
      border:'1px solid color-mix(in srgb, var(--gold) 45%, transparent)',
      borderRadius:'var(--r-md)',
      background:'color-mix(in srgb, var(--gold) 10%, var(--card))',
      color:'var(--ink-dim)',
      fontSize: compact ? '0.76rem' : '0.78rem',

    }}>
      <b style={{color:'var(--ink)'}}>You may see "Google hasn't verified this app".</b>{' '}
      While TutorTally is this early, tap <b>Advanced</b> at the bottom left, then tap{' '}
      <b>Go to TutorTally (unsafe)</b>. Google uses that exact scary word, but the
      calendar access is read-only.
    </div>
  );
}

function GoogleCalendarPanel({ session, onDataChanged }) {
  const [status, setStatus] = useState(null);
  const [calendars, setCalendars] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [unmatched, setUnmatched] = useState([]);
  const [confirmingTitles, setConfirmingTitles] = useState({});
  const [editingTitles, setEditingTitles] = useState({});
  const [editedNames, setEditedNames] = useState({});

  async function authedFetch(path, opts = {}) {
    const token = session?.access_token;
    return fetch(`${FN_BASE}/${path}`, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: `Bearer ${token}` },
    }).then(r => r.json());
  }

  useEffect(() => { refresh(); }, []);

  async function refresh() {
    setStatus(null);
    const s = await authedFetch('google-calendar-status').catch(e => ({ ok: false, problem: String(e) }));
    setStatus(s);
    if (s.connected && !s.calendar_chosen) {
      const l = await authedFetch('google-calendar-list').catch(() => null);
      setCalendars(l?.calendars || []);
    } else {
      setCalendars(null);
    }
  }

  async function connect() {
    setBusy(true);
    // Tell the callback which domain to come back to. It's checked against an
    // allowlist server-side, so this can't be used to bounce anyone elsewhere.
    const back = encodeURIComponent(window.location.origin + window.location.pathname);
    const r = await authedFetch(`google-calendar-connect?return_to=${back}`).catch(e => ({ ok: false, problem: String(e) }));
    setBusy(false);
    if (r.ok && r.authorize_url) window.location.href = r.authorize_url;
    else setMsg('Could not start the connection - try again.');
  }

  async function pick(cal) {
    setBusy(true);
    setMsg(null);
    await authedFetch('google-calendar-select', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ calendar_id: cal.id, calendar_summary: cal.summary }),
    });
    // Picking the calendar IS the request to use it, so pulling the lessons in
    // is the obvious next thing. Making someone find Sync now afterwards left
    // the app looking empty at the exact moment it was supposed to prove it
    // worked.
    const r = await authedFetch('google-calendar-sync').catch(e => ({ ok: false, problem: String(e) }));
    const mine = r.results?.[0];
    setMsg(r.ok && mine?.ok
      ? `Synced ${mine.synced} lesson${mine.synced === 1 ? '' : 's'}, matched against ${mine.students_matched} student${mine.students_matched === 1 ? '' : 's'}.`
      : `Connected. Tap Sync now to pull your lessons in.`);
    setUnmatched(mine?.unmatched_titles || []);
    setBusy(false);
    refresh();
    onDataChanged?.();
  }

  async function syncNow() {
    setBusy(true); setMsg(null);
    const r = await authedFetch('google-calendar-sync').catch(e => ({ ok: false, problem: String(e) }));
    setBusy(false);
    const mine = r.results?.[0];
    setMsg(r.ok && mine?.ok
      ? `Synced ${mine.synced} lesson${mine.synced === 1 ? '' : 's'}, matched against ${mine.students_matched} student${mine.students_matched === 1 ? '' : 's'}.`
      : `Problem: ${mine?.problem || r.problem || 'unknown'}`);
    setUnmatched(mine?.unmatched_titles || []);
    refresh();
    // A sync writes lessons, and everything on the dashboard is derived from
    // those: who needs chasing, who has nothing booked, the upcoming lists.
    // Without this the app kept showing pre-sync figures until the page was
    // reloaded by hand, so someone whose lessons had just landed stayed in
    // Needs attention for having nothing booked.
    onDataChanged?.();
  }

  // Quick path for onboarding: turn a recurring calendar event nobody's
  // claimed yet straight into a student, using the event title itself as
  // both the name and the match pattern, then re-sync so their lessons
  // land immediately instead of waiting for the next tap of "Sync now".
  async function addStudentFromTitle(title) {
    setBusy(true);
    const ownerId = (await supabase.auth.getUser()).data.user?.id;
    await supabase.from('tutoring_students').insert({
      name: title.trim().slice(0, 80),
      calendar_title_pattern: title,
      active: true,
      lesson_location: 'tutor_home',
      owner_id: ownerId,
    });
    onDataChanged?.();
    await syncNow();
  }

  async function disconnect() {
    setBusy(true);
    await authedFetch('google-calendar-disconnect', { method: 'POST' });
    setBusy(false);
    refresh();
  }

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderRadius:10,
        background:'var(--card-2)', border:'1px solid var(--line)', marginBottom:12, fontSize:'0.85rem'
      }}>
        <span style={{
          width:9, height:9, borderRadius:5, flexShrink:0,
          background: status === null ? 'var(--muted)' : status.connected ? 'var(--good)' : 'var(--warn)'
        }} />
        <span style={{flex:1}}>
          {status === null ? 'Checking…'
            : status.connected && status.calendar_chosen ? `Connected · ${status.calendar_summary}`
            : status.connected ? 'Connected - pick a calendar below'
            : 'Not connected'}
        </span>
      </div>

      {!status?.connected && (
        <>
          <button className="btn save" style={{width:'100%'}} onClick={connect} disabled={busy || status === null}>
            {busy ? 'Opening Google…' : '📅 Connect Google Calendar'}
          </button>
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginTop:10, lineHeight:1.45}}>
            Google will ask you to approve read-only access to your calendars.
            Nothing is shared with anyone else - this connects only your own account.
          </div>
          <GoogleUnverifiedNote />
        </>
      )}

      {status?.connected && !status.calendar_chosen && (
        <>
          <div className="section-label">Which calendar has your lessons?</div>
          {calendars === null && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Loading your calendars…</div>}
          {calendars?.length === 0 && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>No calendars found on that Google account.</div>}
          {calendars?.map(c => (
            <button key={c.id} style={{
              display:'block', width:'100%', textAlign:'left', padding:'12px 14px', marginBottom:7,
              borderRadius:'var(--r-md)', border:'1px solid var(--line)', background:'var(--card-2)',
              fontSize:'0.88rem', cursor:'pointer', fontFamily:'inherit', color:'var(--ink)'
            }} disabled={busy} onClick={() => pick(c)}>
              {c.summary}{c.primary ? ' (main calendar)' : ''}
            </button>
          ))}
        </>
      )}

      {status?.connected && status.calendar_chosen && (
        <>
          <button className="btn save" style={{width:'100%', marginBottom:8}} onClick={syncNow} disabled={busy}>
            {busy ? 'Syncing…' : '↻ Sync now'}
          </button>
          {msg && <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10}}>{msg}</div>}
          {unmatched.length > 0 && (
            <div style={{marginBottom:14}}>
              <div className="section-label">
                {unmatched.length} name{unmatched.length === 1 ? '' : 's'} in your calendar aren't a student yet
              </div>
              {unmatched.map(u => {
                const guess = guessStudentName(u.title);
                return (
                  <div key={u.title} style={{
                    padding:'9px 12px', marginBottom:6,
                    borderRadius:'var(--r-md)', border:'1px solid var(--line)', background:'var(--card-2)',
                  }}>
                    {editingTitles[u.title] ? (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <input type="text" value={editedNames[u.title] ?? guess} autoFocus
                          onChange={e => setEditedNames({...editedNames, [u.title]: e.target.value})}
                          style={{flex:1, fontSize:'0.85rem', padding:'6px 8px', borderRadius:8, border:'1px solid var(--line)', fontFamily:'inherit'}} />
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => addStudentFromTitle((editedNames[u.title] ?? guess).trim())}>
                          + Add
                        </button>
                      </div>
                    ) : confirmingTitles[u.title] ? (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <span style={{flex:1, fontSize:'0.85rem'}}>
                          Is their name <b>{guess}</b>? <span style={{color:'var(--muted)'}}>× {u.count}</span>
                        </span>
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => addStudentFromTitle(guess)}>
                          Yes
                        </button>
                        <button className="btn cancel" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0, minWidth:'auto'}}
                          disabled={busy} onClick={() => setEditingTitles({...editingTitles, [u.title]: true})}>
                          No
                        </button>
                      </div>
                    ) : (
                      <div style={{display:'flex', alignItems:'center', gap:8}}>
                        <span style={{flex:1, fontSize:'0.85rem'}}>
                          {u.title} <span style={{color:'var(--muted)'}}>× {u.count}</span>
                        </span>
                        <button className="btn save" style={{padding:'6px 10px', fontSize:'0.8rem', flexShrink:0}}
                          disabled={busy} onClick={() => setConfirmingTitles({...confirmingTitles, [u.title]: true})}>
                          Add student
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{fontSize:'0.78rem', color:'var(--muted)', lineHeight:1.45}}>
                The guess strips out common lesson words and subjects. Say no if it's wrong
                and type the real name. Their lessons come in straight away, then you can fill
                in the details on their card.
              </div>
            </div>
          )}
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:14, lineHeight:1.5}}>
            Also syncs automatically overnight. Matches events whose title
            contains a student's "name in your calendar" (set on their profile),
            same as before - nothing to reconfigure there.
            {status.last_synced_at && (
              <> Last automatic sync: {new Date(status.last_synced_at).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}.</>
            )}
          </div>
          {status.last_sync_error && (
            <div style={{fontSize:'0.78rem', color:'var(--warn)', marginBottom:14}}>
              Last sync had a problem: {status.last_sync_error}
            </div>
          )}
          <button className="btn cancel" style={{width:'100%'}} onClick={disconnect} disabled={busy}>
            Disconnect
          </button>
        </>
      )}
    </div>
  );
}

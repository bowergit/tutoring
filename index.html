const FN_BASE = 'https://uilytgubukiinyrqrltj.supabase.co/functions/v1';

function MonzoPanel({ students, onDataChanged }) {
  const M = useRawMoney();
  const N = useNameDisplay();
  const nameModeIsNormal = usePrivacy().nameMode === 'normal';
  const [status, setStatus] = useState(null);
  const [pending, setPending] = useState(null);
  const [blocked, setBlocked] = useState([]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [working, setWorking] = useState({});

  const activeStudents = students.filter(s => s.active);

  useEffect(() => { refresh(); }, []);

  async function refresh() {
    setPending(null);
    try {
      const s = await fetch(`${FN_BASE}/monzo-status`).then(r => r.json());
      setStatus(s);
      const p = await fetch(`${FN_BASE}/monzo-review`).then(r => r.json());
      setPending(p.pending || []);
      setBlocked(p.blocked || []);
    } catch (e) {
      setStatus({ connected: false, problem: String(e) });
      setPending([]);
    }
  }

  async function unblock(key) {
    setBlocked(b => b.filter(x => x.key !== key));
    await fetch(`${FN_BASE}/monzo-review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ unblock_key: key }),
    });
    refresh();
  }

  async function syncNow() {
    setBusy(true); setMsg(null);
    try {
      const r = await fetch(`${FN_BASE}/monzo-sync`).then(r => r.json());
      setMsg(r.ok
        ? `Logged ${r.newly_logged} new payment${r.newly_logged === 1 ? '' : 's'}.`
        : `Problem: ${r.problem}`);
      if (r.ok) onDataChanged();
    } catch { setMsg('Sync failed - check your connection.'); }
    setBusy(false);
    refresh();
  }

  async function act(txId, body) {
    setWorking(w => ({ ...w, [txId]: true }));
    try {
      await fetch(`${FN_BASE}/monzo-review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction_id: txId, ...body }),
      });
      setPending(p => p.filter(x => x.transaction_id !== txId));
      if (body.student_id) onDataChanged();
    } finally {
      setWorking(w => ({ ...w, [txId]: false }));
    }
  }

  const connected = status?.connected && status?.data_access_approved;

  return (
    <div>
      <div style={{
        display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderRadius:10,
        background:'var(--card-2)', border:'1px solid var(--line)', marginBottom:12, fontSize:'0.85rem'
      }}>
        <span style={{
          width:9, height:9, borderRadius:5, flexShrink:0,
          background: status === null ? 'var(--muted)' : connected ? 'var(--good)' : 'var(--warn)'
        }} />
        <span style={{flex:1}}>
          {status === null ? 'Checking…'
            : connected ? 'Connected to Monzo'
            : status?.connected ? 'Connected, but data access not approved in the Monzo app'
            : 'Not connected'}
        </span>
        {!connected && status !== null && (
          <a href={`${FN_BASE}/monzo-connect`} style={{
            fontSize:'0.78rem', fontWeight:600, color:'var(--accent)', textDecoration:'none'
          }}>Reconnect →</a>
        )}
      </div>

      <button className="btn save" style={{width:'100%', marginBottom:6}} onClick={syncNow} disabled={busy}>
        {busy ? 'Checking Monzo…' : '↻ Sync payments now'}
      </button>
      {msg && <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:10}}>{msg}</div>}

      <div className="section-label" style={{marginTop:16}}>
        Unrecognised transfers{pending ? ` (${pending.length})` : ''}
      </div>
      <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:10, lineHeight:1.45}}>
        Money that came in but doesn't match a student. Assign one and every future
        transfer from that account is logged automatically; "Never tutoring" hides
        that payer for good. Read live from Monzo - nothing is stored unless you
        assign it.
      </div>

      {pending === null && <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Loading…</div>}
      {pending?.length === 0 && (
        <div style={{fontSize:'0.85rem', color:'var(--muted)'}}>Nothing waiting - all caught up.</div>
      )}

      {pending?.map(t => (
        <div key={t.transaction_id} style={{
          padding:'10px 0', borderBottom:'1px solid var(--line)',
          opacity: working[t.transaction_id] ? 0.45 : 1
        }}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:10}}>
            <span style={{fontWeight:600, fontSize:'0.9rem'}}>{N(t.from || 'Unknown sender', t.from || 'unknown-sender', true)}</span>
            <span style={{fontWeight:700, fontSize:'0.95rem'}}>{M(t.amount, t.transaction_id)}</span>
          </div>
          <div style={{fontSize:'0.75rem', color:'var(--muted)', marginTop:2}}>
            {new Date(t.date + 'T12:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}
            {/* Free-text bank reference can contain a name, so it's hidden
                entirely rather than shown in privacy mode - there's no safe
                way to partially redact arbitrary text. */}
            {nameModeIsNormal && t.reference && t.reference !== t.from ? ` · ${t.reference}` : ''}
          </div>
          <div style={{display:'flex', gap:6, marginTop:8}}>
            <select
              value=""
              disabled={working[t.transaction_id]}
              onChange={e => e.target.value && act(t.transaction_id, { student_id: e.target.value })}
              style={{flex:1, fontSize:'0.82rem', padding:'7px 8px'}}

              <option value="">Assign to student…</option>
              {activeStudents.map(s => <option key={s.id} value={s.id}>{N(s.name, s.id)}</option>)}
            </select>
            <button
              className="btn cancel"
              style={{flex:'0 0 auto', minWidth:'auto', padding:'7px 12px', fontSize:'0.8rem'}}
              disabled={working[t.transaction_id]}
              title={`Never ask about money from ${t.from || 'this payer'} again`}
              onClick={() => act(t.transaction_id, { dismiss: true })}
            >Never tutoring</button>
          </div>
        </div>
      ))}

      {blocked.length > 0 && (
        <>
          <div className="section-label" style={{marginTop:20}}>
            Never tutoring · {blocked.length}
          </div>
          <div style={{fontSize:'0.78rem', color:'var(--muted)', marginBottom:8, lineHeight:1.45}}>
            Money from these accounts is skipped without asking.
          </div>
          {blocked.map(b => (
            <div key={b.key} style={{
              display:'flex', justifyContent:'space-between', alignItems:'center',
              padding:'8px 0', borderBottom:'1px solid var(--line-soft)', fontSize:'0.85rem'
            }}>
              <span>{N(b.name || 'Unnamed account', b.key, true)}</span>
              <button
                className="btn cancel"
                style={{flex:'0 0 auto', minWidth:'auto', padding:'5px 11px', fontSize:'0.76rem'}}
                onClick={() => unblock(b.key)}
              >Unblock</button>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ---------- Sign in and sign up ----------
// A real <form> with the right autocomplete hints, so a password manager
// offers to fill and save it. Signing up puts the tutor straight on the free
// plan: the database trigger creates their subscription row, so there is no
// step here that anyone has to remember to do by hand.
function LoginGate() {
  // /?signup=1 is what the marketing page links to, so someone arriving from
  // "Create my free account" lands on the form they were promised.
  const [mode, setMode] = useState(
    new URLSearchParams(window.location.search).has('signup') ? 'signup' : 'signin'
  );   // signin | signup
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [state, setState] = useState('idle');   // idle | busy | error | reset-sent | check-email
  const [detail, setDetail] = useState('');

  function switchMode(next) {
    setMode(next);
    setState('idle');
    setDetail('');
    setPassword('');
  }

  async function signIn(e) {
    e.preventDefault();
    if (!email.trim() || !password) return;
    setState('busy');
    const { error } = await supabase.auth.signInWithPassword({
      email: email.trim(),
      password,
    });
    if (error) {
      setState('error');
      setDetail(error.message === 'Invalid login credentials'
        ? 'That email and password combination was not recognised.'
        : error.message);
    }
    // On success the auth listener in App swaps this screen out.
  }

  async function signUp(e) {
    e.preventDefault();
    if (!email.trim() || !password) return;
    if (password.length < 8) {
      setState('error');
      setDetail('Use at least 8 characters for your password.');
      return;
    }
    setState('busy');
    // Same redirect rule as the reset link below: origin and path only, or
    // Supabase falls back to the project Site URL, which is a different app.
    const { data, error } = await supabase.auth.signUp({
      email: email.trim(),
      password,
      options: {
        data: { display_name: name.trim() || null },
        emailRedirectTo: window.location.origin + window.location.pathname,
      },
    });
    if (error) {
      setState('error');
      setDetail(error.message);
      return;
    }
    // With email confirmation on there is no session yet, so say so rather
    // than leaving them on a form that looks like it did nothing.
    if (!data.session) setState('check-email');
  }

  async function sendReset() {
    if (!email.trim()) {
      setState('error');
      setDetail('Enter your email address first, then tap this again.');
      return;
    }
    setState('busy');
    // Origin + path only. Supabase checks this against its allowed-redirect
    // list and, if it doesn't match, silently falls back to the project's
    // Site URL - which on this project is the other app entirely. A stray
    // ?v=… left in the address bar was enough to cause that, so anything
    // beyond the path is stripped before asking.
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin + window.location.pathname,
    });
    if (error) { setState('error'); setDetail(error.message); }
    else { setState('reset-sent'); }
  }

  const signingUp = mode === 'signup';
  const notice = (body, backLabel) => (
    <div style={{
      background:'var(--accent-light)', border:'1px solid color-mix(in srgb, var(--accent) 30%, transparent)',

// ---------- Change password ----------
function ChangePassword() {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [state, setState] = useState('idle');
  const [detail, setDetail] = useState('');

  async function save(e) {
    e.preventDefault();
    if (pw.length < 8) { setState('error'); setDetail('Use at least 8 characters.'); return; }
    if (pw !== pw2)    { setState('error'); setDetail('The two passwords do not match.'); return; }
    setState('busy');
    const { error } = await supabase.auth.updateUser({ password: pw });
    if (error) { setState('error'); setDetail(error.message); }
    else { setState('done'); setPw(''); setPw2(''); }
  }

  return (
    <form onSubmit={save}>
      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:14, lineHeight:1.45}}>
        Sets the password for the account you're signed in as. Your password
        manager should offer to update its saved copy.
      </div>
      <div className="field">
        <label>New password</label>
        <input type="password" value={pw} onChange={e => setPw(e.target.value)}
               autoComplete="new-password" placeholder="At least 8 characters" />
      </div>
      <div className="field">
        <label>Confirm new password</label>
        <input type="password" value={pw2} onChange={e => setPw2(e.target.value)}
               autoComplete="new-password" placeholder="Type it again" />
      </div>
      {state === 'error' && (
        <div style={{fontSize:'0.8rem', color:'var(--warn)', marginBottom:12}}>{detail}</div>
      )}
      {state === 'done' && (
        <div style={{fontSize:'0.82rem', color:'var(--accent)', marginBottom:12, fontWeight:600}}>
          Password updated.
        </div>
      )}
      <button className="btn save" style={{width:'100%'}} type="submit" disabled={state === 'busy'}>
        {state === 'busy' ? 'Saving…' : 'Reset password'}
      </button>
    </form>
  );
}

// Account deletion is deliberately a separate, typed confirmation. The Edge
// Function only accepts the signed-in tutor's JWT, cancels any Stripe plan, and
// then removes that tutor's data before deleting the Auth account.
function DeleteAccount({ session }) {
  const [confirming, setConfirming] = useState(false);
  const [word, setWord] = useState('');
  const [state, setState] = useState('idle');
  const [detail, setDetail] = useState('');

  async function removeAccount() {
    if (word !== 'DELETE' || !session?.access_token) return;
    setState('busy');
    setDetail('');
    try {
      const res = await fetch(`${FN_BASE}/delete-account`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ confirm: 'DELETE' }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.ok) throw new Error(body.message || 'Could not delete your account.');
      await supabase.auth.signOut();
    } catch (err) {
      setState('error');
      setDetail(err.message || 'Could not delete your account.');
    }
  }

  if (!confirming) {
    return (
      <div>
        <p style={{fontSize:'0.84rem', color:'var(--ink-dim)', lineHeight:1.5, marginTop:0}}>
          Delete your TutorTally account, students, lessons, payments and calendar connection.
          If you have TutorTally Pro, the subscription is cancelled too.
        </p>
        <button className="btn" style={{width:'100%', background:'var(--warn)', color:'#fff'}} onClick={() => setConfirming(true)}>
          Delete my account
        </button>
      </div>
    );
  }

  return (
    <div>
      <div style={{background:'var(--warn-light)', border:'1px solid var(--warn)', borderRadius:'var(--r-md)', padding:'12px', color:'var(--ink-dim)', fontSize:'0.84rem', lineHeight:1.5, marginBottom:14}}>
        <b style={{color:'var(--warn)'}}>Are you sure?</b> This permanently deletes your TutorTally account and the records in it. Type DELETE to continue.
      </div>
      <div className="field">
        <label>Type DELETE</label>
        <input value={word} onChange={e => setWord(e.target.value)} autoComplete="off" />
      </div>
      {state === 'error' && <div style={{fontSize:'0.8rem', color:'var(--warn)', marginBottom:12}}>{detail}</div>}
      <div style={{display:'flex', gap:8}}>
        <button className="btn" style={{flex:1, background:'var(--card-2)', color:'var(--ink)', border:'1px solid var(--line)'}} onClick={() => { setConfirming(false); setWord(''); setState('idle'); }} disabled={state === 'busy'}>Keep my account</button>
        <button className="btn" style={{flex:1, background:'var(--warn)', color:'#fff'}} onClick={removeAccount} disabled={state === 'busy' || word !== 'DELETE'}>{state === 'busy' ? 'Deleting…' : 'Delete permanently'}</button>
      </div>
    </div>
  );
}

// ---------- Your name ----------
// Sets the header from "TutorTally" to "{name}'s TutorTally" - useful
// now that more than one tutor's account exists on the same app, so each
// person's own copy is visibly theirs. Stored in Supabase Auth's own user
// metadata (auth.updateUser({ data })), not a new table: it's private to the
// account by construction, nobody else can read or set another user's copy.
function YourName({ session }) {
  const [name, setName] = useState(session?.user?.user_metadata?.display_name || '');
  const [phone, setPhone] = useState(session?.user?.user_metadata?.contact_phone || '');
  const [email, setEmail] = useState(session?.user?.user_metadata?.contact_email || '');
  const [state, setState] = useState('idle');

  const loginEmail = session?.user?.email || '';

  async function save(e) {
    e.preventDefault();
    setState('busy');
    // Stored separately from the login email on purpose: the address parents
    // write to has nothing to do with the one used to sign in, and changing
    // an auth email would trigger a confirmation round-trip.
    const { error } = await supabase.auth.updateUser({
      data: {
        display_name: name.trim(),
        contact_phone: normaliseUKPhone(phone),
        contact_email: email.trim(),
      },
    });
    setState(error ? 'error' : 'done');
  }

  return (
    <form onSubmit={save}>
      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:14, lineHeight:1.45}}>
        Shown in the header as "{name.trim() || '…'}'s TutorTally". The email
        and phone here are what the "message the tutor" buttons on each student's
        lesson link use - nobody else's copy changes.
      </div>
      <div className="field">
        <label>Your first name</label>
        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Daniel" />
      </div>
      <div className="field">
        <label>Contact email (for parents)</label>
        <input type="email" value={email} onChange={e => setEmail(e.target.value)}
               autoComplete="off" placeholder={loginEmail || 'you@example.com'} />
        <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
          Doesn't have to be your login address. Leave blank to use{' '}
          {loginEmail ? <b>{loginEmail}</b> : 'the address you sign in with'}.
        </div>
      </div>
      <div className="field">
        <label>Your phone (for parents' WhatsApp button)</label>
        <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. 07787 112345" />
      </div>
      {state === 'done' && (
        <div style={{fontSize:'0.82rem', color:'var(--accent)', marginBottom:12, fontWeight:600}}>Saved.</div>
      )}
      {state === 'error' && (
        <div style={{fontSize:'0.8rem', color:'var(--warn)', marginBottom:12}}>Could not save - try again.</div>
      )}
      <button className="btn save" style={{width:'100%'}} type="submit" disabled={state === 'busy'}>
        {state === 'busy' ? 'Saving…' : 'Save'}
      </button>
    </form>
  );
}

function SetupChecklist({ session, students, onOpenTool, onAddStudent }) {
  const [calendarStatus, setCalendarStatus] = useState(null);
  const meta = session?.user?.user_metadata || {};
  const hasName = !!String(meta.display_name || '').trim();
  const hasPhone = !!normaliseUKPhone(meta.contact_phone || '');
  const hasStudent = students.some(s => s.active);
  const calendarDone = calendarStatus?.connected && calendarStatus?.calendar_chosen;

  useEffect(() => {
    if (!session?.access_token) return;
    fetch(`${FN_BASE}/google-calendar-status`, {
      headers: { Authorization: `Bearer ${session.access_token}` },
    })
      .then(r => r.json())
      .then(setCalendarStatus)
      .catch(() => setCalendarStatus({ ok: false }));
  }, [session?.access_token]);

  // Nothing is known about the calendar until that request lands, and treating
  // unknown as "not done" meant a finished checklist appeared for a moment and
  // then vanished, for everyone who had already done all of it.
  if (calendarStatus === null) return null;

  const items = [
    { key: 'name', done: hasName, text: 'Add your name', tool: 'yourname' },
    { key: 'phone', done: hasPhone, text: 'Add your phone number', tool: 'yourname' },
    {
      key: 'calendar',
      done: calendarDone,
      text: calendarStatus?.connected ? 'Pick your lesson calendar' : 'Connect Google Calendar',
      tool: 'gcal',
    },
    { key: 'student', done: hasStudent, text: 'Add your first student', addStudent: true },
  ];
  const missing = items.filter(item => !item.done);
  if (missing.length === 0) return null;

  return (
    <div style={{
      border:'1px solid var(--line)', background:'var(--card-2)', borderRadius:'var(--r-md)',
      padding:'12px', margin:'0 0 12px',
    }}>
      <div style={{fontSize:'0.82rem', fontWeight:700, color:'var(--ink)', marginBottom:8}}>Setup checklist</div>
      <div style={{display:'flex', flexDirection:'column', gap:7}}>
        {items.map(item => (
          <button
            key={item.key}
            onClick={() => item.addStudent ? onAddStudent?.() : onOpenTool?.(item.tool)}
            style={{
              display:'flex', alignItems:'center', justifyContent:'space-between', gap:10,
              padding:'9px 10px', borderRadius:'var(--r-md)', border:'1px solid var(--line)',
              background:item.done ? 'var(--card)' : 'var(--card-3)', color:'var(--ink)',
              fontFamily:'inherit', cursor:item.done ? 'default' : 'pointer', textAlign:'left',
            }}
            disabled={item.done}
          >
            <span>{item.text}</span>
            <span style={{color:item.done ? 'var(--accent)' : 'var(--muted)', fontWeight:700}}>
              {item.done ? 'Done' : 'Open'}
            </span>
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- Revenue trend ----------
// Two different questions, one chart. "Earned" is what the lessons taught in
// a month were worth; "received" is what actually landed in the bank that
// month. They diverge whenever someone pays late, in advance, or in a lump.
//
// Earned is the default because it is the one with history behind it: lesson
// records go back as far as the calendar does, whereas payment tracking only
// starts when the tutor starts logging payments, so a received-only chart
// shows a couple of bars and looks broken.
function RevenueTrend({ payments, lessons, students, rateHistory }) {
  const M = useMoney();
  const [basis, setBasis] = React.useState('earned');
  const [months, setMonths] = React.useState(12);
  // Half behind, half ahead, so the month you are in sits in the middle and
  // what is already booked is as visible as what has been earned. Money that
  // has actually arrived has no future, so that view stays a plain history.
  const AHEAD = basis === 'earned' ? 6 : 0;
  const BEHIND = basis === 'earned' ? 6 : months - 1;

  const scaleByStudent = {};
  students.forEach(s => { scaleByStudent[s.id] = moneyScaleFor(s.id, rateHistory); });

  const buckets = {};
  const now = new Date();
  for (let i = -BEHIND; i <= AHEAD; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    // Built from local parts, not toISOString: midnight on the 1st in BST is
    // still the previous month in UTC, which silently merged July into June.
    buckets[`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`] = 0;
  }

  if (basis === 'received') {
    payments.forEach(p => {
      const key = String(p.date_paid || '').slice(0, 7);
      if (!(key in buckets)) return;
      buckets[key] += parseFloat(p.amount) * (scaleByStudent[p.student_id] ?? 1);
    });
  } else {
    // A free lesson earned nothing, and a cancelled one never happened. Both
    // would otherwise inflate a month that was quieter than it looks.
    // Lessons still in the diary count too, which is the whole point of
    // showing the months ahead: they are what is booked, not yet taught.
    (lessons || [])
      .filter(l => (l.status === 'completed' || l.status === 'scheduled') && !l.is_complimentary)
      .forEach(l => {
        const key = String(l.lesson_date || '').slice(0, 7);
        if (!(key in buckets)) return;
        buckets[key] += rateForLesson(l, rateHistory);
      });
  }

  // Twelve bare month names is ambiguous as soon as the window crosses a new
  // year, and nothing marked which month is still being earned. Both on the
  // row now.
  const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const rows = Object.entries(buckets).map(([key, total]) => {
    const d = new Date(key + '-01T12:00:00');
    return {
      key, total,
      isNow: key === nowKey,
      // Anything after this month is in the diary rather than in the bank, and
      // is drawn differently so the two are never read as the same thing.
      isFuture: key > nowKey,
      label: `${d.toLocaleDateString('en-GB', { month: 'short' })} ${String(d.getFullYear()).slice(2)}`,
    };
  });

  const peak = Math.max(...rows.map(r => r.total), 1);
  const received = rows.reduce((s, r) => s + r.total, 0);
  const monthsWithMoney = rows.filter(r => r.total > 0).length;
  const average = monthsWithMoney > 0 ? received / monthsWithMoney : 0;
  // Kept apart on purpose. Adding a booked month to an earned one gives a
  // number that is neither, and reads as income that has not happened.
  const earnedToDate = rows.filter(r => !r.isFuture).reduce((s, r) => s + r.total, 0);
  const bookedAhead  = rows.filter(r => r.isFuture).reduce((s, r) => s + r.total, 0);

  // Compare the two most recent complete months, ignoring the current partial
  // one - otherwise every month looks like a collapse until it's over.
  const past = rows.filter(r => !r.isFuture && !r.isNow);
  const lastFull = past[past.length - 1];
  const prevFull = past[past.length - 2];
  const change = lastFull && prevFull && prevFull.total > 0
    ? Math.round(((lastFull.total - prevFull.total) / prevFull.total) * 100)
    : null;

  const empty = monthsWithMoney === 0;

  return (
    <div>
      <div className="seg sub" style={{marginBottom:10}}>
        <button className={basis === 'earned' ? 'sel' : ''} onClick={() => setBasis('earned')}>
          Earned
        </button>
        <button className={basis === 'received' ? 'sel' : ''} onClick={() => setBasis('received')}>
          Received
        </button>
      </div>

      <div style={{fontSize:'0.8rem', color:'var(--muted)', marginBottom:14, lineHeight:1.45}}>
        {basis === 'earned'
          ? 'Six months behind and six ahead, with this month in the middle. Solid bars are lessons taught, striped ones are still in the diary. Free lessons aside, and the change below compares the last two complete months.'
          : 'Money that actually arrived each month, dated by when it was paid. This only goes back as far as you have been logging payments.'}

                empty month ahead read "- booked", which is not a fact. */}
            {(r.isNow || (r.isFuture && r.total > 0)) && (
              <span style={{display:'block', fontSize:'0.62rem', color:'var(--muted)', fontWeight:500}}>
                {r.isNow ? 'so far' : 'booked'}

            )}

        </div>
      ))}

      <div style={{
        display:'flex', gap:14, marginTop:16, paddingTop:14,
        borderTop:'1px solid var(--line)', flexWrap:'wrap'
      }}>
        <div style={{flex:'1 1 90px'}}>
          <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em'}}>
            {M(basis === 'earned' ? earnedToDate : received)}
          </div>
          <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
            {basis === 'earned' ? 'earned, 6 months to date' : `last ${months} months`}
          </div>
        </div>
        <div style={{flex:'1 1 90px'}}>
          <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em'}}>
            {M(basis === 'earned' ? bookedAhead : average)}
          </div>
          <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
            {basis === 'earned' ? 'booked, 6 months ahead' : 'monthly average'}
          </div>
        </div>
        {change !== null && (
          <div style={{flex:'1 1 90px'}}>
            <div style={{fontSize:'1.15rem', fontWeight:750, letterSpacing:'-0.02em',
                         color: change >= 0 ? 'var(--accent)' : 'var(--warn)'}}>
              {change >= 0 ? '+' : ''}{change}%
            </div>
            <div style={{fontSize:'0.66rem', color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.07em', marginTop:2}}>
              {prevFull.label} → {lastFull.label}

          </div>
        )}
      </div>

      {basis === 'received' && <button
        onClick={() => setMonths(months === 12 ? 24 : 12)}
        style={{
          display:'block', width:'100%', marginTop:14, padding:'10px 0',
          background:'none', border:'none', color:'var(--muted)',
          fontFamily:'inherit', fontSize:'0.8rem', cursor:'pointer'
        }}
      >{months === 12 ? 'Show two years' : 'Show one year'}</button>}
    </div>
  );
}

// ---------- Needs attention ----------
// Surfaces the two things that actually cost money if missed: someone owing
// for a while, and an active student with nothing in the diary. Hidden
// entirely when there's nothing wrong, so it never becomes wallpaper.
function NeedsAttention({ students, lessons, payments, allocations, rateHistory, onJump }) {
  const M = useMoney();
  const N = useNameDisplay();
  const today = new Date().toISOString().slice(0, 10);

  const items = [];
  students.filter(s => s.active).forEach(s => {
    const mine = lessons.filter(l => l.student_id === s.id);
    const lessonIds = new Set(mine.map(l => l.id));
    const scale = moneyScaleFor(s.id, rateHistory);

    const owed = mine
      .filter(l => l.status === 'completed' && !l.is_complimentary && !l.pre_settled)
      .reduce((sum, l) => sum + rateForLesson(l, rateHistory), 0);
    const paid = payments
      .filter(p => p.student_id === s.id)
      .reduce((sum, p) => sum + parseFloat(p.amount) * scale, 0);
    const balance = owed - paid;

    const oldestUnpaid = mine
      .filter(l => l.status === 'completed' && !l.is_complimentary && !l.pre_settled)
      .filter(l => {
        const covered = allocations
          .filter(a => a.lesson_id === l.id)
          .reduce((sum, a) => sum + parseFloat(a.amount) * scale, 0);
        return covered < rateForLesson(l, rateHistory) - 0.005;
      })
      .sort((a, b) => a.lesson_date.localeCompare(b.lesson_date))[0];

    if (balance > 0.005 && oldestUnpaid) {
      const days = Math.floor((new Date(today) - new Date(oldestUnpaid.lesson_date)) / 86400000);
      if (days >= 7) {
        items.push({
          id: s.id + ':owing', studentId: s.id, name: s.name,
          why: `${M(balance, s.id + ':balance')} · ${days}d`,
          sort: 1000 - days,
        });
      }
    }

    const hasUpcoming = mine.some(l => l.status === 'scheduled' && l.lesson_date >= today);
    if (!hasUpcoming) {
      items.push({
        id: s.id + ':nolesson', studentId: s.id, name: s.name,
        why: 'nothing booked', sort: 2000,
      });
    }
  });

  if (items.length === 0) return null;
  items.sort((a, b) => a.sort - b.sort);

  return (
    <div className="attn">
      <div className="attn-title">Needs attention · {items.length}</div>
      {items.slice(0, 6).map(it => (
        <div className="attn-item" key={it.id} onClick={() => onJump(it.studentId)}>
          <span>{N(it.name, it.studentId)}</span>
          <span className="attn-why">{it.why}</span>
        </div>
      ))}
    </div>
  );
}

// Deliberately harder to trigger than a tap - this fires a permanent delete,
// so a drag past 90% of the track is the confirmation, not a click.
function SlideToConfirm({ onConfirm }) {
  const trackRef = React.useRef(null);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [done, setDone] = useState(false);
  const HANDLE = 34;

  function clampAndMaybeFire(clientX) {
    const rect = trackRef.current.getBoundingClientRect();
    const max = rect.width - HANDLE - 4;
    const x = Math.min(Math.max(clientX - rect.left - HANDLE / 2, 0), max);
    setDragX(x);
    if (x >= max * 0.9) {
      setDragging(false);
      setDone(true);
      onConfirm();
    }
  }

  return (
    <div ref={trackRef} style={{
      position:'relative', height:38, borderRadius:19, background:'var(--card-2)',
      border:'1.5px solid var(--warn)', overflow:'hidden', userSelect:'none', touchAction:'none',
    }}
      onPointerMove={e => dragging && clampAndMaybeFire(e.clientX)}
      onPointerUp={() => { if (dragging && !done) { setDragging(false); setDragX(0); } }}
      onPointerLeave={() => { if (dragging && !done) { setDragging(false); setDragX(0); } }}>
      <div style={{
        position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
        fontSize:'0.8rem', color:'var(--warn)', pointerEvents:'none',
      }}>
        {done ? 'Deleting…' : 'Slide to permanently delete →'}
      </div>
      <div
        onPointerDown={e => { if (!done) { setDragging(true); e.target.setPointerCapture(e.pointerId); } }}
        style={{
          position:'absolute', top:2, left:2, width:HANDLE, height:HANDLE, borderRadius:HANDLE / 2,
          background:'var(--warn)', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center',
          transform:`translateX(${dragX}px)`, transition: dragging ? 'none' : 'transform 0.2s',
          cursor: done ? 'default' : 'grab', touchAction:'none', fontSize:'1rem', lineHeight:1,
        }}><span style={{transform:'translateY(-1px)'}}>🗑</span></div>
    </div>
  );
}

function GlobalToolsSheet({ students, rateHistory, payments = [], lessons = [], userEmail, session, entitlement, initialTool = null, moneyMode, setMoneyMode, nameMode, setNameMode, onClose, onReplayWalkthrough, onDataChanged, onAddStudent }) {
  const N = useNameDisplay();
  const [cls, close] = useAnimatedClose(onClose);
  // Opens straight onto a panel when the walkthrough sent them here, so the
  // step that says "open calendar settings" actually lands on it.
  const [tool, setTool] = useState(initialTool);
  const [buysOpen, setBuysOpen] = useState(false);
  const privacyOn = moneyMode !== 'normal' || nameMode !== 'normal';
  const archived = students.filter(s => !s.active);
  const danielOnly = isDanielAccount(session);

  // Growth calculator state (shared with perspective calc)
  const active = students.filter(s => s.active);
  const avgRate = active.length > 0
    ? Math.round(active.reduce((sum, s) => sum + getCurrentRate(s.id, rateHistory), 0) / active.length)
    : 90;
  const [extra, setExtra] = useState(4);
  const [extraRate, setExtraRate] = useState(avgRate);
  const [extraCash, setExtraCash] = useState(false);

  // avgRate is derived from rates that are themselves faked in privacy mode, but
  // extraRate was seeded once at mount - so without this it would keep showing
  // the real average after the switch was flipped, leaking the very figure the
  // switch is meant to hide.
  useEffect(() => { setExtraRate(avgRate); }, [moneyMode]);

  const addNetW = extra * extraRate * (extraCash ? 1 : 0.6);

  async function unarchive(id) {
    await supabase.from('tutoring_students').update({ active: true }).eq('id', id);
    onDataChanged();
  }

  const [deletingId, setDeletingId] = useState(null);

  // Monzo transactions aren't owned by the student the way lessons/payments
  // are - they're real bank history - so unmatch rather than let the delete
  // cascade take them. Everything else (lessons, payments, rate history,
  // bundles) has ON DELETE CASCADE and goes with the student.
  async function deleteStudent(id) {
    await supabase.from('tutoring_monzo_transactions')
      .update({ matched_student_id: null }).eq('matched_student_id', id);
    await supabase.from('tutoring_students').delete().eq('id', id);
    setDeletingId(null);
    onDataChanged();

  const backBtn = (
    <button style={{background:'none',border:'none',color:'var(--muted)',cursor:'pointer',fontSize:'1.1rem',padding:0}} onClick={() => setTool(null)}>←</button>

  // Panels that belong together share one screen with a switch across the top,
  // rather than sitting as separate lines in the menu. Six entries collapse to
  // three, and the pair you actually wanted is one tap away instead of a
  // return trip through the menu.

    money:   { title: 'Money',        tabs: danielOnly ? [['revenue', 'Revenue trend'], ['growth', 'Growth calculator']] : [['revenue', 'Revenue trend']] },

      <div style={{marginBottom:16}}>
        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
          {backBtn}
          <h2 style={{margin:0}}>{group.title}</h2>
        </div>
        <div className="seg">

            <button
              key={id}
              className={id === leaf ? 'sel' : ''}
              onClick={() => setTool(id)}
            >{label}</button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className={`overlay${cls}`} onClick={e => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        {!tool && (

            <h2>Settings</h2>

              onOpenTool={setTool}
              onAddStudent={() => { close(); setTimeout(() => onAddStudent?.(), 220); }}

            <div className="tools-menu">
              <ToolsSection title="Setup">
                <ToolsRow
                  title="Google Calendar"
                  subtitle="Choose the calendar TutorTally reads for lessons"
                  onClick={() => setTool('gcal')}
                />
                {danielOnly && (
                  <ToolsRow
                    title="Monzo payments"
                    subtitle="Match incoming bank transfers to students"
                    onClick={() => setTool('monzo')}
                  />
                )}
              </ToolsSection>

              <ToolsSection title="Money">
                <ToolsRow
                  title="Billing & subscription"
                  subtitle="Manage Stripe and your TutorTally plan"
                  onClick={() => setTool('billing')}
                />
                <ToolsRow
                  title={danielOnly ? 'Revenue and growth' : 'Revenue trend'}

                  onClick={() => setTool('revenue')}

          </>
        )}
        <div className="btn-row" style={{marginTop:20}}>
          <button className="btn cancel" onClick={close}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Add/Edit Student Modal ----------
function StudentFormModal({ student, onClose, onSaved, allStudents = [], rateHistory = [], defaultRate = null, session }) {
  const [cls, close] = useAnimatedClose(onClose);
  const { moneyMode, nameMode } = usePrivacy();
  const N = useNameDisplay();
  const isEdit = !!student;
  const danielOnly = isDanielAccount(session);

  // With privacy on, the form shows masked values so it can be demonstrated
  // without exposing anything - and becomes read-only, because a field you can
  // edit while it displays a fake value is one Save away from writing that
  // fake value into the real record.
  const demo = moneyMode !== 'normal' || nameMode !== 'normal';
  const seed = student?.id || 'new-student';
  const maskName  = (real, isPayer) => nameMode === 'normal' ? real
    : nameMode === 'dummy' ? (isPayer ? dummyPayerNameFor(seed) : dummyNameFor(seed))
    : HIDDEN_TEXT_MASK;
  const maskText  = (real, faker) => nameMode === 'normal' ? real
    : nameMode === 'dummy' ? faker(seed)
    : HIDDEN_TEXT_MASK;
  const maskRate  = real => moneyMode === 'normal' ? real
    : moneyMode === 'dummy' ? String(dummyRateFor(seed))
    : '•••';
  const existingBoard = student?.exam_board || '';
  const initPreset = PRESET_BOARDS.includes(existingBoard) ? existingBoard : (existingBoard ? 'other' : '');
  const initialLessonLocation = studentLessonLocation(student);
  const initialInPerson = isEdit ? !!initialLessonLocation : true;

  const [form, setForm] = useState({
    name: student?.name || '',
    parent_name: student?.parent_name || '',
    parent_phone: student?.parent_phone || '',
    address: student?.address || '',
    school: student?.school || '',
    school_year: student?.school_year || '',
    exam_board_preset: initPreset,
    exam_board_custom: initPreset === 'other' ? existingBoard : '',
    exam_tier: student?.exam_tier || '',
    has_extra_time: student?.has_extra_time || false,
    pays_in_cash: !!student?.pays_in_cash,
    is_zoom: !!student?.is_zoom,
    in_person: initialInPerson,
    lesson_location: initialLessonLocation || 'tutor_home',
    zoom_link: student?.zoom_link || '',
    monzo_payer_name: student?.monzo_payer_name || '',
    general_notes: student?.general_notes || '',
    calendar_title_pattern: student?.calendar_title_pattern || '',
    spreadsheet_url: student?.spreadsheet_url || '',
    referred_by_student_id: student?.referred_by_student_id || '',
    active: student?.active !== undefined ? student.active : true,
  });
  const todayStr = new Date().toISOString().slice(0, 10);
  // A new student starts on the tutor's usual fee (set during setup) so the
  // common case needs no typing; an existing one keeps whatever they're on,
  // which is loaded from rate history below.
  const [ratePerSession, setRatePerSession] = useState(
    !student && defaultRate != null ? String(defaultRate) : ''
  );
  const [originalRate, setOriginalRate] = useState(null);
  const [rateFrom, setRateFrom] = useState(todayStr);
  const [saving, setSaving] = useState(false);
  const septemberLabel = septemberSchoolYearLabel(form.school_year);

  function toggleOnline(v) {
    setForm(f => ({
      ...f,
      is_zoom: v,
      zoom_link: v && !f.zoom_link ? 'https://zoom.us/' : f.zoom_link,
    }));
  }

  function toggleInPerson(v) {
    setForm(f => ({
      ...f,
      in_person: v,
      lesson_location: f.lesson_location || 'tutor_home',
    }));
  }

  useEffect(() => {
    if (!isEdit || !student?.id) return;
    async function fetchRate() {
      const today = new Date().toISOString().slice(0, 10);
      const { data } = await supabase
        .from('tutoring_rate_history')
        .select('rate')
        .eq('student_id', student.id)
        .lte('effective_from_date', today)
        .order('effective_from_date', { ascending: false })
        .limit(1)
        .single();
      if (data) {
        const r = parseFloat(data.rate);
        setRatePerSession(r.toString());
        setOriginalRate(r);
      }
    }
    fetchRate();
  }, []);

  async function handleSave() {
    setSaving(true);
    const exam_board = form.exam_board_preset === 'other'
      ? form.exam_board_custom
      : form.exam_board_preset;
    const payload = {
      name: form.name,
      parent_name: form.parent_name,
      parent_phone: form.parent_phone,
      address: form.address,
      school: form.school,
      school_year: form.school_year ? parseInt(form.school_year) : null,
      school_year_as_of_date: form.school_year
        ? (parseInt(form.school_year) !== student?.school_year
            ? new Date().toISOString().slice(0, 10)
            : (student?.school_year_as_of_date || new Date().toISOString().slice(0, 10)))
        : null,
      exam_board: exam_board || null,
      exam_tier: form.exam_tier || null,
      has_extra_time: form.has_extra_time,
      pays_in_cash: form.pays_in_cash,
      is_zoom: form.is_zoom,
      lesson_location: form.in_person ? form.lesson_location : null,
      zoom_link: form.zoom_link || null,
      monzo_payer_name: danielOnly ? (form.monzo_payer_name || null) : (student?.monzo_payer_name || null),
      general_notes: form.general_notes,
      // Blank must be stored as null, not '': an empty string is a pattern
      // that matches every event title, which would hand this student the
      // tutor's entire calendar.
      calendar_title_pattern: form.calendar_title_pattern.trim() || null,
      spreadsheet_url: form.spreadsheet_url || null,
      referred_by_student_id: danielOnly ? (form.referred_by_student_id || null) : (student?.referred_by_student_id || null),
      active: form.active,
    };

    // owner_id must be set explicitly on every insert: the column DEFAULT
    // points at Daniel's canonical account, so a second tenant's insert would
    // otherwise be silently rejected by the RLS WITH CHECK clause (owner_id
    // from the default wouldn't match their own auth.uid()).
    const ownerId = (await supabase.auth.getUser()).data.user?.id;

    let studentId = student?.id;
    if (isEdit) {
      await supabase.from('tutoring_students').update(payload).eq('id', student.id);
    } else {
      const { data: newStudent } = await supabase.from('tutoring_students')
        .insert({ ...payload, owner_id: ownerId }).select().single();
      studentId = newStudent?.id;
    }

    const rateNum = parseFloat(ratePerSession);
    const rateChanged = rateNum !== originalRate;
    const schedulingFutureRise = rateFrom !== todayStr;
    if (studentId && ratePerSession && !isNaN(rateNum) && (rateChanged || schedulingFutureRise)) {
      // Backdating a correction must win over anything it's meant to replace.
      // The rate lookup picks whichever row has the latest effective_from_date
      // that's still on/before a lesson's date - so without this, an existing
      // row dated after the new backdated date (but still in the past) would
      // keep outranking it, and the correction would silently never apply.
      // Future-scheduled rises (effective_from_date > today) are left alone.
      if (rateFrom <= todayStr) {
        await supabase.from('tutoring_rate_history')
          .delete()
          .eq('student_id', studentId)
          .gt('effective_from_date', rateFrom)
          .lte('effective_from_date', todayStr);
      }
      // Upsert, not insert: editing a rate twice in one day must replace that
      // day's figure rather than leave two rows competing for the same date.
      await supabase.from('tutoring_rate_history').upsert({
        student_id: studentId,
        rate: rateNum,
        effective_from_date: rateFrom,
        owner_id: ownerId,
      }, { onConflict: 'student_id,effective_from_date' });

      // Changing a rate changes what each lesson costs, so money already
      // spread across lessons has to be spread again. Without this a lesson
      // stays over-allocated at the old rate and the next stays short, which
      // shows as "part paid" even though the total received is exactly right.
      await supabase.rpc('reallocate_student_payments', { p_student_id: studentId });
    }

    setSaving(false);
    onSaved();
  }

  return (
    <div className={`overlay${cls}`} onClick={(e) => e.target === e.currentTarget && close()}>
      <div className={`sheet${cls}`}>
        <h2>{isEdit ? 'Edit student' : 'Add student'}</h2>

        {demo && (
          <div style={{
            fontSize:'0.76rem', fontWeight:600, color:'#fff', background:'var(--gold)',
            padding:'8px 11px', borderRadius:8, marginBottom:14, lineHeight:1.4
          }}>
            Privacy mode is on, so this form shows masked values and is read-only.
            Turn it off in Settings to make changes.
          </div>
        )}

        {/* One wrapper rather than readOnly on fifteen inputs: this also stops
            the toggles and selects being changed, so nothing here can be
            altered while the values on display aren't the real ones. */}
        <div style={demo ? { pointerEvents: 'none', opacity: 0.9 } : undefined}>
        <div className="field">
          <label>Name</label>
          <input type="text" value={maskName(form.name)} onChange={e => setForm({...form, name: e.target.value})} />
        </div>
        <div className="field">
          <label>Parent name</label>
          <input type="text" value={maskName(form.parent_name, true)} onChange={e => setForm({...form, parent_name: e.target.value})} />
        </div>
        <div className="field">
          <label>Parent's mobile number</label>
          <input type="text" value={maskText(form.parent_phone, dummyPhoneFor)} onChange={e => setForm({...form, parent_phone: e.target.value})} placeholder="07700 900000" />
        </div>
        <div className="field">
          <label>School</label>
          <input type="text" list="school-options" value={maskText(form.school, dummySchoolFor)} onChange={e => setForm({...form, school: e.target.value})} />
          <datalist id="school-options">
            {[...new Set(allStudents.map(s => s.school).filter(Boolean))].map(sc => <option key={sc} value={sc} />)}
          </datalist>
        </div>
        <div className="field">
          <label>Rate per session</label>
          <div className="rate-cash-row">
            {/* type=text while masked, because a number input cannot render dots */}
            <div className="money-input">
              <span>£</span>
              <input type={demo ? 'text' : 'number'} min="0" step="5"
                value={maskRate(ratePerSession)}
                onChange={e => setRatePerSession(e.target.value)} placeholder="90" />
            </div>
            <Toggle checked={form.pays_in_cash} onChange={v => setForm({...form, pays_in_cash: v})} label="Cash" />
          </div>
          <label style={{marginTop:10}}>Effective from</label>
          <input type="date" value={rateFrom} onChange={e => setRateFrom(e.target.value)} />
          <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
            Leave as today to change the rate now, or set a future date to
            schedule a rise. Lessons keep whichever rate applied on the day they
            were taught.
          </div>
          {isEdit && student?.id && (() => {
            const future = (rateHistory || [])
              .filter(r => r.student_id === student.id && r.effective_from_date > todayStr)
              .sort((a, b) => a.effective_from_date.localeCompare(b.effective_from_date));
            if (future.length === 0) return null;
            return (
              <div style={{fontSize:'0.78rem', color:'var(--gold)', marginTop:6}}>
                Scheduled: {future.map(r =>
                  `£${maskRate(String(parseFloat(r.rate)))} from ${new Date(r.effective_from_date + 'T12:00:00')
                    .toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}`
                ).join(' · ')}
              </div>
            );
          })()}
        </div>
        <div className="field">
          <label>School year (7-13, as of today)</label>
          <input type="number" min="7" max="13" value={form.school_year} onChange={e => setForm({...form, school_year: e.target.value})} />
          {septemberLabel && (
            <div style={{fontSize:'0.76rem', color:'var(--gold)', marginTop:5, lineHeight:1.45}}>
              {septemberLabel}
            </div>
          )}
        </div>
        <div className="field">
          <label>Exam board</label>
          <select value={form.exam_board_preset} onChange={e => setForm({...form, exam_board_preset: e.target.value})}>
            <option value="">-</option>
            <option value="Edexcel">Edexcel</option>
            <option value="AQA">AQA</option>
            <option value="Edexcel IGCSE">Edexcel IGCSE</option>
            <option value="OCR">OCR</option>
            <option value="other">Other</option>
          </select>
          {form.exam_board_preset === 'other' && (
            <input type="text" style={{marginTop: 6}} value={form.exam_board_custom}
              onChange={e => setForm({...form, exam_board_custom: e.target.value})}
              placeholder="e.g. OCR, Cambridge" />
          )}
        </div>
        <div className="field">
          <label>Exam tier</label>
          <select value={form.exam_tier} onChange={e => setForm({...form, exam_tier: e.target.value})}>
            <option value="">-</option>
            <option value="foundation">Foundation</option>
            <option value="higher">Higher</option>
            <option value="not_sure">Not sure yet</option>
          </select>
        </div>
        <div className="field">
          <Toggle checked={form.has_extra_time} onChange={v => setForm({...form, has_extra_time: v})} label="Has extra time (25%)" />
        </div>
        <div className="field">
          <div style={{display:'flex', alignItems:'center', gap:16, flexWrap:'wrap'}}>
            <Toggle checked={form.is_zoom} onChange={toggleOnline} label="Online lesson" />
            <Toggle checked={form.in_person} onChange={toggleInPerson} label="In person lesson" />
          </div>
        </div>
        {form.is_zoom && (
          <div className="field">
            <label>Online link</label>
            <input type="text" value={form.zoom_link}
              onChange={e => setForm({...form, zoom_link: e.target.value})}
              placeholder="https://zoom.us/..." />
          </div>
        )}
        {form.in_person && (
          <div className="field">
            <label>In person location</label>
            <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
              <button type="button" className={`billing-btn ${form.lesson_location === 'student_home' ? '' : 'ghost'}`}
                onClick={() => setForm({...form, lesson_location:'student_home'})}>
                Student's house
              </button>
              <button type="button" className={`billing-btn ${form.lesson_location === 'tutor_home' ? '' : 'ghost'}`}
                onClick={() => setForm({...form, lesson_location:'tutor_home'})}>
                Tutor's house
              </button>
            </div>
          </div>
        )}
        {form.in_person && form.lesson_location === 'student_home' && (
          <div className="field">
            <label>Address</label>
            <input type="text" value={maskText(form.address, dummyAddressFor)} onChange={e => setForm({...form, address: e.target.value})} />
          </div>
        )}
        {danielOnly && (
          <div className="field">
            <label>Expect bank transfers from</label>
            <input type="text" value={maskName(form.monzo_payer_name, true)}
              onChange={e => setForm({...form, monzo_payer_name: e.target.value})}

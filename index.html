function Walkthrough({ session, students, onOpenTool, onAddStudent, onDone, onPausedChange }) {
  const meta = session?.user?.user_metadata || {};

  // Someone who already told us their name and number does not need to be
  // asked again on their way through, so that step is dropped rather than
  // shown pre-filled. Fixed at mount: the list must not shorten underneath
  // them the moment they type into it.
  const [steps] = useState(() => WT_STEPS.filter(st => (
    st.key !== 'you' || !(meta.display_name && meta.contact_phone)
  )));

  const startAt = typeof meta.wt_step === 'number' && meta.wt_step > 0
    // The stored position is an index, and the list is a different length
    // depending on what they had already filled in, so it is clamped.
    ? Math.min(meta.wt_step, steps.length - 1)
    : 0;
  const [step, setStep] = useState(startAt);
  const [paused, setPausedState] = useState(false);
  // Told to the app as well, so the Tools button can come back while they
  // wander - looking around is the whole point of pausing, and Tools is where
  // half the app lives.
  const setPaused = v => { setPausedState(v); onPausedChange?.(v); };
  const [saving, setSaving] = useState(false);
  const [calStatus, setCalStatus] = useState(null);
  // True whenever a sheet is on screen, which for most steps is the thing the
  // step just told them to open.
  const [sheetOpen, setSheetOpen] = useState(false);
  // Lets them pull the full instructions back up over a sheet if they need to
  // re-read them, at the cost of the room the sheet had.
  const [expanded, setExpanded] = useState(false);
  const barRef = React.useRef(null);

  useEffect(() => {
    const check = () => setSheetOpen(!!document.querySelector('.overlay:not(.closing)'));
    check();
    const mo = new MutationObserver(check);
    mo.observe(document.body, {
      childList: true, subtree: true, attributes: true, attributeFilter: ['class'],
    });
    return () => mo.disconnect();
  }, []);

  // Closing the sheet drops the expanded state, so the next one opens compact.
  useEffect(() => { if (!sheetOpen) setExpanded(false); }, [sheetOpen]);

  // Measured rather than assumed: the bar is a different height compact,
  // expanded, and on a phone with a home indicator.
  React.useLayoutEffect(() => {
    if (sheetOpen && barRef.current) {
      document.body.dataset.wtBar = '1';
      document.body.style.setProperty('--wt-bar-h', barRef.current.offsetHeight + 'px');
    } else {
      delete document.body.dataset.wtBar;
      document.body.style.removeProperty('--wt-bar-h');
    }
  });

  useEffect(() => () => {
    delete document.body.dataset.wtBar;
    document.body.style.removeProperty('--wt-bar-h');
  }, []);

  const [name, setName]   = useState(meta.display_name || '');
  const [email, setEmail] = useState(meta.contact_email || '');
  const [phone, setPhone] = useState(meta.contact_phone || '');
  const [rate, setRate]   = useState(meta.default_rate != null ? String(meta.default_rate) : '');

  const s = steps[step];
  const isLast = step === steps.length - 1;
  // Archived students would otherwise be counted, which reads as wrong to
  // someone checking the number against what's on their screen.
  const activeCount = students.filter(x => x.active).length;

  // Live connection state, so the calendar step tells them where they actually
  // are rather than assuming the tap worked.
  useEffect(() => {
    if (s.key !== 'calendar' && s.key !== 'students') { setCalStatus(null); return; }
    let cancelled = false;
    const load = () => fetch(`${FN_BASE}/google-calendar-status`, {
      headers: { Authorization: `Bearer ${session?.access_token}` },
    }).then(r => r.json()).then(d => { if (!cancelled) setCalStatus(d); }).catch(() => {});
    load();
    // The calendar gets picked in a sheet this component knows nothing about,
    // so fetching once left the banner insisting they still had to choose one
    // long after they had. Re-checked while the step is open, and again the
    // moment the sheet closes.
    const id = setInterval(load, 4000);
    return () => { cancelled = true; clearInterval(id); };
  }, [step, sheetOpen]);

  async function persist(nextStep) {
    const data = { wt_step: nextStep };
    if (s.form) {
      data.display_name  = name.trim();
      data.contact_email = email.trim();
      data.contact_phone = normaliseUKPhone(phone);
      const r = parseFloat(rate);
      data.default_rate = isNaN(r) ? null : r;
    }
    await supabase.auth.updateUser({ data });
  }

  async function next() {
    setSaving(true);
    if (isLast) { await persist(-1); setSaving(false); onDone(); return; }
    await persist(step + 1);
    setSaving(false);
    setStep(step + 1);
  }

  async function skip() {
    setSaving(true);
    await persist(-1);
    setSaving(false);
    onDone();
  }

  if (paused) {
    return ReactDOM.createPortal(
      <button onClick={() => setPaused(false)} style={{
        position:'fixed', right:14, bottom:14, zIndex:150,
        padding:'11px 16px', borderRadius:100, border:'1px solid var(--accent)',
        background:'var(--card)', color:'var(--accent)', fontFamily:'inherit',
        fontSize:'0.82rem', fontWeight:650, boxShadow:'var(--sh-3)', cursor:'pointer',
      }}>
        ▶ Back to setup · {step + 1}/{steps.length}
      </button>, document.body
    );
  }

  // A sheet is open and they have not asked to re-read the step, so the
  // walkthrough gets out of the way. It stays on screen, because the step it
  // is on is usually the instruction for the sheet they are looking at.
  if (sheetOpen && !expanded) {
    return ReactDOM.createPortal(
      <div ref={barRef} style={{
        position:'fixed', left:0, right:0, bottom:0, zIndex:150,
        background:'var(--card)', borderTop:'1px solid var(--line)',
        boxShadow:'var(--sh-3)',
        padding:'10px 14px calc(10px + env(safe-area-inset-bottom))',
      }}>
        <div style={{
          maxWidth:680, margin:'0 auto', display:'flex', alignItems:'center', gap:10,
        }}>
          <span style={{
            fontSize:'0.66rem', fontWeight:700, letterSpacing:'0.06em',
            color:'var(--muted)', flexShrink:0,
          }}>{step + 1}/{steps.length}</span>
          <span style={{
            flex:1, minWidth:0, fontSize:'0.84rem', fontWeight:650,
            overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
          }}>{s.title}</span>
          <button onClick={() => setExpanded(true)} style={{
            flexShrink:0, padding:'8px 12px', borderRadius:'var(--r-md)',
            border:'1px solid var(--line)', background:'var(--card-2)',
            color:'var(--ink)', fontFamily:'inherit', fontSize:'0.78rem',
            fontWeight:600, cursor:'pointer',
          }}>Steps</button>
          <button className="btn save" onClick={next} disabled={saving}
            style={{flexShrink:0, minWidth:0, padding:'9px 16px'}}>
            {saving ? '…' : isLast ? 'Finish' : 'Next'}
          </button>
        </div>
      </div>, document.body
    );
  }

  return ReactDOM.createPortal(
    <>
    {s.anchor && <Spotlight anchor={s.anchor} />}
    <div ref={barRef} style={{
      position:'fixed', left:0, right:0, bottom:0, zIndex:150,
      background:'var(--card)', borderTop:'1px solid var(--line)',
      boxShadow:'var(--sh-3)', padding:'16px 16px calc(16px + env(safe-area-inset-bottom))',
      maxHeight: sheetOpen ? '46vh' : '72vh', overflowY:'auto', overflowX:'hidden',
    }}>
      <div style={{maxWidth:680, margin:'0 auto'}}>
        <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:7}}>
          <span style={{
            fontSize:'0.66rem', fontWeight:700, letterSpacing:'0.07em',
            textTransform:'uppercase', color:'var(--muted)',
          }}>Setup · {step + 1} of {steps.length}</span>
          <div style={{flex:1, height:3, background:'var(--card-3)', borderRadius:2}}>
            <div style={{
              width:`${((step + 1) / steps.length) * 100}%`, height:'100%',
              background:'var(--accent-fill)', borderRadius:2, transition:'width .25s',
            }} />
          </div>
          {sheetOpen && (
            <button onClick={() => setExpanded(false)} title="Shrink out of the way" style={{
              background:'none', border:'none', color:'var(--muted)', cursor:'pointer',
              fontFamily:'inherit', fontSize:'0.9rem', padding:'0 2px', flexShrink:0,
            }}>▾</button>
          )}
        </div>

        <div style={{fontSize:'1.02rem', fontWeight:700, marginBottom:5}}>{s.title}</div>
        <div style={{fontSize:'0.86rem', color:'var(--ink-dim)', lineHeight:1.5, marginBottom:12}}>
          {s.body}
        </div>

        {s.points && (
          <div style={{marginBottom:12}}>
            {s.points.map(([label, text]) => (
              <div key={label} style={{
                display:'flex', gap:9, marginBottom:7,
                fontSize:'0.82rem', lineHeight:1.45,
              }}>
                <span style={{
                  fontWeight:700, color:'var(--ink)', flexShrink:0,
                  minWidth:96, whiteSpace:'nowrap',
                }}>{label}</span>
                <span style={{color:'var(--ink-dim)'}}>
                  {/* **like this** comes out bold, so the field they actually
                      have to type into is findable without reading a sentence. */}
                  {text.split(/\*\*/).map((part, i) => (
                    i % 2
                      ? <b key={i} style={{color:'var(--ink)', fontWeight:700}}>{part}</b>
                      : <React.Fragment key={i}>{part}</React.Fragment>
                  ))}
                </span>
              </div>
            ))}
          </div>
        )}

        {s.form && (
          <div style={{marginBottom:12}}>
            <div className="field">
              <label>Your first name</label>
              <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Djavhan" />
            </div>
            <div className="field">
              <label>Contact email for parents</label>
              <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                     placeholder={session?.user?.email || 'you@example.com'} />
            </div>
            <div className="field">
              <label>Your phone (for the parents' WhatsApp button)</label>
              <input type="text" value={phone} onChange={e => setPhone(e.target.value)} placeholder="e.g. 07999 896555" />
            </div>
            <div className="field">
              <label>Your usual fee per lesson</label>
              <input type="number" min="0" step="1" value={rate} onChange={e => setRate(e.target.value)} placeholder="e.g. 50" />
              <div style={{fontSize:'0.76rem', color:'var(--muted)', marginTop:4, lineHeight:1.45}}>
                Just the starting figure for new students - you can charge each one
                differently, and change it whenever you like.
              </div>
            </div>
          </div>
        )}

        {calStatus && (() => {
          // Fully connected is the only good state here. Half connected still
          // needs something doing, so it stays neutral rather than claiming a
          // green tick for a job that is not finished.
          const good = calStatus.connected && calStatus.calendar_chosen;
          return (
            <div style={{
              display:'inline-flex', alignItems:'center', gap:8,
              fontSize:'0.8rem', fontWeight:600, marginBottom:11, padding:'8px 13px',
              borderRadius:100,
              background: good ? 'var(--good-light)' : 'var(--card-2)',
              color: good ? 'var(--good)' : 'var(--muted)',
              border: `1px solid ${good ? 'transparent' : 'var(--line)'}`,
            }}>
              <span style={{
                width:8, height:8, borderRadius:'50%', flexShrink:0,
                background: good ? 'var(--good)' : 'var(--muted)',
              }} />
              {good
                ? `Connected to “${calStatus.calendar_summary}” · ${activeCount} student${activeCount === 1 ? '' : 's'} so far`
                : calStatus.connected
                  ? 'Connected. Now pick which calendar has your lessons'
                  : 'Not connected yet'}
            </div>
          );
        })()}

        {s.action && (
          <button className="btn save" style={{width:'100%', marginBottom:10}}
            onClick={() => { s.action.addStudent ? onAddStudent() : onOpenTool(s.action.tool); }}>
            {s.action.label}
          </button>
        )}

        <div style={{display:'flex', gap:8, alignItems:'center'}}>
          <button onClick={skip} disabled={saving} style={{
            background:'none', border:'none', color:'var(--muted)', cursor:'pointer',
            fontFamily:'inherit', fontSize:'0.78rem', padding:'8px 2px', flexShrink:0,
          }}>Skip</button>
          <button onClick={() => setPaused(true)} disabled={saving} style={{
            flex:1, padding:'11px 10px', borderRadius:'var(--r-md)',
            border:'1px solid var(--line)', background:'var(--card-2)', color:'var(--ink)',
            fontFamily:'inherit', fontSize:'0.8rem', fontWeight:600, cursor:'pointer',
          }}>Let me look around</button>
          <button className="btn save" onClick={next} disabled={saving}
            style={{flex:1, minWidth:0}}>
            {saving ? '…' : isLast ? 'Finish' : 'Next'}
          </button>
        </div>
      </div>
    </div>
    </>, document.body
  );
}

function App() {
  const [students, setStudents] = useState([]);
  const [lessons, setLessons] = useState([]);
  const [payments, setPayments] = useState([]);
  const [bundles, setBundles] = useState([]);
  const [allocations, setAllocations] = useState([]);
  const [rateHistory, setRateHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [lastSynced, setLastSynced] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [showAddModal, setShowAddModal] = useState(false);
  const [editingStudent, setEditingStudent] = useState(null);
  const [showGlobalTools, setShowGlobalTools] = useState(false);
  const [toolsInitial, setToolsInitial] = useState(null);
  const [walkthroughOpen, setWalkthroughOpen] = useState(false);
  const [walkthroughPaused, setWalkthroughPaused] = useState(false);
  const [monzoStatus, setMonzoStatus] = useState(null);
  const [googleStatus, setGoogleStatus] = useState(null);
  const [moneyMode, setMoneyMode] = useState('normal');
  const [nameMode, setNameMode] = useState('normal');
  const [query, setQuery] = useState('');
  const [focusStudentId, setFocusStudentId] = useState(null);
  // undefined = still checking; null = signed out; object = signed in.
  const [session, setSession] = useState(undefined);
  // undefined = not read yet; null = could not read (treated as full access);
  // object = the real entitlement row.
  const [entitlement, setEntitlement] = useState(undefined);
  const [blockedOnce, setBlockedOnce] = useState(false);
  const [limitPrompt, setLimitPrompt] = useState(false);
  const [billingNotice, setBillingNotice] = useState(null);
  const [billingCheckExpired, setBillingCheckExpired] = useState(false);
  const [billingTick, setBillingTick] = useState(0);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session ?? null));
    const { data: sub } = supabase.auth.onAuthStateChange((_evt, s) => setSession(s ?? null));
    return () => sub.subscription.unsubscribe();
  }, []);

  // Read once per sign-in, and again after a return from Stripe, since the
  // webhook that flips the status can land a second or two after the redirect.
  useEffect(() => {
    if (!session || DEMO_MODE) return;
    let cancelled = false;
    async function readSubscription() {
      const { data, error } = await supabase.from('tutoring_subscriptions').select('*').maybeSingle();
      let next = data;
      if (!error && next?.stripe_customer_id && !STRIPE_OK.includes(next.stripe_status)) {
        try {
          next = await refreshBillingFromStripe(session.access_token);
        } catch (err) {
          console.warn('stripe billing refresh failed:', err?.message || err);
        }
      }
      if (cancelled) return;
      if (error) {
        // Fail open: see readEntitlement. Never lock someone out of their
        // own records because a billing read failed.
        console.warn('subscription read failed, allowing access:', error.message);
        setEntitlement(null);
        return;
      }
      setEntitlement(next);
    }
    readSubscription()
      .catch(error => {
        if (cancelled) return;
        console.warn('subscription read failed, allowing access:', error?.message || error);
        setEntitlement(null);
      });
    return () => { cancelled = true; };
  }, [session?.user?.id, billingTick]);

  // The locks are read by the client wrapper, which lives outside React, so
  // they are assigned here as a side effect rather than passed down as props.
  useEffect(() => {
    if (DEMO_MODE) { WRITES_BLOCKED = false; NEW_STUDENT_BLOCKED = false; return; }
    // Counted from `students` rather than the `activeStudents` further down:
    // this effect is declared above it, and the dependency array is evaluated
    // during render, when that binding does not exist yet.
    const st = readEntitlement(entitlement, students.filter(s => s.active).length);
    WRITES_BLOCKED = !st.access;
    NEW_STUDENT_BLOCKED = !st.pro && st.atLimit;
    CURRENT_FREE_LIMIT = st.limit;
    notifyBlockedWrite = () => setBlockedOnce(true);
    notifyStudentLimit = () => setLimitPrompt(true);
  }, [entitlement, students]);

  // Stripe redirects back before its webhook necessarily has, so keep checking
  // for long enough to avoid showing an old free-plan banner underneath.
  useEffect(() => {
    if (billingNotice !== 'done') {
      setBillingCheckExpired(false);
      return;
    }
    setBillingCheckExpired(false);
    const timers = [1000, 2500, 5000, 10000, 20000, 40000, 65000]
      .map(ms => setTimeout(() => setBillingTick(n => n + 1), ms));
    const expired = setTimeout(() => setBillingCheckExpired(true), 70000);
    return () => {
      timers.forEach(clearTimeout);
      clearTimeout(expired);
    };
  }, [billingNotice]);

  // Decided once per sign-in and then left alone. This used to re-evaluate on
  // anything that produced a new session object, so a token refresh or a save
  // from inside Settings could hand back a session whose metadata had not
  // caught up and re-open a walkthrough finished long ago. That is the setup
  // panel appearing over Settings and then vanishing again.
  const walkthroughDecidedFor = React.useRef(null);
  useEffect(() => {
    const uid = session?.user?.id;
    // Waits for the first load, so the student count below is real rather than
    // an empty array that simply has not arrived yet.
    if (!uid || loading) return;
    if (walkthroughDecidedFor.current === uid) return;
    walkthroughDecidedFor.current = uid;

    // -1 means finished or skipped. Having students is the other way of
    // knowing: whatever the flag says, someone with a register full of people
    // clearly got through setup, and accounts predating the flag have no -1
    // to find. Only a genuinely empty account gets walked through it.
    const finished = session.user?.user_metadata?.wt_step === -1;
    const alreadyRunning = students.some(x => x.active);
    setWalkthroughOpen(!finished && !alreadyRunning);
  }, [session?.user?.id, loading, students.length]);

  async function replayWalkthrough() {
    await supabase.auth.updateUser({ data: { wt_step: 0 } });
    setShowGlobalTools(false);
    setToolsInitial(null);
    setWalkthroughOpen(true);
  }

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const monzo = params.get('monzo');
    if (monzo) {
      setMonzoStatus(monzo);
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => setMonzoStatus(null), 6000);
    }
    const google = params.get('google');
    if (google) {
      setGoogleStatus(google);
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => setGoogleStatus(null), 6000);
    }
    const billing = params.get('billing');
    if (billing) {
      setBillingNotice(billing);
      window.history.replaceState({}, '', window.location.pathname);
      if (billing !== 'done') setTimeout(() => setBillingNotice(null), 9000);
    }
  }, []);

  // A failed read must never look like an empty diary. Every result is checked
  // for an error, and if any table fails the previous data is left on screen
  // with a banner saying so - `data || []` on a failed query yields [], which
  // renders as "no lessons" and is indistinguishable from genuinely having
  // none. That is exactly how a momentary connection drop once emptied the
  // whole app while the database was perfectly intact.
  async function loadAll(isManualRefresh = false) {
    if (isManualRefresh) setRefreshing(true);
    try {
      // Auto-complete lessons that have already happened. Two passes, because a
      // lesson earlier TODAY has passed too - checking the date alone left this
      // morning's lesson showing as upcoming until tomorrow.
      const today = new Date().toISOString().slice(0, 10);
      const nowHHMM = new Date().toTimeString().slice(0, 5);
      await supabase.from('tutoring_lessons').update({ status: 'completed' })
        .eq('status', 'scheduled').lt('lesson_date', today);
      await supabase.from('tutoring_lessons').update({ status: 'completed' })
        .eq('status', 'scheduled').eq('lesson_date', today).lt('start_time', nowHHMM);
      const [s, l, p, b, r, a] = await Promise.all([
        supabase.from('tutoring_students').select('*').order('active', { ascending: false }).order('name'),
        supabase.from('tutoring_lessons').select('*'),
        // Archived payments are excluded everywhere money is counted; they
        // only surface in Tools → Deleted payments, where they can be restored.
        supabase.from('tutoring_payments').select('*').is('deleted_at', null),
        supabase.from('tutoring_bundles').select('*'),
        supabase.from('tutoring_rate_history').select('*'),
        supabase.from('tutoring_payment_allocations').select('*')
      ]);

      const failed = [s, l, p, b, r, a].find(res => res.error);
      if (failed) throw new Error(failed.error.message || 'Could not read your data');

      setStudents(s.data || []);
      setLessons(l.data || []);
      setPayments(p.data || []);
      setBundles(b.data || []);
      setRateHistory(r.data || []);
      setAllocations(a.data || []);
      setLastSynced(new Date());
      setLoadError(null);
    } catch (err) {
      setLoadError(String(err && err.message ? err.message : err));
    } finally {
      setLoading(false);
      setRefreshing(false);
    }
  }

  // Only fetch once signed in - with RLS on, an anonymous fetch returns
  // nothing anyway, and firing it would just show a misleading empty state.
  useEffect(() => { if (session) loadAll(); }, [session]);

  const activeStudents = students.filter(s => s.active);
  const archivedCount = students.filter(s => !s.active).length;
  const billingReadState = readEntitlement(entitlement, activeStudents.length);
  const tutorDisplayName = session?.user?.user_metadata?.display_name;
  const headerTitle = planCopyName(billingReadState, tutorDisplayName);
  const billingConfirmed = billingNotice === 'done'
    && entitlement !== undefined
    && entitlement !== null
    && billingReadState.pro;
  const billingStillChecking = billingNotice === 'done' && !billingConfirmed && !billingCheckExpired;
  const billingNeedsAttention = billingNotice === 'done' && !billingConfirmed && billingCheckExpired;

  useEffect(() => {
    if (!billingConfirmed) return;
    const t = setTimeout(() => setBillingNotice(null), 9000);
    return () => clearTimeout(t);
  }, [billingConfirmed]);

  const syncLabel = lastSynced
    ? `synced ${lastSynced.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`
    : '';

  const privacyOn = moneyMode !== 'normal' || nameMode !== 'normal';

  // Rate lookups are plain functions used all over the tree, not hooks, so the
  // mode is published here for them to read. Set during render, before any
  // child reads it.
  PRIVACY_MONEY_MODE = moneyMode;

  // Search matches name or school, so "Hasmonean" finds everyone there.
  // (auth gate is applied at the end of this component, after all hooks have
  // run - bailing out earlier would change the hook order between renders)
  const q = query.trim().toLowerCase();
  const shownStudents = q
    ? activeStudents.filter(s =>
        (s.name || '').toLowerCase().includes(q) ||
        (s.school || '').toLowerCase().includes(q))
    : activeStudents;

  function jumpToStudent(id) {
    setQuery('');
    setFocusStudentId(id);
    // Let the filter clear before scrolling, or the card may not be mounted yet.
    setTimeout(() => {
      const el = document.getElementById('student-' + id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 60);
    setTimeout(() => setFocusStudentId(null), 2200);
  }

  // Still restoring the session from storage: hold a blank screen for the
  // instant it takes, rather than flashing the sign-in form at someone who is
  // already signed in.
  if (session === undefined) return <div style={{minHeight:'100dvh'}} />;
  if (session === null) return <LoginGate />;

  return (
    <PrivacyContext.Provider value={{ moneyMode, nameMode }}>
    <div>
      <BillingBar
        entitlement={entitlement}
        activeStudents={activeStudents.length}
        blockedOnce={blockedOnce}
        suppressFreePrompt={billingStillChecking}
        ownerName={tutorDisplayName}
      />
      {billingNotice && (
        <div style={{
          position:'fixed', top:12, left:0, right:0, marginInline:'auto', width:'fit-content', zIndex:200,
          padding:'10px 18px', borderRadius:10, fontSize:'0.85rem', fontWeight:600, maxWidth:'92vw',
          background: billingNotice === 'done' && !billingNeedsAttention ? 'var(--good)' : 'var(--warn)',
          color:'#fff', boxShadow:'0 4px 20px rgba(0,0,0,0.25)'
        }}>
          {billingNotice === 'done'
            ? billingConfirmed
              ? 'Thanks - your subscription is active.'
              : billingNeedsAttention
                ? 'Stripe has not confirmed TutorTally Pro yet. Open Tools: Billing & subscription, or try upgrading again.'
                : 'Checking Stripe before updating your plan...'
            : 'Payment was cancelled. Nothing has been charged.'}
        </div>
      )}
      {monzoStatus && (
        <div style={{
          position:'fixed', top:12, left:'50%', transform:'translateX(-50%)', zIndex:200,
          padding:'10px 18px', borderRadius:10, fontSize:'0.85rem', fontWeight:600,
          background: monzoStatus === 'connected' ? 'var(--good)' : 'var(--warn)',
          color:'#fff', boxShadow:'0 4px 20px rgba(0,0,0,0.25)'
        }}>
          {monzoStatus === 'connected' ? '🏦 Monzo connected successfully' : 'Monzo connection was cancelled or denied'}
        </div>
      )}
      {googleStatus && (
        <div style={{
          position:'fixed', top:12, left:0, right:0, marginInline:'auto', width:'fit-content', zIndex:200,
          padding:'10px 18px', borderRadius:10, fontSize:'0.85rem', fontWeight:600,
          background: googleStatus === 'connected' ? 'var(--good)' : 'var(--warn)',
          color:'#fff', boxShadow:'0 4px 20px rgba(0,0,0,0.25)'
        }}>
          {googleStatus === 'connected' ? '📅 Google Calendar connected - pick a calendar in Settings to finish' : 'Google Calendar connection was cancelled or denied'}
        </div>
      )}
      <div className="app-header">
        <div className="header-row">
          <div className="header-left">
            <svg className="brand-mark" viewBox="0 0 900 700" role="img" aria-label="TutorTally">
              <path d="M86 440L812 220" fill="none" stroke="var(--accent-fill)"
                    strokeWidth="94" strokeLinecap="round" />
              <rect x="292" y="48" width="100" height="604" rx="14" fill="var(--ink)" />
              <rect x="512" y="48" width="100" height="604" rx="14" fill="var(--ink)" />
            </svg>
          <div style={{minWidth:0}}>
            <div className="header-title">
              {headerTitle}
            </div>
            <div className="header-sub">
              {activeStudents.length} active{archivedCount > 0 ? ` · ${archivedCount} archived` : ''}{syncLabel ? ` · ${syncLabel}` : ''}
            </div>
          </div>
          </div>
          <div className="header-right">
            <button className="refresh-btn" onClick={() => loadAll(true)} disabled={refreshing}>
              <span style={{display:'inline-block', animation: refreshing ? 'spin 0.8s linear infinite' : 'none'}}>↻</span>
            </button>
            {(!walkthroughOpen || walkthroughPaused) && (
              <button className="header-settings-btn" data-wt="tools"
                      onClick={() => setShowGlobalTools(true)}>⚙ Settings</button>
            )}
            <button className="add-btn" onClick={() =>
              NEW_STUDENT_BLOCKED ? setLimitPrompt(true) : setShowAddModal(true)
            } data-wt="add">+ Add</button>
          </div>
        </div>
        {/* The controls live in Tools; this is only a reminder that they're on,
            so it can't be left masked by accident. */}
        {privacyOn && (
          <div
            onClick={() => setShowGlobalTools(true)}
            style={{
              display:'inline-flex', alignItems:'center', gap:6, marginTop:10, cursor:'pointer',
              fontSize:'0.72rem', fontWeight:600, color:'var(--gold)',
              border:'1px solid var(--gold)', borderRadius:20, padding:'4px 11px'
            }}>
            🕶 Privacy mode on
            <span style={{color:'var(--muted)', fontWeight:500}}>
              {moneyMode !== 'normal' ? (moneyMode === 'dummy' ? 'fake amounts' : 'amounts hidden') : ''}
              {moneyMode !== 'normal' && nameMode !== 'normal' ? ' · ' : ''}
              {nameMode !== 'normal' ? (nameMode === 'dummy' ? 'fake names' : 'names hidden') : ''}
            </span>
          </div>
        )}
      </div>

      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>

      {loadError && (
        <div style={{
          margin:'0 auto 4px', maxWidth:680, padding:'11px 14px',
          background:'var(--warn-light)', border:'1px solid var(--warn)',
          borderRadius:'var(--r-md)', color:'var(--warn)', fontSize:'0.82rem', lineHeight:1.45
        }}>
          <b>Couldn't reach your data.</b>{' '}
          {lastSynced
            ? 'Showing what was last loaded - nothing has been lost or changed.'
            : 'Nothing is loaded yet, so this page is empty - that is not your real data.'}
          <button onClick={() => loadAll(true)} disabled={refreshing} style={{
            marginLeft:8, padding:'3px 10px', borderRadius:8, cursor:'pointer',
            border:'1px solid var(--warn)', background:'none', color:'var(--warn)',
            fontFamily:'inherit', fontSize:'0.78rem', fontWeight:600
          }}>
            {refreshing ? 'Retrying…' : 'Retry'}
          </button>
        </div>
      )}

      <div className="content">
        {loading && (
          <>
            <div className="sk" style={{height:132, marginBottom:14}} />
            <div className="sk" /><div className="sk" /><div className="sk" />
          </>
        )}

        {!loading && <SummaryWidget students={students} rateHistory={rateHistory} showNet={isDanielAccount(session)} />}

        {!loading && (
          <NeedsAttention
            students={students} lessons={lessons} payments={payments}
            allocations={allocations} rateHistory={rateHistory}
            onJump={jumpToStudent}
          />
        )}

        {!loading && activeStudents.length > 3 && (
          <div className="search-wrap">
            <span className="s-icon">⌕</span>
            <input
              type="text" value={query} onChange={e => setQuery(e.target.value)}
              placeholder="Search students or schools…"
            />
            {query && <button className="s-clear" onClick={() => setQuery('')}>✕</button>}
          </div>
        )}

        {!loading && activeStudents.length === 0 && (
          <div className="empty">No active students. Tap "+ Add" to get started.</div>
        )}

        {!loading && activeStudents.length > 0 && shownStudents.length === 0 && (
          <div className="empty">No one matches "{query}".</div>
        )}

        {!loading && shownStudents.map(s => (
          <StudentCard key={s.id} student={s} lessons={lessons} payments={payments} bundles={bundles}
            allocations={allocations} allStudents={students} rateHistory={rateHistory}
            focused={focusStudentId === s.id}
            session={session}
            onEdit={setEditingStudent} onDataChanged={loadAll} />
        ))}

        {!loading && <PlatformStats session={session} />}

        {!loading && <div className="version-tag">v6.6</div>}
      </div>

      {showAddModal && (
        <StudentFormModal
          allStudents={students}
          rateHistory={rateHistory}
          defaultRate={session?.user?.user_metadata?.default_rate ?? null}
          session={session}
          onClose={() => setShowAddModal(false)}
          onSaved={() => { setShowAddModal(false); loadAll(); }}
        />
      )}

      {/* Hidden only while the walkthrough card is actually on screen, since
          they occupy the same space and the card offers its own way in. It
          comes straight back when they pause to look around. */}
      {(!walkthroughOpen || walkthroughPaused) && (
        <button className="global-tools-btn" data-wt="tools" onClick={() => setShowGlobalTools(true)}>⚙ Settings</button>
      )}

      {showGlobalTools && (
        <GlobalToolsSheet
          students={students}
          rateHistory={rateHistory}
          payments={payments}
          lessons={lessons}
          entitlement={entitlement}
          userEmail={session?.user?.email}
          session={session}
          initialTool={toolsInitial}
          moneyMode={moneyMode} setMoneyMode={setMoneyMode}
          nameMode={nameMode} setNameMode={setNameMode}
          onClose={() => { setShowGlobalTools(false); setToolsInitial(null); }}
          onReplayWalkthrough={replayWalkthrough}
          onDataChanged={loadAll}
          onAddStudent={() => setShowAddModal(true)}
        />
      )}

      {walkthroughOpen && (
        <Walkthrough
          session={session}
          students={students}
          onOpenTool={t => { setToolsInitial(t); setShowGlobalTools(true); }}
          onAddStudent={() => setShowAddModal(true)}
          onPausedChange={setWalkthroughPaused}
          onDone={() => { setWalkthroughOpen(false); setWalkthroughPaused(false); }}
        />
      )}

      {limitPrompt && (
        <StudentLimitModal
          limit={CURRENT_FREE_LIMIT}
          ownerName={tutorDisplayName}
          onClose={() => setLimitPrompt(false)}
        />
      )}

      {editingStudent && (
        <StudentFormModal
          student={editingStudent}
          allStudents={students}
          rateHistory={rateHistory}
          session={session}
          onClose={() => setEditingStudent(null)}
          onSaved={() => { setEditingStudent(null); loadAll(); }}
        />
      )}
    </div>
    </PrivacyContext.Provider>
  );
}

// iOS Safari ignores user-scalable=no, so the pinch gesture has to be refused
// directly. touch-action handles double-tap; these cover pinch.
['gesturestart', 'gesturechange', 'gestureend'].forEach(evt =>
  document.addEventListener(evt, e => e.preventDefault(), { passive: false })
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
